 that never meet are parallel lines. Two straight lines are parallel when they have the same gradient. Lines that cross at a right angle are perpendicular, and multiplying their gradients gives −1. For example, y = 2x and y = −½x cross at a right angle, and 2 × −½ = −1."}, {"id": "ch07-s5-example", "kind": "example", "text": "Find the line parallel to y = 3x − 1 through (2, 11). It has gradient 3, so it is y = 3x + c. Put in x = 2 and y = 11: 11 = 6 + c, so c = 5. The line is y = 3x + 5."}, {"id": "ch07-s5-mistake", "kind": "mistake", "text": "The tempting slip is to think y = 2x + 1 and y = x + 2 are parallel because they use the same numbers. Their gradients are 2 and 1, so they cross, at (1, 3)."}, {"id": "ch07-s5-turn", "kind": "turn", "text": "Which line is parallel to y = 5x + 2: y = 2x + 5, y = 5x − 3 or y = −5x + 2?", "answer": "y = 5x − 3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "y=5x-3"}, {"kind": "form", "value": "y=-3+5x"}]}], "accepts": ["y = 5x − 3", "y = 5x - 3", "y=5x-3"], "rejects": ["y = 2x + 5", "y = −5x + 2", "y = 5x + 2"], "mistakes": []}}, {"id": "ch07-s5-sayBack", "kind": "sayBack", "text": "Parallel lines have the same gradient and cross the y-axis at different places."}]}, {"id": "ch07-s6", "heading": "7.6 The story of a journey", "excerpt": "Going, Kym covers 12 km in 1 hour, which is 12 km an hour. Coming home, 12 km takes 2 hours, which is 6 km an hour. During the visit, time passes but the distance stays 12 km.", "teaches": ["real-life-graph"], "steps": [{"id": "ch07-s6-question", "kind": "question", "text": "Kym cycles 12 km to a friend's house in 1 hour, stays for 1 hour, then rides home in 2 hours. Mark the distance from home against the time. Which part of the trip was fastest?"}, {"id": "ch07-s6-idea", "kind": "idea", "text": "Going, Kym covers 12 km in 1 hour, which is 12 km an hour. Coming home, 12 km takes 2 hours, which is 6 km an hour. During the visit, time passes but the distance stays 12 km."}, {"id": "ch07-s6-picture", "kind": "picture", "text": "Put the time in hours along the x-axis, 0 to 4, and the distance from home up the y-axis, 0 to 12 km. Join (0, 0) to (1, 12), then (1, 12) to (2, 12), then (2, 12) to (4, 0)."}, {"id": "ch07-s6-reason", "kind": "reason", "text": "Why is the steepest part the fastest? Its gradient is distance ÷ time, which is the speed. The flat part has gradient 0, so Kym is not moving."}, {"id": "ch07-s6-name", "kind": "name", "text": "A graph of a real situation, like a taxi fare or a trip, is a real-life graph. On a distance-time graph the gradient is the speed, and a line sloping down means heading back towards the start."}, {"id": "ch07-s6-example", "kind": "example", "text": "A bus goes 30 km in the first half hour, then 30 km in the next hour. Its speeds are 30 ÷ 0.5 = 60 km an hour, then 30 ÷ 1 = 30 km an hour. The first part of its line is twice as steep."}, {"id": "ch07-s6-mistake", "kind": "mistake", "text": "The tempting slip is to read the line going down as Kym riding downhill. It shows the distance from home shrinking, so Kym is riding home."}, {"id": "ch07-s6-turn", "kind": "turn", "text": "On a distance-time graph, a runner's line goes from (0, 0) to (2, 18), with time in hours and distance in km. What is the runner's speed in km an hour?", "answer": "9", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "9"}]}], "accepts": ["9", "9 km an hour", "9 km/h"], "rejects": ["18", "36", "2"], "mistakes": []}}, {"id": "ch07-s6-sayBack", "kind": "sayBack", "text": "On a distance-time graph the gradient is the speed, and a flat line means standing still."}]}], "callouts": [{"id": "ch07-c-predict", "kind": "predict", "title": "Predict first", "body": "Predict where y = −2x + 3 crosses the x-axis. Then set the gradient to −2 and where it crosses the y-axis to 3, and read the amber line."}, {"id": "ch07-c-aha", "kind": "check", "title": "Explain it", "body": "The machine \"multiply by 2, then add 3\" turns 4 into 11. Explain to a friend how to run it backwards from 11 to get 4 again."}, {"id": "ch07-c-trap", "kind": "careful", "title": "Last step first", "body": "To run a function machine backwards, undo its last step first. For multiply by 2, then add 3, take away 3 before you halve."}], "keyTerms": ["Function machine", "Inverse function", "Coordinates", "Gradient", "Intercept", "Straight-line graph", "Parallel lines", "Real-life graph"], "widgets": ["w_linear_graph_slope_explorer", "w_kinematics_travel_graph"], "debate": {"id": "debate-ch07-graphs", "chapterNumber": 7, "oupUnitNumber": 14, "title": "Which number is the gradient?", "contextPrompt": "Arjun and Zara look at the line y = 6 − 2x and argue about its gradient.", "speakerAName": "Arjun", "speakerAClaim": "The gradient is the first number, so it is 6.", "speakerBName": "Zara", "speakerBClaim": "The gradient is the number in front of x, so it is −2.", "choices": [{"id": "ch07-a", "speakerLabel": "Arjun is right (6)", "reasoningStatement": "The gradient is always the first number in the equation.", "isCorrect": false, "socraticRebuttal": "Work out y when x = 0 and when x = 1. How much did y change for that one step across?"}, {"id": "ch07-b", "speakerLabel": "Zara is right (−2)", "reasoningStatement": "The gradient is the number multiplying x, sign and all.", "isCorrect": true, "socraticRebuttal": "Yes. Written as y = −2x + 6, the line falls 2 for every 1 across, and it crosses the y-axis at (0, 6)."}, {"id": "ch07-c", "speakerLabel": "Neither. It is 2.", "reasoningStatement": "Steepness is a size, so it cannot be negative.", "isCorrect": false, "socraticRebuttal": "Is y going up or down as x goes up? What sign tells you which way the line slopes?"}], "invariantTakeaway": "The gradient is the number multiplying x, with its sign. Rewrite the rule as y = mx + c before you read it."}}, {"id": "ch08", "number": 8, "volumeNumber": 3, "volumeTitle": "Volume III · Euclid's Compass, Circles & Trigonometry", "title": "Angles and proof", "subtitle": "School book chapter 8 · Crossing lines, parallel lines, triangles, polygons and midpoints", "hookSummary": "Tear the three corners off a paper triangle and lay them side by side, points touching. They make a straight line every time. Why does that work for every triangle?", "beyondSchoolBook": false, "skillCard": {"skill": "Finding missing angles, and giving a reason for each step", "sheCan": {"prompt": "With no calculator: a line crosses two parallel lines and makes an angle of 65° with one of them. Give the alternate angle and the co-interior angle. Two angles of a triangle are 40° and 75°: find the exterior angle at the third corner. Find the midpoint of (−2, 5) and (6, 1).", "answer": "The alternate angle is 65° and the co-interior angle is 115°. The exterior angle is 40° + 75° = 115°. The midpoint is (2, 3)."}, "whyItMatters": "Builders, map makers and designers find angles they cannot measure from angles they can. Giving a reason for each step is how mathematics makes sure a fact holds every time.", "standsOn": ["Chapter 7: parallel lines and coordinates", "Chapter 0: if-then statements", "Measuring an angle in degrees, with 360° in a full turn"], "unlocks": ["Chapter 9: drawing exact shapes and finding directions on a map", "Chapter 12: the sides and angles of right-angled triangles", "Every later proof about shapes, built from the facts in this chapter"]}, "intuitionToFormula": {"concreteAction": "Set the angle at A to 50° and the angle at B to 60°. The dashed green line runs through C, parallel to the side AB.", "ahaInvariant": "Drag either slider. The red copy, the grey angle and the blue copy at C always fill the green line. So the three angles of the triangle always add to 180°.", "formulaDisplay": "A + B + C = 180°,   exterior angle at B = A + C", "termMappings": [{"symbol": "A", "visualPart": "The red angles", "colorRole": "red", "meaning": "The angle at corner A, and its copy at C"}, {"symbol": "B", "visualPart": "The blue angles", "colorRole": "blue", "meaning": "The angle at corner B, and its copy at C"}, {"symbol": "the line through C", "visualPart": "The green dashed line", "colorRole": "green", "meaning": "A line through C, parallel to AB"}, {"symbol": "exterior angle at B", "visualPart": "The amber angle", "colorRole": "amber", "meaning": "The angle between side BC and the side AB carried on past B"}], "atlasFigureRef": "maths/ch08-angles-parallel/index.html"}, "sections": [{"id": "ch08-s1", "heading": "8.1 Where two lines cross", "excerpt": "Angles along a straight line add to 180°, half a full turn. So the angle next to the 70° is 180° − 70° = 110°. Next to that is 70° again, then 110°.", "teaches": ["vertically-opposite-angles"], "steps": [{"id": "ch08-s1-question", "kind": "question", "text": "Two straight roads cross, and one corner of the crossing measures 70°. What are the other three angles at the crossing?"}, {"id": "ch08-s1-idea", "kind": "idea", "text": "Angles along a straight line add to 180°, half a full turn. So the angle next to the 70° is 180° − 70° = 110°. Next to that is 70° again, then 110°."}, {"id": "ch08-s1-picture", "kind": "picture", "text": "Draw two lines crossing like an X. Mark the 70° angle, then the angle straight across the crossing from it. Shade both of them in one colour, and the other two in another."}, {"id": "ch08-s1-reason", "kind": "reason", "text": "Why are the opposite angles equal? Each one sits beside the same 110° angle on a straight line. So each is 180° − 110°, which is 70° both times."}, {"id": "ch08-s1-name", "kind": "name", "text": "The angles opposite each other where two lines cross are vertically opposite angles, and they are equal. Vertically here means at the same corner point, not up and down. Angles on a straight line add to 180°, and angles all the way round a point add to 360°."}, {"id": "ch08-s1-example", "kind": "example", "text": "Two lines cross, and one angle is 38°. The angle opposite it is 38°, and the two beside it are 180° − 38° = 142° each. Check: 38 + 142 + 38 + 142 = 360. If another pair of opposite angles is 2x and 142°, then x = 71."}, {"id": "ch08-s1-mistake", "kind": "mistake", "text": "The tempting slip is to make the angle beside it equal, instead of the one opposite. Angles side by side share a straight line, so they add to 180°."}, {"id": "ch08-s1-turn", "kind": "turn", "text": "Two lines cross. One angle is 3x and the angle opposite it is 75°. Find x.", "answer": "25", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "25"}]}], "accepts": ["25", "x = 25", "= 25"], "rejects": ["75", "35", "105"], "mistakes": []}}, {"id": "ch08-s1-sayBack", "kind": "sayBack", "text": "Vertically opposite angles are equal, and angles side by side on a straight line add to 180°."}]}, {"id": "ch08-s2", "heading": "8.2 A line across parallel lines", "excerpt": "The tracks point the same way, so the road meets each one at the same slant. Slide the first crossing along the road to the second and it fits exactly. The angle is 60° again.", "teaches": ["transversal", "corresponding-angles"], "steps": [{"id": "ch08-s2-question", "kind": "question", "text": "A road crosses two parallel railway tracks. At the first track the road makes an angle of 60°. What angle does it make at the second track, in the same position?"}, {"id": "ch08-s2-idea", "kind": "idea", "text": "The tracks point the same way, so the road meets each one at the same slant. Slide the first crossing along the road to the second and it fits exactly. The angle is 60° again."}, {"id": "ch08-s2-picture", "kind": "picture", "text": "Draw two parallel lines across the page and a slanted line cutting both. At each crossing, shade the angle above the parallel line and to the right of the slanted line."}, {"id": "ch08-s2-reason", "kind": "reason", "text": "Why are the two shaded angles equal? Sliding the top line down the slanted line moves it onto the bottom line without turning it. Nothing turns, so no angle changes."}, {"id": "ch08-s2-name", "kind": "name", "text": "A line that cuts across two or more lines is a transversal. Angles in the same position at each crossing are corresponding angles. When the lines are parallel, corresponding angles are equal, and together they trace a letter F."}, {"id": "ch08-s2-example", "kind": "example", "text": "A transversal crosses two parallel lines. At the top crossing, the angle above the line and left of the transversal is 112°. The corresponding angle at the bottom crossing is 112° too. The angle beside it on the bottom line is 180° − 112° = 68°."}, {"id": "ch08-s2-mistake", "kind": "mistake", "text": "The tempting slip is to use corresponding angles when the lines are not parallel. If the two lines lean towards each other, the angles at the two crossings differ. Look for the arrows that mark parallel lines first."}, {"id": "ch08-s2-turn", "kind": "turn", "text": "A transversal crosses two parallel lines. One angle is 47°, and its corresponding angle is (2x + 7)°. Find x.", "answer": "20", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "20"}]}], "accepts": ["20", "x = 20", "= 20"], "rejects": ["47", "27", "63"], "mistakes": []}}, {"id": "ch08-s2-sayBack", "kind": "sayBack", "text": "A transversal meets parallel lines at the same slant, so its corresponding angles are equal."}]}, {"id": "ch08-s3", "heading": "8.3 Z angles and C angles", "excerpt": "The corresponding angle, below the bottom line on the left, is 70°. The angle you want is vertically opposite that one, so it is 70° as well.", "teaches": ["alternate-angles", "co-interior-angles"], "steps": [{"id": "ch08-s3-question", "kind": "question", "text": "A transversal crosses two parallel lines. Below the top line, on the left of the transversal, the angle is 70°. What is the angle above the bottom line, on the right?"}, {"id": "ch08-s3-idea", "kind": "idea", "text": "The corresponding angle, below the bottom line on the left, is 70°. The angle you want is vertically opposite that one, so it is 70° as well."}, {"id": "ch08-s3-picture", "kind": "picture", "text": "Shade the two 70° angles. Both sit between the parallel lines, on opposite sides of the transversal, in the corners of a Z. Then shade the angle above the bottom line on the left. With the first 70° it makes a C."}, {"id": "ch08-s3-reason", "kind": "reason", "text": "Why do the two angles in the C add to 180°? The lower one sits on the bottom line beside the other 70°, so it is 110°. And 70° + 110° = 180°."}, {"id": "ch08-s3-name", "kind": "name", "text": "Angles between the parallel lines on opposite sides of the transversal are alternate angles, and they are equal. Angles between the lines on the same side are co-interior angles, and they add to 180°. Look for a Z or a C."}, {"id": "ch08-s3-example", "kind": "example", "text": "An angle of 54° between two parallel lines has an alternate angle of 54°. Two co-interior angles are x and x + 40. Then 2x + 40 = 180, so x = 70, and the angles are 70° and 110°."}, {"id": "ch08-s3-mistake", "kind": "mistake", "text": "The tempting slip is to make co-interior angles equal, like alternate angles. Equal co-interior angles would each be 90°, which happens only when the transversal crosses at a right angle."}, {"id": "ch08-s3-turn", "kind": "turn", "text": "Two parallel lines are cut by a transversal. Two co-interior angles are (4x)° and (2x + 42)°. Find x.", "answer": "23", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "23"}]}], "accepts": ["23", "x = 23", "= 23"], "rejects": ["21", "92", "88"], "mistakes": []}}, {"id": "ch08-s3-sayBack", "kind": "sayBack", "text": "Alternate angles, in a Z, are equal. Co-interior angles, in a C, add to 180°."}]}, {"id": "ch08-s4", "heading": "8.4 Why a triangle's angles make 180°", "excerpt": "Draw a line through the top corner, parallel to the bottom side. The three angles at the top corner fill that straight line, so they add to 180°. Each one matches an angle of the triangle.", "teaches": ["proof"], "steps": [{"id": "ch08-s4-question", "kind": "question", "text": "Tear the corners off a paper triangle and they make a straight line. But nobody can tear every triangle there is. How can you be sure the angles add to 180° every time?"}, {"id": "ch08-s4-idea", "kind": "idea", "text": "Draw a line through the top corner, parallel to the bottom side. The three angles at the top corner fill that straight line, so they add to 180°. Each one matches an angle of the triangle."}, {"id": "ch08-s4-picture", "kind": "picture", "text": "In the figure, set the angle at A to 50° and the angle at B to 60°. The red angle at A has a red copy at C, and the blue angle at B has a blue copy there too."}, {"id": "ch08-s4-reason", "kind": "reason", "text": "Why are the copies equal? Each copy and its angle at A or B sit in a Z between the green line and side AB. So they are alternate angles. The grey angle between the copies is the angle of the triangle at C."}, {"id": "ch08-s4-name", "kind": "name", "text": "A chain of steps like this, each with its reason, is a proof. Each step is an if-then statement: if two lines are parallel, then alternate angles are equal. A proof shows a fact holds for every triangle, not only the ones you drew."}, {"id": "ch08-s4-example", "kind": "example", "text": "A triangle has angles of 47° and 68°. The third angle is 180° − 47° − 68° = 65°. The reason is that the angles in a triangle add to 180°."}, {"id": "ch08-s4-mistake", "kind": "mistake", "text": "The tempting slip is to measure a few triangles and call it a proof. A protractor reads to about 1°, and checking ten triangles still leaves every other triangle unchecked."}, {"id": "ch08-s4-turn", "kind": "turn", "text": "A triangle's angles are x, 2x and 3x degrees. Find x.", "answer": "30", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "30"}]}], "accepts": ["30", "x = 30", "30°"], "rejects": ["60", "90", "180"], "mistakes": []}}, {"id": "ch08-s4-sayBack", "kind": "sayBack", "text": "A proof gives a reason for every step, so its fact holds for every triangle."}], "figure": true}, {"id": "ch08-s5", "heading": "8.5 The angle outside a triangle", "excerpt": "The new angle and the 60° angle sit together on a straight line, so the new one is 180° − 60° = 120°. That is the same as 50° + 70°, the angles at the other two corners.", "teaches": ["exterior-angle"], "steps": [{"id": "ch08-s5-question", "kind": "question", "text": "A triangle has angles of 50°, 60° and 70°. Carry one side on past the 60° corner with a ruler. What angle does the new line make with the other side at that corner?"}, {"id": "ch08-s5-idea", "kind": "idea", "text": "The new angle and the 60° angle sit together on a straight line, so the new one is 180° − 60° = 120°. That is the same as 50° + 70°, the angles at the other two corners."}, {"id": "ch08-s5-picture", "kind": "picture", "text": "Draw the triangle and carry one side on past a corner. Shade the angle outside the triangle, between the new line and the side next to it."}, {"id": "ch08-s5-reason", "kind": "reason", "text": "Why do the other two angles add up to the outside one? The two angles at that corner make 180°, and so do the three angles of the triangle. Take the angle inside that corner away from both."}, {"id": "ch08-s5-name", "kind": "name", "text": "The angle between one side carried on and the next side is an exterior angle. An exterior angle of a triangle equals the sum of the angles at the other two corners."}, {"id": "ch08-s5-example", "kind": "example", "text": "A triangle has angles of 35° and 85° at two corners. The exterior angle at the third corner is 35° + 85° = 120°. Check: the third angle is 180° − 120° = 60°, and 35 + 85 + 60 = 180."}, {"id": "ch08-s5-mistake", "kind": "mistake", "text": "The tempting slip is to add in the angle beside the exterior angle as well. The exterior angle equals the two angles away from it, not all three."}, {"id": "ch08-s5-turn", "kind": "turn", "text": "A triangle has angles of 42° and 71° at two corners. What is the exterior angle at the third corner?", "answer": "113°", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "113"}]}], "accepts": ["113", "113°", "= 113°"], "rejects": ["67", "180", "293"], "mistakes": []}}, {"id": "ch08-s5-sayBack", "kind": "sayBack", "text": "An exterior angle of a triangle equals the two angles at the other corners added together."}]}, {"id": "ch08-s6", "heading": "8.6 Angles in any shape with straight sides", "excerpt": "From one corner of a five-sided shape you can draw 2 lines, which cut it into 3 triangles. Their angles fill the corners of the shape exactly. So the shape's angles add to 3 × 180° = 540°.", "teaches": ["polygon", "interior-angle"], "steps": [{"id": "ch08-s6-question", "kind": "question", "text": "A shape has five straight sides. From one corner, draw a line to every other corner that is not next to it. How many triangles do you make, and what do the angles of the shape add to?"}, {"id": "ch08-s6-idea", "kind": "idea", "text": "From one corner of a five-sided shape you can draw 2 lines, which cut it into 3 triangles. Their angles fill the corners of the shape exactly. So the shape's angles add to 3 × 180° = 540°."}, {"id": "ch08-s6-picture", "kind": "picture", "text": "Draw a six-sided shape and cut it up the same way from one corner. You get 4 triangles. Each extra side adds one more triangle."}, {"id": "ch08-s6-reason", "kind": "reason", "text": "Why are there always 2 fewer triangles than sides? Every side makes one triangle with the starting corner, except the two sides that touch that corner."}, {"id": "ch08-s6-name", "kind": "name", "text": "A flat shape with straight sides is a polygon, and the angles inside it at its corners are its interior angles. For n sides, the interior angles add to (n − 2) × 180°. A regular polygon has all its sides equal and all its angles equal."}, {"id": "ch08-s6-example", "kind": "example", "text": "An eight-sided polygon has interior angles adding to (8 − 2) × 180° = 1080°. If it is regular, each is 1080° ÷ 8 = 135°. Each exterior angle is then 180° − 135° = 45°. Walking once round the shape turns you a full 360°, and 8 × 45° = 360°."}, {"id": "ch08-s6-mistake", "kind": "mistake", "text": "The tempting slip is to count one triangle for each side and use n × 180°. A square would then add to 720°, but its four right angles make 360°."}, {"id": "ch08-s6-turn", "kind": "turn", "text": "What do the interior angles of a seven-sided polygon add to?", "answer": "900°", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "900"}]}], "accepts": ["900", "900°", "= 900°"], "rejects": ["1260", "1080", "720"], "mistakes": []}}, {"id": "ch08-s6-sayBack", "kind": "sayBack", "text": "A polygon with n sides cuts into n − 2 triangles, so its interior angles add to (n − 2) × 180°."}]}, {"id": "ch08-s7", "heading": "8.7 Halfway between two points", "excerpt": "Across, halfway from 2 to 8 is 5. Up, halfway from 1 to 5 is 3. So they meet at (5, 3).", "teaches": ["midpoint"], "steps": [{"id": "ch08-s7-question", "kind": "question", "text": "On a map grid, Kym's house is at (2, 1) and a friend's house is at (8, 5). They walk towards each other and meet halfway. Where do they meet?"}, {"id": "ch08-s7-idea", "kind": "idea", "text": "Across, halfway from 2 to 8 is 5. Up, halfway from 1 to 5 is 3. So they meet at (5, 3)."}, {"id": "ch08-s7-picture", "kind": "picture", "text": "Mark both houses on squared paper and join them with a ruler. Draw the step under the line: 6 across and 4 up. Halfway along the line is half of each, 3 across and 2 up from (2, 1)."}, {"id": "ch08-s7-reason", "kind": "reason", "text": "Why average each coordinate? Halfway along the line means halfway across and halfway up. The number halfway between two numbers is their total divided by 2."}, {"id": "ch08-s7-name", "kind": "name", "text": "A line segment is the part of a line between two points, and the point halfway along it is its midpoint. For ends (x₁, y₁) and (x₂, y₂), the midpoint is ((x₁ + x₂) ÷ 2, (y₁ + y₂) ÷ 2)."}, {"id": "ch08-s7-example", "kind": "example", "text": "The midpoint of (−3, 4) and (5, −2) is ((−3 + 5) ÷ 2, (4 + (−2)) ÷ 2), which is (1, 1)."}, {"id": "ch08-s7-mistake", "kind": "mistake", "text": "The tempting slip is to take the ends away instead of adding them: (5 − (−3)) ÷ 2 = 4. That is how far across the midpoint is from each end, not its x-coordinate."}, {"id": "ch08-s7-turn", "kind": "turn", "text": "What is the midpoint of (−6, 3) and (2, 9)?", "answer": "(−2, 6)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["-2", "6"]}]}], "accepts": ["(−2, 6)", "(-2, 6)", "−2, 6"], "rejects": ["(4, 3)", "(6, −2)", "(−4, 12)"], "mistakes": []}}, {"id": "ch08-s7-sayBack", "kind": "sayBack", "text": "A midpoint averages the x-coordinates of the ends, then their y-coordinates."}]}], "callouts": [{"id": "ch08-c-predict", "kind": "predict", "title": "Predict first", "body": "Predict the angle at C when the angles at A and B are both 65°. Then set both sliders to 65° and read the grey angle."}, {"id": "ch08-c-aha", "kind": "check", "title": "Explain it", "body": "Two lines cross and one angle is 70°. Explain to a friend why the angle straight across the crossing must be 70° too."}, {"id": "ch08-c-trap", "kind": "careful", "title": "Beside or opposite", "body": "Where two lines cross, the angles opposite each other are equal. Angles side by side share a straight line, so they add to 180°."}], "keyTerms": ["Angle", "Vertically opposite angles", "Transversal", "Corresponding angles", "Alternate angles", "Co-interior angles", "Proof", "Exterior angle", "Polygon", "Interior angle", "Midpoint"], "widgets": ["w_parallel_transversal_proof", "w_exterior_angle_tear_proof"], "debate": {"id": "debate-ch08-angles", "chapterNumber": 8, "oupUnitNumber": 8, "title": "Equal, or adding to 180°?", "contextPrompt": "A transversal crosses two parallel lines. Meera and Dev look at the two angles between the lines, on the same side of the transversal. One of them is 65°.", "speakerAName": "Meera", "speakerAClaim": "Angles between parallel lines match, so the other one is 65° too.", "speakerBName": "Dev", "speakerBClaim": "They are co-interior angles, so they add to 180° and the other one is 115°.", "choices": [{"id": "ch08-a", "speakerLabel": "Meera is right (65°)", "reasoningStatement": "Any two angles between parallel lines are equal.", "isCorrect": false, "socraticRebuttal": "Draw the transversal at a steep slant. Do the two angles on the same side look the same, or is one wide and the other narrow?"}, {"id": "ch08-b", "speakerLabel": "Dev is right (115°)", "reasoningStatement": "Co-interior angles, in a C shape, add to 180°.", "isCorrect": true, "socraticRebuttal": "Yes. The angle beside the 65° on the same parallel line is 115°. It is alternate to the other angle in the C, so that one is 115° as well."}, {"id": "ch08-c", "speakerLabel": "Neither. Each is 90°.", "reasoningStatement": "Two angles that add to 180° must each be 90°.", "isCorrect": false, "socraticRebuttal": "Is 65° + 115° also 180°? What does adding to 180° tell you about each angle on its own?"}], "invariantTakeaway": "Alternate angles are equal, and co-interior angles add to 180°. Find the Z or the C before you decide."}}, {"id": "ch09", "number": 9, "volumeNumber": 3, "volumeTitle": "Volume III · Euclid's Compass, Circles & Trigonometry", "title": "Constructions, bearings and nets", "subtitle": "School book chapter 3 · Compass drawings, four-sided shapes, directions and solids", "hookSummary": "With only a pencil, a ruler and a pair of compasses you can cut a line exactly in half. No measuring is needed. Why do two arcs know where the middle is?", "beyondSchoolBook": false, "skillCard": {"skill": "Drawing exact shapes with compasses, giving directions as bearings, and counting the parts of a solid", "sheCan": {"prompt": "With no calculator: a ship sails on a bearing of 070°. What is the bearing back to its start? A solid with no holes has 5 vertices and 8 edges: how many faces does it have? Three angles of a quadrilateral are 90°, 80° and 105°: find the fourth.", "answer": "The bearing back is 070° + 180° = 250°. Euler's formula gives 5 − 8 + F = 2, so F = 5. The fourth angle is 360° − 275° = 85°."}, "whyItMatters": "Sailors and pilots steer by bearings, and builders draw exact views of a house before anyone lays a brick. A compass drawing shows where every point that obeys a rule must lie.", "standsOn": ["Chapter 8: angle facts, co-interior angles and the midpoint", "Chapter 7: parallel lines", "Measuring lengths with a ruler and angles in degrees"], "unlocks": ["Chapter 10: circles, and how much a solid holds", "Chapter 11: moving and resizing shapes", "Chapter 12: the straight-line distance across a journey with a turn in it"]}, "intuitionToFormula": {"concreteAction": "Set AB to 6 cm and the compass opening to 4 cm. The blue arcs from A and B cross above and below AB, and the red line joins the two crossings.", "ahaInvariant": "Move P up and down the red line. PA and PB change, but they always stay equal. So every point on the red line is as far from A as it is from B.", "formulaDisplay": "PA = PB for every point P on the perpendicular bisector of AB", "termMappings": [{"symbol": "the arcs", "visualPart": "The blue arcs", "colorRole": "blue", "meaning": "Points one compass opening from A, and points one compass opening from B"}, {"symbol": "the perpendicular bisector", "visualPart": "The red line", "colorRole": "red", "meaning": "The line through both crossings, at a right angle to AB"}, {"symbol": "PA = PB", "visualPart": "The two green dashed lines", "colorRole": "green", "meaning": "The distance from P to A, and the distance from P to B"}], "atlasFigureRef": "maths/ch09-loci-constructions/index.html"}, "sections": [{"id": "ch09-s1", "heading": "9.1 Every point at one distance", "excerpt": "Every spot it reaches with the rope tight is exactly 3 m from the post. Those spots make a circle, with the post at its centre.", "teaches": ["locus"], "steps": [{"id": "ch09-s1-question", "kind": "question", "text": "A goat is tied to a post by a rope 3 m long. It walks round with the rope pulled tight. What shape does it trace on the grass?"}, {"id": "ch09-s1-idea", "kind": "idea", "text": "Every spot it reaches with the rope tight is exactly 3 m from the post. Those spots make a circle, with the post at its centre."}, {"id": "ch09-s1-picture", "kind": "picture", "text": "Push a pin into card and loop a 3 cm thread round the pin and a pencil. Draw with the thread pulled tight. Every pencil mark is 3 cm from the pin."}, {"id": "ch09-s1-reason", "kind": "reason", "text": "Why a circle, and nothing else? A spot closer than 3 m leaves the rope slack. A spot further away needs a longer rope. Only the spots at exactly 3 m are left."}, {"id": "ch09-s1-name", "kind": "name", "text": "All the points that obey a rule make up a locus, and more than one locus are loci. The locus of points 3 m from a post is a circle round the post."}, {"id": "ch09-s1-example", "kind": "example", "text": "The locus of points 2 cm from a point O is a circle round O. The point 2 cm to the left of O is on it. A point 1 cm from O is inside the circle, so it is not on the locus."}, {"id": "ch09-s1-mistake", "kind": "mistake", "text": "The tempting slip is to mark one point that obeys the rule and stop. A locus is every point that obeys it, so it is usually a whole line or curve."}, {"id": "ch09-s1-turn", "kind": "turn", "text": "A goat's rope is 4 m long and tied to a post. How wide is the circle its rope traces, from one side to the other through the post?", "answer": "8 m", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "8"}]}], "accepts": ["8", "8 m", "8m"], "rejects": ["4", "16", "2"], "mistakes": []}}, {"id": "ch09-s1-sayBack", "kind": "sayBack", "text": "A locus is every point that obeys a rule. Points at one distance from a point make a circle."}]}, {"id": "ch09-s2", "heading": "9.2 Equally far from two points", "excerpt": "The point halfway between A and B works, 3 km from each. So does any point straight above or below that halfway point, on a line across AB.", "teaches": ["perpendicular-bisector"], "steps": [{"id": "ch09-s2-question", "kind": "question", "text": "Two friends live at A and B, 6 km apart. They want a café exactly as far from one home as from the other. Where could it go?"}, {"id": "ch09-s2-idea", "kind": "idea", "text": "The point halfway between A and B works, 3 km from each. So does any point straight above or below that halfway point, on a line across AB."}, {"id": "ch09-s2-picture", "kind": "picture", "text": "In the figure, set AB to 6 cm and the compass opening to 4 cm. The blue arcs from A and B cross twice, above and below AB. The red line joins the two crossings."}, {"id": "ch09-s2-reason", "kind": "reason", "text": "Why is each crossing equally far from A and B? Both arcs were drawn with the same opening, 4 cm. Fold the paper along the red line and A lands on B, so every point on the fold is equally far from both."}, {"id": "ch09-s2-name", "kind": "name", "text": "To bisect something is to cut it into two equal parts. The red line is the perpendicular bisector of AB: it cuts AB in half at its midpoint, at a right angle. It is the locus of points equally far from A and B."}, {"id": "ch09-s2-example", "kind": "example", "text": "A and B are 8 cm apart. Open the compasses to 5 cm and draw an arc from each end. The line through the two crossings meets AB 4 cm from each end, at a right angle."}, {"id": "ch09-s2-mistake", "kind": "mistake", "text": "The tempting slip is to open the compasses to half of AB or less. Then the two arcs only touch, or miss each other, and there is no line to draw."}, {"id": "ch09-s2-turn", "kind": "turn", "text": "A and B are 10 cm apart. A point P is on the perpendicular bisector of AB, and PA is 13 cm. What is PB?", "answer": "13 cm", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "13"}]}], "accepts": ["13", "13 cm", "PB = 13"], "rejects": ["10", "5", "26"], "mistakes": []}}, {"id": "ch09-s2-sayBack", "kind": "sayBack", "text": "Every point on the perpendicular bisector of AB is as far from A as it is from B."}], "figure": true}, {"id": "ch09-s3", "heading": "9.3 Cutting an angle in half", "excerpt": "The path should split the corner evenly, into two angles of 35°. Then every point on it is the same distance from each fence.", "teaches": ["angle-bisector"], "steps": [{"id": "ch09-s3-question", "kind": "question", "text": "Two straight fences meet at a corner at 70°. A gardener wants a path that stays as far from one fence as from the other. Which way should it run?"}, {"id": "ch09-s3-idea", "kind": "idea", "text": "The path should split the corner evenly, into two angles of 35°. Then every point on it is the same distance from each fence."}, {"id": "ch09-s3-picture", "kind": "picture", "text": "Draw a 70° angle. Put the compass point on the corner and draw an arc that crosses both arms. From each crossing, draw an arc of one size so the two meet inside. Rule a line from the corner through that point."}, {"id": "ch09-s3-reason", "kind": "reason", "text": "Why are the two halves equal? Join the meeting point to the two crossings, and you have two triangles. Their three sides match pair by pair, so their angles match too, including the two halves at the corner."}, {"id": "ch09-s3-name", "kind": "name", "text": "The line that cuts an angle into two equal angles is its angle bisector. It is the locus of points the same distance from both arms of the angle."}, {"id": "ch09-s3-example", "kind": "example", "text": "The angle bisector of a 130° angle makes two angles of 65°. A point on it that is 4 cm from one arm is 4 cm from the other arm too."}, {"id": "ch09-s3-mistake", "kind": "mistake", "text": "The tempting slip is to measure the distance to an arm along a slant. The distance from a point to a line is the shortest one, at a right angle to the line."}, {"id": "ch09-s3-turn", "kind": "turn", "text": "An angle of 148° is cut by its angle bisector. What size is each of the two new angles?", "answer": "74°", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "74"}]}], "accepts": ["74", "74°", "= 74°"], "rejects": ["296", "32", "148"], "mistakes": []}}, {"id": "ch09-s3-sayBack", "kind": "sayBack", "text": "An angle bisector cuts an angle into two equal halves, and its points are equally far from both arms."}]}, {"id": "ch09-s4", "heading": "9.4 Triangles that must match", "excerpt": "Yes. Draw the 7 cm side first. The third corner must be 5 cm from one end and 6 cm from the other, and only one point above the line is both.", "teaches": ["congruent"], "steps": [{"id": "ch09-s4-question", "kind": "question", "text": "Kym and a friend each draw a triangle with sides of 5 cm, 6 cm and 7 cm. Must their two triangles be exactly the same?"}, {"id": "ch09-s4-idea", "kind": "idea", "text": "Yes. Draw the 7 cm side first. The third corner must be 5 cm from one end and 6 cm from the other, and only one point above the line is both."}, {"id": "ch09-s4-picture", "kind": "picture", "text": "Rule a 7 cm line. Open the compasses to 5 cm and draw an arc from the left end. Open them to 6 cm and draw an arc from the right end. Join the crossing to both ends."}, {"id": "ch09-s4-reason", "kind": "reason", "text": "Why is there no other choice? Each arc is a locus, every point at one distance from an end. Above the line the two arcs cross once. The crossing below gives the same triangle, flipped over."}, {"id": "ch09-s4-name", "kind": "name", "text": "Shapes with exactly the same shape and size are congruent. Two triangles are congruent if all three sides match, written SSS. Two sides and the angle between them also fix a triangle, written SAS. So do two angles and the side between them, written ASA."}, {"id": "ch09-s4-example", "kind": "example", "text": "Triangle ABC has AB = 6 cm, angle A = 40° and AC = 9 cm. Every triangle drawn from those three facts is congruent to it, by SAS. So its third side and its other two angles match ABC's as well."}, {"id": "ch09-s4-mistake", "kind": "mistake", "text": "The tempting slip is to use three matching angles. A triangle with every angle 60° can have sides of 1 cm or of 1 km. Matching angles fix the shape, but not the size."}, {"id": "ch09-s4-turn", "kind": "turn", "text": "Triangle PQR is congruent to triangle ABC, with P matching A, Q matching B and R matching C. Angle A is 50° and angle B is 70°. What is angle R?", "answer": "60°", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "60"}]}], "accepts": ["60", "60°", "R = 60°"], "rejects": ["50", "70", "120"], "mistakes": []}}, {"id": "ch09-s4-sayBack", "kind": "sayBack", "text": "Congruent shapes match exactly. SSS, SAS or ASA is enough to show that two triangles are congruent."}]}, {"id": "ch09-s5", "heading": "9.5 Four sides and two diagonals", "excerpt": "All four sides are 4 cm, so it is a diamond with equal sides. Line AB and the red line join its opposite corners, and they cross at a right angle, halfway along each.", "teaches": ["quadrilateral"], "steps": [{"id": "ch09-s5-question", "kind": "question", "text": "In 9.2, each arc crossing was 4 cm from A and 4 cm from B. Join A, the top crossing, B and the bottom crossing in order. What shape do the four lines make?"}, {"id": "ch09-s5-idea", "kind": "idea", "text": "All four sides are 4 cm, so it is a diamond with equal sides. Line AB and the red line join its opposite corners, and they cross at a right angle, halfway along each."}, {"id": "ch09-s5-picture", "kind": "picture", "text": "Draw a square, a rectangle, a diamond with equal sides and a kite. In each, join opposite corners with two straight lines. Mark where they cross at a right angle."}, {"id": "ch09-s5-reason", "kind": "reason", "text": "Why do the angles of any four-sided shape add to 360°? A line between opposite corners cuts it into 2 triangles. Each triangle's angles add to 180°, and 2 × 180° = 360°."}, {"id": "ch09-s5-name", "kind": "name", "text": "A polygon with four sides is a quadrilateral, and its angles add to 360°. A rhombus has four equal sides, and a parallelogram has two pairs of parallel sides. The lines joining opposite corners are the diagonals."}, {"id": "ch09-s5-example", "kind": "example", "text": "A kite has angles of 110°, 110° and 50°. Its fourth angle is 360° − 110° − 110° − 50° = 90°. Its diagonals cross at a right angle, as a kite's always do."}, {"id": "ch09-s5-mistake", "kind": "mistake", "text": "The tempting slip is to say a square is not a rhombus. A square has four equal sides, so it is a rhombus, one that has right angles too."}, {"id": "ch09-s5-turn", "kind": "turn", "text": "Three angles of a quadrilateral are 85°, 95° and 110°. What is the fourth angle?", "answer": "70°", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "70"}]}], "accepts": ["70", "70°", "= 70°"], "rejects": ["290", "180", "110"], "mistakes": []}}, {"id": "ch09-s5-sayBack", "kind": "sayBack", "text": "A quadrilateral has four sides and angles adding to 360°. Its sides and diagonals tell which kind it is."}]}, {"id": "ch09-s6", "heading": "9.6 Directions as bearings", "excerpt": "Face north, then turn clockwise until you face the boat's way. North-east is halfway to east, so the turn is 45°. Writing 045° keeps every direction to three figures, from 000° to 359°.", "teaches": ["bearing"], "steps": [{"id": "ch09-s6-question", "kind": "question", "text": "A boat leaves a harbour heading north-east, and the captain writes the direction as 045°. What does that number measure, and why does it have three figures?"}, {"id": "ch09-s6-idea", "kind": "idea", "text": "Face north, then turn clockwise until you face the boat's way. North-east is halfway to east, so the turn is 45°. Writing 045° keeps every direction to three figures, from 000° to 359°."}, {"id": "ch09-s6-picture", "kind": "picture", "text": "Draw a north arrow at the harbour and the boat's path. Mark the turn from north to the path, clockwise. Then draw a north arrow at the boat, and look back along the path to the harbour."}, {"id": "ch09-s6-reason", "kind": "reason", "text": "Why does the way back differ by 180°? The two north arrows are parallel. The angles between them and the path are co-interior angles, so they add to 180°."}, {"id": "ch09-s6-name", "kind": "name", "text": "A direction measured clockwise from north, in three figures, is a bearing. The bearing of the way back is the back bearing. Add 180° to a bearing under 180°, and take 180° from a bearing over 180°."}, {"id": "ch09-s6-example", "kind": "example", "text": "A boat sails on a bearing of 065°. Its back bearing is 065° + 180° = 245°. A plane flies on a bearing of 290°, so its back bearing is 290° − 180° = 110°."}, {"id": "ch09-s6-mistake", "kind": "mistake", "text": "The tempting slip is to turn anticlockwise from north. West is a quarter turn anticlockwise, but its bearing is 270°, three quarter turns clockwise."}, {"id": "ch09-s6-turn", "kind": "turn", "text": "A ship sails from a port on a bearing of 130°. What is the bearing of the port from the ship?", "answer": "310°", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "310"}]}], "accepts": ["310", "310°", "= 310°"], "rejects": ["50", "050°", "230"], "mistakes": []}}, {"id": "ch09-s6-sayBack", "kind": "sayBack", "text": "A bearing turns clockwise from north and has three figures. The back bearing differs from it by 180°."}]}, {"id": "ch09-s7", "heading": "9.7 Flat drawings of a solid", "excerpt": "The flat card is six rectangles joined at the folds: front, back, two sides, top and bottom. Fold along the lines and it closes into the box again.", "teaches": ["net-of-a-solid", "plan-and-elevation"], "steps": [{"id": "ch09-s7-question", "kind": "question", "text": "A cereal box is opened out flat along its folds. What shapes make up the flat card, and could you fold it back into the box?"}, {"id": "ch09-s7-idea", "kind": "idea", "text": "The flat card is six rectangles joined at the folds: front, back, two sides, top and bottom. Fold along the lines and it closes into the box again."}, {"id": "ch09-s7-picture", "kind": "picture", "text": "Draw six equal squares in a cross: a row of four, with one more above and one below the second square. Cut it out and fold along every line. It closes into a cube."}, {"id": "ch09-s7-reason", "kind": "reason", "text": "Why do some patterns of six squares fail? If two squares fold onto the same side of the cube, another side stays open. The cross works because each square lands on a different side."}, {"id": "ch09-s7-name", "kind": "name", "text": "A flat pattern that folds into a solid is a net of a solid. A solid can also be drawn as three flat views. The view from directly above is the plan view. The views from the front and the side are the front elevation and the side elevation."}, {"id": "ch09-s7-example", "kind": "example", "text": "A cuboid is 5 cm long, 3 cm wide and 2 cm tall. Its plan view is a 5 cm by 3 cm rectangle. Its front elevation is 5 cm by 2 cm, and its side elevation is 3 cm by 2 cm."}, {"id": "ch09-s7-mistake", "kind": "mistake", "text": "The tempting slip is to draw the plan view on a slant, the way the solid looks from a corner. A plan view looks straight down, so a cuboid's is a plain rectangle."}, {"id": "ch09-s7-turn", "kind": "turn", "text": "A cuboid is 6 cm long, 4 cm wide and 3 cm tall. What is the area of its plan view?", "answer": "24 cm²", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "24"}]}], "accepts": ["24", "24 cm²", "24 cm2"], "rejects": ["18", "12", "72"], "mistakes": []}}, {"id": "ch09-s7-sayBack", "kind": "sayBack", "text": "A net of a solid folds up into it. The plan view and the elevations show it from above, the front and the side."}]}, {"id": "ch09-s8", "heading": "9.8 Corners, edges and faces", "excerpt": "For the cube, 8 − 12 + 6 = 2. The pyramid has 5 corners, 8 edges and 5 flat sides, and 5 − 8 + 5 = 2 as well.", "teaches": ["vertices-edges-faces", "eulers-formula"], "steps": [{"id": "ch09-s8-question", "kind": "question", "text": "A cube has 8 corners, 12 edges and 6 flat sides. Work out 8 − 12 + 6. Then do the same for a pyramid on a square. What do you notice?"}, {"id": "ch09-s8-idea", "kind": "idea", "text": "For the cube, 8 − 12 + 6 = 2. The pyramid has 5 corners, 8 edges and 5 flat sides, and 5 − 8 + 5 = 2 as well."}, {"id": "ch09-s8-picture", "kind": "picture", "text": "Hold a box, or draw one. Touch and count each corner, then each edge, then each flat side. Write the three counts in a table, and add a row for the pyramid."}, {"id": "ch09-s8-reason", "kind": "reason", "text": "Why does the answer stay at 2? Slice one corner off a cube. You lose 1 corner and gain 3 new ones. You also gain 3 edges and 1 flat side. So corners − edges + sides changes by 2 − 3 + 1 = 0."}, {"id": "ch09-s8-name", "kind": "name", "text": "The flat surfaces of a solid are its faces, the lines where two faces meet are its edges, and the corners are its vertices. One corner is a vertex. For a solid with no holes, Euler's formula says V − E + F = 2."}, {"id": "ch09-s8-example", "kind": "example", "text": "A pyramid on a triangle has 4 vertices, 6 edges and 4 faces, and 4 − 6 + 4 = 2. A solid with 12 vertices and 30 edges has 30 − 12 + 2 = 20 faces."}, {"id": "ch09-s8-mistake", "kind": "mistake", "text": "The tempting slip is to count only the edges you can see in a drawing. A cube drawn on paper shows 9 of its edges, and the other 3 hide at the back."}, {"id": "ch09-s8-turn", "kind": "turn", "text": "A solid with no holes has 7 faces and 10 vertices. Use Euler's formula to find its number of edges.", "answer": "15", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "15"}]}], "accepts": ["15", "15 edges", "E = 15"], "rejects": ["17", "19", "5"], "mistakes": []}}, {"id": "ch09-s8-sayBack", "kind": "sayBack", "text": "Count the vertices, the edges and the faces. For a solid with no holes, V − E + F = 2."}]}], "callouts": [{"id": "ch09-c-predict", "kind": "predict", "title": "Predict first", "body": "Set AB to 8 cm and the compass opening to 3 cm. Predict whether the two arcs will cross, then look."}, {"id": "ch09-c-aha", "kind": "check", "title": "Explain it", "body": "A goat is tied to a post by a rope 5 m long. Explain to a friend why the edge of the grass it can reach is a circle."}, {"id": "ch09-c-trap", "kind": "careful", "title": "Every point, not one", "body": "A rule such as 3 cm from a pin is obeyed by a whole circle of points, not by one. Find every point that obeys the rule."}], "keyTerms": ["Locus", "Perpendicular bisector", "Angle bisector", "Congruent", "Quadrilateral", "Bearing", "Net of a solid", "Plan and elevation", "Vertices, edges and faces", "Euler's formula"], "widgets": ["w_euclid_compass_locus", "w_bearings_back_bearing_radar", "w_polyhedron_net_folder"], "debate": {"id": "debate-ch09-bearings", "chapterNumber": 9, "oupUnitNumber": 3, "title": "Which way is back?", "contextPrompt": "A boat sails from a harbour on a bearing of 300°. Asha and Rohan work out the bearing of the harbour from the boat.", "speakerAName": "Asha", "speakerAClaim": "The way back is the opposite way, so add 180°. The back bearing is 480°.", "speakerBName": "Rohan", "speakerBClaim": "A bearing stays under 360°, so take 180° away instead. The back bearing is 120°.", "choices": [{"id": "ch09-a", "speakerLabel": "Asha is right (480°)", "reasoningStatement": "To face the other way, always add 180°.", "isCorrect": false, "socraticRebuttal": "Turning 480° clockwise from north is more than a full turn. Take away the full turn of 360°: which way do you face then?"}, {"id": "ch09-b", "speakerLabel": "Rohan is right (120°)", "reasoningStatement": "For a bearing over 180°, take 180° away to get the way back.", "isCorrect": true, "socraticRebuttal": "Yes. 300° − 180° = 120°, and adding 180° to 120° brings you round to 300° again."}, {"id": "ch09-c", "speakerLabel": "Neither. It is 060°.", "reasoningStatement": "The way back is 360° − 300°.", "isCorrect": false, "socraticRebuttal": "360° − 300° is the turn from north the other way round. Does 060° point exactly opposite to 300°, or somewhere else?"}], "invariantTakeaway": "The back bearing is half a turn from the bearing. Add 180° or take 180° away, whichever lands from 000° to 359°."}}, {"id": "ch10", "number": 10, "volumeNumber": 3, "volumeTitle": "Volume III · Euclid's Compass, Circles & Trigonometry", "title": "Circles, prisms and volume", "subtitle": "School book chapter 5 · The distance round a circle, the space inside shapes, and how much a solid holds", "hookSummary": "A circle has no straight sides to measure along. So how can a pizza's area be worked out with a ruler?", "beyondSchoolBook": false, "skillCard": {"skill": "Working out the distance round a circle, the area of curved and slanted shapes, and the space inside a solid", "sheCan": {"prompt": "With no calculator: a circle has a radius of 10 cm. Using π ≈ 3.14, find the distance round it and its area. A prism has a cross-section of 12 cm² and a length of 5 cm. What is its volume?", "answer": "The circumference is 2 × 3.14 × 10 = 62.8 cm. The area is 3.14 × 10 × 10 = 314 cm². The volume is 12 × 5 = 60 cm³."}, "whyItMatters": "Wheels, pipes, tins and water tanks are round or long and straight. Working out how far a wheel rolls, or how much a tank holds, needs these rules.", "standsOn": ["Chapter 9: loci, nets and the faces of a solid", "Chapter 8: polygons and their angles", "The area of a rectangle, counted in unit squares"], "unlocks": ["Chapter 11: moving and resizing shapes, and what resizing does to an area", "Chapter 12: the sides of a right-angled triangle", "Chapter 18: areas under curves, found by adding thin slices"]}, "intuitionToFormula": {"concreteAction": "Set the radius to 4 cm and the slices to 12. The circle's slices sit top to tail in a strip, points up and points down.", "ahaInvariant": "Move the slices slider up. The strip straightens into a rectangle πr long and r tall. So the circle's area is πr × r = πr².", "formulaDisplay": "A = πr × r = πr²", "termMappings": [{"symbol": "πr", "visualPart": "The blue curved edges along the bottom of the strip", "colorRole": "blue", "meaning": "Half of the distance round the circle"}, {"symbol": "r", "visualPart": "The red height of the strip", "colorRole": "red", "meaning": "The radius, from the centre of the circle to its edge"}, {"symbol": "the green slice", "visualPart": "The green part of the circle", "colorRole": "green", "meaning": "A slice with the angle set by the third slider, and its share of the area"}], "atlasFigureRef": "maths/ch10-circles-mensuration/index.html"}, "sections": [{"id": "ch10-s1", "heading": "10.1 Across a circle", "excerpt": "Each spoke reaches from the middle to the edge. Two spokes in one straight line reach right across, so the wheel is 60 cm across.", "teaches": ["radius-and-diameter"], "steps": [{"id": "ch10-s1-question", "kind": "question", "text": "A bicycle wheel has spokes running from the hub to the rim, each 30 cm long. How far is it across the wheel, through the hub?"}, {"id": "ch10-s1-idea", "kind": "idea", "text": "Each spoke reaches from the middle to the edge. Two spokes in one straight line reach right across, so the wheel is 60 cm across."}, {"id": "ch10-s1-picture", "kind": "picture", "text": "Draw a circle with the compasses open to 4 cm. Rule a line from the centre to the edge, then a line right across through the centre."}, {"id": "ch10-s1-reason", "kind": "reason", "text": "Why is the line across twice the line out? The circle is the locus of points 4 cm from the centre. The line across is one 4 cm line out on each side."}, {"id": "ch10-s1-name", "kind": "name", "text": "The distance from the centre of a circle to its edge is the radius, and more than one are radii. The distance across through the centre is the diameter, twice the radius."}, {"id": "ch10-s1-example", "kind": "example", "text": "A coin has a diameter of 24 mm. Its radius is 24 ÷ 2 = 12 mm. A round table with a radius of 75 cm has a diameter of 150 cm."}, {"id": "ch10-s1-mistake", "kind": "mistake", "text": "The tempting slip is to measure across the circle without passing through the centre. Any line across that misses the centre is shorter than the diameter."}, {"id": "ch10-s1-turn", "kind": "turn", "text": "A round pond has a diameter of 9 m. What is its radius?", "answer": "4.5 m", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "4.5"}]}], "accepts": ["4.5", "4.5 m", "4.5m"], "rejects": ["18", "9", "3"], "mistakes": []}}, {"id": "ch10-s1-sayBack", "kind": "sayBack", "text": "The radius runs from the centre to the edge. The diameter runs right across through the centre, and is twice the radius."}]}, {"id": "ch10-s2", "heading": "10.2 The distance round", "excerpt": "A little more than 3, every time. A coin, a tin and a plate all give the same answer, whether the circle is big or small.", "teaches": ["pi", "circumference"], "steps": [{"id": "ch10-s2-question", "kind": "question", "text": "Wrap a string once round a tin, then lay it beside the tin's diameter. How many diameters long is the string?"}, {"id": "ch10-s2-idea", "kind": "idea", "text": "A little more than 3, every time. A coin, a tin and a plate all give the same answer, whether the circle is big or small."}, {"id": "ch10-s2-picture", "kind": "picture", "text": "Measure round three round things with string, and measure across each one. Divide the distance round by the distance across. Each answer comes out near 3.14."}, {"id": "ch10-s2-reason", "kind": "reason", "text": "Why is it the same for every circle? All circles are the same shape, only bigger or smaller. Double the diameter and the distance round doubles too, so the one divided by the other stays the same."}, {"id": "ch10-s2-name", "kind": "name", "text": "The distance round a circle is its circumference. It is always π times the diameter, where π, said pi, is about 3.14. So C = πd, or C = 2πr."}, {"id": "ch10-s2-example", "kind": "example", "text": "A plate has a diameter of 20 cm. Its circumference is π × 20, which is about 3.14 × 20 = 62.8 cm."}, {"id": "ch10-s2-mistake", "kind": "mistake", "text": "The tempting slip is to multiply the radius by π and stop. That gives half the circumference, because πd = π × 2r."}, {"id": "ch10-s2-turn", "kind": "turn", "text": "A wheel has a radius of 5 cm. Using π ≈ 3.14, what is its circumference?", "answer": "31.4 cm", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "31.4"}]}], "accepts": ["31.4", "31.4 cm", "C = 31.4"], "rejects": ["15.7", "78.5", "10"], "mistakes": []}}, {"id": "ch10-s2-sayBack", "kind": "sayBack", "text": "Every circle's circumference is π times its diameter, and π is about 3.14."}]}, {"id": "ch10-s3", "heading": "10.3 Slanted shapes", "excerpt": "Yes. Cut a triangle off one slanted end and slide it to the other end. The parallelogram becomes a 6 cm by 4 cm rectangle, with area 24 cm².", "teaches": ["trapezium"], "steps": [{"id": "ch10-s3-question", "kind": "question", "text": "A parallelogram leans over, with a base of 6 cm and a height of 4 cm. Does it cover the same space as a 6 cm by 4 cm rectangle?"}, {"id": "ch10-s3-idea", "kind": "idea", "text": "Yes. Cut a triangle off one slanted end and slide it to the other end. The parallelogram becomes a 6 cm by 4 cm rectangle, with area 24 cm²."}, {"id": "ch10-s3-picture", "kind": "picture", "text": "Draw a parallelogram on squared paper and cut it out. Cut straight down from one top corner, and move the triangle across. It fits into a rectangle."}, {"id": "ch10-s3-reason", "kind": "reason", "text": "Why the straight-up height and not the slanted side? Cutting and sliding keeps the area the same. The rectangle it makes is as tall as the straight-up height."}, {"id": "ch10-s3-name", "kind": "name", "text": "A parallelogram's area is base × height, with the height at a right angle to the base. A quadrilateral with one pair of parallel sides is a trapezium. Two copies make a parallelogram, so a trapezium's area is ½(a + b) × h."}, {"id": "ch10-s3-example", "kind": "example", "text": "A trapezium has parallel sides of 5 cm and 9 cm, with 4 cm between them. Its area is ½ × (5 + 9) × 4 = 7 × 4 = 28 cm²."}, {"id": "ch10-s3-mistake", "kind": "mistake", "text": "The tempting slip is to use the slanted side as the height. A parallelogram with base 9 cm, slanted side 5 cm and height 4 cm has area 36 cm², not 45 cm²."}, {"id": "ch10-s3-turn", "kind": "turn", "text": "A trapezium has parallel sides of 3 cm and 7 cm, and the height between them is 4 cm. What is its area?", "answer": "20 cm²", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "20"}]}], "accepts": ["20", "20 cm²", "20 cm2"], "rejects": ["40", "84", "10"], "mistakes": []}}, {"id": "ch10-s3-sayBack", "kind": "sayBack", "text": "A parallelogram's area is base × height. A trapezium's is half the two parallel sides added, × height. Use the straight-up height."}]}, {"id": "ch10-s4", "heading": "10.4 The space inside a circle", "excerpt": "Cut it into thin slices and lay them top to tail, points up and points down. They make a shape that is nearly a rectangle.", "teaches": ["area-of-a-circle"], "steps": [{"id": "ch10-s4-question", "kind": "question", "text": "A pizza has a radius of 10 cm. How much space does it cover? A circle has no straight sides to multiply together."}, {"id": "ch10-s4-idea", "kind": "idea", "text": "Cut it into thin slices and lay them top to tail, points up and points down. They make a shape that is nearly a rectangle."}, {"id": "ch10-s4-picture", "kind": "picture", "text": "In the figure, set the radius to 4 cm and the slices to 12. The slices sit top to tail in a strip. Move the slices slider up and watch the strip straighten."}, {"id": "ch10-s4-reason", "kind": "reason", "text": "Why is the strip πr long and r tall? Half the slices have their curved edges along the bottom, so the bottom is half the circumference, πr. Each slice is one radius tall."}, {"id": "ch10-s4-name", "kind": "name", "text": "So the area of a circle is πr × r, written πr². With π ≈ 3.14, the pizza of radius 10 cm covers about 314 cm²."}, {"id": "ch10-s4-example", "kind": "example", "text": "A round rug has a radius of 2 m. Its area is π × 2², which is about 3.14 × 4 = 12.56 m²."}, {"id": "ch10-s4-mistake", "kind": "mistake", "text": "The tempting slip is to work out π × r × 2 in place of π × r × r. For a radius of 10 cm that gives 62.8, which is a length round the edge, not an area."}, {"id": "ch10-s4-turn", "kind": "turn", "text": "A circle has a radius of 3 cm. Using π ≈ 3.14, what is its area?", "answer": "28.26 cm²", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "28.26"}]}], "accepts": ["28.26", "28.26 cm²", "28.26 cm2"], "rejects": ["18.84", "9.42", "113.04"], "mistakes": []}}, {"id": "ch10-s4-sayBack", "kind": "sayBack", "text": "Lay a circle's slices top to tail and they make a strip πr long and r tall. So its area is πr²."}], "figure": true}, {"id": "ch10-s5", "heading": "10.5 Slices of a circle", "excerpt": "Each slice is a quarter of the pizza. So its area is a quarter of the whole area, and its crust is a quarter of the circumference.", "teaches": ["sector"], "steps": [{"id": "ch10-s5-question", "kind": "question", "text": "A pizza of radius 10 cm is cut into 4 equal slices. How much pizza is in one slice, and how long is its crust?"}, {"id": "ch10-s5-idea", "kind": "idea", "text": "Each slice is a quarter of the pizza. So its area is a quarter of the whole area, and its crust is a quarter of the circumference."}, {"id": "ch10-s5-picture", "kind": "picture", "text": "Draw a circle and two radii with 90° between them, and shade the slice between them. The 90° is a quarter of the 360° round the centre."}, {"id": "ch10-s5-reason", "kind": "reason", "text": "Why use the angle? The slices round the centre share 360° between them. A slice with an angle of 90° takes 90/360 of the circle, of its area and of its edge."}, {"id": "ch10-s5-name", "kind": "name", "text": "A slice of a circle between two radii is a sector. With an angle θ at the centre, its curved edge has an arc length of θ/360 × 2πr, and its area is θ/360 × πr²."}, {"id": "ch10-s5-example", "kind": "example", "text": "A sector has a radius of 10 cm and an angle of 90°. Its area is ¼ × 314 = 78.5 cm², and its arc length is ¼ × 62.8 = 15.7 cm."}, {"id": "ch10-s5-mistake", "kind": "mistake", "text": "The tempting slip is to give the arc length as the distance round the whole sector. The distance round also takes in the two straight radii."}, {"id": "ch10-s5-turn", "kind": "turn", "text": "A sector has a radius of 6 cm and an angle of 60°. Using π ≈ 3.14, what is its arc length?", "answer": "6.28 cm", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "6.28"}]}], "accepts": ["6.28", "6.28 cm", "= 6.28"], "rejects": ["18.84", "18.28", "37.68"], "mistakes": []}}, {"id": "ch10-s5-sayBack", "kind": "sayBack", "text": "A sector with angle θ is θ/360 of its circle. Its area and its arc length are that share of the whole."}]}, {"id": "ch10-s6", "heading": "10.6 How much a solid holds", "excerpt": "Cut it into slices 1 cm thick. Each slice is the same triangle, so each holds the same amount. Add up the slices.", "teaches": ["volume", "prism", "cross-section"], "steps": [{"id": "ch10-s6-question", "kind": "question", "text": "A box of chocolates is shaped like a long tent, with the same triangle at every point along it. How can you work out the space inside?"}, {"id": "ch10-s6-idea", "kind": "idea", "text": "Cut it into slices 1 cm thick. Each slice is the same triangle, so each holds the same amount. Add up the slices."}, {"id": "ch10-s6-picture", "kind": "picture", "text": "Build a cuboid from 1 cm cubes, 4 cubes long, 3 across and 2 high. One layer across the end holds 3 × 2 = 6 cubes. Count the layers."}, {"id": "ch10-s6-reason", "kind": "reason", "text": "Why multiply? There are 4 layers along the length, each with 6 cubes, so 6 × 4 = 24 cubes. The area of the end counts the cubes in one layer."}, {"id": "ch10-s6-name", "kind": "name", "text": "The space a solid fills is its volume, counted in cubes such as cm³. A solid with the same shape all along its length is a prism. A slice straight across it is its cross-section, and its volume is the area of the cross-section × its length."}, {"id": "ch10-s6-example", "kind": "example", "text": "The tent box has a triangle at each end with base 6 cm and height 4 cm, of area ½ × 6 × 4 = 12 cm². It is 20 cm long, so it holds 12 × 20 = 240 cm³."}, {"id": "ch10-s6-mistake", "kind": "mistake", "text": "The tempting slip is to multiply every length you can see: 6 × 4 × 20 = 480 cm³. That is the box that would fit round the tent, twice as big."}, {"id": "ch10-s6-turn", "kind": "turn", "text": "A prism has a cross-section of area 15 cm² and is 8 cm long. What is its volume?", "answer": "120 cm³", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "120"}]}], "accepts": ["120", "120 cm³", "120 cm3"], "rejects": ["23", "60", "240"], "mistakes": []}}, {"id": "ch10-s6-sayBack", "kind": "sayBack", "text": "A prism has the same cross-section all along. Its volume is the area of the cross-section × its length."}]}, {"id": "ch10-s7", "heading": "10.7 Wrapping a solid", "excerpt": "Open the box out flat into its net. The paper must cover every one of its six rectangles.", "teaches": ["surface-area"], "steps": [{"id": "ch10-s7-question", "kind": "question", "text": "How much paper does it take to cover a box 5 cm long, 3 cm wide and 2 cm tall, with no overlaps?"}, {"id": "ch10-s7-idea", "kind": "idea", "text": "Open the box out flat into its net. The paper must cover every one of its six rectangles."}, {"id": "ch10-s7-picture", "kind": "picture", "text": "Draw the net of the box and label its rectangles. The top and bottom are 5 by 3, the front and back are 5 by 2, and the two ends are 3 by 2."}, {"id": "ch10-s7-reason", "kind": "reason", "text": "Why count each size twice? A cuboid's faces come in opposite pairs of the same size. So the paper needed is 2 × (15 + 10 + 6) = 62 cm²."}, {"id": "ch10-s7-name", "kind": "name", "text": "The total area of all the faces of a solid is its surface area. It is counted in squares such as cm², because it is a flat area folded round."}, {"id": "ch10-s7-example", "kind": "example", "text": "A cube has edges of 3 cm. Each of its 6 faces is 3 × 3 = 9 cm², so its surface area is 6 × 9 = 54 cm²."}, {"id": "ch10-s7-mistake", "kind": "mistake", "text": "The tempting slip is to mix up surface area and volume. The 5 by 3 by 2 box has a surface area of 62 cm² but a volume of 30 cm³."}, {"id": "ch10-s7-turn", "kind": "turn", "text": "A cube has edges of 4 cm. What is its surface area?", "answer": "96 cm²", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "96"}]}], "accepts": ["96", "96 cm²", "96 cm2"], "rejects": ["64", "16", "48"], "mistakes": []}}, {"id": "ch10-s7-sayBack", "kind": "sayBack", "text": "Surface area adds up the area of every face. Its net lays every face out flat to count."}]}, {"id": "ch10-s8", "heading": "10.8 Leaning stacks", "excerpt": "The same. It is the same 20 coins, slid sideways. Each coin keeps its shape and its thickness.", "teaches": ["cavalieris-principle"], "steps": [{"id": "ch10-s8-question", "kind": "question", "text": "Stack 20 coins in a straight pile, then push the pile so it leans. Does the leaning pile hold more metal, less, or the same?"}, {"id": "ch10-s8-idea", "kind": "idea", "text": "The same. It is the same 20 coins, slid sideways. Each coin keeps its shape and its thickness."}, {"id": "ch10-s8-picture", "kind": "picture", "text": "Draw a straight stack of coins as a tall rectangle. Beside it, draw the same stack leaning, as a slanted parallelogram of the same height."}, {"id": "ch10-s8-reason", "kind": "reason", "text": "Why does leaning not change the volume? Cut both stacks at any height, and each cut is one coin's circle. Equal slices at every height add up to equal volumes."}, {"id": "ch10-s8-name", "kind": "name", "text": "Cavalieri's principle says that two solids of the same height have the same volume if their cross-sections at every height have equal areas."}, {"id": "ch10-s8-example", "kind": "example", "text": "A tin shaped like a cylinder has a radius of 4 cm and a height of 10 cm. Every slice is a circle of about 3.14 × 16 = 50.24 cm², so it holds about 502.4 cm³."}, {"id": "ch10-s8-mistake", "kind": "mistake", "text": "The tempting slip is to measure a leaning solid's height along its slant. The height is straight up, at a right angle to the bottom."}, {"id": "ch10-s8-turn", "kind": "turn", "text": "A straight stack of 12 coins has a volume of 30 cm³. It is pushed over so that it leans. What is its volume now?", "answer": "30 cm³", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "30"}]}], "accepts": ["30", "30 cm³", "30 cm3"], "rejects": ["0", "60", "2.5"], "mistakes": []}}, {"id": "ch10-s8-sayBack", "kind": "sayBack", "text": "Equal slices at every height give equal volumes. Leaning a stack does not change how much it holds."}]}], "callouts": [{"id": "ch10-c-predict", "kind": "predict", "title": "Predict first", "body": "Set the slices slider to 4, then to 24. Predict which strip looks more like a rectangle, then look."}, {"id": "ch10-c-aha", "kind": "check", "title": "Explain it", "body": "A round rug and a square rug both measure 2 m across. Explain to a friend which one covers more floor, and why."}, {"id": "ch10-c-trap", "kind": "careful", "title": "Height straight up", "body": "In every area and volume rule in this chapter, the height is measured at a right angle to the bottom. Never measure it along a slant."}], "keyTerms": ["Radius and diameter", "Pi", "Circumference", "Trapezium", "Area of a circle", "Sector", "Volume", "Prism", "Cross-section", "Surface area", "Cavalieri's principle"], "widgets": ["w_circle_sector_rearranger", "w_trapezium_prism_slicer"], "debate": {"id": "debate-ch10-circles", "chapterNumber": 10, "oupUnitNumber": 5, "title": "Twice as wide, how much more pizza?", "contextPrompt": "A small pizza has a radius of 10 cm, and a large one has a radius of 20 cm. Asha and Rohan argue about how much more pizza the large one has.", "speakerAName": "Asha", "speakerAClaim": "The radius is twice as long, so the large pizza has twice as much.", "speakerBName": "Rohan", "speakerBClaim": "The area is πr², and the radius is squared. So the large pizza has four times as much.", "choices": [{"id": "ch10-a", "speakerLabel": "Asha is right (twice as much)", "reasoningStatement": "Double the size, double the pizza.", "isCorrect": false, "socraticRebuttal": "Work out both areas with π ≈ 3.14: 3.14 × 10 × 10 and 3.14 × 20 × 20. Is the second one double the first?"}, {"id": "ch10-b", "speakerLabel": "Rohan is right (four times as much)", "reasoningStatement": "The radius is used twice in πr², so doubling it doubles the area twice.", "isCorrect": true, "socraticRebuttal": "Yes. 314 cm² becomes 1256 cm², which is 4 × 314. The large pizza is twice as long and twice as tall in every direction."}, {"id": "ch10-c", "speakerLabel": "Neither. It is π times as much.", "reasoningStatement": "The rule has a π in it, so π decides how much more.", "isCorrect": false, "socraticRebuttal": "Both pizzas use the same π. Divide one area by the other: what is left once the π cancels?"}], "invariantTakeaway": "Double the radius and the area of a circle is four times as big, because the radius is multiplied by itself."}}, {"id": "ch11", "number": 11, "volumeNumber": 3, "volumeTitle": "Volume III · Euclid's Compass, Circles & Trigonometry", "title": "Moving and resizing shapes", "subtitle": "School book chapter 13 · Sliding, flipping, turning and enlarging shapes on a grid", "hookSummary": "A torch makes a shadow of a cut-out triangle, twice as tall on the wall. Is the shadow's area twice as big too?", "beyondSchoolBook": false, "skillCard": {"skill": "Sliding, flipping, turning and enlarging shapes on a grid, and saying what each move keeps the same", "sheCan": {"prompt": "With no calculator: slide the point (2, 5) by 3 across and −1 up. Turn the point (4, 1) through 180° about (0, 0). A triangle of area 4 cm² is enlarged by scale factor 3. What is its new area?", "answer": "The slide gives (5, 4). The half turn gives (−4, −1). The new area is 3 × 3 × 4 = 36 cm²."}, "whyItMatters": "Every computer game slides, turns and resizes its pictures with these rules. Maps, models and photo prints are enlargements, so their lengths and areas follow the same rules.", "standsOn": ["Chapter 7: points on a grid, written as coordinates", "Chapter 9: the perpendicular bisector, and shapes that match exactly", "Chapter 3: ratio"], "unlocks": ["Chapter 12: right-angled triangles, where matching triangles share their ratios", "Chapter 19: vectors, which grow out of this chapter's column vectors", "Chapter 20: matrices, which do every move in this chapter with four numbers"]}, "intuitionToFormula": {"concreteAction": "Set the scale factor to 2 and the centre to (0, 0). Dashed lines run from the centre C through each corner of the blue triangle PQR.", "ahaInvariant": "Each corner of the red triangle P′Q′R′ is twice as far from C as the matching corner of PQR. And 4 copies of PQR fit inside P′Q′R′.", "formulaDisplay": "CP′ = k × CP,   new area = k² × old area", "termMappings": [{"symbol": "CP", "visualPart": "The blue triangle PQR, and its distance from C", "colorRole": "blue", "meaning": "The shape you start with"}, {"symbol": "k × CP", "visualPart": "The red triangle P′Q′R′, k times as far from C", "colorRole": "red", "meaning": "Every distance from the centre, multiplied by the scale factor"}, {"symbol": "k²", "visualPart": "The green lines that cut P′Q′R′ into copies of PQR", "colorRole": "green", "meaning": "How many copies of the old area fit inside the new one"}], "atlasFigureRef": "maths/linear-algebra/index.html#1"}, "sections": [{"id": "ch11-s1", "heading": "11.1 Sliding a shape", "excerpt": "Only its place changes. Every corner moves 4 squares right and 1 square up. Its shape, its size and the way it faces stay the same.", "teaches": ["transformation", "translation"], "steps": [{"id": "ch11-s1-question", "kind": "question", "text": "Slide a paper triangle across a squared page, 4 squares right and 1 square up, without turning it. What changes, and what stays the same?"}, {"id": "ch11-s1-idea", "kind": "idea", "text": "Only its place changes. Every corner moves 4 squares right and 1 square up. Its shape, its size and the way it faces stay the same."}, {"id": "ch11-s1-picture", "kind": "picture", "text": "On squared paper, draw a triangle with corners at (1, 1), (3, 1) and (1, 2). Add 4 to each x-coordinate and 1 to each y-coordinate, and draw the new triangle."}, {"id": "ch11-s1-reason", "kind": "reason", "text": "Why does every side keep its length? Every corner moves by the same amount. So the gap between any two corners does not change."}, {"id": "ch11-s1-name", "kind": "name", "text": "A change that moves or resizes a shape is a transformation. The shape you start with is the object, and the result is the image. A slide with no turning is a translation."}, {"id": "ch11-s1-example", "kind": "example", "text": "Translate the triangle 4 right and 1 up. The corner (1, 1) goes to (5, 2), (3, 1) goes to (7, 2), and (1, 2) goes to (5, 3)."}, {"id": "ch11-s1-mistake", "kind": "mistake", "text": "The tempting slip is to move one corner and redraw the rest by eye. Every corner must move by the same amount, or the shape bends out of true."}, {"id": "ch11-s1-turn", "kind": "turn", "text": "The point (2, 6) is translated 3 squares left and 4 squares down. Where does it land?", "answer": "(−1, 2)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["-1", "2"]}]}], "accepts": ["(−1, 2)", "(-1, 2)", "−1, 2"], "rejects": ["(5, 10)", "(−1, 10)", "(5, 2)"], "mistakes": []}}, {"id": "ch11-s1-sayBack", "kind": "sayBack", "text": "A translation slides every point of a shape by the same amount. Its shape, its size and the way it faces stay the same."}]}, {"id": "ch11-s2", "heading": "11.2 Two numbers for a slide", "excerpt": "Write the steps across first and the steps up second. A step south is a step up of −1, so 2 steps south is −2. The slide is 5, then −2.", "teaches": ["column-vector"], "steps": [{"id": "ch11-s2-question", "kind": "question", "text": "A treasure map says: walk 5 steps east, then 2 steps south. How can you write that slide with only two numbers?"}, {"id": "ch11-s2-idea", "kind": "idea", "text": "Write the steps across first and the steps up second. A step south is a step up of −1, so 2 steps south is −2. The slide is 5, then −2."}, {"id": "ch11-s2-picture", "kind": "picture", "text": "Draw an arrow on squared paper from (0, 0) to (5, −2). It goes 5 squares across and 2 squares down."}, {"id": "ch11-s2-reason", "kind": "reason", "text": "Why a minus sign? Steps to the left and steps down go the opposite way to the axes. So they are negative numbers, as on a number line."}, {"id": "ch11-s2-name", "kind": "name", "text": "A column vector writes a translation as two numbers in a column, the step across on top and the step up below. In a line of text this book writes it as 5 over −2."}, {"id": "ch11-s2-example", "kind": "example", "text": "The column vector 3 over 4 moves the point (1, 2) to (1 + 3, 2 + 4), which is (4, 6)."}, {"id": "ch11-s2-mistake", "kind": "mistake", "text": "The tempting slip is to read the top number as the step up. 3 over 4 means 3 across and 4 up, not 3 up and 4 across."}, {"id": "ch11-s2-turn", "kind": "turn", "text": "Translate the point (2, 5) by the column vector 3 over −4. Where does it land?", "answer": "(5, 1)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["5", "1"]}]}], "accepts": ["(5, 1)", "5, 1", "(5,1)"], "rejects": ["(5, 9)", "(−2, 8)", "(−1, 9)"], "mistakes": []}}, {"id": "ch11-s2-sayBack", "kind": "sayBack", "text": "A column vector has the step across on top and the step up below. Add them to a point's coordinates to slide it."}]}, {"id": "ch11-s3", "heading": "11.3 Mirror images", "excerpt": "A mirror sends each point to the other side, the same distance away. The round part on the right of the b ends up on the left.", "teaches": ["reflection"], "steps": [{"id": "ch11-s3-question", "kind": "question", "text": "Hold a letter b up to a mirror. Why does it look like a d?"}, {"id": "ch11-s3-idea", "kind": "idea", "text": "A mirror sends each point to the other side, the same distance away. The round part on the right of the b ends up on the left."}, {"id": "ch11-s3-picture", "kind": "picture", "text": "On squared paper, use the y-axis as a mirror. Plot (3, 2), count 3 squares to the mirror and 3 more beyond it. You land on (−3, 2)."}, {"id": "ch11-s3-reason", "kind": "reason", "text": "Why the same distance on each side? The mirror is the perpendicular bisector of each point and its image. It crosses the line between them halfway, at a right angle."}, {"id": "ch11-s3-name", "kind": "name", "text": "Flipping a shape over a line is a reflection, and the line
