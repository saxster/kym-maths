icture", "text": "Draw a bar of 10 boxes for the old price. Cross out 2 boxes for the 20% off. The 8 boxes left hold ₹1,200, so each box holds ₹150. All 10 boxes hold ₹1,500."}, {"id": "ch03-s5-reason", "kind": "reason", "text": "The sale multiplied the old price by 0.8. To undo a multiplication, you divide. ₹1,200 ÷ 0.8 = ₹1,500. Adding 20% back does not undo it, because that multiplies by 1.2. And 0.8 × 1.2 = 0.96, not 1."}, {"id": "ch03-s5-name", "kind": "name", "text": "Finding the amount before a percentage change is called a reverse percentage. Work out the multiplier for the change, then divide the new amount by it. Dividing by the multiplier always takes you back to the start."}, {"id": "ch03-s5-example", "kind": "example", "text": "After a 12% rise, a month's rent is ₹5,600. What was the old rent? The multiplier for a 12% rise is 1.12, so work out ₹5,600 ÷ 1.12. Multiply both numbers by 100 to get 560,000 ÷ 112, which is 5,000. The old rent was ₹5,000. Check forwards: ₹5,000 × 1.12 = ₹5,600."}, {"id": "ch03-s5-mistake", "kind": "mistake", "text": "The trap is to take the percentage of the wrong amount. 12% of ₹5,600 is ₹672, and ₹5,600 − ₹672 = ₹4,928. Test that answer by going forwards. ₹4,928 × 1.12 = ₹5,519.36, which is not ₹5,600. The 12% in the question was 12% of the old rent, the number you are looking for."}, {"id": "ch03-s5-turn", "kind": "turn", "text": "After a 10% rise, a cinema ticket costs ₹330. What did it cost before the rise?", "answer": "₹300", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "300"}]}], "accepts": ["300", "₹300", "300 rupees"], "rejects": ["297", "363", "33", "320"], "mistakes": []}}, {"id": "ch03-s5-sayBack", "kind": "sayBack", "text": "To undo a percentage change, divide by its multiplier."}]}, {"id": "ch03-s6", "heading": "3.6 Growth on growth", "excerpt": "Only if the bank pays on the first ₹1,000 each year and nothing more. Most banks do better than that. They add the interest to the account, and the next year they pay 8% on the new, bigger amount. Year 1 ends on ₹1,080. Year 2 adds 8% of ₹1,080, which is ₹86.40, not ₹80.", "teaches": ["simple-interest", "compound-growth", "rule-of-72"], "steps": [{"id": "ch03-s6-question", "kind": "question", "text": "Kym's grandmother puts ₹1,000 in a bank that pays 8% interest a year. She leaves it there for 20 years. Kym says the bank adds ₹80 a year, so it will grow to ₹2,600. Is she right?"}, {"id": "ch03-s6-idea", "kind": "idea", "text": "Only if the bank pays on the first ₹1,000 each year and nothing more. Most banks do better than that. They add the interest to the account, and the next year they pay 8% on the new, bigger amount. Year 1 ends on ₹1,080. Year 2 adds 8% of ₹1,080, which is ₹86.40, not ₹80."}, {"id": "ch03-s6-picture", "kind": "picture", "text": "Make a table with one row for each year, starting from ₹1,000. Each row is the row above × 1.08: ₹1,080, then ₹1,166.40, then ₹1,259.71. The steps get bigger every year, because each one is 8% of a bigger number."}, {"id": "ch03-s6-reason", "kind": "reason", "text": "Each year multiplies by 1.08, so 20 years multiply by 1.08 twenty times. A calculator gives that as about 4.66. So the ₹1,000 becomes about ₹4,661. That is far more than ₹2,600, and the only difference is interest earning interest."}, {"id": "ch03-s6-name", "kind": "name", "text": "Interest paid only on the starting amount is simple interest. It adds the same sum every year. Interest paid on the growing total is compound interest, and growth of this kind is compound growth. It multiplies by the same number every year. A quick guide is the rule of 72: divide 72 by the yearly percentage to estimate the years needed to double."}, {"id": "ch03-s6-example", "kind": "example", "text": "₹20,000 is saved at 5% compound interest for 2 years. The multiplier is 1.05 each year. ₹20,000 × 1.05 = ₹21,000, and ₹21,000 × 1.05 = ₹22,050. The interest earned is ₹2,050. Simple interest would have paid 2 × ₹1,000 = ₹2,000. Now use the rule of 72 on the ₹1,000 that Kym's grandmother saved at 8%. 72 ÷ 8 = 9, so her money doubles about every 9 years. In the figure, set the interest rate to 8% and read the amber lines."}, {"id": "ch03-s6-mistake", "kind": "mistake", "text": "The trap is to treat compound growth as adding. 8% a year for 20 years is not 160% in total. It is × 1.08 twenty times, which is a rise of about 366%. The same trap works against you with a loan. A debt at 24% a year doubles in about 3 years."}, {"id": "ch03-s6-turn", "kind": "turn", "text": "₹2,000 is saved at 5% compound interest a year. How much is in the account after 2 years?", "answer": "₹2,205", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2205"}]}], "accepts": ["2205", "₹2,205", "2,205"], "rejects": ["2200", "2100", "205", "2210"], "mistakes": []}}, {"id": "ch03-s6-sayBack", "kind": "sayBack", "text": "Compound growth multiplies by the same number each year, so the growth itself grows."}], "figure": true}], "callouts": [{"id": "ch03-c-predict", "kind": "predict", "title": "Predict first", "body": "Before you touch the figure: ₹1,000 is left for 20 years at 8%. Guess the total with compound interest. Then compare your guess with the amber lines."}, {"id": "ch03-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why sharing ₹90 in the ratio 1 : 2 does not give anyone ₹45."}, {"id": "ch03-c-trap", "kind": "careful", "title": "Watch out for the wrong 100%", "body": "A percentage is always a percentage of something. Before you calculate, ask which amount is the 100%: the old price or the new one."}], "keyTerms": ["Percentage", "Ratio", "Unitary method", "Direct proportion", "Inverse proportion", "Percentage multiplier", "Reverse percentage", "Simple interest", "Compound growth", "Rule of 72"], "widgets": ["w_singapore_ratio_bar_model", "w_compound_multiplier_machine"], "debate": {"id": "debate-ch03-percentages", "chapterNumber": 3, "oupUnitNumber": 9, "title": "The price before the rise", "contextPrompt": "After a 25% rise, a month's bus pass costs ₹1,000. Ishaan and Tara each work out what it cost before the rise.", "speakerAName": "Ishaan", "speakerAClaim": "25% of ₹1,000 is ₹250. Take it off, and the old price was ₹750.", "speakerBName": "Tara", "speakerBClaim": "The new price is 125% of the old one. ₹1,000 ÷ 1.25 = ₹800.", "choices": [{"id": "ch03-a", "speakerLabel": "Ishaan is right (₹750)", "reasoningStatement": "A 25% rise is undone by a 25% cut.", "isCorrect": false, "socraticRebuttal": "Test it by going forwards. ₹750 × 1.25 = ₹937.50, not ₹1,000. The 25% in the question was 25% of the old price. Is that the same as 25% of ₹1,000?"}, {"id": "ch03-b", "speakerLabel": "Tara is right (₹800)", "reasoningStatement": "The rise multiplied the old price by 1.25, so dividing by 1.25 undoes it.", "isCorrect": true, "socraticRebuttal": "Yes. Check it forwards: 25% of ₹800 is ₹200, and ₹800 + ₹200 = ₹1,000."}, {"id": "ch03-c", "speakerLabel": "Neither. It was ₹975.", "reasoningStatement": "25% means 25, so take ₹25 off.", "isCorrect": false, "socraticRebuttal": "25% is not ₹25. It is 25 out of every 100, so its size depends on the price. What is 25% of ₹800?"}], "invariantTakeaway": "To undo a percentage change, divide by its multiplier. Taking the same percentage off does not work."}}, {"id": "ch04", "number": 4, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "From Bar Models to Algebraic Expressions", "subtitle": "School book Ch 2 · Expanding brackets, factorising by HCF, quadratics & Difference of Two Squares", "hookSummary": "An algebraic bracket a(b + c) is the area of a rectangle of height a and split width b + c.", "intuitionToFormula": {"concreteAction": "Tile a partitioned rectangle of sides (x + a) and (x + b), or snip the corner b² from a square a².", "ahaInvariant": "When you cut a corner square b² from a² and rotate the remaining strip, it forms a single rectangle of length (a + b) and height (a − b)!", "formulaDisplay": "a(b + c) = ab + ac,   (x + a)(x + b) = x² + (a + b)x + ab,   a² − b² = (a − b)(a + b)", "termMappings": [{"symbol": "x²", "visualPart": "Red main square tile (x by x)", "colorRole": "red", "meaning": "Quadratic core area"}, {"symbol": "(a + b)x", "visualPart": "Blue flanking rectangles ax and bx", "colorRole": "blue", "meaning": "Linear cross-terms (why (x+a)² ≠ x² + a²!)"}, {"symbol": "ab", "visualPart": "Amber corner rectangle (a by b)", "colorRole": "amber", "meaning": "Constant product corner"}], "atlasFigureRef": "maths/ch04-algebra-tiles/index.html"}, "sections": [{"id": "ch04-s1", "heading": "4.1 See it in a picture", "excerpt": "Tile a partitioned rectangle of sides (x + a) and (x + b), or snip the corner b² from a square a². When you cut a corner square b² from a² and rotate the remaining strip, it forms a single rectangle of length (a + b) and height (a − b)!"}, {"id": "ch04-s2", "heading": "4.2 Write it in symbols", "excerpt": "Every piece of the geometry locks onto a symbol in a(b + c) = ab + ac,   (x + a)(x + b) = x² + (a + b)x + ab,   a² − b² = (a − b)(a + b). Once you see why each term exists, you never have to guess a sign or denominator."}, {"id": "ch04-s3", "heading": "4.3 Bar models and stretch problems", "excerpt": "Apply From Bar Models to Algebraic Expressions across Cambridge Stage 8 Checkpoint questions, Singapore multi-step problems, and horizon extensions."}], "callouts": [{"id": "ch04-c-predict", "kind": "predict", "title": "Predict Before You Drag", "body": "Before moving the slider in Algebra Area Tiles, predict which geometric quantity changes and which invariant stays locked."}, {"id": "ch04-c-aha", "kind": "check", "title": "The Intuition → Formula Bridge", "body": "When you cut a corner square b² from a² and rotate the remaining strip, it forms a single rectangle of length (a + b) and height (a − b)! Formula: a(b + c) = ab + ac,   (x + a)(x + b) = x² + (a + b)x + ab,   a² − b² = (a − b)(a + b)"}, {"id": "ch04-c-trap", "kind": "careful", "title": "Classic Algebraic Trap to Avoid", "body": "Whenever a formula in Chapter 4 looks tempting to shortcut, test a concrete 2×2 area or small integer example (x = 2, y = 3) first!"}], "keyTerms": ["Expression", "Term", "Coefficient", "Distributive Law", "Expanding", "Factorising", "Difference of Two Squares"], "widgets": ["w_algebra_area_tiles", "w_difference_of_squares_slicer"]}, {"id": "ch05", "number": 5, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "The Balance Beam: Equations, Formulae & Inequalities", "subtitle": "School book Ch 7 · Deriving & solving equations, changing the subject of a formula & inequality number lines", "hookSummary": "An equation is a balanced beam; changing the subject of a formula peels the onion of operations in reverse order.", "intuitionToFormula": {"concreteAction": "Drag weights off a twin-pan balance and flip an inequality interval across 0 by multiplying by −1.", "ahaInvariant": "Multiplying a number line by −1 reflects every point across 0 like a mirror — what was further right (>) becomes further left (<)!", "formulaDisplay": "ax + b = cx + d  ⇒  x = (d − b) / (a − c),   and   a < b  ⇒  −a > −b", "termMappings": [{"symbol": "ax − cx", "visualPart": "Red variable bars gathered on left pan", "colorRole": "red", "meaning": "Net unknown units (a − c)x"}, {"symbol": "d − b", "visualPart": "Blue constant weights on right pan", "colorRole": "blue", "meaning": "Net constant value"}, {"symbol": "a < b ⇒ −a > −b", "visualPart": "Amber mirror reflection across 0", "colorRole": "amber", "meaning": "Order reverses under negative reflection"}], "atlasFigureRef": "maths/ch05-balance-equations/index.html"}, "sections": [{"id": "ch05-s1", "heading": "5.1 See it in a picture", "excerpt": "Drag weights off a twin-pan balance and flip an inequality interval across 0 by multiplying by −1. Multiplying a number line by −1 reflects every point across 0 like a mirror — what was further right (>) becomes further left (<)!"}, {"id": "ch05-s2", "heading": "5.2 Write it in symbols", "excerpt": "Every piece of the geometry locks onto a symbol in ax + b = cx + d  ⇒  x = (d − b) / (a − c),   and   a < b  ⇒  −a > −b. Once you see why each term exists, you never have to guess a sign or denominator."}, {"id": "ch05-s3", "heading": "5.3 Bar models and stretch problems", "excerpt": "Apply The Balance Beam: Equations, Formulae & Inequalities across Cambridge Stage 8 Checkpoint questions, Singapore multi-step problems, and horizon extensions."}], "callouts": [{"id": "ch05-c-predict", "kind": "predict", "title": "Predict Before You Drag", "body": "Before moving the slider in Balance Beam Equations, predict which geometric quantity changes and which invariant stays locked."}, {"id": "ch05-c-aha", "kind": "check", "title": "The Intuition → Formula Bridge", "body": "Multiplying a number line by −1 reflects every point across 0 like a mirror — what was further right (>) becomes further left (<)! Formula: ax + b = cx + d  ⇒  x = (d − b) / (a − c),   and   a < b  ⇒  −a > −b"}, {"id": "ch05-c-trap", "kind": "careful", "title": "Classic Algebraic Trap to Avoid", "body": "Whenever a formula in Chapter 5 looks tempting to shortcut, test a concrete 2×2 area or small integer example (x = 2, y = 3) first!"}], "keyTerms": ["Equation", "Formula", "Subject of a Formula", "Inverse Operation", "Open vs Closed Circle", "Inequality Flip"], "widgets": ["w_balance_beam_equations", "w_formula_subject_transposer", "w_inequality_mirror_line"]}, {"id": "ch06", "number": 6, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "Patterns in Time: Sequences, nth Terms & Gauss's Sum", "subtitle": "School book Ch 11 · Term-to-term vs position-to-term rules, linear & quadratic sequences, and Gauss's staircase", "hookSummary": "A constant first difference means a linear staircase dn + c; a constant second difference 2a means a quadratic parabola an² + bn + c.", "intuitionToFormula": {"concreteAction": "Duplicate an n-step staircase 1 + 2 + … + n, rotate the copy by 180°, and snap it on top of the original.", "ahaInvariant": "The two staircases lock together into a solid rectangle of width n and uniform height (n + 1) — so one staircase is exactly half the rectangle!", "formulaDisplay": "Tₙ = a₁ + (n − 1)d,   Sₙ = ½ n (a₁ + aₙ),   Quadratic 2nd diff = 2a", "termMappings": [{"symbol": "d", "visualPart": "Red step riser between consecutive terms", "colorRole": "red", "meaning": "Constant first difference (linear slope)"}, {"symbol": "a₁ + aₙ", "visualPart": "Blue combined height of flipped Gauss staircase", "colorRole": "blue", "meaning": "First term plus last term in every column"}, {"symbol": "½ n", "visualPart": "Green half-rectangle area factor", "colorRole": "green", "meaning": "n columns divided by 2 identical staircases"}], "atlasFigureRef": "maths/ch06-sequences-gauss/index.html"}, "sections": [{"id": "ch06-s1", "heading": "6.1 See it in a picture", "excerpt": "Duplicate an n-step staircase 1 + 2 + … + n, rotate the copy by 180°, and snap it on top of the original. The two staircases lock together into a solid rectangle of width n and uniform height (n + 1) — so one staircase is exactly half the rectangle!"}, {"id": "ch06-s2", "heading": "6.2 Write it in symbols", "excerpt": "Every piece of the geometry locks onto a symbol in Tₙ = a₁ + (n − 1)d,   Sₙ = ½ n (a₁ + aₙ),   Quadratic 2nd diff = 2a. Once you see why each term exists, you never have to guess a sign or denominator."}, {"id": "ch06-s3", "heading": "6.3 Bar models and stretch problems", "excerpt": "Apply Patterns in Time: Sequences, nth Terms & Gauss's Sum across Cambridge Stage 8 Checkpoint questions, Singapore multi-step problems, and horizon extensions."}], "callouts": [{"id": "ch06-c-predict", "kind": "predict", "title": "Predict Before You Drag", "body": "Before moving the slider in Gauss Staircase Sum, predict which geometric quantity changes and which invariant stays locked."}, {"id": "ch06-c-aha", "kind": "check", "title": "The Intuition → Formula Bridge", "body": "The two staircases lock together into a solid rectangle of width n and uniform height (n + 1) — so one staircase is exactly half the rectangle! Formula: Tₙ = a₁ + (n − 1)d,   Sₙ = ½ n (a₁ + aₙ),   Quadratic 2nd diff = 2a"}, {"id": "ch06-c-trap", "kind": "careful", "title": "Classic Algebraic Trap to Avoid", "body": "Whenever a formula in Chapter 6 looks tempting to shortcut, test a concrete 2×2 area or small integer example (x = 2, y = 3) first!"}], "keyTerms": ["Sequence", "Term-to-Term", "nth Term Tₙ", "First Difference", "Second Difference", "Arithmetic Series", "Fibonacci & Golden Ratio"], "widgets": ["w_gauss_staircase_sum", "w_sequence_difference_engine"]}, {"id": "ch07", "number": 7, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "Functions, Linear Graphs & Kinematics", "subtitle": "School book Ch 14 · Function machines, y = mx + c, gradient Δy/Δx, parallel/perpendicular lines & speed-time graphs", "hookSummary": "Every straight line is a constant rate of change m = Δy / Δx anchored at a vertical intercept c.", "intuitionToFormula": {"concreteAction": "Slide two points P and Q along a line y = mx + c and inspect the right-angled rise/run staircase.", "ahaInvariant": "No matter how wide or narrow you make the horizontal run Δx, the vertical rise Δy scales in the exact same proportion, keeping Δy / Δx = m invariant!", "formulaDisplay": "y = mx + c,   m = (y₂ − y₁) / (x₂ − x₁),   m₁ · m₂ = −1 (perpendicular)", "termMappings": [{"symbol": "Δy = y₂ − y₁", "visualPart": "Red vertical rise segment", "colorRole": "red", "meaning": "Signed vertical change"}, {"symbol": "Δx = x₂ − x₁", "visualPart": "Blue horizontal run segment", "colorRole": "blue", "meaning": "Signed horizontal step"}, {"symbol": "c", "visualPart": "Green y-axis crossing (0, c)", "colorRole": "green", "meaning": "Starting value when x = 0"}], "atlasFigureRef": "maths/ch07-functions-graphs/index.html"}, "sections": [{"id": "ch07-s1", "heading": "7.1 See it in a picture", "excerpt": "Slide two points P and Q along a line y = mx + c and inspect the right-angled rise/run staircase. No matter how wide or narrow you make the horizontal run Δx, the vertical rise Δy scales in the exact same proportion, keeping Δy / Δx = m invariant!"}, {"id": "ch07-s2", "heading": "7.2 Write it in symbols", "excerpt": "Every piece of the geometry locks onto a symbol in y = mx + c,   m = (y₂ − y₁) / (x₂ − x₁),   m₁ · m₂ = −1 (perpendicular). Once you see why each term exists, you never have to guess a sign or denominator."}, {"id": "ch07-s3", "heading": "7.3 Bar models and stretch problems", "excerpt": "Apply Functions, Linear Graphs & Kinematics across Cambridge Stage 8 Checkpoint questions, Singapore multi-step problems, and horizon extensions."}], "callouts": [{"id": "ch07-c-predict", "kind": "predict", "title": "Predict Before You Drag", "body": "Before moving the slider in Linear Graph Slope Explorer, predict which geometric quantity changes and which invariant stays locked."}, {"id": "ch07-c-aha", "kind": "check", "title": "The Intuition → Formula Bridge", "body": "No matter how wide or narrow you make the horizontal run Δx, the vertical rise Δy scales in the exact same proportion, keeping Δy / Δx = m invariant! Formula: y = mx + c,   m = (y₂ − y₁) / (x₂ − x₁),   m₁ · m₂ = −1 (perpendicular)"}, {"id": "ch07-c-trap", "kind": "careful", "title": "Classic Algebraic Trap to Avoid", "body": "Whenever a formula in Chapter 7 looks tempting to shortcut, test a concrete 2×2 area or small integer example (x = 2, y = 3) first!"}], "keyTerms": ["Function f(x)", "Gradient m", "y-Intercept c", "x-Intercept", "Parallel Lines", "Perpendicular Gradient −1/m", "Travel Graphs"], "widgets": ["w_linear_graph_slope_explorer", "w_kinematics_travel_graph"]}, {"id": "ch08", "number": 8, "volumeNumber": 3, "volumeTitle": "Volume III · Euclid's Compass, Mensuration & Trigonometry", "title": "Angle Chasing, Parallel Lines & Deductive Proof", "subtitle": "School book Ch 8 · Alternate, corresponding & co-interior angles, exterior angle of a triangle & midpoint formula", "hookSummary": "A transversal slicing two parallel lines carries the exact same 4-angle intersection down the track.", "intuitionToFormula": {"concreteAction": "Slide the top intersection along a transversal onto the bottom parallel line, and tear the two base angles α, β off a triangle to place them into the exterior angle.", "ahaInvariant": "Because a parallel translation changes no angles, α and β fit flush inside the exterior angle next to γ — proving both α + β + γ = 180° and ext = α + β at once!", "formulaDisplay": "θ_ext = α + β,   ∑ interior angles of n-gon = (n − 2) × 180°,   M = ((x₁+x₂)/2, (y₁+y₂)/2)", "termMappings": [{"symbol": "α + β", "visualPart": "Red + Blue remote interior angles translated along parallel line", "colorRole": "red", "meaning": "Fit exactly into the exterior angle"}, {"symbol": "(n − 2) × 180°", "visualPart": "Amber fan of (n − 2) non-overlapping triangles from one vertex", "colorRole": "amber", "meaning": "Every n-gon triangulates into n − 2 triangles"}, {"symbol": "((x₁+x₂)/2, (y₁+y₂)/2)", "visualPart": "Green midpoint of the bounding coordinate box", "colorRole": "green", "meaning": "Average of endpoints on each axis"}], "atlasFigureRef": "maths/ch08-angles-parallel/index.html"}, "sections": [{"id": "ch08-s1", "heading": "8.1 See it in a picture", "excerpt": "Slide the top intersection along a transversal onto the bottom parallel line, and tear the two base angles α, β off a triangle to place them into the exterior angle. Because a parallel translation changes no angles, α and β fit flush inside the exterior angle next to γ — proving both α + β + γ = 180° and ext = α + β at once!"}, {"id": "ch08-s2" rsect on the locus equidistant from two points.", "intuitionToFormula": {"concreteAction": "Sweep two equal-radius compass arcs from endpoints A and B and connect their intersections P and Q.", "ahaInvariant": "Because AP = BP = AQ = BQ = r, the four radii form a rhombus — and the diagonals of a rhombus always bisect each other at 90°!", "formulaDisplay": "|PA| = |PB|  ⇔  P lies on perpendicular bisector of AB;   Euler: V − E + F = 2", "termMappings": [{"symbol": "|PA| = |PB| = r", "visualPart": "Blue equal compass rings centred on A and B", "colorRole": "blue", "meaning": "Rhombus side invariant"}, {"symbol": "PQ ⊥ AB", "visualPart": "Red perpendicular bisector through the two crossings", "colorRole": "red", "meaning": "Every point on it is the same distance from A and B"}, {"symbol": "000°–360°", "visualPart": "Amber bearing ray from A to B, read clockwise from the green North lines", "colorRole": "amber", "meaning": "Back-bearing differs by ±180°"}, {"symbol": "V − E + F = 2", "visualPart": "Amber cube wireframe folded from its net", "colorRole": "amber", "meaning": "Euler characteristic of any convex polyhedron"}], "atlasFigureRef": "maths/ch09-loci-constructions/index.html"}, "sections": [{"id": "ch09-s1", "heading": "9.1 See it in a picture", "excerpt": "Sweep two equal-radius compass arcs from endpoints A and B and connect their intersections P and Q. Because AP = BP = AQ = BQ = r, the four radii form a rhombus — and the diagonals of a rhombus always bisect each other at 90°!"}, {"id": "ch09-s2", "heading": "9.2 Write it in symbols", "excerpt": "Every piece of the geometry locks onto a symbol in |PA| = |PB|  ⇔  P lies on perpendicular bisector of AB;   Euler: V − E + F = 2. Once you see why each term exists, you never have to guess a sign or denominator."}, {"id": "ch09-s3", "heading": "9.3 Bar models and stretch problems", "excerpt": "Apply Compass & Straightedge: Locus, Quadrilaterals & 3D Nets across Cambridge Stage 8 Checkpoint questions, Singapore multi- II · Euclid's Compass, Mensuration & Trigonometry", "title": "Shadows of the Circle: Pythagoras, Sine, Cosine & Radians", "subtitle": "Advanced Geometry & Trig · Atlas unit-circle (8 pages): Pythagoras, SOHCAHTOA, unit-circle shadows, radians & Cosine Rule", "hookSummary": "Sine is the vertical shadow of a turning point on the unit circle; cosine is its horizontal shadow.", "intuitionToFormula": {"concreteAction": "Open the 3D Unit Circle stage: shine level light from the right for sin θ, top light for cos θ, and unfold the three squares on the right triangle.", "ahaInvariant": "Because the hypotenuse of the unit-circle triangle is 1, the red vertical shadow is sin θ, the blue horizontal shadow is cos θ, and Pythagoras immediately gives sin²θ + cos²θ = 1² for every angle!", "formulaDisplay": "P = (cos θ, sin θ),   sin²θ + cos²θ = 1,   tan θ = sin θ / cos θ,   c² = a² + b² − 2ab cos C", "termMappings": [{"symbol": "sin θ", "visualPart": "Red vertical shadow bar cast by level light", "colorRole": "red", "meaning": "y-coordinate of P on unit circle (Opposite / Hypotenuse)"}, {"symbol": "cos θ", "visualPart": "Blue horizontal shadow bar cast by top light", "colorRole": "blue", "meaning": "x-coordinate of P on unit circle (Adjacent / Hypotenuse)"}, {"symbol": "sin²θ + cos²θ = 1", "visualPart": "Red square + Blue square folding onto Grey radius square", "colorRole": "amber", "meaning": "Pythagorean identity on the unit circle"}], "atlasFigureRef": "maths/ch16-trigonometry-unit-circle/index.html#1"}, "sections": [{"id": "ch12-s1", "heading": "12.1 See it in a picture", "excerpt": "Open the 3D Unit Circle stage: shine level light from the right for sin θ, top light for cos θ, and unfold the three squares on the right triangle. Because the hypotenuse of the unit-circle triangle is 1, the red vertical shadow is sin θ, the blue horizontal shadow is cos θ, and Pythagoras immediately gives sin²θ + cos²θ = 1² for every angle!"}, {"id": "ch12-s2", "heading": "12.2 Write it in symbols", "excerpt": "Every piece of the geometry locks onto a symbol in P = (cos θ, sin θ),   sin²θ + cos²θ = 1,   tan θ = sin θ / cos θ,   c² = a² + b² − 2ab cos C. Once you see why each term exists, you never have to guess a sign or denominator."}, {"id": "ch12-s3", "heading": "12.3 Bar models and stretch problems", "excerpt": "Apply Shadows of the Circle: Pythagoras, Sine, Cosine & Radians across Cambridge Stage 8 Checkpoint questions, Singapore multi-step problems, and horizon extensions."}], "callouts": [{"id": "ch12-c-predict", "kind": "predict", "title": "Predict Before You Drag", "body": "Before moving the slider in 3D Atlas: Unit Circle, predict which geometric quantity changes and which invariant stays locked."}, {"id": "ch12-c-aha", "kind": "check", "title": "The Intuition → Formula Bridge", "body": "Because the hypotenuse of the unit-circle triangle is 1, the red vertical shadow is sin θ, the blue horizontal shadow is cos θ, and Pythagoras immediately gives sin²θ + cos²θ = 1² for every angle! Formula: P = (cos θ, sin θ),   sin²θ + cos²θ = 1,   tan θ = sin θ / cos θ,   c² = a² + b² − 2ab cos C"}, {"id": "ch12-c-trap", "kind": "careful", "title": "Classic Algebraic Trap to Avoid", "body": "Whenever a formula in Chapter 12 looks tempting to shortcut, test a concrete 2×2 area or small integer example (x = 2, y = 3) first!"}], "keyTerms": ["Pythagoras' Theorem", "Unit Circle", "Sine (sin θ)", "Cosine (cos θ)", "Tangent (tan θ)", "Radian (s = rθ)", "Pythagorean Identity", "Sine & Cosine Rules"], "widgets": ["w_atlas_unit_circle", "w_pythagoras_garfield_proof", "w_cosine_rule_generaliser"]}, {"id": "ch13", "number": 13, "volumeNumber": 4, "volumeTitle": "Volume IV · Data Forensics, Uncertainty & Bayes' Theorem", "title": "How Not to Be Fooled by a Sample", "subtitle": "School book Ch 4 · Sampling methods, bias forensics, Abraham Wald's bombers & Atlas σ/√n standard error", "hookSummary": "A huge biased sample is worse than a small random one; repeated random samples cluster within ±σ / √n of the truth.", "intuitionToFormula": {"concreteAction": "Run the Repeated Readings Explorer (`statistics/error`) and toggle survivorship filter on Wald's WWII aircraft.", "ahaInvariant": "Bullet holes on returning planes show where a plane can be hit and still fly home — the missing holes on the engines mark where fatal hits occurred!", "formulaDisplay": "Stratified nᵢ = n × (Nᵢ / N),   Standard Error SE = σ / √n", "termMappings": [{"symbol": "Nᵢ / N", "visualPart": "Blue stratum share of total population", "colorRole": "blue", "meaning": "Proportional representation weight"}, {"symbol": "σ / √n", "visualPart": "Red shrinking standard-error bracket around true mean μ", "colorRole": "red", "meaning": "Quadrupling sample size n halves the error bar"}, {"symbol": "Selection Bias", "visualPart": "Amber missing-data ghost region (Wald's engine armour)", "colorRole": "amber", "meaning": "Unobserved dropouts skew naive averages"}], "atlasFigureRef": "statistics/error/index.html"}, "sections": [{"id": "ch13-s1", "heading": "13.1 See it in a picture", "excerpt": "Run the Repeated Readings Explorer (`statistics/error`) and toggle survivorship filter on Wald's WWII aircraft. Bullet holes on returning planes show where a plane can be hit and still fly home — the missing holes on the engines mark where fatal hits occurred!"}, {"id": "ch13-s2", "heading": "13.2 Write it in symbols", "excerpt": "Every piece of the geometry locks onto a symbol in Stratified nᵢ = n × (Nᵢ / N),   Standard Error SE = σ / √n. Once you see why each term exists, you never have to guess a sign or denominator."}, {"id": "ch13-s3", "heading": "13.3 Bar models and stretch problems", "excerpt": "Apply How Not to Be Fooled by a Sample across Cambridge Stage 8 Checkpoint questions, Singapore multi-step problems, and horizon extensions."}], "callouts": [{"id": "ch13-c-predict", "kind": "predict", "title": "Predict Before You Drag", "body": "Before moving the slider in 3D Atlas: Samplin d Probability · Atlas Bayes Explorer: why a positive result from a 95% accurate test on a 2% condition is right only 28% of the time", "hookSummary": "Evidence never acts in a vacuum — it slices and renormalizes the prior base rate inside a 1,000-person unit square.", "intuitionToFormula": {"concreteAction": "Open the Bayes Unit-Square Explorer (`statistics/bayes`): set prevalence p = 2%, sensitivity = 95%, false-positive rate = 5%, and screen 1,000 people.", "ahaInvariant": "Conditioning on a positive test throws away everyone who tested negative! What remains is just two bars: 19 True Positives (red) from the 20 sick people, and 49 False Positives (amber) from the 980 healthy people — so P(D | +) = 19 / (19 + 49) ≈ 27.9%!", "formulaDisplay": "P(D | +) = [ P(+ | D) P(D) ] / [ P(+ | D) P(D) + P(+ | ¬D) P(¬D) ]", "termMappings": [{"symbol": "P(+ | D) P(D)", "visualPart": "Red True-Positive rectangle (19 of 1,000)", "colorRole": "red", "meaning": "Sick people correctly flagged positive"}, {"symbol": "P(+ | ¬D) P(¬D)", "visualPart": "Amber False-Positive rectangle (49 of 1,000)", "colorRole": "amber", "meaning": "Healthy people falsely flagged positive"}, {"symbol": "Red / (Red + Amber)", "visualPart": "Isolated posterior bar on the right of the 3D board", "colorRole": "green", "meaning": "Share of all positive tests that are genuinely sick"}], "atlasFigureRef": "maths/ch17-bayes-probability/index.html"}, "sections": [{"id": "ch16-s1", "heading": "16.1 See it in a picture", "excerpt": "Open the Bayes Unit-Square Explorer (`statistics/bayes`): set prevalence p = 2%, sensitivity = 95%, false-positive rate = 5%, and screen 1,000 people. Conditioning on a positive test throws away everyone who tested negative! What remains is just two bars: 19 True Positives (red) from the 20 sick people, and 49 False Positives (amber) from the 980 healthy people — so P(D | +) = 19 / (19 + 49) ≈ 27.9%!"}, {"id": "ch16-s2", "heading": "16.2 Write it in symbols", "excerpt": "Every piece of t function applyChapterSliders(chNum) {
  const specs = CH_SLIDERS[chNum] || CH_SLIDERS[0];
  ['a', 'b', 'c'].forEach((k, idx) => {
    const s = specs[idx];
    const inp = document.getElementById(`param-${k}`);
    document.getElementById(`lbl-${k}`).textContent = s.lbl;
    inp.min = s.min; inp.max = s.max; inp.step = s.step; inp.value = s.val;
    inp.dataset.unit = s.u || '';
  });
}

function parseHash() {
  const h = (window.location.hash || '').replace('#', '');
  if (h.startsWith('ch')) {
    const n = parseInt(h.slice(2), 10);
    if (!isNaN(n) && n >= 0 && n < CHAPTERS.length) currentChapter = n;
  }
}

function setAtlasRoute(relPath) {
  const iframe = document.getElementById('atlas-iframe');
  const targetSrc = `./atlas/examples/${relPath}`;
  if (iframe.getAttribute('data-src') !== targetSrc) {
    iframe.setAttribute('data-src', targetSrc);
    document.getElementById('atlas-card').hidden = true;
    iframe.src = targetSrc;
  }
}

function renderChapter() {
  const ch = CHAPTERS[currentChapter] || CHAPTERS[0];
  const br = ch.intuitionToFormula;
  document.getElementById('ch-vol').textContent = ch.volumeTitle.toUpperCase();
  document.getElementById('ch-title').textContent = `Chapter ${ch.number} · ${ch.title}`;
  document.getElementById('ch-subtitle').textContent = ch.subtitle;
  document.getElementById('ch-hook').textContent = ch.hookSummary;
  document.getElementById('ch-formula').textContent = br.formulaDisplay;
  document.getElementById('ch-concrete').textContent = br.concreteAction;
  document.getElementById('ch-aha').textContent = br.ahaInvariant;

  const termsEl = document.getElementById('ch-terms');
  termsEl.innerHTML = (br.termMappings || []).map(tm =>
    `<div class="term-pill ${tm.colorRole}" data-role="${tm.colorRole}" data-symbol="${tm.symbol}"><b>${tm.symbol}</b> → ${tm.visualPart}: ${tm.meaning}</div>`
  ).join('');
  termsEl.querySelectorAll('.term-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const role = pill.getAttribute('data-role') || '';
      const sym = pill.getAttribute('data-symbol') || '';
      window.highlightFormulaTerm(role);
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kymmathsBridge) {
        window.webkit.messageHandlers.kymmathsBridge.postMessage({ type: 'termHighlighted', colorRole: role, symbol: sym });
      }
    });
  });

  applyChapterSliders(ch.number);
  setAtlasRoute(br.atlasFigureRef);
  drawSandbox();
}

      pill.classList.add('active-role');

      pill.classList.remove('active-role');

  });
  drawSandbox();
};

window.selectChapter = function(n) {
  const idx = Math.max(0, Math.min(CHAPTERS.length - 1, parseInt(n, 10) || 0));
  if (currentChapter !== idx) {
    currentChapter = idx;
    renderChapter();
  }
};

function gcd(x, y) {
  let a = Math.abs(Math.round(x)), b = Math.abs(Math.round(y));
  while (b !== 0) { const t = b; b = a % b; a = t; }
  return Math.max(1, a);
}

function comb(n, k) {
  if (k < 0 || k > n) return 0;
  let res = 1;
  for (let i = 1; i <= k; i++) res = (res * (n - i + 1)) / i;
  return Math.round(res);
}

function drawArrow(ctx, x1, y1, x2, y2, color, lw = 2.5) {
  const dx = x2 - x1, dy = y2 - y1, ang = Math.atan2(dy, dx);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 9 * Math.cos(ang - 0.42), y2 - 9 * Math.sin(ang - 0.42));
  ctx.lineTo(x2 - 9 * Math.cos(ang + 0.42), y2 - 9 * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

        ctx.fillStyle = bn.c + '35'; ctx.strokeStyle = bn.c; ctx.lineWidth = 2.2;
        ctx.fillRect(xCur, yBase - bh, bw, bh); ctx.strokeRect(xCur, yBase - bh, bw, bh);
        ctx.fillStyle = ink; ctx.fillText(`f=${bn.f}`, xCur + 6, yBase - bh - 6);
        ctx.fillStyle = muted; ctx.fillText(bn.l, xCur + 4, yBase + 18);
        xCur += bw;
      });
      ctx.fillStyle = red; ctx.fillText(`Wide bin FD = ${f3} ÷ ${w3} = ${fd3.toFixed(2)}`, 320, 92);
      ctx.fillStyle = amber; ctx.fillText(`Area = FD × Δx = ${fd3.toFixed(2)} × ${w3} = ${f3}`, 320, 122);
      readoutHtml = `Wide Class (Δx = ${w3}, f = ${f3}): <b>Frequency Density = f / Δx = ${fd3.toFixed(2)}</b> (Bar Area = ${f3})`;
      break;
    }
    case 15: {
      // Ch 15: Galton Pegboard & Binomial C(n, k)
      const n = Math.round(a), k = Math.min(n, Math.round(b)), p = c / 100;
      const ways = comb(n, k), prob = ways * Math.pow(p, k) * Math.pow(1 - p, n - k);
      const yBase = 225, bw = Math.min(36, 260 / (n + 1)), x0 = 54;
      let maxP = 0;
      for (let i = 0; i <= n; i++) maxP = Math.max(maxP, comb(n, i) * Math.pow(p, i) * Math.pow(1 - p, n - i));
      for (let i = 0; i <= n; i++) {
        const pr = comb(n, i) * Math.pow(p, i) * Math.pow(1 - p, n - i);
        const bh = (pr / Math.max(0.01, maxP)) * 145;
        const col = i === k ? red : blue;
        ctx.fillStyle = col + (i === k ? '55' : '28'); ctx.strokeStyle = col; ctx.lineWidth = 2;
        ctx.fillRect(x0 + i * bw, yBase - bh, bw - 3, bh); ctx.strokeRect(x0 + i * bw, yBase - bh, bw - 3, bh);
        ctx.fillStyle = ink; ctx.fillText(comb(n, i), x0 + i * bw + 4, yBase - bh - 6);
      }
      ctx.fillStyle = red; ctx.fillText(`C(${n}, ${k}) = ${ways} distinct peg paths`, 315, 95);
      ctx.fillStyle = green; ctx.fillText(`P(X = ${k}) = ${(prob * 100).toFixed(1)}%`, 315, 128);
      readoutHtml = `Galton Board (n = ${n}, k = ${k}): <b>ⁿCₖ = ${ways} paths</b> · Binomial probability <b>P(X = ${k}) = ${(prob * 100).toFixed(2)}%</b>`;
      break;
    }
    case 16: {
      // Ch 16: Bayes 1,000-Person Unit Square Eikosogram
      const prev = a / 100, sens = b / 100, fpr = c / 100;
      const sick = 1000 * prev, healthy = 1000 - sick;
      const tp = sick * sens, fp = healthy * fpr, ppv = (tp / (tp + fp)) * 100;
      const sqX = 48, sqY = 38, sqW = 210, sqH = 185;
      const wD = Math.max(18, prev * sqW * 2.2);
      const hTP = sens * sqH, hFP = Math.max(14, fpr * sqH * 1.8);
      ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.strokeRect(sqX, sqY, sqW, sqH);
      ctx.fillStyle = red + '66'; ctx.fillRect(sqX, sqY + sqH - hTP, wD, hTP);
      ctx.fillStyle = amber + '66'; ctx.fillRect(sqX + wD, sqY + sqH - hFP, sqW - wD, hFP);
      ctx.fillStyle = red; ctx.fillText(`True Pos (Red): ${tp.toFixed(1)}`, 285, 82);
      ctx.fillStyle = amber; ctx.fillText(`False Pos (Amber): ${fp.toFixed(1)}`, 285, 112);
      ctx.fillStyle = green; ctx.fillText(`Posterior P(D | +) = ${ppv.toFixed(1)}%`, 285, 148);
      // Isolated posterior bar
      const totH = 140, tpBarH = (tp / (tp + fp)) * totH;
      ctx.fillStyle = red; ctx.fillRect(495, 60, 28, tpBarH);
      ctx.fillStyle = amber; ctx.fillRect(495, 60 + tpBarH, 28, totH - tpBarH);
      readoutHtml = `Of 1,000 people: <b>${tp.toFixed(1)} True Positives</b> vs <b>${fp.toFixed(1)} False Positives</b> ⇒ <b>P(D | +) = ${ppv.toFixed(1)}%</b>`;
      break;
    }
    case 17: {
      // Ch 17: Differential Calculus — Secant to Tangent & d(x^2) = 2x dx
      const x0 = a, hStep = b, f = x => 0.5 * x * x;
      const y0 = f(x0), y1 = f(x0 + hStep), secSlope = (y1 - y0) / hStep, tanSlope = x0;
      const ox = 54, oy = 235, scX = 72, scY = 42;
      ctx.strokeStyle = blue; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let u = 0; u <= 3.2; u += 0.08) {
        const sx = ox + u * scX, sy = oy - f(u) * scY;
        if (u === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      const px = ox + x0 * scX, py = oy - y0 * scY, qx = ox + (x0 + hStep) * scX, qy = oy - y1 * scY;
      ctx.strokeStyle = amber; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(px - 35, py + 35 * (secSlope * scY / scX)); ctx.lineTo(qx + 25, qy - 25 * (secSlope * scY / scX)); ctx.stroke();
      ctx.strokeStyle = red; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(px - 45, py + 45 * (tanSlope * scY / scX)); ctx.lineTo(px + 55, py - 55 * (tanSlope * scY / scX)); ctx.stroke();
      ctx.fillStyle = red; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = amber; ctx.beginPath(); ctx.arc(qx, qy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = red; ctx.fillText(`Tangent f′(${x0}) = ${tanSlope.toFixed(2)}`, 305, 85);
      ctx.fillStyle = amber; ctx.fillText(`Secant Δy/h = ${secSlope.toFixed(3)}`, 305, 115);
      ctx.fillStyle = green; ctx.fillText(`d(x²)/dx = 2x + h = ${(2*c + hStep).toFixed(2)} → ${2*c}`, 305, 148);
      readoutHtml = `At x₀ = ${x0}, step h = ${hStep}: Secant = <b>${secSlope.toFixed(3)}</b> → Exact Derivative <b>f′(x₀) = ${tanSlope.toFixed(2)}</b>`;
      break;
    }
    case 18: {
      // Ch 18: Integral Calculus — Midpoint Riemann Bars & FTC Area = Antiderivative
      const upperX = a, N = Math.round(b), kSlope = c, dx = upperX / N;
      const ox = 54, oy = 232, scX = 76, scY = 48;
      let rSum = 0;
      for (let i = 0; i < N; i++) {
        const xm = (i + 0.5) * dx, ym = kSlope * xm;
        rSum += ym * dx;
        const bx = ox + i * dx * scX, bw = dx * scX, bh = ym * scY;
        ctx.fillStyle = (i === N - 1 ? red : blue) + '38';
        ctx.strokeStyle = i === N - 1 ? red : blue; ctx.lineWidth = 1.6;
        ctx.fillRect(bx, oy - bh, bw, bh); ctx.strokeRect(bx, oy - bh, bw, bh);
      }
      ctx.strokeStyle = green; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + 3 * scX, oy - kSlope * 3 * scY); ctx.stroke();
      const exact = 0.5 * kSlope * upperX * upperX;
      ctx.fillStyle = blue; ctx.fillText(`Riemann Sum (${N} slabs) = ${rSum.toFixed(3)}`, 305, 92);
      ctx.fillStyle = green; ctx.fillText(`Exact ∫₀ˣ kt dt = ½kx² = ${exact.toFixed(3)}`, 305, 124);
      ctx.fillStyle = red; ctx.fillText(`FTC: dA/dx = f(x) = ${(kSlope*upperX).toFixed(2)}`, 305, 156);
      readoutHtml = `Midpoint Riemann (${N} slabs) = <b>${rSum.toFixed(4)}</b> · Exact Antiderivative <b>F(${upperX}) − F(0) = ${exact.toFixed(4)}</b>`;
      break;
    }
    case 19: {
      // Ch 19: Vectors Tip-to-Tail Triangle Law & Dot Product
      const ax = a, ay = 1.2, bx = b, by = 2.0, angRad = (c * Math.PI) / 180;
      const ox = 64, oy = 225, sc = 36;
      const p1x = ox + ax * sc, p1y = oy - ay * sc;
      const p2x = p1x + bx * sc, p2y = p1y - by * sc;
      drawArrow(ctx, ox, oy, p1x, p1y, red, 3);
      drawArrow(ctx, p1x, p1y, p2x, p2y, blue, 3);
      drawArrow(ctx, ox, oy, p2x, p2y, green, 3.2);
      ctx.fillStyle = red; ctx.fillText(`a = (${ax}, ${ay})`, ox + 28, oy - 12);
      ctx.fillStyle = blue; ctx.fillText(`b = (${bx}, ${by})`, p1x + 14, p1y - 18);
      ctx.fillStyle = green; ctx.fillText(`a + b = (${(ax+bx).toFixed(1)}, ${(ay+by).toFixed(1)})`, ox + 15, oy - 95);
      const magA = Math.hypot(ax, ay), magB = Math.hypot(bx, by), dot = magA * magB * Math.cos(angRad);
      ctx.fillStyle = amber; ctx.fillText(`Dot Product |a||b|cos(${c}°) = ${dot.toFixed(2)}`, 305, 175);
      readoutHtml = `Resultant <b>a + b = (${(ax+bx).toFixed(1)}, ${(ay+by).toFixed(1)})</b> · |a+b| = <b>${Math.hypot(ax+bx, ay+by).toFixed(2)}</b> · Dot product = <b>${dot.toFixed(2)}</b>`;
      break;
    }
    default: {
      // Ch 20: 2x2 Matrix Basis Grid, Determinant Parallelogram & Eigenvectors
      const mA = a, mB = b, mD = c, det = mA * mD - mB * mB;
      const ox = 95, oy = 215, sc = 42;
      const iX = ox + mA * sc, iY = oy - mB * sc;
      const jX = ox + mB * sc, jY = oy - mD * sc;
      const sumX = iX + (jX - ox), sumY = iY + (jY - oy);
      ctx.fillStyle = amber + '38'; ctx.strokeStyle = amber; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(iX, iY); ctx.lineTo(sumX, sumY); ctx.lineTo(jX, jY); ctx.closePath();
      ctx.fill(); ctx.stroke();
      drawArrow(ctx, ox, oy, iX, iY, red, 3.2);
      drawArrow(ctx, ox, oy, jX, jY, blue, 3.2);
      ctx.fillStyle = red; ctx.fillText(`Aî = (${mA}, ${mB})`, iX + 8, iY);
      ctx.fillStyle = blue; ctx.fillText(`Aĵ = (${mB}, ${mD})`, jX - 24, jY - 10);
      ctx.fillStyle = amber; ctx.fillText(`Area det(A) = ad − bc = ${det.toFixed(2)}`, 305, 95);
      const tr = mA + mD, disc = Math.max(0, tr * tr - 4 * det);
      const l1 = 0.5 * (tr + Math.sqrt(disc)), l2 = 0.5 * (tr - Math.sqrt(disc));
      ctx.fillStyle = green; ctx.fillText(`Eigenvalues λ₁ = ${l1.toFixed(2)}, λ₂ = ${l2.toFixed(2)}`, 305, 128);
      ctx.fillStyle = ink; ctx.fillText(`Check: λ₁ × λ₂ = ${(l1 * l2).toFixed(2)} = det(A)`, 305, 160);
      readoutHtml = `Matrix [[${mA}, ${mB}], [${mB}, ${mD}]] · <b>det(A) = ${det.toFixed(2)}</b> · Eigenvalues <b>λ₁ = ${l1.toFixed(2)}, λ₂ = ${l2.toFixed(2)}</b>`;
      break;
    }
  }

  if (window.highlightedRole) {
    const ch = CHAPTERS[currentChapter] || CHAPTERS[0];
    const mappings = (ch.intuitionToFormula && ch.intuitionToFormula.termMappings) || [];
    const matched = mappings.find(m => m.colorRole === window.highlightedRole);
    if (matched) {
      const roleCol = matched.colorRole === 'red' ? red : (matched.colorRole === 'blue' ? blue : (matched.colorRole === 'amber' ? amber : green));
      ctx.save();
      ctx.strokeStyle = roleCol;
      ctx.lineWidth = 3;
      ctx.strokeRect(6, 6, w - 12, h - 12);
      ctx.fillStyle = roleCol;
      ctx.font = 'bold 12px -apple-system, sans-serif';
      ctx.fillText(`Focused Term: ${matched.symbol} → ${matched.visualPart}`, 16, h - 14);
      ctx.restore();
    }
  }
  ctx.restore();
  document.getElementById('live-readout').innerHTML = readoutHtml;
}

['param-a', 'param-b', 'param-c'].forEach(id => {
  document.getElementById(id).addEventListener('input', drawSandbox);
});

document.getElementById('btn-prev').addEventListener('click', () => {
  currentChapter = (currentChapter - 1 + CHAPTERS.length) % CHAPTERS.length;
  window.location.hash = `#ch${String(currentChapter).padStart(2, '0')}`;
});
document.getElementById('btn-next').addEventListener('click', () => {
  currentChapter = (currentChapter + 1) % CHAPTERS.length;
  window.location.hash = `#ch${String(currentChapter).padStart(2, '0')}`;
});
document.getElementById('btn-stage-primary').addEventListener('click', () => {
  const ch = CHAPTERS[currentChapter] || CHAPTERS[0];
  setAtlasRoute(ch.intuitionToFormula.atlasFigureRef);
});
document.getElementById('btn-stage-companion').addEventListener('click', () => {
  const ch = CHAPTERS[currentChapter] || CHAPTERS[0];
  setAtlasRoute(COMPANION_BOOKS[ch.number] || ch.intuitionToFormula.atlasFigureRef);
});
// The 3D figures are not bundled for offline use yet, so the box stays hidden until the
// loaded figure has drawn something: a blank box with no figure is worse than none.
function figureHasContent(frame) {
  try {
    const doc = frame.contentDocument;
    return !!(doc && doc.body && doc.body.querySelector('canvas, svg, img, video'));
  } catch (e) {
    return false;
  }
}
function showAtlasCardIfDrawn() {
  const frame = document.getElementById('atlas-iframe');
  const card = document.getElementById('atlas-card');
  const src = frame.src;
  card.hidden = !figureHasContent(frame);
  if (card.hidden) setTimeout(() => { if (frame.src === src) card.hidden = !figureHasContent(frame); }, 1500);
}
document.getElementById('atlas-iframe').addEventListener('load', showAtlasCardIfDrawn);
document.getElementById('atlas-iframe').addEventListener('error', () => {
  document.getElementById('atlas-card').hidden = true;
});
document.getElementById('btn-reload-atlas').addEventListener('click', () => {
  const iframe = document.getElementById('atlas-iframe');
  iframe.src = iframe.getAttribute('data-src') || iframe.src;
});
document.getElementById('btn-stamp').addEventListener('click', () => {
  const ch = CHAPTERS[currentChapter] || CHAPTERS[0];
  const wid = (ch.widgets && ch.widgets[0]) || `w_ch${ch.number}`;
  const readout = document.getElementById('live-readout').innerText.replace(/\n/g, ' · ');
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kymmathsBridge) {
    window.webkit.messageHandlers.kymmathsBridge.postMessage({ type: 'stampWidget', widgetId: wid, chapter: ch.number, readout });
  }
  document.getElementById('btn-stamp').textContent = 'Challenge Stamped ✓';
});

window.addEventListener('hashchange', () => {
  parseHash();
  renderChapter();
});
window.addEventListener('resize', drawSandbox);

parseHash();
renderChapter();
</script>
