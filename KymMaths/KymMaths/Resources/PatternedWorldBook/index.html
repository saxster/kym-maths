 and one Tail.", "speakerAName": "Asha", "speakerAClaim": "There are three possible results: two Heads, two Tails, or one of each. So one Head and one Tail has probability 1/3.", "speakerBName": "Rohan", "speakerBClaim": "The 2 × 2 sample space has four equally likely outcomes: HH, HT, TH and TT. Both HT and TH give one of each, so the probability is 2/4 = 1/2.", "choices": [{"id": "ch15-a", "speakerLabel": "Asha is right (1/3)", "reasoningStatement": "HT and TH are the same result, so there are only 3 outcomes.", "isCorrect": false, "socraticRebuttal": "Head on the ₹1 coin with Tail on the ₹2 coin is a different physical outcome from Tail on ₹1 with Head on ₹2."}, {"id": "ch15-b", "speakerLabel": "Rohan is right (2/4 = 1/2)", "reasoningStatement": "Of the 4 equally likely pairs in the sample space, 2 pairs (HT and TH) have one Head and one Tail.", "isCorrect": true, "socraticRebuttal": "Yes. Listing all 4 equally likely pairs in the sample space shows that HT and TH together take up 2 out of 4 squares."}, {"id": "ch15-c", "speakerLabel": "Neither. It is 1/2 × 1/2 = 1/4.", "reasoningStatement": "Multiply 1/2 for Head by 1/2 for Tail.", "isCorrect": false, "socraticRebuttal": "1/4 is the probability of HT alone. Adding TH (another 1/4) gives 1/4 + 1/4 = 1/2."}], "invariantTakeaway": "Count equally likely pairs in the full sample space: HT and TH are two separate ways to get one Head and one Tail."}}, {"id": "ch16", "number": 16, "volumeNumber": 4, "volumeTitle": "Volume IV · Data Forensics, Uncertainty & Bayes' Theorem", "title": "Bayes: updating a belief", "subtitle": "Beyond the school book · Why a 95% accurate test on a rare condition is right only 28% of the time, worked out in 1,000 people before any formula", "hookSummary": "A medical test is 95% accurate, and you test positive for a condition that affects 2 in 100 people. Why is the chance you actually have it only about 28%, not 95%?", "beyondSchoolBook": true, "skillCard": {"skill": "Turning percentages into counts out of 1,000 people to update a probability when new evidence arrives", "sheCan": {"prompt": "With no calculator: out of 1,000 people, 2% (20 people) have a trait and 980 do not. A test flags 95% of the 20 who have it, and also falsely flags 5% of the 980 who do not. How many people test positive in all, and what fraction of them actually have the trait?", "answer": "95% of 20 is 19 true positives, and 5% of 980 is 49 false positives. In all, 19 + 49 = 68 people test positive, and 19/68 (about 27.9%) actually have the trait."}, "whyItMatters": "Doctors reading a scan, spam filters checking an email and detectives weighing a clue all update a starting chance when new evidence arrives.", "standsOn": ["Chapter 2: simplifying fractions", "Chapter 3: percentages and sharing a total in a ratio", "Chapter 15: sample spaces and tree diagrams"], "unlocks": ["Medicine: reading screening tests without panicking over false alarms", "Computer science: spam filters and machine learning classifiers", "Science: weighing how strongly new evidence supports a hypothesis"]}, "intuitionToFormula": {"concreteAction": "In the figure, set the condition rate to 2%, the true-hit rate to 95%, and the false-alarm rate to 5%.", "ahaInvariant": "Out of 1,000 people, everyone who tested negative disappears. Only two bars remain: 19 sick people flagged red and 49 healthy people flagged amber, so 19 out of 68 are sick.", "formulaDisplay": "P(sick | +) = true positives ÷ (true positives + false positives)", "termMappings": [{"symbol": "True positives", "visualPart": "The red rectangle on the left (19 of 1,000)", "colorRole": "red", "meaning": "Sick people the test rightly flags"}, {"symbol": "False positives", "visualPart": "The amber rectangle on the right (49 of 1,000)", "colorRole": "amber", "meaning": "Healthy people the test wrongly flags"}, {"symbol": "Red ÷ (Red + Amber)", "visualPart": "The red share of the stacked bar on the far right", "colorRole": "green", "meaning": "The updated chance of being sick once the test is positive"}], "atlasFigureRef": "maths/ch17-bayes-probability/index.html"}, "sections": [{"id": "ch16-s1", "heading": "16.1 Narrowing the world when you learn a clue", "excerpt": "Before you see the helmet, the chance is 20 out of 1,000, or 2%. Once you see the helmet, you stop dividing by all 1,000 students and divide only by the students carrying a helmet.", "teaches": ["conditional-probability", "base-rate", "prior"], "steps": [{"id": "ch16-s1-question", "kind": "question", "text": "In a school of 1,000 students, 20 cycle to school and 980 walk or take the bus. What is the chance a student cycles before you look, and how does it change if they hold a cycle helmet?"}, {"id": "ch16-s1-idea", "kind": "idea", "text": "Before you see the helmet, the chance is 20 out of 1,000, or 2%. Once you see the helmet, you stop dividing by all 1,000 students and divide only by the students carrying a helmet."}, {"id": "ch16-s1-picture", "kind": "picture", "text": "Draw a box of 1,000 dots, with a narrow strip of 20 cyclists on the left and 980 non-cyclists on the right. Draw a circle around only the dots holding a helmet; that circle is your new denominator."}, {"id": "ch16-s1-reason", "kind": "reason", "text": "Why does the denominator shrink? Everyone without a helmet is ruled out by what you saw. Probabilities must be counted inside the group that matches the clue."}, {"id": "ch16-s1-name", "kind": "name", "text": "The starting share of a group in the whole population, such as 20 in 1,000 (2%), is the base rate. Your starting probability before seeing the clue is the prior. The probability of A given that B has happened is the conditional probability, written P(A | B), read 'the probability of A given B'."}, {"id": "ch16-s1-example", "kind": "example", "text": "In a two-way table, 30 students play chess, and 12 of those 30 also play tabla. Given that a student plays chess, the conditional probability they play tabla is 12 ÷ 30 = 2/5."}, {"id": "ch16-s1-mistake", "kind": "mistake", "text": "The tempting slip is to keep dividing by the whole 1,000 after you know the clue happened. The vertical bar in P(A | B) means 'restrict the denominator to B'."}, {"id": "ch16-s1-turn", "kind": "turn", "text": "In a club of 100 members, 25 wear glasses, and 10 of those 25 are left-handed. Given that a member wears glasses, what is the conditional probability they are left-handed, in simplest form?", "answer": "2/5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2/5", "simplest": true}]}], "accepts": ["2/5", "0.4"], "rejects": ["10/25", "1/10", "1/4"], "mistakes": []}}, {"id": "ch16-s1-sayBack", "kind": "sayBack", "text": "The base rate gives your prior before the clue; conditional probability P(A | B) shrinks the denominator to only the cases where B happened."}]}, {"id": "ch16-s2", "heading": "16.2 Two ways a test can be right, and how false alarms pile up", "excerpt": "5% of 980, which is 49 healthy people. Even a small 5% slip rate makes a big pile of 49 wrong alarms when it acts on a crowd of 980 healthy people.", "teaches": ["sensitivity", "specificity", "false-positive"], "steps": [{"id": "ch16-s2-question", "kind": "question", "text": "Out of 1,000 people, 20 are sick and 980 are healthy. A test catches 95% of the 20 sick people, and it is 95% accurate on the 980 healthy people too. How many healthy people still get a wrong positive result?"}, {"id": "ch16-s2-idea", "kind": "idea", "text": "5% of 980, which is 49 healthy people. Even a small 5% slip rate makes a big pile of 49 wrong alarms when it acts on a crowd of 980 healthy people."}, {"id": "ch16-s2-picture", "kind": "picture", "text": "Split a bar of 1,000 people into 20 sick on the left and 980 healthy on the right. Colour 19 of the 20 red (0.95 × 20 = 19), and colour 49 of the 980 amber (0.05 × 980 = 49)."}, {"id": "ch16-s2-reason", "kind": "reason", "text": "Why are there more amber boxes (49) than red boxes (19)? Because healthy people outnumber sick people 980 to 20. Five per cent of a huge crowd beats ninety-five per cent of a tiny group."}, {"id": "ch16-s2-name", "kind": "name", "text": "The share of sick people the test rightly flags positive is its sensitivity (here 19 out of 20, or 95%). The share of healthy people the test rightly clears negative is its specificity (here 931 out of 980, or 95%). A healthy person wrongly flagged positive is a false positive (here the remaining 5% of 980, which is 49 people)."}, {"id": "ch16-s2-example", "kind": "example", "text": "If 500 people are healthy and a test has 98% specificity, then 98% of 500 = 490 test negative, and the remaining 2% of 500 = 10 are false positives."}, {"id": "ch16-s2-mistake", "kind": "mistake", "text": "The tempting slip is to take 5% of all 1,000 people instead of 5% of the 980 healthy people. Sensitivity acts on the sick group; the false-positive rate acts on the healthy group."}, {"id": "ch16-s2-turn", "kind": "turn", "text": "Out of 400 healthy people, a test has a 5% false-positive rate (95% specificity). How many false positives does it produce?", "answer": "20", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "20"}]}], "accepts": ["20", "20 people"], "rejects": ["380", "5", "80"], "mistakes": []}}, {"id": "ch16-s2-sayBack", "kind": "sayBack", "text": "Sensitivity measures true hits among the sick; specificity measures true clears among the healthy, and the rest of the healthy group are false positives."}]}, {"id": "ch16-s3", "heading": "16.3 Counting inside the positive room", "excerpt": "19 out of 68, which is about 27.9%. The 932 people who tested negative are not in the room, so the chance is red divided by red plus amber.", "teaches": ["posterior", "likelihood-ratio", "bayes-theorem"], "steps": [{"id": "ch16-s3-question", "kind": "question", "text": "Put all 19 truly sick positive testers and all 49 false-positive testers into one room. If you are in that room of 68 people, what is the chance you are actually sick?"}, {"id": "ch16-s3-idea", "kind": "idea", "text": "19 out of 68, which is about 27.9%. The 932 people who tested negative are not in the room, so the chance is red divided by red plus amber."}, {"id": "ch16-s3-picture", "kind": "picture", "text": "In the figure, look at the stacked bar on the far right for 2%, 95% and 5%. The red top piece is 19 and the amber bottom piece is 49, making 68 positive tests in all."}, {"id": "ch16-s3-reason", "kind": "reason", "text": "Why did the chance jump from 2% to 27.9%, yet stop far short of 95%? A positive test is 95% ÷ 5% = 19 times as likely when you are sick as when you are healthy, which boosts the odds from 20 : 980 to (20 × 19) : 980 = 380 : 980 = 19 : 49."}, {"id": "ch16-s3-name", "kind": "name", "text": "The updated probability after seeing the evidence is the posterior. The multiplier sensitivity ÷ false-positive rate (here 95% ÷ 5% = 19) is the likelihood ratio. The rule posterior = true positives ÷ (true positives + false positives) is Bayes' theorem."}, {"id": "ch16-s3-example", "kind": "example", "text": "In a group of 1,000 people, 10 are sick and 990 are healthy. A test flags 9 of the 10 sick people and 9 of the 990 healthy people. By Bayes' theorem, the posterior is 9 ÷ (9 + 9) = 9/18 = 1/2 = 50%."}, {"id": "ch16-s3-mistake", "kind": "mistake", "text": "The tempting slip is to confuse the test's 95% sensitivity with the posterior. Forgetting the base rate and assuming P(sick | +) equals P(+ | sick) is the base-rate trap."}, {"id": "ch16-s3-turn", "kind": "turn", "text": "In a screening of 1,000 people, there are 20 true positives and 60 false positives. What is the posterior probability of being sick given a positive test, as a decimal?", "answer": "0.25", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "0.25"}]}], "accepts": ["0.25", "1/4"], "rejects": ["0.33", "0.02", "0.75"], "mistakes": []}}, {"id": "ch16-s3-sayBack", "kind": "sayBack", "text": "Bayes' theorem finds the posterior by dividing true positives by all positives (true positives + false positives), multiplying the prior odds by the likelihood ratio."}], "figure": true}], "callouts": [{"id": "ch16-c-predict", "kind": "predict", "title": "Predict first", "body": "In the figure, raise the base rate from 2% to 10% while keeping sensitivity at 95% and false positives at 5%. Predict whether the posterior rises above 50%."}, {"id": "ch16-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend using 1,000 people why a 95% accurate test on a rare 2% condition gives more false alarms (49) than true hits (19)."}, {"id": "ch16-c-trap", "kind": "careful", "title": "Turn percentages into 1,000 people", "body": "Whenever a conditional probability question gives you percentages, turn them into whole numbers out of 1,000 people before dividing."}], "keyTerms": ["Conditional probability", "Base rate", "Prior", "Sensitivity", "Specificity", "False positive", "Posterior", "Likelihood ratio", "Bayes' theorem"], "widgets": ["w_atlas_bayes_square", "w_bayes_natural_frequency_tree"], "debate": {"id": "debate-ch16-bayes", "chapterNumber": 16, "oupUnitNumber": 12, "title": "90% accurate test: 90% chance or 50% chance?", "contextPrompt": "Out of 1,000 people, 10 are sick (and 9 test positive) while 990 are healthy (and 9 test positive as false alarms). Asha and Rohan debate the chance a positive tester is sick.", "speakerAName": "Asha", "speakerAClaim": "9 out of 10 sick people test positive, so the test is 90% accurate. If you test positive, you have a 90% chance of being sick.", "speakerBName": "Rohan", "speakerBClaim": "18 people tested positive in all: 9 sick and 9 healthy, in a 1 : 1 ratio. So your chance of being sick is 9 ÷ 18 = 50%.", "choices": [{"id": "ch16-a", "speakerLabel": "Asha is right (90%)", "reasoningStatement": "The chance of being sick given a positive test is the same as the test's 90% hit rate.", "isCorrect": false, "socraticRebuttal": "90% is the share of sick people who test positive. You also have to count the 9 healthy people who tested positive."}, {"id": "ch16-b", "speakerLabel": "Rohan is right (9 ÷ 18 = 50%)", "reasoningStatement": "Among the 18 people who tested positive, true positives and false positives are in the ratio 9 : 9, so half are sick.", "isCorrect": true, "socraticRebuttal": "Yes. Only 18 people tested positive, 9 sick and 9 healthy, so 9 ÷ 18 = 50%."}, {"id": "ch16-c", "speakerLabel": "Neither. It is 9 ÷ 1,000 = 0.9%.", "reasoningStatement": "Divide the 9 sick positive testers by all 1,000 people.", "isCorrect": false, "socraticRebuttal": "Once you know the test is positive, the 982 people who tested negative are ruled out."}], "invariantTakeaway": "Among all positive tests, compare true positives with false positives: P(sick | +) = true positives ÷ (true positives + false positives)."}}, {"id": "ch17", "number": 17, "volumeNumber": 5, "volumeTitle": "Volume V · Calculus, Vectors & Linear Algebra", "title": "Slopes of curves", "subtitle": "Beyond the school book · Zooming in until a curve looks straight, sliding two points together, and finding where a curve levels out", "hookSummary": "A straight line has one gradient everywhere. A ball thrown into the air slows down, stops at the top, and speeds up on the way down. How do you measure the steepness of a curve at one single instant?", "beyondSchoolBook": true, "skillCard": {"skill": "Finding the slope of a curve at one point by shrinking the step h to zero, and locating peaks and valleys", "sheCan": {"prompt": "With no calculator: for the curve y = x³, what is the derivative dy/dx, and what is the slope of the curve at x = 2? And for the parabola y = x² − 6x + 11, at what value of x is the curve momentarily flat?", "answer": "For y = x³, the power rule brings the 3 down and drops the power by 1: dy/dx = 3x². At x = 2, the slope is 3 × 2² = 12. For y = x² − 6x + 11, the slope is dy/dx = 2x − 6, which equals 0 when x = 3."}, "whyItMatters": "Car speedometers, rockets climbing into orbit and businesses finding the best price all rely on the rate of change at one instant.", "standsOn": ["Chapter 4: expanding brackets such as (x + h)² = x² + 2xh + h²", "Chapter 7: the gradient of a straight line, rise divided by step across", "Chapter 10: the area of a square when its side grows by a thin strip"], "unlocks": ["Chapter 18: areas under curves, which undo the slope step", "Physics: instantaneous velocity and acceleration from a position graph", "Optimization: finding the best dimensions of a box or container"]}, "intuitionToFormula": {"concreteAction": "In the figure, keep the red point at x = 1.25 and slide the step h from 0.45 down toward 0.05.", "ahaInvariant": "As the amber point slides closer to the red point, the amber line swings into the red line that touches the curve at x = 1.25. Growing a square of side x by a thin strip h adds two strips of area x × h and a tiny corner h².", "formulaDisplay": "f′(x) = the limit as h → 0 of (f(x + h) − f(x)) ÷ h,   d/dx(xⁿ) = n xⁿ⁻¹", "termMappings": [{"symbol": "f(x + h) − f(x)", "visualPart": "The vertical rise between the red point and the amber point", "colorRole": "red", "meaning": "How much the curve rises across the step h"}, {"symbol": "h", "visualPart": "The horizontal step between the two points", "colorRole": "blue", "meaning": "The step width that shrinks toward 0"}, {"symbol": "2x + h → 2x", "visualPart": "Two long strips of length x plus a tiny corner h²", "colorRole": "green", "meaning": "Why the derivative of x² is 2x once the corner h vanishes"}], "atlasFigureRef": "maths/ch18-differential-calculus/index.html"}, "sections": [{"id": "ch17-s1", "heading": "17.1 Two points sliding together", "excerpt": "Pick a second point a small step h to the right, at x = 3 + h. Work out rise ÷ run between them, and watch what number it settles onto as h shrinks toward 0.", "teaches": ["secant-line", "limit", "tangent-line"], "steps": [{"id": "ch17-s1-question", "kind": "question", "text": "The gradient rule rise ÷ run needs two points, because dividing 0 ÷ 0 at one point makes no sense. How can we find the slope of the parabola y = x² right at x = 3?"}, {"id": "ch17-s1-idea", "kind": "idea", "text": "Pick a second point a small step h to the right, at x = 3 + h. Work out rise ÷ run between them, and watch what number it settles onto as h shrinks toward 0."}, {"id": "ch17-s1-picture", "kind": "picture", "text": "In the figure, watch the amber line through the two points on the curve as you slide the step h from 0.45 down to 0.05. The amber slope gets closer and closer to the red slope at the first point."}, {"id": "ch17-s1-reason", "kind": "reason", "text": "Why does the division work while h is not zero? From x = 3 to x = 3 + h on y = x², the rise is (3 + h)² − 3² = 6h + h². Dividing by h gives 6 + h, and as h shrinks toward 0, 6 + h settles onto 6."}, {"id": "ch17-s1-name", "kind": "name", "text": "A straight line cutting through two points on a curve is a secant line. The value that an expression approaches as the step shrinks toward zero is the limit. The line that touches the curve at one point with that exact limiting slope is the tangent line."}, {"id": "ch17-s1-example", "kind": "example", "text": "On y = x² between x = 3 and x = 3.1 (so h = 0.1), the secant line has slope (9.61 − 9) ÷ 0.1 = 6.1. At h = 0.01 it is 6.01, and the limit as h approaches 0 gives a tangent line of slope 6."}, {"id": "ch17-s1-mistake", "kind": "mistake", "text": "The tempting slip is to plug h = 0 in before simplifying, which gives 0 ÷ 0. Expand and divide out h first to get 6 + h, then let h shrink to 0."}, {"id": "ch17-s1-turn", "kind": "turn", "text": "On y = x², the secant line from x = 4 to x = 4 + h has slope 8 + h. What is the slope of the tangent line at x = 4 as h shrinks to 0?", "answer": "8", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "8"}]}], "accepts": ["8", "slope = 8"], "rejects": ["16", "4", "0"], "mistakes": []}}, {"id": "ch17-s1-sayBack", "kind": "sayBack", "text": "A secant line joins two points step h apart; taking the limit as h shrinks to 0 turns it into the tangent line at one point."}], "figure": true}, {"id": "ch17-s2", "heading": "17.2 Speed at a single instant", "excerpt": "20 m/s. Over a tiny step of h seconds from t = 2 to t = 2 + h, the distance fallen is 20h + 5h². Dividing by h gives 20 + 5h, which approaches 20 m/s.", "teaches": ["rate-of-change", "derivative"], "steps": [{"id": "ch17-s2-question", "kind": "question", "text": "A stone dropped from a cliff falls y = 5t² metres in t seconds. Between t = 1 and t = 3 it falls 40 metres in 2 seconds, an average of 20 m/s. How fast is it falling at the exact instant t = 2 seconds?"}, {"id": "ch17-s2-idea", "kind": "idea", "text": "20 m/s. Over a tiny step of h seconds from t = 2 to t = 2 + h, the distance fallen is 20h + 5h². Dividing by h gives 20 + 5h, which approaches 20 m/s."}, {"id": "ch17-s2-picture", "kind": "picture", "text": "Draw the curve y = 5t² rising more and more steeply, and draw the straight tangent line touching it at t = 2 with slope 20."}, {"id": "ch17-s2-reason", "kind": "reason", "text": "Why does a car's speedometer match the slope of the tangent line? A speedometer measures distance ÷ time over a tiny fraction of a second, which is the tangent slope at that moment."}, {"id": "ch17-s2-name", "kind": "name", "text": "How fast one quantity changes per unit of another at a single instant is the rate of change. The rule or function that gives the tangent slope at any point x is the derivative, written f′(x) or dy/dx."}, {"id": "ch17-s2-example", "kind": "example", "text": "For y = 5t², the derivative is dy/dt = 10t. At t = 1 s the stone falls at 10 m/s; at t = 2 s it falls at 20 m/s; at t = 3 s it falls at 30 m/s."}, {"id": "ch17-s2-mistake", "kind": "mistake", "text": "The tempting slip is to divide total height by total time, y ÷ t, as if the graph were a straight line from (0, 0). At t = 2 on y = 5t², y ÷ t gives 20 ÷ 2 = 10 m/s, which is only the average from t = 0 to t = 2, half the instantaneous speed of 20 m/s."}, {"id": "ch17-s2-turn", "kind": "turn", "text": "A falling stone has height rule y = 5t² and derivative dy/dt = 10t. What is its instantaneous speed in m/s at t = 4 seconds?", "answer": "40", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "40"}]}], "accepts": ["40", "40 m/s"], "rejects": ["80", "20", "16"], "mistakes": []}}, {"id": "ch17-s2-sayBack", "kind": "sayBack", "text": "The derivative dy/dx or f′(x) gives the instantaneous rate of change, the slope of the tangent line at x."}]}, {"id": "ch17-s3", "heading": "17.3 Why a growing square has two long strips", "excerpt": "Two long strips, each of area x × h, plus one tiny corner square of area h². Divide the new area 2xh + h² by the step h to get 2x + h, and let h shrink to 0: the derivative of x² is 2x.", "teaches": ["power-rule"], "steps": [{"id": "ch17-s3-question", "kind": "question", "text": "A square tile has side x and area x². If you widen the square by a thin strip h along its right edge and its top edge, how much new area do you add?"}, {"id": "ch17-s3-idea", "kind": "idea", "text": "Two long strips, each of area x × h, plus one tiny corner square of area h². Divide the new area 2xh + h² by the step h to get 2x + h, and let h shrink to 0: the derivative of x² is 2x."}, {"id": "ch17-s3-picture", "kind": "picture", "text": "Draw a square of side x, and add a strip of width h along the right side and top. Shade the tiny h × h square in the corner."}, {"id": "ch17-s3-reason", "kind": "reason", "text": "What happens in 3D when a cube of side x and volume x³ grows by h? It adds three square slabs of face area x² and thickness h, so the derivative of x³ is 3x²."}, {"id": "ch17-s3-name", "kind": "name", "text": "Bringing the exponent n down in front and reducing the exponent by 1 is the power rule. The derivative of xⁿ is n xⁿ⁻¹."}, {"id": "ch17-s3-example", "kind": "example", "text": "By the power rule, the derivative of x⁴ is 4x³. For y = 3x² + 5x − 7, the derivative is dy/dx = 3(2x) + 5(1) − 0 = 6x + 5, because a constant −7 does not change."}, {"id": "ch17-s3-mistake", "kind": "mistake", "text": "The tempting slip is to bring the power down and forget to subtract 1 from the exponent, writing 3x³ for the derivative of x³. Always drop the exponent by 1: x³ becomes 3x²."}, {"id": "ch17-s3-turn", "kind": "turn", "text": "Use the power rule to find the derivative dy/dx of y = x³ at x = 2.", "answer": "12", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "12"}]}], "accepts": ["12", "dy/dx = 12"], "rejects": ["8", "6", "24"], "mistakes": []}}, {"id": "ch17-s3-sayBack", "kind": "sayBack", "text": "The power rule differentiates xⁿ to n xⁿ⁻¹, and a constant term differentiates to 0."}]}, {"id": "ch17-s4", "heading": "17.4 Flat at the top of the flight", "excerpt": "Zero. To change from positive (rising) to negative (falling), a smooth slope must pass through 0 at the top, where the tangent line is horizontal.", "teaches": ["stationary-point", "maximum-and-minimum"], "steps": [{"id": "ch17-s4-question", "kind": "question", "text": "When you throw a cricket ball straight up, its slope is positive on the way up and negative on the way down. What must its slope be at the exact peak of its flight?"}, {"id": "ch17-s4-idea", "kind": "idea", "text": "Zero. To change from positive (rising) to negative (falling), a smooth slope must pass through 0 at the top, where the tangent line is horizontal."}, {"id": "ch17-s4-picture", "kind": "picture", "text": "Draw a smooth hill and a smooth valley. Lay a ruler flat across the top of the hill and the bottom of the valley."}, {"id": "ch17-s4-reason", "kind": "reason", "text": "Why does setting dy/dx = 0 find the peak or the valley? Everywhere else the curve is either still climbing (dy/dx > 0) or already dropping (dy/dx < 0)."}, {"id": "ch17-s4-name", "kind": "name", "text": "A point on a curve where the derivative dy/dx equals 0 is a stationary point. A peak is a local maximum and a valley is a local minimum; together they are maximum and minimum points."}, {"id": "ch17-s4-example", "kind": "example", "text": "A ball's height is h(t) = 20t − 5t². Its derivative is dh/dt = 20 − 10t. Setting 20 − 10t = 0 gives t = 2 seconds, and the peak height is h(2) = 20(2) − 5(4) = 20 metres."}, {"id": "ch17-s4-mistake", "kind": "mistake", "text": "The tempting slip is to think dy/dx = 0 means the height y is 0. At t = 2 s the slope is 0, while the ball is at its highest point, 20 metres in the air."}, {"id": "ch17-s4-turn", "kind": "turn", "text": "For the parabola y = x² − 6x + 11, the derivative is dy/dx = 2x − 6. At what value of x does the curve have its stationary point?", "answer": "3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "3"}]}], "accepts": ["3", "x = 3"], "rejects": ["6", "2", "11"], "mistakes": []}}, {"id": "ch17-s4-sayBack", "kind": "sayBack", "text": "At a stationary point the tangent line is horizontal (dy/dx = 0), marking a smooth maximum and minimum."}]}], "callouts": [{"id": "ch17-c-predict", "kind": "predict", "title": "Predict first", "body": "In the figure on y = ½x², set x₀ to 2. Before sliding the step h down toward 0, predict what slope the tangent line at x = 2 will have."}, {"id": "ch17-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend using a square of side x why the derivative of x² is 2x and not x."}, {"id": "ch17-c-trap", "kind": "careful", "title": "Slope is zero, not height", "body": "At the peak of a ball's flight, its derivative dh/dt is 0 because it stops rising for an instant, not because its height h is 0."}], "keyTerms": ["Secant line", "Limit", "Tangent line", "Rate of change", "Derivative", "Power rule", "Stationary point", "Maximum and minimum"], "widgets": ["w_atlas_calculus_derivative", "w_power_rule_square_growth"], "debate": {"id": "debate-ch17-derivative", "chapterNumber": 17, "oupUnitNumber": 14, "title": "What does zero slope at the peak mean?", "contextPrompt": "A cricket ball thrown straight up has height h(t) = 20t − 5t² metres. At t = 2 seconds, its derivative dh/dt is 0. Asha and Rohan debate what dh/dt = 0 tells us.", "speakerAName": "Asha", "speakerAClaim": "dh/dt = 0 means the ball is at height 0 metres on the ground.", "speakerBName": "Rohan", "speakerBClaim": "At t = 2 seconds the height is 20(2) − 5(4) = 20 metres. dh/dt = 0 means the tangent line is horizontal right at the top of the climb.", "choices": [{"id": "ch17-a", "speakerLabel": "Asha is right (height is 0 m)", "reasoningStatement": "When the derivative is 0, the height is 0 too.", "isCorrect": false, "socraticRebuttal": "Substitute t = 2 into 20t − 5t²: 40 − 20 = 20 metres. The derivative measures slope, not height."}, {"id": "ch17-b", "speakerLabel": "Rohan is right (flat tangent at the 20 m peak)", "reasoningStatement": "The derivative is the rate of change, which passes through 0 as the ball turns from rising to falling.", "isCorrect": true, "socraticRebuttal": "Yes. At t = 2 seconds the ball reaches its maximum height of 20 m, where its instantaneous rate of change is 0."}, {"id": "ch17-c", "speakerLabel": "Neither. The ball floats in the air forever after t = 2.", "reasoningStatement": "Zero speed means the ball never moves again.", "isCorrect": false, "socraticRebuttal": "The slope is 0 only at the single instant t = 2; after t = 2, dh/dt = 20 − 10t becomes negative and the ball falls."}], "invariantTakeaway": "At a smooth peak or valley, the derivative dy/dx is 0 because the tangent line is momentarily horizontal."}}, {"id": "ch18", "number": 18, "volumeNumber": 5, "volumeTitle": "Volume V · Calculus, Vectors & Linear Algebra", "title": "Areas under curves", "subtitle": "Beyond the school book · Slicing a curved region into thin rectangles, running the power rule backwards, and why area undoes slope", "hookSummary": "A train's speed graph is a curve, not a flat line. How do you find the exact distance it travelled when the shape under the graph is not a rectangle or a triangle?", "beyondSchoolBook": true, "skillCard": {"skill": "Approximating the area under a curve with thin rectangles, reversing the power rule to find an antiderivative, and evaluating definite integrals", "sheCan": {"prompt": "With no calculator: what is the antiderivative of 2x that is 0 at x = 0? What is the exact area under y = 2x from x = 0 to x = 3? Check your answer with the area of a right-angled triangle of base 3 and height 6.", "answer": "The antiderivative of 2x is x², because the derivative of x² is 2x. From x = 0 to x = 3, the area is 3² − 0² = 9, which matches the triangle ½ × 3 × 6 = 9."}, "whyItMatters": "Whenever a rate of change varies from moment to moment, the total accumulated change is the area under the rate curve.", "standsOn": ["Chapter 7: distance as the area under a speed–time graph", "Chapter 10: the areas of rectangles and triangles", "Chapter 17: the derivative and the power rule"], "unlocks": ["Physics: work done by a changing force and distance from a changing velocity", "Probability: finding probabilities as areas under a smooth bell curve", "Geometry: volumes of curved solids sliced into thin discs"]}, "intuitionToFormula": {"concreteAction": "In the figure, set the right-hand edge x to 2.4, the slope k to 1.0, and slide the number of strips from 4 up to 20.", "ahaInvariant": "Above the midpoint of each strip, the tiny triangle sticking out on the right matches the tiny triangle missing on the left. Every thin strip of area f(x) × Δx equals a tiny step up on the antiderivative curve F(x).", "formulaDisplay": "∫ₐᵇ f(x) dx = F(b) − F(a)   where F′(x) = f(x)", "termMappings": [{"symbol": "f(xᵢ) Δx", "visualPart": "One blue vertical strip of width Δx", "colorRole": "blue", "meaning": "The area of a single thin rectangle under the curve"}, {"symbol": "∫₀ˣ f(t) dt", "visualPart": "All the strips added together from 0 to x", "colorRole": "green", "meaning": "The total accumulated area under the rate curve"}, {"symbol": "F(b) − F(a)", "visualPart": "The height reached on the antiderivative curve", "colorRole": "red", "meaning": "Total change in F, which equals the area under F′"}], "atlasFigureRef": "maths/ch19-integral-calculus/index.html"}, "sections": [{"id": "ch18-s1", "heading": "18.1 Slicing a curved shape into thin strips", "excerpt": "Slice the base into thin strips of equal width Δx. Stand a rectangle on each strip using the height at its middle, and add their areas up.", "teaches": ["riemann-sum", "midpoint-rule"], "steps": [{"id": "ch18-s1-question", "kind": "question", "text": "You know how to find the area of a rectangle: width × height. How can rectangles measure the area under a curve whose height keeps changing?"}, {"id": "ch18-s1-idea", "kind": "idea", "text": "Slice the base into thin strips of equal width Δx. Stand a rectangle on each strip using the height at its middle, and add their areas up."}, {"id": "ch18-s1-picture", "kind": "picture", "text": "In the figure, set the upper edge x to 2.4 and slide the number of strips from 4 up to 20. Watch the stepped tops hug the green line more and more closely."}, {"id": "ch18-s1-reason", "kind": "reason", "text": "Why measure the height at the midpoint of each strip rather than at its left or right edge? A rising curve is lower on the left and higher on the right, so the missed triangle balances the extra one."}, {"id": "ch18-s1-name", "kind": "name", "text": "Adding the areas of thin vertical rectangles Σ f(xᵢ) Δx to approximate the area under a curve is a Riemann sum. Choosing the curve's height at the middle of each strip's base is the midpoint rule."}, {"id": "ch18-s1-example", "kind": "example", "text": "To estimate the area under y = x² from x = 0 to x = 2 using 2 strips of width 1, the midpoints are x = 0.5 and x = 1.5. The midpoint rule gives 1 × (0.5)² + 1 × (1.5)² = 0.25 + 2.25 = 2.5."}, {"id": "ch18-s1-mistake", "kind": "mistake", "text": "The tempting slip is to add the heights f(xᵢ) and forget to multiply by the strip width Δx. Each strip is a rectangle, so its area is height × width."}, {"id": "ch18-s1-turn", "kind": "turn", "text": "Estimate the area under y = 2x from x = 0 to x = 4 using 2 strips of width 2, with midpoints at x = 1 (height 2) and x = 3 (height 6).", "answer": "16", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "16"}]}], "accepts": ["16", "area = 16"], "rejects": ["8", "12", "32"], "mistakes": []}}, {"id": "ch18-s1-sayBack", "kind": "sayBack", "text": "A Riemann sum adds rectangle areas height × width; the midpoint rule takes each height at the middle of its strip."}], "figure": true}, {"id": "ch18-s2", "heading": "18.2 Letting the strips become infinitely thin", "excerpt": "It moves +30 m forward and −10 m backward, finishing 30 − 10 = 20 m ahead of its start. Area above the time axis adds on; area below the time axis subtracts.", "teaches": ["definite-integral", "signed-area"], "steps": [{"id": "ch18-s2-question", "kind": "question", "text": "A train travels forward at 10 m/s for 3 seconds, then reverses at −5 m/s for 2 seconds. How far from its start does it finish?"}, {"id": "ch18-s2-idea", "kind": "idea", "text": "It moves +30 m forward and −10 m backward, finishing 30 − 10 = 20 m ahead of its start. Area above the time axis adds on; area below the time axis subtracts."}, {"id": "ch18-s2-picture", "kind": "picture", "text": "Draw a rectangle of height +10 and width 3 above the axis (area +30), and a rectangle of depth −5 and width 2 below the axis (area −10)."}, {"id": "ch18-s2-reason", "kind": "reason", "text": "Why let the number of strips grow without bound on a curved graph? As the strip width dx shrinks to 0, the jagged steps disappear and the limit of the Riemann sum equals the exact area."}, {"id": "ch18-s2-name", "kind": "name", "text": "The limit of the Riemann sum from x = a to x = b as strip width shrinks to 0 is the definite integral, ∫ₐᵇ f(x) dx. The elongated S sign ∫ stands for 'sum'. Because regions above the x-axis count as positive and regions below count as negative, the definite integral measures signed area."}, {"id": "ch18-s2-example", "kind": "example", "text": "Under y = 2x from x = 0 to x = 3, the region is a triangle of base 3 and height 6. So the definite integral ∫₀³ 2x dx = ½ × 3 × 6 = 9."}, {"id": "ch18-s2-mistake", "kind": "mistake", "text": "The tempting slip is to add the area below the axis instead of subtracting it when finding net change. For signed area, anything below the horizontal axis carries a minus sign."}, {"id": "ch18-s2-turn", "kind": "turn", "text": "A curve forms a region of area 14 above the x-axis and a region of area 5 below the x-axis. What is the net signed area (the definite integral across both regions)?", "answer": "9", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "9"}]}], "accepts": ["9", "+9"], "rejects": ["19", "-9", "70"], "mistakes": []}}, {"id": "ch18-s2-sayBack", "kind": "sayBack", "text": "The definite integral ∫ₐᵇ f(x) dx is the exact limit of the Riemann sum and measures signed area: above the axis minus below."}]}, {"id": "ch18-s3", "heading": "18.3 Why slope and area undo each other", "excerpt": "Each thin strip of area under the speed curve, v(t) × dt, is a tiny step of distance dF. Adding all the tiny steps from t = 1 to t = 4 gives the total change in position: F(4) − F(1) = 4² − 1² = 15.", "teaches": ["antiderivative", "fundamental-theorem-of-calculus"], "steps": [{"id": "ch18-s3-question", "kind": "question", "text": "Suppose you know a train's speed at every instant is v(t) = 2t, and you notice that the position rule F(t) = t² has derivative F′(t) = 2t. How can F(t) = t² give you the area under v(t) = 2t from t = 1 to t = 4 in one subtraction?"}, {"id": "ch18-s3-idea", "kind": "idea", "text": "Each thin strip of area under the speed curve, v(t) × dt, is a tiny step of distance dF. Adding all the tiny steps from t = 1 to t = 4 gives the total change in position: F(4) − F(1) = 4² − 1² = 15."}, {"id": "ch18-s3-picture", "kind": "picture", "text": "Stack thin vertical steps dF one on top of another from F(a) up to F(b). The middle steps cancel in pairs, leaving only F(b) − F(a)."}, {"id": "ch18-s3-reason", "kind": "reason", "text": "How do you reverse the power rule to find F(x) from xⁿ? Differentiating multiplied by the power and subtracted 1; reversing it adds 1 to the power and divides by the new power: xⁿ⁺¹ ÷ (n + 1)."}, {"id": "ch18-s3-name", "kind": "name", "text": "A function F(x) whose derivative F′(x) equals f(x) is an antiderivative of f(x). The rule that the definite integral of f(x) from a to b equals F(b) − F(a) is the fundamental theorem of calculus."}, {"id": "ch18-s3-example", "kind": "example", "text": "To find ∫₀² 3x² dx, notice that x³ has derivative 3x², so F(x) = x³ is an antiderivative. By the fundamental theorem of calculus, the exact area is F(2) − F(0) = 2³ − 0³ = 8."}, {"id": "ch18-s3-mistake", "kind": "mistake", "text": "The tempting slip when finding an antiderivative of xⁿ is to subtract 1 from the power as if differentiating. Always add 1 to the exponent and divide by the new exponent, then check by differentiating your answer."}, {"id": "ch18-s3-turn", "kind": "turn", "text": "Since F(x) = x³ is an antiderivative of 3x², use F(3) − F(1) to find the exact area ∫₁³ 3x² dx.", "answer": "26", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "26"}]}], "accepts": ["26", "area = 26"], "rejects": ["27", "24", "6"], "mistakes": []}}, {"id": "ch18-s3-sayBack", "kind": "sayBack", "text": "An antiderivative F(x) reverses the derivative, and the fundamental theorem of calculus says ∫ₐᵇ f(x) dx = F(b) − F(a)."}]}], "callouts": [{"id": "ch18-c-predict", "kind": "predict", "title": "Predict first", "body": "In the figure, set the upper edge x to 2.0 and the slope k to 1.0. Predict the exact area of the triangle from 0 to 2 before looking at the readout."}, {"id": "ch18-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why adding up thousands of tiny height steps dF from x = a to x = b leaves F(b) − F(a)."}, {"id": "ch18-c-trap", "kind": "careful", "title": "Check by differentiating", "body": "After you write an antiderivative F(x), differentiate it in your head to check that F′(x) gives back the function inside the integral."}], "keyTerms": ["Riemann sum", "Midpoint rule", "Definite integral", "Signed area", "Antiderivative", "Fundamental theorem of calculus"], "widgets": ["w_atlas_calculus_integral", "w_ftc_area_slope_duality"], "debate": {"id": "debate-ch18-integral", "chapterNumber": 18, "oupUnitNumber": 14, "title": "What does the area under a speed graph measure?", "contextPrompt": "A metro train's speed v(t) in m/s is plotted against time t in seconds. Asha and Rohan debate what the area under the v(t) curve represents.", "speakerAName": "Asha", "speakerAClaim": "The area under the speed graph gives the train's acceleration.", "speakerBName": "Rohan", "speakerBClaim": "Each thin strip has height in m/s multiplied by width in seconds, which gives metres. Adding the strips gives the total distance travelled.", "choices": [{"id": "ch18-a", "speakerLabel": "Asha is right (acceleration)", "reasoningStatement": "Any calculation on a speed graph gives acceleration.", "isCorrect": false, "socraticRebuttal": "Acceleration is the slope dv/dt, which divides m/s by seconds to get m/s². Area multiplies the two axes."}, {"id": "ch18-b", "speakerLabel": "Rohan is right (distance travelled in metres)", "reasoningStatement": "Multiplying height (m/s) by width (s) gives metres for each thin strip, so the total area is total distance.", "isCorrect": true, "socraticRebuttal": "Yes. Slope divides the vertical unit by the horizontal unit; area multiplies them: (m/s) × s = m."}, {"id": "ch18-c", "speakerLabel": "Neither. It gives the average speed.", "reasoningStatement": "The area under a curve is its average value.", "isCorrect": false, "socraticRebuttal": "To get average speed, you would still have to divide that total distance (the area) by the total time."}], "invariantTakeaway": "The derivative divides units (slope = y ÷ x); the definite integral multiplies units (area = ∫ y dx)."}}, {"id": "ch19", "number": 19, "volumeNumber": 5, "volumeTitle": "Volume V · Calculus, Vectors & Linear Algebra", "title": "Vectors", "subtitle": "School book chapter 16 · Chaining journeys nose to tail, finding arrow lengths with Pythagoras, proving midsegments, and testing right angles with the dot product", "hookSummary": "Walk 3 steps East and 4 steps North, then 2 steps East and 1 step South. Where do you finish, and how far in a straight line are you from where you started?", "beyondSchoolBook": false, "skillCard": {"skill": "Adding, subtracting and scaling column vectors, finding their magnitude with Pythagoras' theorem, and using vectors to prove lines are parallel or collinear", "sheCan": {"prompt": "With no calculator: for column vectors a = (3, 4) and b = (2, −1), work out 2a − 3b and find the exact length of a. And if AB = (4, −2) and BC = (−1, 7), what is the single journey AC?", "answer": "2a − 3b = (6 − 6, 8 − (−3)) = (0, 11). The length of a is √(3² + 4²) = √25 = 5. And AC = AB + BC = (4 − 1, −2 + 7) = (3, 5)."}, "whyItMatters": "Pilots correcting for wind, game engines moving characters and physicists adding forces all use arrows with both length and direction.", "standsOn": ["Chapter 8: parallel lines and midpoints", "Chapter 11: column vectors for translations", "Chapter 12: Pythagoras' theorem and cosine"], "unlocks": ["Chapter 20: matrices that transform every vector in the plane at once", "Physics: resolving forces on a ramp and adding velocities", "3D graphics: lighting and camera angles using the dot product"]}, "intuitionToFormula": {"concreteAction": "In the figure, slide the horizontal steps of vector a and vector b, then turn the angle between them to 90°.", "ahaInvariant": "Placing the tail of b at the tip of a makes the shortcut from start to finish equal to a + b. When the angle between two vectors reaches 90°, their dot product drops to 0.", "formulaDisplay": "AB = b − a,   |v| = √(x² + y²),   a · b = x₁x₂ + y₁y₂ = |a||b| cos θ", "termMappings": [{"symbol": "a + b", "visualPart": "The green shortcut arrow from the tail of a to the tip of b", "colorRole": "green", "meaning": "The single displacement that replaces the two-stage journey"}, {"symbol": "|v| = √(x² + y²)", "visualPart": "The length of the arrow as the hypotenuse of its steps", "colorRole": "red", "meaning": "Straight-line distance found by Pythagoras' theorem"}, {"symbol": "a · b", "visualPart": "How much one vector points along the other", "colorRole": "amber", "meaning": "Zero when the two vectors meet at a right angle (90°)"}], "atlasFigureRef": "maths/ch15-linear-graphs-inequalities/index.html"}, "sections": [{"id": "ch19-s1", "heading": "19.1 Nose-to-tail journeys and going backwards", "excerpt": "Walk backwards from A to O, which is (−2, −5), and then forwards from O to B, which is (6, 8). Together that is (6 − 2, 8 − 5) = (4, 3), so AB = OB − OA.", "teaches": ["position-vector", "adding-vectors", "zero-vector"], "steps": [{"id": "ch19-s1-question", "kind": "question", "text": "From the origin O(0, 0), point A is at (2, 5) and point B is at (6, 8). How do you travel from A to B by going back through O?"}, {"id": "ch19-s1-idea", "kind": "idea", "text": "Walk backwards from A to O, which is (−2, −5), and then forwards from O to B, which is (6, 8). Together that is (6 − 2, 8 − 5) = (4, 3), so AB = OB − OA."}, {"id": "ch19-s1-picture", "kind": "picture", "text": "In the figure, follow the red arrow a from the start, then the blue arrow b from the red tip. The green arrow goes straight from the first tail to the second tip."}, {"id": "ch19-s1-reason", "kind": "reason", "text": "Why does AB equal OB − OA and not OA − OB? Starting at A and adding AB lands you at B: OA + AB = OB, so subtracting OA gives AB = OB − OA, 'destination minus start'."}, {"id": "ch19-s1-name", "kind": "name", "text": "The vector from the origin O to a point A is the position vector of A, written OA or a. Chaining two vectors nose to tail by adding their steps is adding vectors (AB + BC = AC). A journey that finishes where it started, such as AB + BA = (0, 0), gives the zero vector, written 0."}, {"id": "ch19-s1-example", "kind": "example", "text": "If AB = (4, −2) and BC = (−1, 7), then by adding vectors AC = AB + BC = (4 + (−1), −2 + 7) = (3, 5)."}, {"id": "ch19-s1-mistake", "kind": "mistake", "text": "The tempting slip when finding AB from position vectors is to subtract in the order OA − OB. Always do destination minus start: AB = OB − OA."}, {"id": "ch19-s1-turn", "kind": "turn", "text": "Point A has position vector OA = (1, 4) and point B has position vector OB = (6, 2). What is the column vector AB = OB − OA?", "answer": "(5, −2)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["5", "-2"]}]}], "accepts": ["(5, −2)", "(5, -2)", "5, -2"], "rejects": ["(-5, 2)", "(7, 6)", "(5, 2)"], "mistakes": []}}, {"id": "ch19-s1-sayBack", "kind": "sayBack", "text": "Position vectors start at O; adding vectors chains them nose to tail (AB + BC = AC), and AB = OB − OA."}], "figure": true}, {"id": "ch19-s2", "heading": "19.2 Length of an arrow and stretching it", "excerpt": "The 3 m step across and 4 m step up make a right-angled triangle, so the straight-line distance is √(3² + 4²) = √25 = 5 m. And 2a doubles both steps to (6, 8), which is 10 m long in the same direction.", "teaches": ["magnitude", "scalar-multiple"], "steps": [{"id": "ch19-s2-question", "kind": "question", "text": "A drone flies along the column vector a = (3, 4), moving 3 m East and 4 m North. How far is it in a straight line from its take-off spot, and where does 2a take it?"}, {"id": "ch19-s2-idea", "kind": "idea", "text": "The 3 m step across and 4 m step up make a right-angled triangle, so the straight-line distance is √(3² + 4²) = √25 = 5 m. And 2a doubles both steps to (6, 8), which is 10 m long in the same direction."}, {"id": "ch19-s2-picture", "kind": "picture", "text": "Draw the right-angled triangle with base 3 and height 4 under the arrow (3, 4), then extend the arrow to twice its length at (6, 8)."}, {"id": "ch19-s2-reason", "kind": "reason", "text": "Why does (−3)² still give +9 when a component is negative? In v = (5, −12), the step −12 goes downwards, but its length is 12, and (−12)² = +144."}, {"id": "ch19-s2-name", "kind": "name", "text": "The length of a vector v = (x, y), found by Pythagoras' theorem √(x² + y²), is its magnitude, written |v|. Multiplying both steps of v by a number k gives a scalar multiple, kv = (kx, ky)."}, {"id": "ch19-s2-example", "kind": "example", "text": "For a = (3, 4) and b = (2, −1), the combination 2a − 3b is (6, 8) − (6, −3) = (0, 11), and the magnitude |a| is √(3² + 4²) = 5."}, {"id": "ch19-s2-mistake", "kind": "mistake", "text": "The tempting slip is to think |a + b| equals |a| + |b|. For a = (3, 4) of magnitude 5 and b = (5, −4), the sum a + b is (8, 0) of magnitude 8, which is shorter than the two separate paths."}, {"id": "ch19-s2-turn", "kind": "turn", "text": "Find the magnitude |v| of the column vector v = (5, −12).", "answer": "13", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "13"}]}], "accepts": ["13", "|v| = 13"], "rejects": ["7", "17", "169"], "mistakes": []}}, {"id": "ch19-s2-sayBack", "kind": "sayBack", "text": "The magnitude |v| = √(x² + y²) is the arrow's length by Pythagoras, and a scalar multiple kv scales both components by k."}]}, {"id": "ch19-s3", "heading": "19.3 Proving two lines are parallel or in one line", "excerpt": "Write OA = a and OB = b, so AB = b − a. To go from M to N, go ½a back to O and ½b out to N: MN = −½a + ½b = ½(b − a) = ½AB.", "teaches": ["collinear"], "steps": [{"id": "ch19-s3-question", "kind": "question", "text": "In triangle OAB, M is the midpoint of OA and N is the midpoint of OB. How can vectors prove in one line that MN is both parallel to AB and half as long?"}, {"id": "ch19-s3-idea", "kind": "idea", "text": "Write OA = a and OB = b, so AB = b − a. To go from M to N, go ½a back to O and ½b out to N: MN = −½a + ½b = ½(b − a) = ½AB."}, {"id": "ch19-s3-picture", "kind": "picture", "text": "Draw triangle OAB with M halfway along OA and N halfway along OB. Mark AB as b − a and the midsegment MN as ½(b − a)."}, {"id": "ch19-s3-reason", "kind": "reason", "text": "Why does MN = ½AB prove two geometric facts at once? MN is a scalar multiple of AB, so they are parallel, and the ½ shows MN is half as long."}, {"id": "ch19-s3-name", "kind": "name", "text": "Points that lie on the same straight line are collinear. If AB is a scalar multiple of BC, they are parallel and share B, so A, B and C are collinear."}, {"id": "ch19-s3-example", "kind": "example", "text": "If AB = (2, 3) and BC = (6, 9), then BC = 3 × AB. Because BC is a scalar multiple of AB and they share point B, the points A, B and C are collinear."}, {"id": "ch19-s3-mistake", "kind": "mistake", "text": "The tempting slip is to stop after saying 'BC = 3 × AB so they are parallel'. Parallel lines can be separate; you must also state that they share the common point B to prove A, B and C are collinear."}, {"id": "ch19-s3-turn", "kind": "turn", "text": "Given AB = (3, −2) and BC = (k, −6), for what value of k are the points A, B and C collinear?", "answer": "9", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "9"}]}], "accepts": ["9", "k = 9"], "rejects": ["6", "-9", "1"], "mistakes": []}}, {"id": "ch19-s3-sayBack", "kind": "sayBack", "text": "When one vector is a scalar multiple of another they are parallel; if they also share a point, the three points are collinear."}]}, {"id": "ch19-s4", "heading": "19.4 Testing for a right angle with the dot product", "excerpt": "Multiply their x-steps together, multiply their y-steps together, and add: 3 × (−4) + 4 × 3 = −12 + 12 = 0. Whenever that sum is 0 for two non-zero vectors, the angle between them is 90°.", "teaches": ["dot-product"], "steps": [{"id": "ch19-s4-question", "kind": "question", "text": "Without a grid or protractor, how can you tell in two seconds that u = (3, 4) and v = (−4, 3) meet at 90°?"}, {"id": "ch19-s4-idea", "kind": "idea", "text": "Multiply their x-steps together, multiply their y-steps together, and add: 3 × (−4) + 4 × 3 = −12 + 12 = 0. Whenever that sum is 0 for two non-zero vectors, the angle between them is 90°."}, {"id": "ch19-s4-picture", "kind": "picture", "text": "Draw u = (3, 4) going 3 across and 4 up, and v = (−4, 3) going 4 left and 3 up. The second triangle is the first triangle turned through 90°."}, {"id": "ch19-s4-reason", "kind": "reason", "text": "Why does x₁x₂ + y₁y₂ equal 0 at 90°? This formula goes past the school book. By the cosine rule on u, v and u − v, x₁x₂ + y₁y₂ = |u||v| cos θ, and cos 90° = 0."}, {"id": "ch19-s4-name", "kind": "name", "text": "For u = (x₁, y₁) and v = (x₂, y₂), the number x₁x₂ + y₁y₂ = |u||v| cos θ is the dot product, written u · v. Notice that the dot product of two vectors is a single number (a scalar), not a vector."}, {"id": "ch19-s4-example", "kind": "example", "text": "For u = (2, 5) and v = (4, −1), the dot product is u · v = (2 × 4) + (5 × (−1)) = 8 − 5 = 3. Since 3 > 0, the angle between them is acute (less than 90°)."}, {"id": "ch19-s4-mistake", "kind": "mistake", "text": "The tempting slip is to write the dot product as a column vector (x₁x₂, y₁y₂). Add the two products together so the answer is a single number."}, {"id": "ch19-s4-turn", "kind": "turn", "text": "Calculate the dot product u · v of u = (4, 3) and v = (2, −1).", "answer": "5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5"}]}], "accepts": ["5", "u · v = 5"], "rejects": ["11", "8", "-3"], "mistakes": []}}, {"id": "ch19-s4-sayBack", "kind": "sayBack", "text": "The dot product u · v = x₁x₂ + y₁y₂ = |u||v| cos θ is a single number that equals 0 whenever two vectors are perpendicular."}]}], "callouts": [{"id": "ch19-c-predict", "kind": "predict", "title": "Predict first", "body": "In the figure, set the angle between the two vectors to 90°. Predict what value the dot product will show before you move the angle slider."}, {"id": "ch19-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why walking 3 m East and 4 m North gives a vector of magnitude 5 m, not 7 m."}, {"id": "ch19-c-trap", "kind": "careful", "title": "Destination minus start", "body": "To find the vector AB from position vectors OA and OB, always subtract the starting point from the finishing point: AB = OB − OA."}], "keyTerms": ["Column vector", "Position vector", "Adding vectors", "Zero vector", "Magnitude", "Scalar multiple", "Collinear", "Dot product"], "widgets": ["w_vector_tip_to_tail_lab", "w_vector_geometric_proof_studio"], "debate": {"id": "debate-ch19-vectors", "chapterNumber": 19, "oupUnitNumber": 16, "title": "Do vector lengths add up directly?", "contextPrompt": "A drone flies along vector a = (3, 4) of magnitude 5 m, and then along vector b = (5, −4). Asha and Rohan debate the magnitude of the resultant journey a + b.", "speakerAName": "Asha", "speakerAClaim": "To find the length of a + b, add the two separate lengths together: |a| + |b|.", "speakerBName": "Rohan", "speakerBClaim": "Add the components first: a + b = (3 + 5, 4 − 4) = (8, 0). The +4 North and −4 South cancel out, leaving a straight 8 m journey East.", "choices": [{"id": "ch19-a", "speakerLabel": "Asha is right (add the two lengths)", "reasoningStatement": "The magnitude of a sum is the sum of the magnitudes.", "isCorrect": false, "socraticRebuttal": "Lengths add directly only when both vectors point in the exact same direction. Here the second leg turns back South."}, {"id": "ch19-b", "speakerLabel": "Rohan is right (a + b = (8, 0), magnitude 8 m)", "reasoningStatement": "Vectors add nose to tail by their horizontal and vertical steps, and the straight shortcut is shorter than the detour.", "isCorrect": true, "socraticRebuttal": "Yes. Adding components gives (3 + 5, 4 − 4) = (8, 0), which has magnitude 8 m."}, {"id": "ch19-c", "speakerLabel": "Neither. Multiply the components to get (15, −16).", "reasoningStatement": "Combining two vectors multiplies their steps.", "isCorrect": false, "socraticRebuttal": "Walking 3 m East and then 5 m East puts you 3 + 5 = 8 m East, not 15 m."}], "invariantTakeaway": "Add vectors by their components nose to tail first, then find the magnitude of the resultant vector."}}, {"id": "ch20", "number": 20, "volumeNumber": 5, "volumeTitle": "Volume V · Calculus, Vectors & Linear Algebra", "title": "Matrices", "subtitle": "Beyond the school book · Moving the grid with two arrows, measuring stretched area with ad − bc, and finding directions that do not turn", "hookSummary": "When you pinch-zoom or rotate a photo on a screen, the tablet moves millions of pixels at once. How can four numbers tell every point on the grid where to land?", "beyondSchoolBook": true, "skillCard": {"skill": "Reading the columns of a 2×2 matrix, multiplying a matrix by a vector, finding the determinant ad − bc, and spotting eigenvectors", "sheCan": {"prompt": "With no calculator: for the 2×2 matrix A = [[3, 1], [2, 4]], where does it send the vector (2, 1)? What is its determinant det(A) = ad − bc, and what does A do to the area of a triangle of area 5 cm²?", "answer": "A sends (2, 1) to 2 × (3, 2) + 1 × (1, 4) = (6 + 1, 4 + 4) = (7, 8). Its determinant is (3 × 4) − (1 × 2) = 12 − 2 = 10, so the triangle's area becomes 10 × 5 = 50 cm²."}, "whyItMatters": "Every 3D game, robot arm and medical scanner runs on matrices. They package an entire grid move into four numbers a computer can multiply at once.", "standsOn": ["Chapter 10: the area of a rectangle and a parallelogram", "Chapter 11: transformations and area scale factors", "Chapter 19: column vectors and scalar multiples"], "unlocks": ["Computer graphics: rotating, shearing and projecting 3D worlds onto a screen", "Engineering: solving systems of many simultaneous equations at once", "Data science: principal directions and page-ranking eigenvectors"]}, "intuitionToFormula": {"concreteAction": "In the figure, set the first column to (2, 1) and the second column to (1, 2), and look at the amber parallelogram.", "ahaInvariant": "The 1 × 1 unit square stretches into an amber parallelogram whose area is ad − bc = 2(2) − 1(1) = 3. And any arrow along the diagonal (1, 1) is stretched by 3 without turning at all.", "formulaDisplay": "[[a, b], [c, d]] [x, y]ᵀ = x(a, c) + y(b, d),   det(A) = ad − bc,   Av = λv", "termMappings": [{"symbol": "Column 1 (a, c)", "visualPart": "The red arrow where (1, 0) lands", "colorRole": "red", "meaning": "The new step for every 1 unit across"}, {"symbol": "Column 2 (b, d)", "visualPart": "The blue arrow where (0, 1) lands", "colorRole": "blue", "meaning": "The new step for every 1 unit up"}, {"symbol": "det(A) = ad − bc", "visualPart": "The amber parallelogram between the red and blue arrows", "colorRole": "amber", "meaning": "How many times bigger every area becomes"}, {"symbol": "Av = λv", "visualPart": "The green directions that stretch by λ without turning", "colorRole": "green", "meaning": "Eigenvectors and their stretch factors (eigenvalues)"}], "atlasFigureRef": "maths/ch20-matrices-eigen/index.html"}, "sections": [{"id": "ch20-s1", "heading": "20.1 Two arrows that move the whole grid", "excerpt": "It must land at 2 lots of (3, 2) plus 1 lot of (1, 4), which is (6, 4) + (1, 4) = (7, 8). Knowing where the two unit arrows land tells you where every point on the plane lands.", "teaches": ["basis-vectors", "linear-transformation", "matrix"], "steps": [{"id": "ch20-s1-question", "kind": "question", "text": "Every point (x, y) is x steps of (1, 0) plus y steps of (0, 1). If a grid move sends (1, 0) to (3, 2) and (0, 1) to (1, 4), where must the point (2, 1) land?"}, {"id": "ch20-s1-idea", "kind": "idea", "text": "It must land at 2 lots of (3, 2) plus 1 lot of (1, 4), which is (6, 4) + (1, 4) = (7, 8). Knowing where the two unit arrows land tells you where every point on the plane lands."}, {"id": "ch20-s1-picture", "kind": "picture", "text": "Draw the red unit arrow (1, 0) and the blue unit arrow (0, 1). Watch them land at (3, 2) and (1, 4), carrying the whole grid with them."}, {"id": "ch20-s1-reason", "kind": "reason", "text": "Why do those two arrows control the whole grid? When grid lines stay straight, parallel and evenly spaced and (0, 0) stays put, 2 steps across and 1 step up must become 2 red arrows plus 1 blue arrow."}, {"id": "ch20-s1-name", "kind": "name", "text": "The unit step across î = (1, 0) and unit step up ĵ = (0, 1) are the basis vectors. A move of the plane that keeps grid lines straight, parallel and evenly spaced with the origin fixed is a linear transformation. Writing the landed red arrow (a, c) and blue arrow (b, d) as two columns makes a 2×2 matrix, [[a, b], [c, d]]."}, {"id": "ch20-s1-example", "kind": "example", "text": "The matrix [[2, 0], [0, 3]] has first column (2, 0) and second column (0, 3). It stretches every x-coordinate by 2 and every y-coordinate by 3, sending (4, 5) to (8, 15)."}, {"id": "ch20-s1-mistake", "kind": "mistake", "text": "The tempting slip is to read the rows of [[3, 1], [2, 4]] as the two landed arrows. Read down the columns: column 1 is (3, 2) where î lands, and column 2 is (1, 4) where ĵ lands."}, {"id": "ch20-s1-turn", "kind": "turn", "text": "A linear transformation sends î = (1, 0) to (4, 1) and ĵ = (0, 1) to (2, 3). Where does it send the vector (1, 2)?", "answer": "(8, 7)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["8", "7"]}]}], "accepts": ["(8, 7)", "8, 7"], "rejects": ["(6, 4)", "(9, 5)", "(7, 8)"], "mistakes": []}}, {"id": "ch20-s1-sayBack", "kind": "sayBack", "text": "A 2×2 matrix records where the basis vectors î and ĵ land in its two columns, sending (x, y) to x × (column 1) + y × (column 2)."}]}, {"id": "ch20-s2", "heading": "20.2 Doing one transformation after another", "excerpt": "No. Follow the basis vector î = (1, 0): reflecting in the x-axis keeps it at (1, 0), and rotating 90° sends it to (0, 1). In the reverse order, rotating 90° sends (1, 0) to (0, 1), and reflecting in the x-axis flips that to (0, −1).", "teaches": ["matrix-multiplication"], "steps": [{"id": "ch20-s2-question", "kind": "question", "text": "First reflect a shape across the x-axis, then rotate it 90° anticlockwise. Do you get the same result if you rotate first and reflect second?"}, {"id": "ch20-s2-idea", "kind": "idea", "text": "No. Follow the basis vector î = (1, 0): reflecting in the x-axis keeps it at (1, 0), and rotating 90° sends it to (0, 1). In the reverse order, rotating 90° sends (1, 0) to (0, 1), and reflecting in the x-axis flips that to (0, −1)."}, {"id": "ch20-s2-picture", "kind": "picture", "text": "Hold a book flat on the desk: flip it left-to-right then turn it 90° clockwise; now start again, turn it 90° clockwise first, then flip it left-to-right. The cover ends up facing a different way."}, {"id": "ch20-s2-reason", "kind": "reason", "text": "How do we combine matrix B followed by matrix A into one matrix AB? Apply A to B's first column, then apply A to B's second column."}, {"id": "ch20-s2-name", "kind": "name", "text": "Combining two linear transformations by letting the left matrix act on each column of the right matrix is matrix multiplication. Each entry of AB is a row-by-column dot product, and usually AB ≠ BA."}, {"id": "ch20-s2-example", "kind": "example", "text": "For A = [[1, 2], [0, 1]] and B = [[2, 0], [1, 3]], A sends B's first column (2, 1) to (1×2 + 2×1, 0×2 + 1×1) = (4, 1), and B's second column (0, 3) to (1×0 + 2×3, 0×0 + 1×3) = (6, 3), so AB = [[4, 6], [1, 3]]."}, {"id": "ch20-s2-mistake", "kind": "mistake", "text": "The tempting slip is to multiply the four numbers in matching positions, top-left by top-left. Instead, multiply each row of the left matrix by each column of the right matrix."}, {"id": "ch20-s2-turn", "kind": "turn", "text": "Multiply the matrix [[2, 1], [0, 3]] by the column vector (4, 2).", "answer": "(10, 6)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["10", "6"]}]}], "accepts": ["(10, 6)", "10, 6"], "rejects": ["(8, 6)", "(6, 10)", "(8, 2)"], "mistakes": []}}, {"id": "ch20-s2-sayBack", "kind": "sayBack", "text": "Matrix multiplication applies the left matrix to each column of the right matrix, and the order of multiplication matters."}]}, {"id": "ch20-s3", "heading": "20.3 Why the area of the parallelogram is ad − bc", "excerpt": "ad − bc. Fit the parallelogram inside an (a + b) by (c + d) rectangle of area ac + ad + bc + bd. Subtract four corner triangles (area ac + bd) and two b × c rectangles (area 2bc) to leave ad − bc.", "teaches": ["determinant", "singular-matrix"], "steps": [{"id": "ch20-s3-question", "kind": "question", "text": "The matrix [[a, b], [c, d]] turns the 1 × 1 unit square into a tilted parallelogram spanned by (a, c) and (b, d). What is the area of that parallelogram?"}, {"id": "ch20-s3-idea", "kind": "idea", "text": "ad − bc. Fit the parallelogram inside an (a + b) by (c + d) rectangle of area ac + ad + bc + bd. Subtract four corner triangles (area ac + bd) and two b × c rectangles (area 2bc) to leave ad − bc."}, {"id": "ch20-s3-picture", "kind": "picture", "text": "In the figure, set a = 2, b = 1 and d = 2. The amber parallelogram between (2, 1) and (1, 2) has area 2(2) − 1(1) = 3."}, {"id": "ch20-s3-reason", "kind": "reason", "text": "What happens when the two columns point along the same line, such as (2, 1) and (4, 2)? The parallelogram squashes flat onto a single line with zero width, and ad − bc = 2(2) − 4(1) = 0."}, {"id": "ch20-s3-name", "kind": "name", "text": "The signed area scale factor of a 2×2 matrix [[a, b], [c, d]] is its determinant, written det(A) = ad − bc. A matrix whose determinant is 0 squashes 2D space onto a line (or a point) and cannot be undone; it is called a singular matrix."}, {"id": "ch20-s3-example", "kind": "example", "text": "For A = [[3, 1], [2, 4]], det(A) = (3 × 4) − (1 × 2) = 12 − 2 = 10. Because every unit square is multiplied in area by 10, a triangle of area 5 cm² is transformed to area 10 × 5 = 50 cm²."}, {"id": "ch20-s3-mistake", "kind": "mistake", "text": "The tempting slip is to add the products ad + bc instead of subtracting ad − bc. Test the identity matrix [[1, 0], [0, 1]] or two equal columns [[1, 1], [1, 1]]: equal columns must collapse to area 1 − 1 = 0."}, {"id": "ch20-s3-turn", "kind": "turn", "text": "Calculate the determinant det(A) = ad − bc of the matrix A = [[4, 1], [2, 3]].", "answer": "10", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "10"}]}], "accepts": ["10", "det(A) = 10"], "rejects": ["14", "5", "-10"], "mistakes": []}}, {"id": "ch20-s3-sayBack", "kind": "sayBack", "text": "The determinant det(A) = ad − bc tells you how many times bigger every area becomes; when det(A) = 0, the matrix is singular."}], "figure": true}, {"id": "ch20-s4", "heading": "20.4 Arrows that stretch without turning", "excerpt": "A sends (1, 1) to (2×1 + 1×1, 1×1 + 2×1) = (3, 3), which is 3 × (1, 1). It stays on the exact same 45° line and stretches to 3 times its length.", "teaches": ["eigenvector", "eigenvalue"], "steps": [{"id": "ch20-s4-question", "kind": "question", "text": "When the matrix A = [[2, 1], [1, 2]] stretches the plane, most vectors get knocked off their starting line. What happens to the diagonal vector v = (1, 1)?"}, {"id": "ch20-s4-idea", "kind": "idea", "text": "A sends (1, 1) to (2×1 + 1×1, 1×1 + 2×1) = (3, 3), which is 3 × (1, 1). It stays on the exact same 45° line and stretches to 3 times its length."}, {"id": "ch20-s4-picture", "kind": "picture", "text": "Draw the two diagonal lines y = x through (1, 1) and y = −x through (1, −1). Under [[2, 1], [1, 2]], the first diagonal stretches by 3 and the second diagonal stays at 1 × (1, −1)."}, {"id": "ch20-s4-reason", "kind": "reason", "text": "Why do we care about the directions that do not turn? Along those two axes, the matrix stretches by 3 in one direction and 1 in the other, scaling area by 3 × 1 = 3."}, {"id": "ch20-s4-name", "kind": "name", "text": "A non-zero vector v that a matrix A stretches without turning, so that Av = λv, is an eigenvector of A. The scale factor λ (the Greek letter lambda) is its eigenvalue."}, {"id": "ch20-s4-example", "kind": "example", "text": "For A = [[2, 1], [1, 2]] and v = (1, −1), multiplying gives Av = (2 − 1, 1 − 2) = (1, −1) = 1 × v. So (1, −1) is an eigenvector with eigenvalue λ = 1."}, {"id": "ch20-s4-mistake", "kind": "mistake", "text": "The tempting slip is to call the zero vector (0, 0) an eigenvector because A(0, 0) = (0, 0). The zero vector has no direction to keep; an eigenvector must be a non-zero vector."}, {"id": "ch20-s4-turn", "kind": "turn", "text": "The matrix A = [[4, 2], [1, 3]] sends the eigenvector v = (2, 1) to Av = (10, 5). Since (10, 5) = λ(2, 1), what is the eigenvalue λ?", "answer": "5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5"}]}], "accepts": ["5", "λ = 5"], "rejects": ["2", "10", "15"], "mistakes": []}}, {"id": "ch20-s4-sayBack", "kind": "sayBack", "text": "An eigenvector v stays on its own line when multiplied by A (Av = λv), and the stretch factor λ is its eigenvalue."}]}], "callouts": [{"id": "ch20-c-predict", "kind": "predict", "title": "Predict first", "body": "In the figure,
