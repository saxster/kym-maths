:root {

}

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--card); }
body {
  margin: 0;
  padding: 4px 18px 40px;

  flex-direction: column;

}

header.book-header > div:first-child,
section.card.native-owned { display: none; }

}

const CHAPTERS = [{"id": "ch00", "number": 0, "volumeNumber": 1, "volumeTitle": "Volume I · The Grammar of Truth, Sets & Number Architecture", "title": "Sets and logic", "subtitle": "Beyond the school book · How to sort things into groups, count overlaps without counting twice, and test an if-then claim", "hookSummary": "How do you count a crowd without counting anyone twice?", "beyondSchoolBook": true, "skillCard": {"skill": "Sorting, counting overlaps and testing claims", "sheCan": {"prompt": "With no calculator: in a class of 30, 17 play cricket, 12 play football and 5 play both. How many play neither? Then find a number that breaks the claim \"if a number is odd, it is a multiple of 3\".", "answer": "17 + 12 − 5 = 24 play a sport, so 6 play neither. 5 breaks the claim, because it is odd and not a multiple of 3. So do 1, 7, 11 and 13."}, "whyItMatters": "Working out chances means counting outcomes in groups that overlap, so it needs this way of counting. In geometry, each step of a reason is an if-then step. One counterexample stops you from trusting a false rule.", "standsOn": ["Multiples and times tables", "Adding and taking away up to 100", "Powers of 2, like 2³ = 8"], "unlocks": ["Chapter 8: angle facts, each one reasoned from if-then steps", "Chapter 15: counting outcomes, often drawn as Venn diagrams", "Chapter 16: Bayes, which counts people in overlapping groups"]}, "intuitionToFormula": {"concreteAction": "Move the three sliders: how many play cricket, how many play football, and how many play both. Watch the four parts of the class change. They always add up to 30.", "ahaInvariant": "The students who play both are inside the cricket count and inside the football count. Add the two counts and they are counted twice. Take the overlap away once and everyone counts once.", "formulaDisplay": "n(A ∪ B) = n(A) + n(B) − n(A ∩ B),   (A ∪ B)′ = A′ ∩ B′", "termMappings": [{"symbol": "n(A) + n(B)", "visualPart": "The red circle and the blue circle", "colorRole": "red", "meaning": "Adds the middle twice, once with each circle"}, {"symbol": "− n(A ∩ B)", "visualPart": "The amber middle", "colorRole": "amber", "meaning": "Takes the middle away once, so it counts once"}, {"symbol": "(A ∪ B)′", "visualPart": "The green box outside both circles", "colorRole": "green", "meaning": "Everyone who is in neither group"}], "atlasFigureRef": "maths/ch00-sets-logic/index.html"}, "sections": [{"id": "ch00-s1", "heading": "0.1 What makes a set", "excerpt": "Each student checks one rule: am I in the cricket team? The answer is yes or no, never maybe. A rule like that sorts the whole class into in and out. The days of the week that start with T work the same way. Tuesday and Thursday are in, and nothing else is.", "teaches": ["set", "member", "universal-set"], "steps": [{"id": "ch00-s1-question", "kind": "question", "text": "Your class has 30 students. The teacher asks everyone in the cricket team to stand up. How does each student know whether to stand?"}, {"id": "ch00-s1-idea", "kind": "idea", "text": "Each student checks one rule: am I in the cricket team? The answer is yes or no, never maybe. A rule like that sorts the whole class into in and out. The days of the week that start with T work the same way. Tuesday and Thursday are in, and nothing else is."}, {"id": "ch00-s1-picture", "kind": "picture", "text": "On paper, write the group inside curly brackets: {Tuesday, Thursday}. Order does not matter, so {Thursday, Tuesday} is the same group. Writing a day twice adds nothing. Now draw a box around everything you could have chosen from, all seven days."}, {"id": "ch00-s1-reason", "kind": "reason", "text": "Why must the rule be so strict? Try the rule \"tall students\". Is a student of 150 cm tall? People will disagree, so nobody can count the group. A clear yes-or-no rule is what makes counting possible."}, {"id": "ch00-s1-name", "kind": "name", "text": "A collection with a clear rule for what is in it is called a set. Each thing in it is a member, also called an element. The sign ∈ means \"is a member of\", so Tuesday ∈ {Tuesday, Thursday}. The box of everything you could choose from is the universal set, written ξ."}, {"id": "ch00-s1-example", "kind": "example", "text": "Let ξ be the whole numbers from 1 to 10. Find the even numbers in ξ. Test each number against the rule: is it even? 2, 4, 6, 8 and 10 pass. So the set is {2, 4, 6, 8, 10}, and it has 5 members."}, {"id": "ch00-s1-mistake", "kind": "mistake", "text": "It is tempting to count a repeated thing twice. The letters of the word MUMBAI make the set {M, U, B, A, I}. That is 5 members, not 6. M appears twice in the word, but once in the set."}, {"id": "ch00-s1-turn", "kind": "turn", "text": "ξ is the whole numbers from 1 to 20. How many members does the set of multiples of 3 in ξ have?", "answer": "6", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "6"}]}], "accepts": ["6", "= 6"], "rejects": ["7", "3", "20"], "mistakes": []}}, {"id": "ch00-s1-sayBack", "kind": "sayBack", "text": "A set is a collection with a yes-or-no rule, and each thing in it counts once."}]}, {"id": "ch00-s2", "heading": "0.2 Where two sets meet", "excerpt": "Each name goes in one place on the page. Cricket only goes in one circle, and football only in the other. A student who plays both has to be inside both circles at once. So the circles must overlap, and those students go in the shared middle.", "teaches": ["venn-diagram", "intersection", "union"], "steps": [{"id": "ch00-s2-question", "kind": "question", "text": "In a class of 30, some students play cricket and some play football. A few play both. You draw one circle for each sport. Where do the students who play both go?"}, {"id": "ch00-s2-idea", "kind": "idea", "text": "Each name goes in one place on the page. Cricket only goes in one circle, and football only in the other. A student who plays both has to be inside both circles at once. So the circles must overlap, and those students go in the shared middle."}, {"id": "ch00-s2-picture", "kind": "picture", "text": "In the figure, move the sliders to 18 in A, 15 in B and 7 in both. Circle A is cricket and circle B is football. The middle holds the 7 who play both. The green box around everything holds all 30 students."}, {"id": "ch00-s2-reason", "kind": "reason", "text": "Why overlap the circles rather than draw them apart? A student who plays both needs a spot that is inside both circles. Two circles drawn apart have no such spot. Overlapping them makes one."}, {"id": "ch00-s2-name", "kind": "name", "text": "A drawing of sets as circles inside a box is a Venn diagram. The middle part, in A and in B, is the intersection, written A ∩ B. Everything in A or B or both is the union, written A ∪ B. To tell them apart, ∪ looks like the letter U, for union. ∩ is the same shape upside down."}, {"id": "ch00-s2-example", "kind": "example", "text": "Let A = {1, 2, 3, 4} and B = {3, 4, 5}. A ∩ B holds what is in both lists, so A ∩ B = {3, 4}. A ∪ B holds everything in either list, once each, so A ∪ B = {1, 2, 3, 4, 5}. Check: 3 and 4 appear once in the union, not twice."}, {"id": "ch00-s2-mistake", "kind": "mistake", "text": "It is tempting to read \"A or B\" as one of them but not both. In sets, \"or\" always includes the middle. A student who plays cricket and football is in A ∪ B. Leave the middle out and your count comes up short."}, {"id": "ch00-s2-turn", "kind": "turn", "text": "A = {2, 4, 6, 8} and B = {4, 8, 12}. How many members does A ∪ B have?", "answer": "5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5"}]}], "accepts": ["5", "= 5"], "rejects": ["7", "2", "3"], "mistakes": []}}, {"id": "ch00-s2-sayBack", "kind": "sayBack", "text": "The intersection is what two sets share, and the union is everything in either one, counted once."}], "figure": true}, {"id": "ch00-s3", "heading": "0.3 Counting without counting twice", "excerpt": "Nothing went wrong. The 7 students who play both were counted with the cricket players, and again with the football players. Count them once and 18 + 15 − 7 = 26 play at least one sport. That leaves 30 − 26 = 4 who play neither.", "teaches": ["complement"], "steps": [{"id": "ch00-s3-question", "kind": "question", "text": "A survey of 30 students finds that 18 play cricket and 15 play football. But 18 + 15 = 33, which is more than the whole class. Did the survey go wrong?"}, {"id": "ch00-s3-idea", "kind": "idea", "text": "Nothing went wrong. The 7 students who play both were counted with the cricket players, and again with the football players. Count them once and 18 + 15 − 7 = 26 play at least one sport. That leaves 30 − 26 = 4 who play neither."}, {"id": "ch00-s3-picture", "kind": "picture", "text": "In the figure, keep 18 in A, 15 in B and 7 in both. Read the three parts inside the circles: 11 play cricket only, 7 play both and 8 play football only. 11 + 7 + 8 = 26. The 4 in the green box outside the circles make the total 30."}, {"id": "ch00-s3-reason", "kind": "reason", "text": "Why take the overlap away exactly once? Adding the two circles' counts adds the middle twice, once with each circle. Every other part is added once. Taking the middle away once leaves every student counted exactly once."}, {"id": "ch00-s3-name", "kind": "name", "text": "Write n(A) for the number of members of A. The rule is n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Everything in the universal set that is not in A is the complement of A, written A′. The 4 students outside both circles make up (A ∪ B)′."}, {"id": "ch00-s3-example", "kind": "example", "text": "In a group of 40 people, 25 like tea, 22 like coffee and 10 like both. How many like neither? First the union: 25 + 22 − 10 = 37 like at least one. Then the complement: 40 − 37 = 3 like neither."}, {"id": "ch00-s3-mistake", "kind": "mistake", "text": "The tempting slip is to forget the people outside the circles. In the tea survey, 37 is not the whole group. The 3 who like neither still belong to the 40. Before you finish, check that the four parts add up to the total: 15 + 10 + 12 + 3 = 40."}, {"id": "ch00-s3-turn", "kind": "turn", "text": "In a class of 32, 20 take art, 15 take music and 6 take both. How many take neither?", "answer": "3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "3"}]}], "accepts": ["3", "= 3"], "rejects": ["29", "-3", "9"], "mistakes": []}}, {"id": "ch00-s3-sayBack", "kind": "sayBack", "text": "Add the two circles, take away the overlap once, and whatever is left of the total sits outside both."}], "figure": true}, {"id": "ch00-s4", "heading": "0.4 Sets inside sets", "excerpt": "List them by size. There is 1 plain dosa with nothing. There are 3 with one filling. There are 3 with two fillings: potato and cheese, potato and onion, cheese and onion. There is 1 with all three. That is 1 + 3 + 3 + 1 = 8 dosas.", "teaches": ["subset", "power-set"], "steps": [{"id": "ch00-s4-question", "kind": "question", "text": "A dosa stall offers three fillings: potato, cheese and onion. You may choose any mix of them, or none at all. How many different dosas can you order?"}, {"id": "ch00-s4-idea", "kind": "idea", "text": "List them by size. There is 1 plain dosa with nothing. There are 3 with one filling. There are 3 with two fillings: potato and cheese, potato and onion, cheese and onion. There is 1 with all three. That is 1 + 3 + 3 + 1 = 8 dosas."}, {"id": "ch00-s4-picture", "kind": "picture", "text": "On paper, go through the fillings one at a time. Potato is in or out: 2 choices. Cheese is in or out, which doubles it to 4. Onion is in or out, which doubles it to 8."}, {"id": "ch00-s4-reason", "kind": "reason", "text": "Why does each new filling double the count? Every order you had before now comes in two versions. One leaves the new filling out and one puts it in. No order is lost and none is counted twice. So 3 fillings give 2 × 2 × 2 = 8 orders."}, {"id": "ch00-s4-name", "kind": "name", "text": "Each order is a subset of {potato, cheese, onion}: a set whose members all come from the bigger set. We write {potato, cheese} ⊆ {potato, cheese, onion}. The plain dosa is the empty set, { }, which is a subset of every set. The set of all the subsets is the power set. A set with 3 members has 2³ = 8 subsets."}, {"id": "ch00-s4-example", "kind": "example", "text": "List the subsets of {red, blue}. Each colour is in or out. Both out gives { }. One in gives {red} and {blue}. Both in gives {red, blue}. That is 4 subsets, and 2² = 4, so the power set has 4 members."}, {"id": "ch00-s4-mistake", "kind": "mistake", "text": "Two subsets are easy to forget: the empty set and the whole set itself. A list for {red, blue} that stops at {red} and {blue} has only 2 of the 4. Check your count against 2 × 2 = 4."}, {"id": "ch00-s4-turn", "kind": "turn", "text": "A set has 4 members. How many subsets does it have?", "answer": "16", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "16"}]}], "accepts": ["16", "= 16"], "rejects": ["8", "4", "15"], "mistakes": []}}, {"id": "ch00-s4-sayBack", "kind": "sayBack", "text": "A subset is any choice of members from a set, and each new member doubles the number of choices."}]}, {"id": "ch00-s5", "heading": "0.5 If this, then that", "excerpt": "Test Dev's claim. 3 is odd, and it is in the 3 times table. 9 works too. Then try 5. It is odd, but it is not in the 3 times table. That one number sinks the claim. Riya's claim survives every number you try: 10, 20, 70, 1,000.", "teaches": ["if-then-statement", "counterexample"], "steps": [{"id": "ch00-s5-question", "kind": "question", "text": "Riya says: if a number ends in 0, it is in the 5 times table. Dev says: if a number is odd, it is in the 3 times table. Who is right?"}, {"id": "ch00-s5-idea", "kind": "idea", "text": "Test Dev's claim. 3 is odd, and it is in the 3 times table. 9 works too. Then try 5. It is odd, but it is not in the 3 times table. That one number sinks the claim. Riya's claim survives every number you try: 10, 20, 70, 1,000."}, {"id": "ch00-s5-picture", "kind": "picture", "text": "On paper, draw a circle for the numbers that end in 0. Draw the 5 times table as a bigger circle around it. The small circle sits completely inside the big one. Riya's claim says exactly that: no number ending in 0 is outside the big circle."}, {"id": "ch00-s5-reason", "kind": "reason", "text": "Why can a hundred numbers that fit never prove Riya right? A claim about every number is a promise with no exceptions. Numbers that fit cannot rule out a later one that does not. One exception breaks the promise at once. To prove Riya right you need a reason. A number ending in 0 is 10 × something, and 10 = 2 × 5."}, {"id": "ch00-s5-name", "kind": "name", "text": "A claim of the form \"if this, then that\" is an if-then statement, written p ⇒ q. The arrow is read \"implies\". In Dev's claim, p is \"the number is odd\" and q is \"it is in the 3 times table\". A case where p is true and q is false is a counterexample. 5 is a counterexample to Dev's claim."}, {"id": "ch00-s5-example", "kind": "example", "text": "Is this true: if a number is a multiple of 4, then it is even? A counterexample would be a multiple of 4 that is odd. But 4 × anything = 2 × (2 × anything), and 2 × anything is even. No counterexample can exist, so the statement is true."}, {"id": "ch00-s5-mistake", "kind": "mistake", "text": "It is tempting to flip the arrow. If it is raining, then the road is wet. That does not mean every wet road had rain. A burst pipe wets the road too. Turning p ⇒ q round gives a new claim, and it can be false while p ⇒ q is true."}, {"id": "ch00-s5-turn", "kind": "turn", "text": "Find a counterexample to this claim: if a number is a multiple of 3, then it is odd. Give the smallest one above 0.", "answer": "6", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "6"}]}], "accepts": ["6", "= 6"], "rejects": ["3", "9", "2"], "mistakes": []}}, {"id": "ch00-s5-sayBack", "kind": "sayBack", "text": "An if-then statement is a promise, and one counterexample is enough to break it."}]}, {"id": "ch00-s6", "heading": "0.6 The same promise, read backwards", "excerpt": "That person is not swimming here. If they were swimming, they would have a pass. So no pass means no swimming. The guard knows this without looking at the pool.", "teaches": ["contrapositive"], "steps": [{"id": "ch00-s6-question", "kind": "question", "text": "A sign at a swimming pool in Mumbai says: if you swim here, you have a pass. A guard at the gate meets someone with no pass. What can the guard be sure of?"}, {"id": "ch00-s6-idea", "kind": "idea", "text": "That person is not swimming here. If they were swimming, they would have a pass. So no pass means no swimming. The guard knows this without looking at the pool."}, {"id": "ch00-s6-picture", "kind": "picture", "text": "On paper, draw the swimmers as a small circle inside a bigger circle of pass holders. Put a dot outside the pass circle for the person at the gate. The dot is outside the swimmers' circle too, because that circle sits inside the pass circle."}, {"id": "ch00-s6-reason", "kind": "reason", "text": "Why do the two sentences say the same thing? They describe the same picture: swimmers inside pass holders. \"If swimming, then pass\" reads it from the inside out. \"If no pass, then not swimming\" reads it from the outside in. One cannot be true without the other."}, {"id": "ch00-s6-name", "kind": "name", "text": "From p ⇒ q you can make \"if not q, then not p\". This is called the contrapositive. It is true whenever p ⇒ q is true, and false whenever p ⇒ q is false."}, {"id": "ch00-s6-example", "kind": "example", "text": "Write the contrapositive of: if a number is a multiple of 10, then it ends in 0. Swap the two parts and put \"not\" in front of each. If a number does not end in 0, then it is not a multiple of 10. Test it on 25: it does not end in 0, and 25 is not in the 10 times table."}, {"id": "ch00-s6-mistake", "kind": "mistake", "text": "The tempting slip is to add the two \"not\"s and forget to swap. \"If you do not swim here, you have no pass\" is a different claim. It is false, because many pass holders stay dry. Both parts must swap, and both must get a \"not\"."}, {"id": "ch00-s6-turn", "kind": "turn", "text": "A rule says: if it rains, the match is cancelled. Today the match was not cancelled. Did it rain? Answer yes or no.", "answer": "No", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "words", "groups": [["no", "not", "didn't", "isn't"]], "forbid": ["yes", "idea", "maybe", "know", "sure"]}]}], "accepts": ["no", "No", "it did not rain"], "rejects": ["yes", "it rained", "maybe"], "mistakes": []}}, {"id": "ch00-s6-sayBack", "kind": "sayBack", "text": "Swap the two parts and say not to both, and you get the same promise read from the outside in."}]}, {"id": "ch00-s7", "heading": "0.7 Not this and not that", "excerpt": "To be outside the union, a student must miss cricket and also miss football. Missing only one sport is not enough. So \"not cricket-or-football\" and \"not cricket and not football\" pick out the same 4 students.", "teaches": ["truth-table", "de-morgan"], "steps": [{"id": "ch00-s7-question", "kind": "question", "text": "The 4 students outside both circles play neither sport. You could say they are not in \"cricket or football\". You could also say they are not in cricket and not in football. Do the two descriptions always pick the same students?"}, {"id": "ch00-s7-idea", "kind": "idea", "text": "To be outside the union, a student must miss cricket and also miss football. Missing only one sport is not enough. So \"not cricket-or-football\" and \"not cricket and not football\" pick out the same 4 students."}, {"id": "ch00-s7-picture", "kind": "picture", "text": "In the figure, look at the green box outside both circles. On paper, shade everything outside A, then everything outside B. The part you shaded twice is exactly the part outside both circles."}, {"id": "ch00-s7-reason", "kind": "reason", "text": "Why must this work for every pair of sets, not only this class? Each member is in A or not, and in B or not. That makes only four kinds of member. Check the two descriptions on all four kinds and they agree every time. Four kinds cover every case."}, {"id": "ch00-s7-name", "kind": "name", "text": "A table that checks a claim on every mix of true and false is a truth table. The rule you found is one of De Morgan's laws: (A ∪ B)′ = A′ ∩ B′. The other law says (A ∩ B)′ = A′ ∪ B′. In both, the dash moves inside and ∪ and ∩ swap."}, {"id": "ch00-s7-example", "kind": "example", "text": "Check the second law with ξ = {1, 2, 3, 4}, A = {1, 2} and B = {2, 3}. A ∩ B = {2}, so (A ∩ B)′ = {1, 3, 4}. A′ = {3, 4} and B′ = {1, 4}, so A′ ∪ B′ = {1, 3, 4}. The two sides match."}, {"id": "ch00-s7-mistake", "kind": "mistake", "text": "It is tempting to move the dash inside and keep the sign, as if (A ∪ B)′ were A′ ∪ B′. Test it on the class of 30 with 7 in both. A′ ∪ B′ holds everyone who misses at least one sport. That is 30 − 7 = 23 students, not the 4 who play neither."}, {"id": "ch00-s7-turn", "kind": "turn", "text": "ξ = {1, 2, 3, 4, 5, 6}, A = {1, 2, 3} and B = {3, 4}. How many members does A′ ∩ B′ have?", "answer": "2", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2"}]}], "accepts": ["2", "= 2"], "rejects": ["5", "4", "3"], "mistakes": []}}, {"id": "ch00-s7-sayBack", "kind": "sayBack", "text": "Outside A or B means outside both, so a dash over a bracket turns ∪ into ∩."}], "figure": true}], "callouts": [{"id": "ch00-c-predict", "kind": "predict", "title": "Predict first", "body": "18 students play cricket and 15 play football, in a class of 30. Could it be that nobody plays both? Write your answer and one reason before you check it with the figure."}, {"id": "ch00-c-aha", "kind": "check", "title": "Explain it", "body": "A friend adds 18 cricket players and 15 football players and says 33 students play a sport. Explain in your own words what went wrong."}, {"id": "ch00-c-trap", "kind": "careful", "title": "Watch out for the middle", "body": "When you count everyone who plays cricket or football, the students who play both belong to the count. Count them once, not twice and not zero times."}], "keyTerms": ["Set", "Member", "Universal set", "Venn diagram", "Intersection", "Union", "Complement", "Subset", "Power set", "If-then statement", "Counterexample", "Contrapositive", "Truth table", "De Morgan's laws"], "widgets": ["w_venn_inclusion_exclusion", "w_truth_table_logic_gates", "w_quantifier_counterexample"], "debate": {"id": "debate-ch00-sets", "chapterNumber": 0, "oupUnitNumber": 1, "title": "Who plays both?", "contextPrompt": "A class in Mumbai has 40 students. 24 play cricket, 20 play football and 4 play neither. Aarav and Zoya disagree about how many play both.", "speakerAName": "Aarav", "speakerAClaim": "24 + 20 = 44. The class has 40, so 44 − 40 = 4 must play both.", "speakerBName": "Zoya", "speakerBClaim": "The 4 who play neither are outside both circles. So 40 − 4 = 36 play a sport, and 44 − 36 = 8 play both.", "choices": [{"id": "ch00-a", "speakerLabel": "Aarav is right (4 students)", "reasoningStatement": "Take the class size away from the two counts added together, and you get the overlap.", "isCorrect": false, "socraticRebuttal": "Try it with 4 in both. Then 20 play only cricket and 16 play only football. 20 + 4 + 16 = 40, which leaves nobody outside the circles. But 4 students play neither."}, {"id": "ch00-b", "speakerLabel": "Zoya is right (8 students)", "reasoningStatement": "First take away the 4 who play neither. The overlap is how far 44 goes past the 36 who are left.", "isCorrect": true, "socraticRebuttal": "Yes. 16 play only cricket, 8 play both and 12 play only football. 16 + 8 + 12 + 4 = 40."}, {"id": "ch00-c", "speakerLabel": "Neither. It is 24 − 20 = 4.", "reasoningStatement": "The overlap is the difference between the two counts.", "isCorrect": false, "socraticRebuttal": "24 − 20 compares the sizes of the two circles. It says nothing about how much they overlap."}], "invariantTakeaway": "First find how many are inside the circles. The overlap is how far the two counts add up past that."}}, {"id": "ch01", "number": 1, "volumeNumber": 1, "volumeTitle": "Volume I · The Grammar of Truth, Sets & Number Architecture", "title": "Negative numbers, primes and powers", "subtitle": "School book chapter 1 · Why minus times minus is plus, how every number is built from primes, and the rules for powers", "hookSummary": "Why does a minus times a minus make a plus?", "beyondSchoolBook": false, "skillCard": {"skill": "Signs, primes and powers", "sheCan": {"prompt": "With no calculator: work out (−2)³ × (−3). Then find the HCF and the LCM of 12 and 20.", "answer": "(−2)³ × (−3) = 24. The HCF is 4 and the LCM is 60."}, "whyItMatters": "Simplifying a fraction is finding an HCF. Adding fractions is finding an LCM. Powers are how growth, interest and computer memory are counted.", "standsOn": ["Times tables to 12 × 12", "Dividing with remainders", "The number line below zero"], "unlocks": ["Chapter 2: fractions and decimals that repeat", "Chapter 4: taking out a common factor in algebra", "Chapter 12: the longest side of a right-angled triangle, which needs square roots"]}, "intuitionToFormula": {"concreteAction": "Stand an arrow at 0 on the number line, pointing at the positive numbers. Multiply by −1 and the arrow turns to face the other way. Set the turns to 0, 1 and 2 and watch where it points.", "ahaInvariant": "The length of the arrow never changes. Only its direction does. Two turns put it back where it started, so (−1) × (−1) = +1.", "formulaDisplay": "(−1) × (−1) = +1,   HCF × LCM = a × b", "termMappings": [{"symbol": "(−1) × (−1)", "visualPart": "The arrow, turned twice", "colorRole": "red", "meaning": "Two about-turns leave it facing forward"}, {"symbol": "HCF", "visualPart": "The blue bar", "colorRole": "blue", "meaning": "The biggest number that divides into both a and b"}, {"symbol": "LCM", "visualPart": "The amber bar", "colorRole": "amber", "meaning": "The smallest number that both a and b divide into"}], "atlasFigureRef": "maths/ch01-number-primes/index.html"}, "sections": [{"id": "ch01-s1", "heading": "1.1 Minus times minus", "excerpt": "Losing a debt is a gain. Take away 3 debts of ₹50 and the shop is ₹150 better off. That is what (−3) × (−50) = +150 says: three lots of owing fifty, removed.", "teaches": [], "steps": [{"id": "ch01-s1-question", "kind": "question", "text": "A shop owes its supplier ₹50 on each of 3 bills. The supplier cancels all 3 bills. Is the shop better or worse off, and by how much?"}, {"id": "ch01-s1-idea", "kind": "idea", "text": "Losing a debt is a gain. Take away 3 debts of ₹50 and the shop is ₹150 better off. That is what (−3) × (−50) = +150 says: three lots of owing fifty, removed."}, {"id": "ch01-s1-picture", "kind": "picture", "text": "Stand at 0 on a number line, facing the positive numbers. Multiplying by −1 means turn around. Turn around once and you face the negative numbers. Turn around twice and you face forward again. In the figure, set the turns to 0, 1 and 2 and watch the arrow."}, {"id": "ch01-s1-reason", "kind": "reason", "text": "Why must the answer be positive? Follow this pattern. 3 × (−2) = −6. 2 × (−2) = −4. 1 × (−2) = −2. 0 × (−2) = 0. Each answer is 2 more than the one before. Keep going, and the pattern forces (−1) × (−2) = +2 and (−2) × (−2) = +4. Any other answer would break the pattern."}, {"id": "ch01-s1-name", "kind": "name", "text": "Numbers with a direction, like +5 and −5, are called directed numbers. The rule has two parts. Same signs give a positive answer. Different signs give a negative answer. Dividing follows the same rule, because dividing undoes multiplying."}, {"id": "ch01-s1-example", "kind": "example", "text": "Work out (−4) × 6 ÷ (−3). First the size: 4 × 6 = 24, and 24 ÷ 3 = 8. Now the signs. There are two minus signs, which is two about-turns. You finish facing forward, so the answer is +8."}, {"id": "ch01-s1-mistake", "kind": "mistake", "text": "The rule is for multiplying and dividing only. −3 − 4 is not +7. It is −7, because you start at −3 and move 4 further left. The saying “two minuses make a plus” tempts you to use the rule where it does not belong. When you add or subtract, walk it on the number line."}, {"id": "ch01-s1-turn", "kind": "turn", "text": "Work out (−6) × (−3) ÷ (−9).", "answer": "−2", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "-2"}]}], "accepts": ["-2", "−2", "= -2"], "rejects": ["2", "18", "-18"], "mistakes": []}}, {"id": "ch01-s1-sayBack", "kind": "sayBack", "text": "Multiplying by a negative number is an about-turn, so two of them leave you facing forward."}], "figure": true}, {"id": "ch01-s2", "heading": "1.2 Every number has an ingredients list", "excerpt": "24 splits into equal rows of 2, 3, 4, 6, 8 or 12. 23 only works as one long row. Some numbers break into smaller pieces. Others refuse to break at all.", "teaches": ["factor", "prime-number", "prime-factors"], "steps": [{"id": "ch01-s2-question", "kind": "question", "text": "A class of 24 can line up in equal rows in many ways. A class of 23 cannot, however you try. What makes 23 so awkward?"}, {"id": "ch01-s2-idea", "kind": "idea", "text": "24 splits into equal rows of 2, 3, 4, 6, 8 or 12. 23 only works as one long row. Some numbers break into smaller pieces. Others refuse to break at all."}, {"id": "ch01-s2-picture", "kind": "picture", "text": "Break 60 into two pieces that multiply to make it: 6 × 10. Break those again. 6 is 2 × 3 and 10 is 2 × 5. Now nothing breaks any further. You are left with 2 × 2 × 3 × 5. Drawn on paper, this looks like a tree with 60 at the top."}, {"id": "ch01-s2-reason", "kind": "reason", "text": "Start a different way: 60 = 4 × 15. Then 4 is 2 × 2 and 15 is 3 × 5. You get 2 × 2 × 3 × 5 again. Whichever way you break a number, you finish with the same unbreakable pieces. They are the number's ingredients list, and every number has exactly one."}, {"id": "ch01-s2-name", "kind": "name", "text": "A number that divides exactly into another is called a factor. 6 and 10 are factors of 60. A number with exactly two factors, 1 and itself, is a prime number. The unbreakable pieces of 60 are its prime factors, and the drawing is a factor tree. 1 is not prime, because it has only one factor."}, {"id": "ch01-s2-example", "kind": "example", "text": "Write 84 as a product of prime factors. 84 = 2 × 42. 42 = 2 × 21. 21 = 3 × 7. Every piece is now prime. So 84 = 2 × 2 × 3 × 7. Check by multiplying back: 4 × 21 = 84."}, {"id": "ch01-s2-mistake", "kind": "mistake", "text": "It is tempting to stop too early. 84 = 4 × 21 is true, but 4 and 21 can both still break. Keep going until every piece is prime. A second trap is to think every odd number is prime. 9, 15 and 21 are odd, and none of them is prime."}, {"id": "ch01-s2-turn", "kind": "turn", "text": "Write 90 as a product of prime factors.", "answer": "2 × 3 × 3 × 5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "2*3*3*5"}, {"kind": "form", "value": "2*3*5*3"}, {"kind": "form", "value": "2*3^2*5"}, {"kind": "form", "value": "2*5*3*3"}, {"kind": "form", "value": "2*5*3^2"}, {"kind": "form", "value": "3*2*3*5"}, {"kind": "form", "value": "3*2*5*3"}, {"kind": "form", "value": "3*3*2*5"}, {"kind": "form", "value": "3*3*5*2"}, {"kind": "form", "value": "3*5*2*3"}, {"kind": "form", "value": "3*5*3*2"}, {"kind": "form", "value": "3^2*2*5"}, {"kind": "form", "value": "3^2*5*2"}, {"kind": "form", "value": "5*2*3*3"}, {"kind": "form", "value": "5*2*3^2"}, {"kind": "form", "value": "5*3*2*3"}, {"kind": "form", "value": "5*3*3*2"}, {"kind": "form", "value": "5*3^2*2"}]}], "accepts": ["2 × 3 × 3 × 5", "2 × 3² × 5", "5 × 3 × 3 × 2"], "rejects": ["9 × 10", "2 × 45", "2 × 3 × 15"], "mistakes": []}}, {"id": "ch01-s2-sayBack", "kind": "sayBack", "text": "Every whole number bigger than 1 is either prime or built from primes in exactly one way."}]}, {"id": "ch01-s3", "heading": "1.3 What two numbers share", "excerpt": "The number of bunches must divide exactly into 24 and into 36. 2 bunches work. So do 3, 4, 6 and 12. The biggest that works is 12, with 2 roses and 3 marigolds in each bunch.", "teaches": ["multiple", "hcf", "lcm"], "steps": [{"id": "ch01-s3-question", "kind": "question", "text": "A florist has 24 roses and 36 marigolds. She wants identical bunches with no flowers left over. What is the largest number of bunches she can make?"}, {"id": "ch01-s3-idea", "kind": "idea", "text": "The number of bunches must divide exactly into 24 and into 36. 2 bunches work. So do 3, 4, 6 and 12. The biggest that works is 12, with 2 roses and 3 marigolds in each bunch."}, {"id": "ch01-s3-picture", "kind": "picture", "text": "Use the ingredients lists. 24 = 2 × 2 × 2 × 3 and 36 = 2 × 2 × 3 × 3. Both lists contain two 2s and one 3. Those shared pieces multiply to 2 × 2 × 3 = 12. In the figure, set the two numbers to 24 and 36 and read the blue bar."}, {"id": "ch01-s3-reason", "kind": "reason", "text": "Why do the shared pieces give the biggest answer? A number divides into 24 only if all its pieces are in 24's list. To divide into both numbers, its pieces must be in both lists. Take every shared piece and you have the biggest such number."}, {"id": "ch01-s3-name", "kind": "name", "text": "The biggest number that divides into both is the highest common factor, or HCF. Now turn the question round. The numbers in a times table are called multiples. 24, 48 and 72 are multiples of 24. The smallest number in both times tables is the lowest common multiple, or LCM. For 24 and 36 it is 72, the amber bar."}, {"id": "ch01-s3-example", "kind": "example", "text": "Two buses leave the depot together. One leaves every 12 minutes and the other every 18. When do they next leave together? The multiples of 12 are 12, 24, 36. The multiples of 18 are 18, 36. They meet at 36 minutes, so the LCM of 12 and 18 is 36. With prime factors: 12 = 2 × 2 × 3 and 18 = 2 × 3 × 3. Take each prime the most times it appears in either list. That gives 2 × 2 × 3 × 3 = 36."}, {"id": "ch01-s3-mistake", "kind": "mistake", "text": "The tempting shortcut for the LCM is to multiply the two numbers. 12 × 18 = 216 is a common multiple, but it is not the lowest. Multiplying counts the shared pieces twice. In fact HCF × LCM always equals the two numbers multiplied together. Here 6 × 36 = 216 = 12 × 18."}, {"id": "ch01-s3-turn", "kind": "turn", "text": "Find the LCM of 8 and 12.", "answer": "24", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "24"}]}], "accepts": ["24", "= 24"], "rejects": ["96", "4", "48"], "mistakes": []}}, {"id": "ch01-s3-sayBack", "kind": "sayBack", "text": "The HCF is built from the prime pieces two numbers share, and the LCM from every piece either one needs."}], "figure": true}, {"id": "ch01-s4", "heading": "1.4 A shorthand for repeated multiplying", "excerpt": "Each round doubles the one before: 2, 4, 8, 16. Round 10 is 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2, which is 1,024 people. Writing ten 2s is slow and hard to check. We need a shorthand.", "teaches": ["power", "index-laws"], "steps": [{"id": "ch01-s4-question", "kind": "question", "text": "You forward a message to 2 friends. Each of them forwards it to 2 more, and so on. How many people receive it in the 10th round?"}, {"id": "ch01-s4-idea", "kind": "idea", "text": "Each round doubles the one before: 2, 4, 8, 16. Round 10 is 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2, which is 1,024 people. Writing ten 2s is slow and hard to check. We need a shorthand."}, {"id": "ch01-s4-picture", "kind": "picture", "text": "Write the count of 2s as a small raised number: 2¹⁰. Now look at 2³ × 2². Written out, that is (2 × 2 × 2) × (2 × 2). Count the 2s. There are five, so 2³ × 2² = 2⁵."}, {"id": "ch01-s4-reason", "kind": "reason", "text": "Multiplying joins two chains of 2s into one longer chain, so the counts add. Dividing cancels 2s from the chain, so the counts subtract. 2⁵ ÷ 2² removes two of the five 2s and leaves 2³."}, {"id": "ch01-s4-name", "kind": "name", "text": "2¹⁰ is called a power of 2. The 2 is the base and the small 10 is the index. The plural of index is indices. The counting shortcuts are the laws of indices. To multiply powers of the same base, add the indices. To divide, subtract them."}, {"id": "ch01-s4-example", "kind": "example", "text": "Simplify 3⁴ × 3² ÷ 3³. Multiplying adds: 4 + 2 = 6, giving 3⁶. Dividing subtracts: 6 − 3 = 3, giving 3³. And 3³ = 3 × 3 × 3 = 27. Now try 5² ÷ 5². Subtracting the indices gives 5⁰. But any number divided by itself is 1. So 5⁰ = 1."}, {"id": "ch01-s4-mistake", "kind": "mistake", "text": "There are two traps. First, 2³ is not 2 × 3. It is 2 × 2 × 2 = 8. Second, the laws need the same base. 2³ × 3² is two different chains, so work out each one: 8 × 9 = 72."}, {"id": "ch01-s4-turn", "kind": "turn", "text": "Write 7³ × 7⁵ as a single power of 7.", "answer": "7⁸", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "7^8"}]}], "accepts": ["7⁸", "7^8"], "rejects": ["7¹⁵", "49⁸", "7^15"], "mistakes": []}}, {"id": "ch01-s4-sayBack", "kind": "sayBack", "text": "A power counts how many times a number is multiplied by itself, so multiplying powers adds the counts."}]}, {"id": "ch01-s5", "heading": "1.5 The number no fraction can reach", "excerpt": "For 49, you need a number that multiplies by itself to give 49. That is 7. For 2, try 1.4. 1.4 × 1.4 = 1.96, which is a little too small. Try 1.5. 1.5 × 1.5 = 2.25, which is too big. The side is somewhere between.", "teaches": ["square-root", "irrational-number"], "steps": [{"id": "ch01-s5-question", "kind": "question", "text": "A square garden has an area of 49 square metres. How long is each side? Now make the area 2 square metres. How long is each side this time?"}, {"id": "ch01-s5-idea", "kind": "idea", "text": "For 49, you need a number that multiplies by itself to give 49. That is 7. For 2, try 1.4. 1.4 × 1.4 = 1.96, which is a little too small. Try 1.5. 1.5 × 1.5 = 2.25, which is too big. The side is somewhere between."}, {"id": "ch01-s5-picture", "kind": "picture", "text": "Zoom in. 1.41 × 1.41 = 1.9881. 1.42 × 1.42 = 2.0164. So the side is between 1.41 and 1.42. Each extra decimal place gets closer to 2. None of them ever lands on it exactly."}, {"id": "ch01-s5-reason", "kind": "reason", "text": "Could some fraction land on it exactly? Suppose one did, written in its lowest terms. Then top × top would equal 2 × bottom × bottom. That makes top × top even, so top is even. Write top as 2 × something, and the same line shows that bottom is even too. But a fraction in its lowest terms cannot have both parts even. So no fraction works. This argument is more than 2,000 years old."}, {"id": "ch01-s5-name", "kind": "name", "text": "The number that multiplies by itself to give 49 is the square root of 49, written √49 = 7. Numbers that can be written as fractions are called rational. Numbers that cannot, like √2, are called irrational numbers. Their decimals never end and never repeat."}, {"id": "ch01-s5-example", "kind": "example", "text": "Between which two whole numbers does √50 lie? 7 × 7 = 49 and 8 × 8 = 64. 50 is between 49 and 64, so √50 is between 7 and 8. It is only a little above 7, because 50 is only a little above 49."}, {"id": "ch01-s5-mistake", "kind": "mistake", "text": "√16 is 4, not 8. Halving is tempting because it also makes a number smaller. Check by multiplying back: 4 × 4 = 16, but 8 × 8 = 64."}, {"id": "ch01-s5-turn", "kind": "turn", "text": "√30 lies between two whole numbers. What is the smaller one?", "answer": "5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5"}]}], "accepts": ["5", "= 5"], "rejects": ["6", "15", "30"], "mistakes": []}}, {"id": "ch01-s5-sayBack", "kind": "sayBack", "text": "A square root asks what number times itself gives this one, and most of the answers cannot be written as fractions."}]}], "callouts": [{"id": "ch01-c-predict", "kind": "predict", "title": "Predict first", "body": "Before you touch the figure: what is (−1) × (−1)? Write your answer and one reason for it."}, {"id": "ch01-c-aha", "kind": "check", "title": "Explain it", "body": "A friend says a minus times a minus should be an even bigger minus. Explain in your own words why it is a plus."}, {"id": "ch01-c-trap", "kind": "careful", "title": "Watch out for 1", "body": "1 is not a prime number. A prime has exactly two factors, and 1 has only one."}], "keyTerms": ["Negative number", "Factor", "Prime number", "Prime factors", "Multiple", "Highest common factor", "Lowest common multiple", "Power", "Laws of indices", "Square root", "Irrational number"], "widgets": ["w_negative_rotation_line", "w_prime_venn_hcf_lcm", "w_index_staircase_surds"], "debate": {"id": "debate-ch01-primes", "chapterNumber": 1, "oupUnitNumber": 1, "title": "Two trains from Dadar", "contextPrompt": "Fast trains leave Dadar every 12 minutes. Slow trains leave every 18 minutes. Both leave together at 8:00 AM. Kabir and Meera disagree about when they next leave together.", "speakerAName": "Kabir", "speakerAClaim": "Multiply the two gaps. 12 × 18 = 216, so it is 216 minutes later.", "speakerBName": "Meera", "speakerBClaim": "Count on in 12s and in 18s. The first number in both lists is 36, so it is 36 minutes later.", "choices": [{"id": "ch01-a", "speakerLabel": "Kabir is right (216 minutes)", "reasoningStatement": "To find when two things next happen together, multiply the two gaps.", "isCorrect": false, "socraticRebuttal": "The trains do leave together after 216 minutes. But they have already left together five times before that. The first time is after 36 minutes."}, {"id": "ch01-b", "speakerLabel": "Meera is right (36 minutes)", "reasoningStatement": "The 12s go 12, 24, 36. The 18s go 18, 36. The first number in both lists is 36.", "isCorrect": true, "socraticRebuttal": "Yes. 36 = 3 × 12 and 36 = 2 × 18, so both trains leave at 8:36 AM."}, {"id": "ch01-c", "speakerLabel": "Neither. It is 6 minutes.", "reasoningStatement": "6 is the biggest number that divides into both 12 and 18.", "isCorrect": false, "socraticRebuttal": "6 does divide into both. But after 6 minutes neither train has left again. The answer must be a number that 12 and 18 both divide into."}], "invariantTakeaway": "Multiplying two numbers always gives a number in both lists. It is often not the first one."}}, {"id": "ch02", "number": 2, "volumeNumber": 1, "volumeTitle": "Volume I · The Grammar of Truth, Sets & Number Architecture", "title": "Fractions and recurring decimals", "subtitle": "School book chapter 6 · Fractions that share a name, why you flip to divide, and decimals that never end", "hookSummary": "How can 0.333… go on for ever and still be exactly one third?", "beyondSchoolBook": false, "skillCard": {"skill": "Fractions and decimals, both ways", "sheCan": {"prompt": "With no calculator: work out 5 1/2 − 2 2/3 and 9 ÷ 3/5. Then write 0.454545… as a fraction.", "answer": "5 1/2 − 2 2/3 = 2 5/6. 9 ÷ 3/5 = 15. 0.454545… = 5/11."}, "whyItMatters": "Recipes, prices and measurements are rarely whole numbers. Almost every chapter after this one divides something, and dividing makes fractions.", "standsOn": ["Chapter 1: factors, multiples, the HCF and the LCM", "Place value down to thousandths", "Dividing by a one-digit number, with remainders"], "unlocks": ["Chapter 3: sharing in parts, percentages and growth", "Chapter 4: algebra, where the same fraction rules work on letters", "Chapter 15: counting chances, which are written as fractions"]}, "intuitionToFormula": {"concreteAction": "Set the repeating digits to 36. The red row is 100 lots of the number 0.3636… The blue row is 1 lot of it. Take the blue row away from the red row.", "ahaInvariant": "The digits after the decimal point are the same in both rows, so they cancel. What is left is a whole number: 99 lots make 36. So the number is 36/99, which is 4/11.", "formulaDisplay": "100x − x = 99x,   a ÷ b/c = a × c/b", "termMappings": [{"symbol": "100x", "visualPart": "The red row", "colorRole": "red", "meaning": "100 lots of the number, which moves every digit two places to the left"}, {"symbol": "x", "visualPart": "The blue row", "colorRole": "blue", "meaning": "1 lot of the number, the recurring decimal itself"}, {"symbol": "99x", "visualPart": "The green box", "colorRole": "green", "meaning": "What is left after taking away, which is a whole number"}, {"symbol": "a ÷ b/c", "visualPart": "The amber line", "colorRole": "amber", "meaning": "How many pieces of size b/c fit into a"}], "atlasFigureRef": "maths/ch02-fractions-decimals/index.html"}, "sections": [{"id": "ch02-s1", "heading": "2.1 One amount, many names", "excerpt": "They ate the same amount: half a pizza each. Cutting every slice in two doubles the number of slices and doubles how many you eat. The amount of pizza does not change. So 2/4 and 4/8 are two names for one amount.", "teaches": ["numerator-denominator", "equivalent-fractions", "simplest-form"], "steps": [{"id": "ch02-s1-question", "kind": "question", "text": "Kym eats 2 slices of a pizza cut into 4 equal slices. Aarav has a pizza of the same size, cut into 8 equal slices, and eats 4. Who ate more?"}, {"id": "ch02-s1-idea", "kind": "idea", "text": "They ate the same amount: half a pizza each. Cutting every slice in two doubles the number of slices and doubles how many you eat. The amount of pizza does not change. So 2/4 and 4/8 are two names for one amount."}, {"id": "ch02-s1-picture", "kind": "picture", "text": "Draw a bar and split it into 4 equal parts. Shade 2 of them. Now draw a line through the middle of every part. The bar has 8 parts and 4 are shaded. The shaded length has not moved."}, {"id": "ch02-s1-reason", "kind": "reason", "text": "Why does this work? Multiplying the top and the bottom by 2 is multiplying by 2/2. And 2/2 is 1 whole. Multiplying by 1 never changes an amount. Dividing the top and the bottom by the same number undoes it, so that is safe too."}, {"id": "ch02-s1-name", "kind": "name", "text": "The top number of a fraction is the numerator and the bottom number is the denominator. Fractions that name the same amount, like 2/4 and 4/8, are equivalent fractions. Divide the top and the bottom by their highest common factor and you reach the simplest form. For 2/4 and 4/8 that is 1/2."}, {"id": "ch02-s1-example", "kind": "example", "text": "Write 18/24 in its simplest form. The HCF of 18 and 24 is 6. 18 ÷ 6 = 3 and 24 ÷ 6 = 4. So 18/24 = 3/4. Check: 3 and 4 share no factor except 1, so you cannot go further."}, {"id": "ch02-s1-mistake", "kind": "mistake", "text": "It is tempting to add the same number to the top and the bottom. Try it: 1/2 would become 2/3. But half a pizza is not two thirds of a pizza. Adding changes the amount. Only multiplying or dividing both parts keeps it the same."}, {"id": "ch02-s1-turn", "kind": "turn", "text": "Write 24/36 in its simplest form.", "answer": "2/3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2/3", "simplest": true}]}], "accepts": ["2/3", "= 2/3"], "rejects": ["4/6", "12/18", "3/2"], "mistakes": []}}, {"id": "ch02-s1-sayBack", "kind": "sayBack", "text": "Multiplying or dividing the top and the bottom by the same number gives a new name for the same amount."}]}, {"id": "ch02-s2", "heading": "2.2 Taking away pieces of different sizes", "excerpt": "Quarters and thirds are pieces of different sizes, so you cannot take one from the other yet. Cut both into twelfths. A quarter is 3 twelfths and a third is 4 twelfths. Now every piece is the same size, and you can count them.", "teaches": ["common-denominator", "improper-fraction", "mixed-number"], "steps": [{"id": "ch02-s2-question", "kind": "question", "text": "Kym has 3 1/4 metres of ribbon. She cuts off 1 2/3 metres to wrap a gift. How much ribbon is left?"}, {"id": "ch02-s2-idea", "kind": "idea", "text": "Quarters and thirds are pieces of different sizes, so you cannot take one from the other yet. Cut both into twelfths. A quarter is 3 twelfths and a third is 4 twelfths. Now every piece is the same size, and you can count them."}, {"id": "ch02-s2-picture", "kind": "picture", "text": "Think of 3 1/4 as 3 whole metres and 1 quarter. Each whole metre is 4 quarters, so that is 13 quarters. In the same way, 1 2/3 is 5 thirds. In twelfths, 13 quarters is 39 twelfths and 5 thirds is 20 twelfths."}, {"id": "ch02-s2-reason", "kind": "reason", "text": "Why twelfths? The new denominator must be in the 4 times table and in the 3 times table. The lowest common multiple of 4 and 3 is 12. Any common multiple would work, but the lowest keeps the numbers small."}, {"id": "ch02-s2-name", "kind": "name", "text": "A denominator that both fractions can share is a common denominator. Here it is 12. A fraction whose top is bigger than its bottom, like 13/4, is an improper fraction. A whole number with a fraction beside it, like 3 1/4, is a mixed number."}, {"id": "ch02-s2-example", "kind": "example", "text": "Work out 3 1/4 − 1 2/3. Write both as improper fractions: 13/4 and 5/3. Give both the common denominator 12: 39/12 and 20/12. Take away the numerators: 39 − 20 = 19, so the answer is 19/12. 12 twelfths make 1 whole, which leaves 7 twelfths. The ribbon left is 1 7/12 metres."}, {"id": "ch02-s2-mistake", "kind": "mistake", "text": "The tempting way is to take away the tops and the bottoms separately. For 3/4 − 1/3 that gives 2/1, which is 2. But you started with less than 1 whole, so 2 cannot be right. The denominator names the size of the piece. It is not something you take away."}, {"id": "ch02-s2-turn", "kind": "turn", "text": "Work out 2 1/2 − 1 2/3. Give your answer as a fraction in its simplest form.", "answer": "5/6", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5/6", "simplest": true}]}], "accepts": ["5/6", "= 5/6"], "rejects": ["1 1/6", "1/6", "10/12"], "mistakes": []}}, {"id": "ch02-s2-sayBack", "kind": "sayBack", "text": "To add or take away fractions, first cut them into pieces of the same size, then count the pieces."}]}, {"id": "ch02-s3", "heading": "2.3 Why you flip to divide", "excerpt": "Dividing asks how many times one amount fits into another. Start by counting thirds. Each litre holds 3 thirds, so 4 litres hold 12 thirds. Each glass uses 2 of them. 12 ÷ 2 = 6, so you can fill 6 glasses.", "teaches": ["reciprocal"], "steps": [{"id": "ch02-s3-question", "kind": "question", "text": "A jug holds 4 litres of lassi. Each glass takes 2/3 of a litre. How many glasses can you fill?"}, {"id": "ch02-s3-idea", "kind": "idea", "text": "Dividing asks how many times one amount fits into another. Start by counting thirds. Each litre holds 3 thirds, so 4 litres hold 12 thirds. Each glass uses 2 of them. 12 ÷ 2 = 6, so you can fill 6 glasses."}, {"id": "ch02-s3-picture", "kind": "picture", "text": "Draw 4 bars for the 4 litres and cut each into 3 equal parts. That makes 12 parts. Circle them in groups of 2, and you get 6 groups. In the figure, set the whole number to 4 and the bottom of the fraction to 3. Read the amber line."}, {"id": "ch02-s3-reason", "kind": "reason", "text": "Look at what you did. You multiplied 4 by 3 to count the thirds. Then you divided by 2 to make the groups. Multiplying by 3 and dividing by 2 is the same as multiplying by 3/2. So 4 ÷ 2/3 = 4 × 3/2."}, {"id": "ch02-s3-name", "kind": "name", "text": "Turn a fraction upside down and you get its reciprocal. The reciprocal of 2/3 is 3/2. Dividing by a fraction is the same as multiplying by its reciprocal. Multiplying fractions is the short part: multiply the numerators, then multiply the denominators. So 1/2 × 3/4 = 3/8, which is half of three quarters."}, {"id": "ch02-s3-example", "kind": "example", "text": "Work out 1 1/2 ÷ 3/8. Write 1 1/2 as the improper fraction 3/2. The reciprocal of 3/8 is 8/3, so work out 3/2 × 8/3. Multiply the numerators and the denominators: 24/6, which is 4. Check with the meaning. Four pieces of 3/8 make 12/8, and 12/8 is 1 1/2."}, {"id": "ch02-s3-mistake", "kind": "mistake", "text": "Dividing does not always make a number smaller. 4 ÷ 2/3 = 6, which is bigger than 4. That feels wrong until you remember the question: how many small pieces fit? A second trap is flipping the wrong fraction. Only the one you divide by gets flipped."}, {"id": "ch02-s3-turn", "kind": "turn", "text": "A tailor has 6 metres of cloth. Each scarf needs 3/4 of a metre. Work out 6 ÷ 3/4.", "answer": "8", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "8"}]}], "accepts": ["8", "= 8", "8 scarves"], "rejects": ["4.5", "9/2", "2", "1/8"], "mistakes": []}}, {"id": "ch02-s3-sayBack", "kind": "sayBack", "text": "Dividing by a fraction asks how many of that piece fit, so you multiply by the fraction turned upside down."}], "figure": true}, {"id": "ch02-s4", "heading": "2.4 Where the decimal point goes", "excerpt": "0.3 is 3 tenths and 0.2 is 2 tenths. 3 × 2 = 6. But tenths times tenths are hundredths, so the area is 6 hundredths. That is 0.06 square metres, ten times smaller than 0.6.", "teaches": ["decimal-place"], "steps": [{"id": "ch02-s4-question", "kind": "question", "text": "A floor tile is 0.3 m long and 0.2 m wide. Is its area 0.6 square metres, or 0.06?"}, {"id": "ch02-s4-idea", "kind": "idea", "text": "0.3 is 3 tenths and 0.2 is 2 tenths. 3 × 2 = 6. But tenths times tenths are hundredths, so the area is 6 hundredths. That is 0.06 square metres, ten times smaller than 0.6."}, {"id": "ch02-s4-picture", "kind": "picture", "text": "Draw a square 1 m by 1 m and cut it into a 10 by 10 grid. That makes 100 small squares. The tile reaches 3 squares one way and 2 the other. It covers 6 small squares out of 100."}, {"id": "ch02-s4-reason", "kind": "reason", "text": "As fractions, 0.3 × 0.2 is 3/10 × 2/10. Multiply the numerators to get 6. Multiply the denominators to get 100. The answer is 6/100. Each digit after a decimal point brings one more division by 10 into the answer."}, {"id": "ch02-s4-name", "kind": "name", "text": "The positions after the decimal point are called decimal places. 0.3 has one decimal place and 0.06 has two. To multiply decimals, multiply them as whole numbers first. Then give the answer as many decimal places as the two numbers had between them."}, {"id": "ch02-s4-example", "kind": "example", "text": "Work out 4.5 ÷ 0.15. Dividing by a decimal is awkward, so change the question. Multiply both numbers by 100 to get 450 ÷ 15. The answer does not change, for the same reason that equivalent fractions are equal. 45 ÷ 15 = 3, so 450 ÷ 15 = 30. Check: 30 × 0.15 = 4.5."}, {"id": "ch02-s4-mistake", "kind": "mistake", "text": "Multiplying does not always make a number bigger. 8 × 0.5 = 4, because 0.5 of something is half of it. And dividing by a number less than 1 makes it bigger: 8 ÷ 0.5 = 16. Ask how many halves fit into 8."}, {"id": "ch02-s4-turn", "kind": "turn", "text": "Work out 0.4 × 0.06.", "answer": "0.024", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "0.024"}]}], "accepts": ["0.024", ".024", "= 0.024"], "rejects": ["0.24", "0.0024", "2.4"], "mistakes": []}}, {"id": "ch02-s4-sayBack", "kind": "sayBack", "text": "Multiply decimals as whole numbers and then place the point. To divide by a decimal, scale both numbers until you divide by a whole number."}]}, {"id": "ch02-s5", "heading": "2.5 How many digits to keep", "excerpt": "No. The first two digits carry almost all the information. 33,000 is the nearest thousand to 32,846, and it is easier to remember. The newspaper kept the digits that matter most and rounded the rest.", "teaches": ["significant-figures"], "steps": [{"id": "ch02-s5-question", "kind": "question", "text": "A cricket ground counts a crowd of 32,846. The newspaper prints 33,000. Has the newspaper made a mistake?"}, {"id": "ch02-s5-idea", "kind": "idea", "text": "No. The first two digits carry almost all the information. 33,000 is the nearest thousand to 32,846, and it is easier to remember. The newspaper kept the digits that matter most and rounded the rest."}, {"id": "ch02-s5-picture", "kind": "picture", "text": "Mark 32,000 and 33,000 on a number line. 32,846 sits between them, much closer to 33,000. The halfway mark is 32,500. Anything at or past halfway rounds up."}, {"id": "ch02-s5-reason", "kind": "reason", "text": "Now take a tiny number: 0.004718 kg of saffron. The zeros at the front only hold the digits in place. They vanish if you write the mass as 4.718 g. The digits that measure anything start at the 4."}, {"id": "ch02-s5-name", "kind": "name", "text": "The digits that carry the size of a number are its significant figures. Count them from the first digit that is not zero. 32,846 to 2 significant figures is 33,000, and 0.004718 is 0.0047. Decimal places are different: they are counted from the decimal point."}, {"id": "ch02-s5-example", "kind": "example", "text": "Round 0.03064 to 3 significant figures. The first significant figure is the 3. The zero after the 3 counts, because it sits between measured digits. So the three figures are 3, 0 and 6. The next digit is 4, which is less than 5, so the 6 stays. The answer is 0.0306."}, {"id": "ch02-s5-mistake", "kind": "mistake", "text": "There are two traps. First, 0.0306 to 2 decimal places is 0.03, which throws most of the number away. Decimal places and significant figures are different counts. Second, keep the size. 32,846 to 2 significant figures is 33,000, not 33. The zeros hold the place of each digit."}, {"id": "ch02-s5-turn", "kind": "turn", "text": "Round 0.05093 to 2 significant figures.", "answer": "0.051", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "0.051"}]}], "accepts": ["0.051", ".051", "= 0.051"], "rejects": ["0.05", "0.0509", "0.06", "51"], "mistakes": []}}, {"id": "ch02-s5-sayBack", "kind": "sayBack", "text": "Significant figures are counted from the first digit that is not zero, so they work for huge and tiny numbers alike."}]}, {"id": "ch02-s6", "heading": "2.6 Decimals that never end", "excerpt": "Nothing went wrong. Divide 1 by 3 by hand. 10 tenths shared among 3 is 3 each, with 1 tenth left over. That 1 tenth becomes 10 hundredths, and the same step happens again. The remainder is always 1, so the 3s never stop.", "teaches": ["terminating-decimal", "recurring-decimal"], "steps": [{"id": "ch02-s6-question", "kind": "question", "text": "Share ₹1 equally among 4 friends and each gets ₹0.25. Share ₹1 among 3 friends and the calculator shows 0.3333333. What went wrong with 3?"}, {"id": "ch02-s6-idea", "kind": "idea", "text": "Nothing went wrong. Divide 1 by 3 by hand. 10 tenths shared among 3 is 3 each, with 1 tenth left over. That 1 tenth becomes 10 hundredths, and the same step happens again. The remainder is always 1, so the 3s never stop."}, {"id": "ch02-s6-picture", "kind": "picture", "text": "Now divide 1 by 7 by hand. The remainder at each step can only be 1, 2, 3, 4, 5 or 6. After at most six steps, one of them must come back. From then on the digits repeat: 1 ÷ 7 = 0.142857142857…"}, {"id": "ch02-s6-reason", "kind": "reason", "text": "Why does 1/4 stop when 1/3 does not? A decimal that stops is a fraction over 10, 100 or 1,000. Those denominators are built only from the primes 2 and 5. 1/4 fits, because it is 25/100. But no power of 10 is a multiple of 3, so 1/3 can never stop."}, {"id": "ch02-s6-name", "kind": "name", "text": "A decimal that stops, like 0.25, is a terminating decimal. A decimal whose digits repeat for ever, like 0.333…, is a recurring decimal. The three dots mean the pattern goes on. Some books put a dot over the repeating digits instead."}, {"id": "ch02-s6-example", "kind": "example", "text": "Write 0.333… as a fraction. Ten lots of it are 3.333…, and one lot is 0.333…, with the same tail of digits. Take one lot from ten lots and the tails cancel, so nine lots are exactly 3. The number is 3/9, which is 1/3. Now try 0.3636…, where two digits repeat. Write x for the number, so that 100x = 36.3636… and the tails match again. Subtract x and 99x = 36, so x = 36/99 = 4/11. In the figure, set the repeating digits to 36 and follow the three rows."}, {"id": "ch02-s6-mistake", "kind": "mistake", "text": "0.3 and 0.333… are different numbers. 0.3 is 3/10, and 0.333… is 1/3, which is a little more. If you cut a recurring decimal short, you have rounded it. A second trap: when two digits repeat, multiplying by 10 does not line the tails up. Multiply by 100."}, {"id": "ch02-s6-turn", "kind": "turn", "text": "Write 0.151515… as a fraction in its simplest form.", "answer": "5/33", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5/33", "simplest": true}]}], "accepts": ["5/33", "x = 5/33", "= 5/33"], "rejects": ["15/99", "15/100", "3/20", "1/6"], "mistakes": []}}, {"id": "ch02-s6-sayBack", "kind": "sayBack", "text": "Multiply a recurring decimal so the repeating tails line up, subtract, and a fraction is left."}], "figure": true}], "callouts": [{"id": "ch02-c-predict", "kind": "predict", "title": "Predict first", "body": "Before you touch the figure: is 3 ÷ 2/4 bigger or smaller than 3? Decide, and write down why you think so."}, {"id": "ch02-c-aha", "kind": "check", "title": "Explain it", "body": "A friend says 1/3 cannot equal 0.333… because the 3s never finish. Explain in your own words why the two are the same number."}, {"id": "ch02-c-trap", "kind": "careful", "title": "Watch out for the flip", "body": "When you divide by a fraction, flip only the fraction you divide by. The first number stays as it is."}], "keyTerms": ["Fraction", "Numerator and denominator", "Equivalent fractions", "Simplest form", "Common denominator", "Improper fraction", "Mixed number", "Reciprocal", "Decimal place", "Significant figures", "Terminating decimal", "Recurring decimal"], "widgets": ["w_recurring_decimal_tail_canceller", "w_fraction_area_division"], "debate": {"id": "debate-ch02-fractions", "chapterNumber": 2, "oupUnitNumber": 6, "title": "Half-litre bottles", "contextPrompt": "A juice stall has 6 litres of nimbu pani. It sells it in bottles of 1/2 a litre. Riya and Arjun disagree about how many bottles it can fill.", "speakerAName": "Riya", "speakerAClaim": "6 ÷ 1/2 means half of 6. That is 3 bottles.", "speakerBName": "Arjun", "speakerBClaim": "Each litre fills 2 bottles, so 6 litres fill 12 bottles.", "choices": [{"id": "ch02-a", "speakerLabel": "Riya is right (3 bottles)", "reasoningStatement": "Dividing makes a number smaller, so the answer must be less than 6.", "isCorrect": false, "socraticRebuttal": "Half of 6 is 6 × 1/2, which is 3. But 3 bottles of half a litre hold only 1 1/2 litres. Where did the other 4 1/2 litres go?"}, {"id": "ch02-b", "speakerLabel": "Arjun is right (12 bottles)", "reasoningStatement": "Two half-litre bottles fill from each litre, and there are 6 litres.", "isCorrect": true, "socraticRebuttal": "Yes. 6 ÷ 1/2 = 6 × 2 = 12. Check it: 12 bottles of half a litre hold 6 litres."}, {"id": "ch02-c", "speakerLabel": "Neither. It is 1/12 of a bottle.", "reasoningStatement": "Flip the 6 to get 1/6, then multiply by 1/2.", "isCorrect": false, "socraticRebuttal": "That flips the wrong number. One litre alone fills 2 bottles, so 1/12 of a bottle cannot be right. Flip only the 1/2."}], "invariantTakeaway": "Dividing by a number less than 1 gives an answer bigger than the number you started with."}}, {"id": "ch03", "number": 3, "volumeNumber": 1, "volumeTitle": "Volume I · The Grammar of Truth, Sets & Number Architecture", "title": "Ratio, percentages and growth", "subtitle": "School book chapters 9 and 12 · Sharing in parts, a percentage change as one multiplication, and money that grows on itself", "hookSummary": "A price goes up by 20% and then down by 20%. Why is it not back where it started?", "beyondSchoolBook": false, "skillCard": {"skill": "Sharing, scaling and growing amounts", "sheCan": {"prompt": "With no calculator: share ₹720 in the ratio 4 : 5. A phone costs ₹6,900 after a 15% rise. What did it cost before? About how many years does money take to double at 3% a year?", "answer": "₹320 and ₹400. ₹6,000. About 24 years."}, "whyItMatters": "Prices, recipes, maps, discounts and savings all work by multiplying. Someone who can read a percentage change is hard to fool in a shop or a bank.", "standsOn": ["Chapter 2: fractions, decimals and dividing by a decimal", "Multiplying and dividing by 10, 100 and 1,000", "Finding 10% and 50% of an amount"], "unlocks": ["Chapter 5: finding an unknown amount by working backwards", "Chapter 11: making a shape bigger, where every length is multiplied by the same number", "Chapter 15: chances, which are compared as fractions and percentages"]}, "intuitionToFormula": {"concreteAction": "Set the interest rate to 8%. The amber lines show what ₹1,000 becomes after 20 years. They give two totals: one for simple interest and one for compound interest.", "ahaInvariant": "Simple interest adds ₹80 every year, so 20 years add ₹1,600. Compound interest multiplies by 1.08 every year, so each year adds more than the last. Adding gives ₹2,600. Multiplying gives ₹4,661.", "formulaDisplay": "1 part = total ÷ (a + b),   A = P × mⁿ", "termMappings": [{"symbol": "a + b", "visualPart": "The red and blue boxes", "colorRole": "red", "meaning": "All the parts of the ratio, counted together"}, {"symbol": "P", "visualPart": "The ₹1,000 in the first amber line", "colorRole": "amber", "meaning": "The amount at the start"}, {"symbol": "m", "visualPart": "The interest rate slider", "colorRole": "amber", "meaning": "The multiplier for one year, which is 1.08 for a rate of 8%"}, {"symbol": "n", "visualPart": "The 20 years", "colorRole": "amber", "meaning": "The number of years, so the number of times you multiply"}, {"symbol": "A", "visualPart": "The compound total", "colorRole": "amber", "meaning": "The amount at the end"}], "atlasFigureRef": "maths/ch03-ratios-compounding/index.html"}, "sections": [{"id": "ch03-s1", "heading": "3.1 Sharing in parts", "excerpt": "Pay for each hour worked. There were 3 + 5 = 8 hours in all, so cut the ₹320 into 8 equal parts. Each part is ₹40. Kym gets 3 parts and Aarav gets 5 parts.", "teaches": ["ratio"], "steps": [{"id": "ch03-s1-question", "kind": "question", "text": "Kym and Aarav sell lemonade at a fair and make ₹320. Kym worked for 3 hours and Aarav for 5. Splitting the money in half would not be fair. How should they share it?"}, {"id": "ch03-s1-idea", "kind": "idea", "text": "Pay for each hour worked. There were 3 + 5 = 8 hours in all, so cut the ₹320 into 8 equal parts. Each part is ₹40. Kym gets 3 parts and Aarav gets 5 parts."}, {"id": "ch03-s1-picture", "kind": "picture", "text": "Draw a bar of 3 equal boxes for Kym. Under it, draw a bar of 5 boxes of the same size for Aarav. The 8 boxes together hold ₹320, so each box holds ₹40. In the figure, set the parts for A to 3 and the parts for B to 5."}, {"id": "ch03-s1-reason", "kind": "reason", "text": "Why add the 3 and the 5 first? The money is shared among all the parts, not among the two people. Once you know what 1 part is worth, each share is a multiplication. Kym gets 3 × ₹40 = ₹120 and Aarav gets 5 × ₹40 = ₹200. Check: ₹120 + ₹200 = ₹320."}, {"id": "ch03-s1-name", "kind": "name", "text": "A comparison like 3 to 5 is called a ratio, and it is written 3 : 5. It does not say how much each person gets. It says how the amounts compare. You can simplify a ratio the way you simplify a fraction: divide every part by a common factor. So 6 : 10 is the same ratio as 3 : 5."}, {"id": "ch03-s1-example", "kind": "example", "text": "Share ₹4,500 among three cousins in the ratio 2 : 3 : 4. There are 2 + 3 + 4 = 9 parts. One part is ₹4,500 ÷ 9 = ₹500. The shares are 2 × ₹500 = ₹1,000, 3 × ₹500 = ₹1,500 and 4 × ₹500 = ₹2,000. Check: the three shares add up to ₹4,500."}, {"id": "ch03-s1-mistake", "kind": "mistake", "text": "The tempting step is to divide by one of the numbers in the ratio, such as ₹320 ÷ 3. But 3 is not the number of parts. There are 8. A second trap is to read 3 : 5 as the fraction 3/5. Kym gets 3 parts out of 8, which is 3/8 of the money."}, {"id": "ch03-s1-turn", "kind": "turn", "text": "Meera and Zoya share 42 stickers in the ratio 2 : 5. How many stickers does Zoya get?", "answer": "30", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "30"}]}], "accepts": ["30", "30 stickers", "= 30"], "rejects": ["12", "6", "21", "105"], "mistakes": []}}, {"id": "ch03-s1-sayBack", "kind": "sayBack", "text": "To share in a ratio, add the parts, find what one part is worth, then multiply."}], "figure": true}, {"id": "ch03-s2", "heading": "3.2 Find one first", "excerpt": "Find the amount for 1 person first. 300 g ÷ 4 = 75 g each. Then multiply by the number of people: 10 × 75 g = 750 g. Going through one turns every question of this kind into the same two steps.", "teaches": ["unitary-method", "direct-proportion"], "steps": [{"id": "ch03-s2-question", "kind": "question", "text": "A recipe for 4 people needs 300 g of paneer. Kym is cooking for 10 people. How much paneer does she need?"}, {"id": "ch03-s2-idea", "kind": "idea", "text": "Find the amount for 1 person first. 300 g ÷ 4 = 75 g each. Then multiply by the number of people: 10 × 75 g = 750 g. Going through one turns every question of this kind into the same two steps."}, {"id": "ch03-s2-picture", "kind": "picture", "text": "Draw two number lines, one above the other. The top line counts people: 0, 1, 4 and 10. The bottom line shows the paneer: 0 g, 75 g, 300 g and 750 g. Each number on the bottom line is 75 times the number above it."}, {"id": "ch03-s2-reason", "kind": "reason", "text": "Why is this allowed? Each person eats the same amount, so the paneer grows in step with the people. Multiply the people by 2.5 and the paneer is multiplied by 2.5 too. You can check: 4 × 2.5 = 10 and 300 × 2.5 = 750."}, {"id": "ch03-s2-name", "kind": "name", "text": "Finding the value of one first is called the unitary method. Two amounts are in direct proportion when multiplying one by a number multiplies the other by the same number. Here the paneer is directly proportional to the people. The amount for one, 75 g, stays the same all the way along."}, {"id": "ch03-s2-example", "kind": "example", "text": "5 notebooks cost ₹180. What do 8 cost? One notebook costs ₹180 ÷ 5 = ₹36. So 8 notebooks cost 8 × ₹36 = ₹288. Check that the answer is sensible: 8 is less than double 5, and ₹288 is less than double ₹180."}, {"id": "ch03-s2-mistake", "kind": "mistake", "text": "A common slip is to divide the wrong way round and work out 5 ÷ 180. Say what you want in words first. Rupees for each notebook means rupees ÷ notebooks. A second trap: not everything doubles together. A taxi charges ₹50 to start and ₹15 for each kilometre. A 2 km trip costs ₹80 and a 4 km trip costs ₹110, not ₹160."}, {"id": "ch03-s2-turn", "kind": "turn", "text": "6 pencils cost ₹45. How much do 10 pencils cost?", "answer": "₹75", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "75"}]}], "accepts": ["75", "₹75", "75 rupees"], "rejects": ["7.5", "49", "450", "27"], "mistakes": []}}, {"id": "ch03-s2-sayBack", "kind": "sayBack", "text": "Find what one is worth, then multiply by how many you need."}]}, {"id": "ch03-s3", "heading": "3.3 When more means less", "excerpt": "No. More painters share the same work, so the job takes less time, not more. The hall needs 4 × 6 = 24 days of one painter's work. Shared among 8 painters, that is 24 ÷ 8 = 3 days.", "teaches": ["inverse-proportion"], "steps": [{"id": "ch03-s3-question", "kind": "question", "text": "4 painters can paint the school hall in 6 days. The head teacher hires 8 painters instead. Will the job take 12 days?"}, {"id": "ch03-s3-idea", "kind": "idea", "text": "No. More painters share the same work, so the job takes less time, not more. The hall needs 4 × 6 = 24 days of one painter's work. Shared among 8 painters, that is 24 ÷ 8 = 3 days."}, {"id": "ch03-s3-picture", "kind": "picture", "text": "Think of the hall as 24 squares of wall. One painter paints one square a day. 4 painters cover 4 squares a day and finish in 6 days. 8 painters cover 8 squares a day and finish in 3 days. The 24 squares never change."}, {"id": "ch03-s3-reason", "kind": "reason", "text": "Why multiply here, when the last section divided? Ask what stays the same. For the paneer, the amount for each person stayed the same, so you divided to find it. For the painters, the whole job stays the same, so you multiply to find it."}, {"id": "ch03-s3-name", "kind": "name", "text": "Two amounts are in inverse proportion when multiplying one by a number divides the other by the same number. Double the painters and the time halves. Multiply the two amounts together and the answer is always the same. Here it is 24."}, {"id": "ch03-s3-example", "kind": "example", "text": "A sack of rice feeds 12 hostel students for 10 days. How long does it feed 15 students? The sack holds 12 × 10 = 120 days of rice for one student. Shared among 15 students, it lasts 120 ÷ 15 = 8 days. Check that the answer is sensible: more students, so fewer days."}, {"id": "ch03-s3-mistake", "kind": "mistake", "text": "The tempting step is the unitary method in its usual order: 10 ÷ 12, then × 15. That gives 12.5 days, which says more students make the rice last longer. Before any sum, ask one question. If this number goes up, does the other go up or down?"}, {"id": "ch03-s3-turn", "kind": "turn", "text": "A tank of water lasts 20 goats for 9 days. How many days does it last 30 goats?", "answer": "6 days", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "6"}]}], "accepts": ["6", "6 days", "= 6"], "rejects": ["13.5", "9", "180", "4"], "mistakes": []}}, {"id": "ch03-s3-sayBack", "kind": "sayBack", "text": "When more of one thing means less of the other, find the total first, then share it out."}]}, {"id": "ch03-s4", "heading": "3.4 One multiplication for a change", "excerpt": "No. The rise is 20% of ₹2,000, which is ₹400, so the price becomes ₹2,400. The cut is 20% of ₹2,400, which is ₹480. The sale price is ₹1,920. The second 20% was taken from a bigger amount, so it took off more.", "teaches": ["percentage-multiplier"], "steps": [{"id": "ch03-s4-question", "kind": "question", "text": "A pair of shoes costs ₹2,000. In June the price goes up by 20%. In the July sale it comes down by 20%. Is it back to ₹2,000?"}, {"id": "ch03-s4-idea", "kind": "idea", "text": "No. The rise is 20% of ₹2,000, which is ₹400, so the price becomes ₹2,400. The cut is 20% of ₹2,400, which is ₹480. The sale price is ₹1,920. The second 20% was taken from a bigger amount, so it took off more."}, {"id": "ch03-s4-picture", "kind": "picture", "text": "Draw a bar of 10 boxes for ₹2,000. A 20% rise adds 2 boxes, which makes 12. Now cut the new bar into 10 equal pieces and take 2 of them away. Each piece is bigger than an old box, so you take away more than you added."}, {"id": "ch03-s4-reason", "kind": "reason", "text": "There is a shorter way to see it. After a 20% rise you have 100% + 20% = 120% of the price. 120% is 120/100, which is 1.2. So a 20% rise is the same as multiplying by 1.2. After a 20% cut you have 80% left, so you multiply by 0.8. Both changes together: 1.2 × 0.8 = 0.96."}, {"id": "ch03-s4-name", "kind": "name", "text": "The one number you multiply by to make a percentage change is called the percentage multiplier. For a rise, add the percentage to 100% and write the result as a decimal. For a fall, take it away from 100%. A 5% rise has the multiplier 1.05 and a 30% fall has the multiplier 0.7."}, {"id": "ch03-s4-example", "kind": "example", "text": "A phone costs ₹15,000 and its price rises by 8%. The multiplier is 1.08. ₹15,000 × 1.08 = ₹16,200. Now go back to the ₹2,000 shoes, which went up 20% and then down 20%. The multiplier for both changes together is 0.96. ₹2,000 × 0.96 = ₹1,920, which matches. 0.96 is 96%, so the two changes make a 4% fall. In the figure, read the green line."}, {"id": "ch03-s4-mistake", "kind": "mistake", "text": "There are two traps. First, a 5% rise is × 1.05, not × 1.5 and not × 0.05. Multiplying by 0.05 finds the 5% on its own. Second, percentages in a row do not add. Two rises of 10% are not a rise of 20%. They make 1.1 × 1.1 = 1.21, which is a 21% rise."}, {"id": "ch03-s4-turn", "kind": "turn", "text": "A bag costs ₹800. Its price is cut by 15%. What is the new price?", "answer": "₹680", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "680"}]}], "accepts": ["680", "₹680", "680 rupees"], "rejects": ["120", "785", "920", "68"], "mistakes": []}}, {"id": "ch03-s4-sayBack", "kind": "sayBack", "text": "A percentage change is one multiplication, and changes in a row multiply."}], "figure": true}, {"id": "ch03-s5", "heading": "3.5 Working backwards", "excerpt": "It is tempting to add 20% of ₹1,200, which gives ₹1,440. But the 20% was taken off the old price, not the sale price. The sale price is 80% of the old price. So 80% is ₹1,200, 10% is ₹150 and 100% is ₹1,500.", "teaches": ["reverse-percentage"], "steps": [{"id": "ch03-s5-question", "kind": "question", "text": "In a sale, everything is 20% off. A kurta costs ₹1,200 in the sale. What did it cost before?"}, {"id": "ch03-s5-idea", "kind": "idea", "text": "It is tempting to add 20% of ₹1,200, which gives ₹1,440. But the 20% was taken off the old price, not the sale price. The sale price is 80% of the old price. So 80% is ₹1,200, 10% is ₹150 and 100% is ₹
