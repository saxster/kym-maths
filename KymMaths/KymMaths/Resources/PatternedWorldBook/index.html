1,500."}, {"id": "ch03-s5-picture", "kind": "picture", "text": "Draw a bar of 10 boxes for the old price. Cross out 2 boxes for the 20% off. The 8 boxes left hold ₹1,200, so each box holds ₹150. All 10 boxes hold ₹1,500."}, {"id": "ch03-s5-reason", "kind": "reason", "text": "The sale multiplied the old price by 0.8. To undo a multiplication, you divide. ₹1,200 ÷ 0.8 = ₹1,500. Adding 20% back does not undo it, because that multiplies by 1.2. And 0.8 × 1.2 = 0.96, not 1."}, {"id": "ch03-s5-name", "kind": "name", "text": "Finding the amount before a percentage change is called a reverse percentage. Work out the multiplier for the change, then divide the new amount by it. Dividing by the multiplier always takes you back to the start."}, {"id": "ch03-s5-example", "kind": "example", "text": "After a 12% rise, a month's rent is ₹5,600. What was the old rent? The multiplier for a 12% rise is 1.12, so work out ₹5,600 ÷ 1.12. Multiply both numbers by 100 to get 560,000 ÷ 112, which is 5,000. The old rent was ₹5,000. Check forwards: ₹5,000 × 1.12 = ₹5,600."}, {"id": "ch03-s5-mistake", "kind": "mistake", "text": "The trap is to take the percentage of the wrong amount. 12% of ₹5,600 is ₹672, and ₹5,600 − ₹672 = ₹4,928. Test that answer by going forwards. ₹4,928 × 1.12 = ₹5,519.36, which is not ₹5,600. The 12% in the question was 12% of the old rent, the number you are looking for."}, {"id": "ch03-s5-turn", "kind": "turn", "text": "After a 10% rise, a cinema ticket costs ₹330. What did it cost before the rise?", "answer": "₹300", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "300"}]}], "accepts": ["300", "₹300", "300 rupees"], "rejects": ["297", "363", "33", "320"], "mistakes": []}}, {"id": "ch03-s5-sayBack", "kind": "sayBack", "text": "To undo a percentage change, divide by its multiplier."}]}, {"id": "ch03-s6", "heading": "3.6 Growth on growth", "excerpt": "Only if the bank pays on the first ₹1,000 each year and nothing more. Most banks do better than that. They add the interest to the account, and the next year they pay 8% on the new, bigger amount. Year 1 ends on ₹1,080. Year 2 adds 8% of ₹1,080, which is ₹86.40, not ₹80.", "teaches": ["simple-interest", "compound-growth", "rule-of-72"], "steps": [{"id": "ch03-s6-question", "kind": "question", "text": "Kym's grandmother puts ₹1,000 in a bank that pays 8% interest a year. She leaves it there for 20 years. Kym says the bank adds ₹80 a year, so it will grow to ₹2,600. Is she right?"}, {"id": "ch03-s6-idea", "kind": "idea", "text": "Only if the bank pays on the first ₹1,000 each year and nothing more. Most banks do better than that. They add the interest to the account, and the next year they pay 8% on the new, bigger amount. Year 1 ends on ₹1,080. Year 2 adds 8% of ₹1,080, which is ₹86.40, not ₹80."}, {"id": "ch03-s6-picture", "kind": "picture", "text": "Make a table with one row for each year, starting from ₹1,000. Each row is the row above × 1.08: ₹1,080, then ₹1,166.40, then ₹1,259.71. The steps get bigger every year, because each one is 8% of a bigger number."}, {"id": "ch03-s6-reason", "kind": "reason", "text": "Each year multiplies by 1.08, so 20 years multiply by 1.08 twenty times. A calculator gives that as about 4.66. So the ₹1,000 becomes about ₹4,661. That is far more than ₹2,600, and the only difference is interest earning interest."}, {"id": "ch03-s6-name", "kind": "name", "text": "Interest paid only on the starting amount is simple interest. It adds the same sum every year. Interest paid on the growing total is compound interest, and growth of this kind is compound growth. It multiplies by the same number every year. A quick guide is the rule of 72: divide 72 by the yearly percentage to estimate the years needed to double."}, {"id": "ch03-s6-example", "kind": "example", "text": "₹20,000 is saved at 5% compound interest for 2 years. The multiplier is 1.05 each year. ₹20,000 × 1.05 = ₹21,000, and ₹21,000 × 1.05 = ₹22,050. The interest earned is ₹2,050. Simple interest would have paid 2 × ₹1,000 = ₹2,000. Now use the rule of 72 on the ₹1,000 that Kym's grandmother saved at 8%. 72 ÷ 8 = 9, so her money doubles about every 9 years. In the figure, set the interest rate to 8% and read the amber lines."}, {"id": "ch03-s6-mistake", "kind": "mistake", "text": "The trap is to treat compound growth as adding. 8% a year for 20 years is not 160% in total. It is × 1.08 twenty times, which is a rise of about 366%. The same trap works against you with a loan. A debt at 24% a year doubles in about 3 years."}, {"id": "ch03-s6-turn", "kind": "turn", "text": "₹2,000 is saved at 5% compound interest a year. How much is in the account after 2 years?", "answer": "₹2,205", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2205"}]}], "accepts": ["2205", "₹2,205", "2,205"], "rejects": ["2200", "2100", "205", "2210"], "mistakes": []}}, {"id": "ch03-s6-sayBack", "kind": "sayBack", "text": "Compound growth multiplies by the same number each year, so the growth itself grows."}], "figure": true}], "callouts": [{"id": "ch03-c-predict", "kind": "predict", "title": "Predict first", "body": "Before you touch the figure: ₹1,000 is left for 20 years at 8%. Guess the total with compound interest. Then compare your guess with the amber lines."}, {"id": "ch03-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why sharing ₹90 in the ratio 1 : 2 does not give anyone ₹45."}, {"id": "ch03-c-trap", "kind": "careful", "title": "Watch out for the wrong 100%", "body": "A percentage is always a percentage of something. Before you calculate, ask which amount is the 100%: the old price or the new one."}], "keyTerms": ["Percentage", "Ratio", "Unitary method", "Direct proportion", "Inverse proportion", "Percentage multiplier", "Reverse percentage", "Simple interest", "Compound growth", "Rule of 72"], "widgets": ["w_singapore_ratio_bar_model", "w_compound_multiplier_machine"], "debate": {"id": "debate-ch03-percentages", "chapterNumber": 3, "oupUnitNumber": 9, "title": "The price before the rise", "contextPrompt": "After a 25% rise, a month's bus pass costs ₹1,000. Ishaan and Tara each work out what it cost before the rise.", "speakerAName": "Ishaan", "speakerAClaim": "25% of ₹1,000 is ₹250. Take it off, and the old price was ₹750.", "speakerBName": "Tara", "speakerBClaim": "The new price is 125% of the old one. ₹1,000 ÷ 1.25 = ₹800.", "choices": [{"id": "ch03-a", "speakerLabel": "Ishaan is right (₹750)", "reasoningStatement": "A 25% rise is undone by a 25% cut.", "isCorrect": false, "socraticRebuttal": "Test it by going forwards. ₹750 × 1.25 = ₹937.50, not ₹1,000. The 25% in the question was 25% of the old price. Is that the same as 25% of ₹1,000?"}, {"id": "ch03-b", "speakerLabel": "Tara is right (₹800)", "reasoningStatement": "The rise multiplied the old price by 1.25, so dividing by 1.25 undoes it.", "isCorrect": true, "socraticRebuttal": "Yes. Check it forwards: 25% of ₹800 is ₹200, and ₹800 + ₹200 = ₹1,000."}, {"id": "ch03-c", "speakerLabel": "Neither. It was ₹975.", "reasoningStatement": "25% means 25, so take ₹25 off.", "isCorrect": false, "socraticRebuttal": "25% is not ₹25. It is 25 out of every 100, so its size depends on the price. What is 25% of ₹800?"}], "invariantTakeaway": "To undo a percentage change, divide by its multiplier. Taking the same percentage off does not work."}}, {"id": "ch04", "number": 4, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "Brackets and factorising", "subtitle": "School book chapter 2 · Letters for numbers, multiplying out brackets, and putting them back", "hookSummary": "A square tile of side x grows by 3 cm along each edge. Why is its new area not x² + 9?", "beyondSchoolBook": false, "skillCard": {"skill": "Writing, multiplying out and factorising expressions", "sheCan": {"prompt": "With no calculator: multiply out 3(2x − 5). Factorise 12y + 18. Work out 41² − 39².", "answer": "6x − 15. 6(2y + 3). 160."}, "whyItMatters": "A letter lets one line of working stand for every case at once. Moving between brackets and separate terms is the main tool in all the algebra that follows.", "standsOn": ["Chapter 1: the HCF, and powers such as 3² and x²", "Multiplying and adding negative numbers", "The area of a rectangle is its length × its width"], "unlocks": ["Chapter 5: finding the number a letter stands for", "Chapter 6: one rule that gives any number in a list", "Chapter 7: drawing the straight line for a rule such as y = 2x + 1"]}, "intuitionToFormula": {"concreteAction": "Set the side to 4, the first number to 3 and the second number to 2. The rectangle is 7 wide and 6 tall, and it is cut into four pieces.", "ahaInvariant": "The pieces hold 16, 12, 8 and 6, which add up to 42, and 7 × 6 = 42. Write x for the side and the pieces are x², 3x, 2x and 6, whatever x is.", "formulaDisplay": "a(b + c) = ab + ac,   (x + a)(x + b) = x² + (a + b)x + ab,   a² − b² = (a − b)(a + b)", "termMappings": [{"symbol": "x²", "visualPart": "The red square", "colorRole": "red", "meaning": "The square of side x"}, {"symbol": "ax and bx", "visualPart": "The two blue strips", "colorRole": "blue", "meaning": "One strip a wide and x tall, and one strip x wide and b tall"}, {"symbol": "ab", "visualPart": "The amber corner", "colorRole": "amber", "meaning": "The small corner, a wide and b tall"}, {"symbol": "(a + b)x", "visualPart": "The green line", "colorRole": "green", "meaning": "The two strips added together"}], "atlasFigureRef": "maths/ch04-algebra-tiles/index.html"}, "sections": [{"id": "ch04-s1", "heading": "4.1 Letters for numbers", "excerpt": "Every bill is worked out the same way. Kym pays 3 × ₹15 + 2 × ₹10 = ₹65. Aarav pays 5 × ₹15 + 1 × ₹10 = ₹85. Only the two counts change from one order to the next.", "teaches": ["variable", "expression"], "steps": [{"id": "ch04-s1-question", "kind": "question", "text": "At the school canteen a samosa costs ₹15 and a cup of chai costs ₹10. Kym buys 3 samosas and 2 chais, and Aarav buys 5 samosas and 1 chai. Is there one rule that prices every order?"}, {"id": "ch04-s1-idea", "kind": "idea", "text": "Every bill is worked out the same way. Kym pays 3 × ₹15 + 2 × ₹10 = ₹65. Aarav pays 5 × ₹15 + 1 × ₹10 = ₹85. Only the two counts change from one order to the next."}, {"id": "ch04-s1-picture", "kind": "picture", "text": "Make a table with a column for samosas, a column for chais and a column for the bill. Each row is one order. The ₹15 and the ₹10 sit in every row. The counts are the only boxes that change."}, {"id": "ch04-s1-reason", "kind": "reason", "text": "Why use a letter? Write s for the number of samosas and c for the number of chais. Then every bill is 15 × s + 10 × c rupees. One line of maths now stands for every row of the table, even orders nobody has placed yet."}, {"id": "ch04-s1-name", "kind": "name", "text": "A letter that stands for a number that can change is called a variable. Here s and c are variables. Numbers, variables and signs joined into a rule, such as 15s + 10c, make an expression. We write 15s for 15 × s and leave out the × sign. An expression has no = sign."}, {"id": "ch04-s1-example", "kind": "example", "text": "Pens cost ₹12 each and notebooks cost ₹30 each. An order of p pens and n notebooks costs 12p + 30n rupees. For 4 pens and 2 notebooks, that is 12 × 4 + 30 × 2 = 48 + 60 = ₹108."}, {"id": "ch04-s1-mistake", "kind": "mistake", "text": "The tempting slip is to read 15s as two digits side by side. With s = 2, that would make 152. In algebra, a number written next to a letter is multiplied by it, so 15s is 15 × 2 = 30. A second trap is to think s means samosa. It means the number of samosas."}, {"id": "ch04-s1-turn", "kind": "turn", "text": "A bus ticket costs ₹20 for an adult and ₹10 for a child. Write an expression for the cost, in rupees, of a adults and k children.", "answer": "20a + 10k", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "20a+10k"}, {"kind": "form", "value": "10k+20a"}]}], "accepts": ["20a + 10k", "10k + 20a", "20a+10k"], "rejects": ["30ak", "20k + 10a", "20 + 10", "30"], "mistakes": []}}, {"id": "ch04-s1-sayBack", "kind": "sayBack", "text": "A variable stands for a number that can change, and an expression is a rule built from it."}]}, {"id": "ch04-s2", "heading": "4.2 Putting numbers in", "excerpt": "Put 4 where the s is and 3 where the c is. Then 15s + 10c becomes 15 × 4 + 10 × 3. That is 60 + 30, so Meera pays ₹90.", "teaches": ["substitution"], "steps": [{"id": "ch04-s2-question", "kind": "question", "text": "The canteen bill for s samosas and c chais is 15s + 10c rupees. What does Meera pay for 4 samosas and 3 chais?"}, {"id": "ch04-s2-idea", "kind": "idea", "text": "Put 4 where the s is and 3 where the c is. Then 15s + 10c becomes 15 × 4 + 10 × 3. That is 60 + 30, so Meera pays ₹90."}, {"id": "ch04-s2-picture", "kind": "picture", "text": "Think of each letter as an empty box. Write the bill as 15 × ( ) + 10 × ( ). Then drop each number into its own box and work out the sum."}, {"id": "ch04-s2-reason", "kind": "reason", "text": "Why keep the boxes as brackets? A letter stands for its whole number, sign and all. So when t = −3, t² means (−3) × (−3), which is 9. Without the bracket, −3² reads as −(3 × 3), which is −9."}, {"id": "ch04-s2-name", "kind": "name", "text": "Putting numbers in place of the letters is called substitution. Write each number in a bracket as you substitute it. Then work in the usual order: brackets, powers, × and ÷, and last of all + and −."}, {"id": "ch04-s2-example", "kind": "example", "text": "Find 3x² − 2y when x = −2 and y = 5. Write it with brackets: 3 × (−2)² − 2 × (5). The power comes first: (−2)² = 4. So the value is 3 × 4 − 10 = 12 − 10 = 2."}, {"id": "ch04-s2-mistake", "kind": "mistake", "text": "One slip is to square only the 2 and keep the minus outside, which gives 3 × (−4) − 10 = −22. Another is to work out 3 × (−2) first and then square it, which gives 36 − 10 = 26. Powers come before multiplying."}, {"id": "ch04-s2-turn", "kind": "turn", "text": "Find the value of a² + 4a when a = −3.", "answer": "−3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "-3"}]}], "accepts": ["-3", "−3", "= -3"], "rejects": ["21", "-21", "3", "-9"], "mistakes": []}}, {"id": "ch04-s2-sayBack", "kind": "sayBack", "text": "Substitute each number in a bracket, then work out powers before you multiply."}]}, {"id": "ch04-s3", "heading": "4.3 Tidying up", "excerpt": "The packs can be counted together, and so can the erasers. 3 packs and 4 packs make 7 packs, and 2 erasers and 1 eraser make 3. So her spending is 7p + 3e.", "teaches": ["term", "coefficient", "like-terms"], "steps": [{"id": "ch04-s3-question", "kind": "question", "text": "A pack of pencils costs p rupees and an eraser costs e rupees. On Monday Kym buys 3 packs and 2 erasers. On Friday she buys 4 packs and 1 eraser. Her spending is 3p + 2e + 4p + e. Can it be written in fewer pieces?"}, {"id": "ch04-s3-idea", "kind": "idea", "text": "The packs can be counted together, and so can the erasers. 3 packs and 4 packs make 7 packs, and 2 erasers and 1 eraser make 3. So her spending is 7p + 3e."}, {"id": "ch04-s3-picture", "kind": "picture", "text": "Sort the shopping into two piles. The pencil pile holds 3 packs and then 4, which is 7. The eraser pile holds 2 and then 1, which is 3. A pack and an eraser never share a pile."}, {"id": "ch04-s3-reason", "kind": "reason", "text": "Why not join 7p and 3e into 10 of something? They count different things. Test it with prices. If p = 20 and e = 5, then 7p + 3e = 140 + 15 = 155. But 10p would be 200 and 10e would be 50."}, {"id": "ch04-s3-name", "kind": "name", "text": "The parts of an expression joined by + or − are the terms of the expression. In 7p + 3e − 4, the terms are 7p, 3e and −4. The number in front of a letter is its coefficient, so the coefficient of p is 7. Terms with exactly the same letters are like terms. Only like terms can be added together."}, {"id": "ch04-s3-example", "kind": "example", "text": "Simplify 5a + 3b − 2a + b. The a terms are 5a and −2a, which make 3a. The b terms are 3b and b, and b on its own has coefficient 1. They make 4b. So 5a + 3b − 2a + b = 3a + 4b."}, {"id": "ch04-s3-mistake", "kind": "mistake", "text": "The tempting step is to add every number and write 7ab. But a and b count different things. Watch the signs too: the minus in −2a belongs to that term, so 2a is taken away. And x and x² are not alike. When x = 3, x is 3 but x² is 9."}, {"id": "ch04-s3-turn", "kind": "turn", "text": "Simplify 6x + 2y − x + 5y.", "answer": "5x + 7y", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "5x+7y"}, {"kind": "form", "value": "7y+5x"}]}], "accepts": ["5x + 7y", "7y + 5x", "5x+7y"], "rejects": ["12xy", "7x + 7y", "5x + 3y"], "mistakes": []}}, {"id": "ch04-s3-sayBack", "kind": "sayBack", "text": "Only like terms can be added, so collect each letter's terms on their own."}]}, {"id": "ch04-s4", "heading": "4.4 Multiplying out a bracket", "excerpt": "Both are. Kym gets 4 × ₹80 = ₹320, and Aarav gets ₹260 + ₹60 = ₹320. Four kits hold four boxes and four rulers, so you can count whole kits or count the pieces.", "teaches": ["expanding-brackets"], "steps": [{"id": "ch04-s4-question", "kind": "question", "text": "A school orders 4 kits. Each kit holds a geometry box at ₹65 and a ruler at ₹15. Kym works out 4 × 80. Aarav works out 4 × 65 + 4 × 15. Who is right?"}, {"id": "ch04-s4-idea", "kind": "idea", "text": "Both are. Kym gets 4 × ₹80 = ₹320, and Aarav gets ₹260 + ₹60 = ₹320. Four kits hold four boxes and four rulers, so you can count whole kits or count the pieces."}, {"id": "ch04-s4-picture", "kind": "picture", "text": "Draw a rectangle 4 squares tall and 80 squares long. Its area is 4 × 80. Draw a line down it 65 squares from the left. The two pieces have areas 4 × 65 and 4 × 15, and together they fill the rectangle."}, {"id": "ch04-s4-reason", "kind": "reason", "text": "The same cut works when one length is a letter. 4(x + 3) means 4 × (x + 3). A rectangle 4 tall and x + 3 long splits into a piece 4 by x and a piece 4 by 3. So 4(x + 3) = 4x + 12, whatever number x stands for."}, {"id": "ch04-s4-name", "kind": "name", "text": "Writing 4(x + 3) as 4x + 12 is called expanding brackets, or multiplying out. The number outside multiplies every term inside the bracket. It works for a minus sign too: 5(2y − 1) = 10y − 5."}, {"id": "ch04-s4-example", "kind": "example", "text": "Expand and simplify 3(2x + 5) − 2(x − 4). The first bracket gives 6x + 15. The second has −2 outside, so it gives −2x + 8, because −2 × −4 = +8. Collect like terms: 6x − 2x = 4x and 15 + 8 = 23. The answer is 4x + 23."}, {"id": "ch04-s4-mistake", "kind": "mistake", "text": "The common slip is to multiply only the first term, so 3(2x + 5) becomes 6x + 5. Draw 3(2x + 5) as a rectangle 3 tall, and the piece for the 5 is 3 tall as well, so it is 15. The other slip is a sign. −2(x − 4) is −2x + 8, not −2x − 8."}, {"id": "ch04-s4-turn", "kind": "turn", "text": "Expand and simplify 4(2x + 3) + 3(x − 2).", "answer": "11x + 6", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "11x+6"}, {"kind": "form", "value": "6+11x"}]}], "accepts": ["11x + 6", "6 + 11x", "11x+6"], "rejects": ["11x + 1", "11x + 18", "5x + 6"], "mistakes": []}}, {"id": "ch04-s4-sayBack", "kind": "sayBack", "text": "The number outside a bracket multiplies every term inside it, sign and all."}]}, {"id": "ch04-s5", "heading": "4.5 Putting the bracket back", "excerpt": "Run expanding brackets backwards. 12x is 6 × 2x, and 18 is 6 × 3. So 12x + 18 = 6(2x + 3), and the floor is 2x + 3 tiles long.", "teaches": ["factorising"], "steps": [{"id": "ch04-s5-question", "kind": "question", "text": "A tiled floor is 6 tiles wide and holds 42 tiles, so it is 7 tiles long. Another floor is also 6 tiles wide, and it holds 12x + 18 tiles. How long is that floor?"}, {"id": "ch04-s5-idea", "kind": "idea", "text": "Run expanding brackets backwards. 12x is 6 × 2x, and 18 is 6 × 3. So 12x + 18 = 6(2x + 3), and the floor is 2x + 3 tiles long."}, {"id": "ch04-s5-picture", "kind": "picture", "text": "Draw the rectangle with its side of 6 marked. Cut it into two pieces with areas 12x and 18. Each piece is 6 tall, so their lengths are 2x and 3. The whole length is 2x + 3."}, {"id": "ch04-s5-reason", "kind": "reason", "text": "Why take out 6 and not 2? Both 2 and 3 divide each term too. But 12x + 18 = 2(6x + 9), and 6x and 9 still share a 3. Taking out the highest common factor leaves nothing more to take out."}, {"id": "ch04-s5-name", "kind": "name", "text": "Writing an expression as a number or letter times a bracket is called factorising. Find the HCF of the terms, write it outside a bracket, and divide each term by it. A letter can be part of the HCF too: 5x² + 15x = 5x(x + 3)."}, {"id": "ch04-s5-example", "kind": "example", "text": "Factorise 20p²q + 8pq. The HCF of 20 and 8 is 4. Both terms have at least one p and one q. So the HCF of the terms is 4pq. 20p²q ÷ 4pq = 5p and 8pq ÷ 4pq = 2. The answer is 4pq(5p + 2). Check by expanding: 4pq × 5p = 20p²q."}, {"id": "ch04-s5-mistake", "kind": "mistake", "text": "The usual slip is to stop too soon. 20p²q + 8pq = 2p(10pq + 4q) is true, but 2 and q are still common to both terms in the bracket. Another slip is to lose a term. When a whole term is the HCF, it leaves 1 behind: 3x + 3 = 3(x + 1)."}, {"id": "ch04-s5-turn", "kind": "turn", "text": "Factorise 14y − 21.", "answer": "7(2y − 3)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "7(2y-3)"}, {"kind": "form", "value": "7(-3+2y)"}, {"kind": "form", "value": "-7(3-2y)"}]}], "accepts": ["7(2y − 3)", "7(2y-3)", "-7(3 - 2y)"], "rejects": ["7(2y − 21)", "2y − 3", "7(14y − 21)", "-7y"], "mistakes": []}}, {"id": "ch04-s5-sayBack", "kind": "sayBack", "text": "To factorise, take the HCF outside a bracket, then check by expanding."}]}, {"id": "ch04-s6", "heading": "4.6 Two brackets", "excerpt": "No. The new photo is 9 cm by 8 cm, so its area is 72 cm². Kym counted the old photo and the small corner, but she left out two strips. One strip is 3 by 6 and the other is 6 by 2.", "teaches": ["quadratic-expression"], "steps": [{"id": "ch04-s6-question", "kind": "question", "text": "A square photo is 6 cm by 6 cm. A border makes it 3 cm longer and 2 cm taller, so it is 9 cm by 8 cm. Kym says the new area is 6 × 6 + 3 × 2 = 42 cm². Is she right?"}, {"id": "ch04-s6-idea", "kind": "idea", "text": "No. The new photo is 9 cm by 8 cm, so its area is 72 cm². Kym counted the old photo and the small corner, but she left out two strips. One strip is 3 by 6 and the other is 6 by 2."}, {"id": "ch04-s6-picture", "kind": "picture", "text": "Draw the 9 by 8 rectangle and cut it into four pieces. They hold 6 × 6 = 36, 3 × 6 = 18, 6 × 2 = 12 and 3 × 2 = 6, which make 72. In the figure, set the side to 6, the first number to 3 and the second number to 2."}, {"id": "ch04-s6-reason", "kind": "reason", "text": "Now let the side of the square be x. The four pieces are x², 3x, 2x and 6. So (x + 3)(x + 2) = x² + 3x + 2x + 6, which is x² + 5x + 6. Each part of one bracket multiplies each part of the other."}, {"id": "ch04-s6-name", "kind": "name", "text": "An expression like x² + 5x + 6, where the highest power of x is 2, is called a quadratic expression. To expand two brackets, multiply each term of one by each term of the other. That makes four products, and the middle two are like terms."}, {"id": "ch04-s6-example", "kind": "example", "text": "Expand (x + 5)(x − 2). Draw a grid with x and 5 along the top and x and −2 down the side. The four boxes hold x², 5x, −2x and −10. The middle pair make 5x − 2x = 3x. So (x + 5)(x − 2) = x² + 3x − 10."}, {"id": "ch04-s6-mistake", "kind": "mistake", "text": "The famous trap is to write (x + 3)² as x² + 9. But (x + 3)² is (x + 3)(x + 3), and the square has two strips of 3x as well as its corners. So it is x² + 6x + 9. In the figure, set both numbers to 3 and look at the two blue strips. Test with x = 4: 7² = 49, and 16 + 24 + 9 = 49."}, {"id": "ch04-s6-turn", "kind": "turn", "text": "Expand and simplify (x + 4)(x + 6).", "answer": "x² + 10x + 24", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "x^2+10x+24"}, {"kind": "form", "value": "24+10x+x^2"}]}], "accepts": ["x² + 10x + 24", "x^2+10x+24", "x squared + 10x + 24"], "rejects": ["x² + 24", "x² + 10x + 10", "2x + 10"], "mistakes": []}}, {"id": "ch04-s6-sayBack", "kind": "sayBack", "text": "Multiply each term in one bracket by each term in the other, then collect the like terms."}], "figure": true}, {"id": "ch04-s7", "heading": "4.7 A square with a corner cut off", "excerpt": "Try smaller numbers first. 5² − 3² = 25 − 9 = 16, and (5 − 3) × (5 + 3) = 2 × 8 = 16 as well. 7² − 2² = 49 − 4 = 45, and 5 × 9 = 45. Each time, one square take away the other equals the gap times the total.", "teaches": ["difference-of-two-squares"], "steps": [{"id": "ch04-s7-question", "kind": "question", "text": "Work out 53² − 47² with no calculator. Squaring both numbers takes a long time. Is there a quicker way?"}, {"id": "ch04-s7-idea", "kind": "idea", "text": "Try smaller numbers first. 5² − 3² = 25 − 9 = 16, and (5 − 3) × (5 + 3) = 2 × 8 = 16 as well. 7² − 2² = 49 − 4 = 45, and 5 × 9 = 45. Each time, one square take away the other equals the gap times the total."}, {"id": "ch04-s7-picture", "kind": "picture", "text": "Draw a 5 by 5 square and cut a 3 by 3 square from one corner. The L-shape left over holds 16 small squares. Cut the L into two strips and lay them end to end. They make a rectangle 2 wide and 8 long."}, {"id": "ch04-s7-reason", "kind": "reason", "text": "The same cut works for any two numbers. A square of side a with a corner of side b cut away leaves an L-shape. It always rearranges into a rectangle a − b wide and a + b long. So a² − b² = (a − b)(a + b)."}, {"id": "ch04-s7-name", "kind": "name", "text": "An expression of the form a² − b² is called the difference of two squares. It factorises as (a − b)(a + b). Expanding shows why: the middle terms −ab and +ab cancel, leaving a² − b²."}, {"id": "ch04-s7-example", "kind": "example", "text": "Back to 53² − 47². It is (53 − 47)(53 + 47) = 6 × 100 = 600. The same idea factorises x² − 49, because 49 = 7². So x² − 49 = (x − 7)(x + 7)."}, {"id": "ch04-s7-mistake", "kind": "mistake", "text": "The trap is to treat a² − b² as (a − b)². Test it: 5² − 3² is 16, but (5 − 3)² is only 4. A second trap is a sum of two squares. x² + 49 does not split this way, because the middle terms would not cancel."}, {"id": "ch04-s7-turn", "kind": "turn", "text": "Work out 64² − 36² without a calculator.", "answer": "2,800", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2800"}]}], "accepts": ["2800", "2,800", "= 2800"], "rejects": ["784", "28", "100", "2880"], "mistakes": []}}, {"id": "ch04-s7-sayBack", "kind": "sayBack", "text": "A difference of two squares, a² − b², factorises as (a − b)(a + b)."}]}], "callouts": [{"id": "ch04-c-predict", "kind": "predict", "title": "Predict first", "body": "Before you touch the figure, predict: is (x + 3)² the same as x² + 9? Then set both numbers to 3 and count the pieces."}, {"id": "ch04-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why 3(x + 4) is 3x + 12 and not 3x + 4. Draw the rectangle to show it."}, {"id": "ch04-c-trap", "kind": "careful", "title": "Test with a number", "body": "After you expand or factorise, put a small number such as x = 2 into both forms. If the two answers differ, there is a slip somewhere."}], "keyTerms": ["Area", "Variable", "Expression", "Substitution", "Term", "Coefficient", "Like terms", "Expanding brackets", "Factorising", "Quadratic expression", "Difference of two squares"], "widgets": ["w_algebra_area_tiles", "w_difference_of_squares_slicer"], "debate": {"id": "debate-ch04-brackets", "chapterNumber": 4, "oupUnitNumber": 2, "title": "Squaring a bracket", "contextPrompt": "Rohan and Priya each multiply out (x + 5)².", "speakerAName": "Rohan", "speakerAClaim": "Square each part. (x + 5)² = x² + 25.", "speakerBName": "Priya", "speakerBClaim": "(x + 5)² is (x + 5)(x + 5), which is x² + 10x + 25.", "choices": [{"id": "ch04-a", "speakerLabel": "Rohan is right (x² + 25)", "reasoningStatement": "A square of a bracket is the square of each part.", "isCorrect": false, "socraticRebuttal": "Try x = 1. (1 + 5)² = 36, but 1 + 25 = 26. Draw the square of side x + 5. What fills the two strips beside the x² piece?"}, {"id": "ch04-b", "speakerLabel": "Priya is right (x² + 10x + 25)", "reasoningStatement": "Each term of one bracket multiplies each term of the other.", "isCorrect": true, "socraticRebuttal": "Yes. The two strips are 5x each, so together they add 10x. Check with x = 1: 1 + 10 + 25 = 36, and 6² = 36."}, {"id": "ch04-c", "speakerLabel": "Neither. It is 2x + 10.", "reasoningStatement": "Squaring means doubling.", "isCorrect": false, "socraticRebuttal": "Squaring means multiplying a number by itself, not by 2. When x = 1, (x + 5)² is 36, but 2x + 10 is only 12."}], "invariantTakeaway": "A squared bracket is two brackets multiplied: (a + b)² = a² + 2ab + b²."}}, {"id": "ch05", "number": 5, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "Equations, formulas and inequalities", "subtitle": "School book chapter 7 · Solving equations, writing and turning round formulas, and inequalities", "hookSummary": "4 bags of marbles and 3 loose marbles balance 15 marbles. How many marbles are in a bag, without opening one?", "beyondSchoolBook": false, "skillCard": {"skill": "Solving equations and inequalities, and turning a formula round", "sheCan": {"prompt": "With no calculator: solve 6x − 5 = 2x + 11. Make r the subject of A = 3r + 7. Solve 4 − 2x < 10.", "answer": "x = 4. r = (A − 7) ÷ 3. x > −3."}, "whyItMatters": "Most problems hide one unknown number inside a rule. Doing the same to both sides finds it, and turning a formula round answers the question the other way.", "standsOn": ["Chapter 4: expressions, expanding brackets and substitution", "Multiplying and dividing negative numbers", "Ordering numbers on a number line"], "unlocks": ["Chapter 6: finding where a number sits in a list that grows by the same step", "Chapter 7: finding where two straight lines cross", "Every later chapter that finds a missing length, angle or amount"]}, "intuitionToFormula": {"concreteAction": "Set the bags to 4, the loose marbles to 3 and the marbles in a bag to 3. The right pan shows 15 marbles.", "ahaInvariant": "Take 3 marbles off both pans, and 4 bags balance 12 marbles, so a bag holds 3. Each step changes both pans by the same amount, so the beam stays level.", "formulaDisplay": "ax + b = c   ⇒   ax = c − b   ⇒   x = (c − b) ÷ a", "termMappings": [{"symbol": "ax", "visualPart": "The red bags on the left pan", "colorRole": "red", "meaning": "a bags, each holding x marbles"}, {"symbol": "b", "visualPart": "The blue loose marbles on the left pan", "colorRole": "blue", "meaning": "The marbles outside the bags"}, {"symbol": "c", "visualPart": "The amber marbles on the right pan", "colorRole": "amber", "meaning": "The total that balances the left pan"}, {"symbol": "x = (c − b) ÷ a", "visualPart": "The green lines", "colorRole": "green", "meaning": "Take b off both pans, then share among the a bags"}], "atlasFigureRef": "maths/ch05-balance-equations/index.html"}, "sections": [{"id": "ch05-s1", "heading": "5.1 Think of a number", "excerpt": "He runs her steps backwards. Her last step was adding 5, so he takes 5 away: 26 − 5 = 21. Before that she multiplied by 3, so he divides by 3: 21 ÷ 3 = 7. Her number was 7.", "teaches": ["equation", "inverse-operation"], "steps": [{"id": "ch05-s1-question", "kind": "question", "text": "Kym says: I thought of a number, multiplied it by 3 and then added 5. I got 26. Aarav finds her number without guessing. How does he do it?"}, {"id": "ch05-s1-idea", "kind": "idea", "text": "He runs her steps backwards. Her last step was adding 5, so he takes 5 away: 26 − 5 = 21. Before that she multiplied by 3, so he divides by 3: 21 ÷ 3 = 7. Her number was 7."}, {"id": "ch05-s1-picture", "kind": "picture", "text": "Draw a row of boxes joined by arrows: start, then × 3, then + 5, then 26. Under it, draw the arrows pointing the other way: 26, then − 5, then ÷ 3. The start box fills in as 7."}, {"id": "ch05-s1-reason", "kind": "reason", "text": "Why go back in reverse order? The last thing done is the first thing to undo. You take off your shoes before your socks. Check the answer forwards: 7 × 3 = 21 and 21 + 5 = 26."}, {"id": "ch05-s1-name", "kind": "name", "text": "Kym's puzzle, with n for her number, is 3n + 5 = 26. A statement that two expressions are equal is called an equation. It is true for some values of n only. Adding and taking away undo each other, and so do multiplying and dividing. They are inverse operations."}, {"id": "ch05-s1-example", "kind": "example", "text": "Aarav's puzzle is n ÷ 4 − 2 = 3. Undo the last step first: 3 + 2 = 5. Then undo the dividing: 5 × 4 = 20. His number was 20. Check: 20 ÷ 4 − 2 = 3."}, {"id": "ch05-s1-mistake", "kind": "mistake", "text": "The tempting slip is to undo the steps in the order they were done. Dividing 26 by 3 first gives 8⅔, and 8⅔ − 5 = 3⅔. Test it forwards: 3⅔ × 3 + 5 = 16, not 26. Another slip is to repeat a step. 26 + 5 does not undo adding 5."}, {"id": "ch05-s1-turn", "kind": "turn", "text": "I think of a number, multiply it by 5 and take away 4. The answer is 31. What was my number?", "answer": "7", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "7"}]}], "accepts": ["7", "n = 7", "= 7"], "rejects": ["5.4", "35", "151"], "mistakes": []}}, {"id": "ch05-s1-sayBack", "kind": "sayBack", "text": "Undo each step with its inverse operation, starting from the last step."}]}, {"id": "ch05-s2", "heading": "5.2 Keeping the balance", "excerpt": "Take 3 marbles off each pan. The beam stays level, and now 4 bags balance 12 marbles. Share the 12 marbles among the 4 bags, so each bag holds 3.", "teaches": ["solving-equations"], "steps": [{"id": "ch05-s2-question", "kind": "question", "text": "On a balance, 4 bags of marbles and 3 loose marbles balance 15 loose marbles. Every bag holds the same number. How many marbles are in one bag?"}, {"id": "ch05-s2-idea", "kind": "idea", "text": "Take 3 marbles off each pan. The beam stays level, and now 4 bags balance 12 marbles. Share the 12 marbles among the 4 bags, so each bag holds 3."}, {"id": "ch05-s2-picture", "kind": "picture", "text": "In the figure, set the bags to 4, the loose marbles to 3 and the marbles in a bag to 3. The right pan shows 15. Each green line changes both pans in the same way."}, {"id": "ch05-s2-reason", "kind": "reason", "text": "Why must both pans change together? They are level because both sides weigh the same. Take the same amount from each, and they still weigh the same. Take it from one pan only, and the beam tips."}, {"id": "ch05-s2-name", "kind": "name", "text": "With b for the marbles in a bag, the balance is 4b + 3 = 15. To solve an equation, do the same thing to both sides until the letter stands alone. The value you find, here b = 3, is the solution. Put it back to check: 4 × 3 + 3 = 15."}, {"id": "ch05-s2-example", "kind": "example", "text": "Bags can sit on both pans. Solve 7x − 4 = 3x + 20. Take 3x from both sides: 4x − 4 = 20. Add 4 to both sides: 4x = 24. Divide both sides by 4: x = 6. Check: 7 × 6 − 4 = 38, and 3 × 6 + 20 = 38."}, {"id": "ch05-s2-mistake", "kind": "mistake", "text": "The common slip is to carry 3x to the other side and keep its sign, which gives 10x − 4 = 20. Taking 3x from the right means taking 3x from the left as well. If a solution fails its check, look for a step done to one side only."}, {"id": "ch05-s2-turn", "kind": "turn", "text": "Solve 5x + 3 = 2x + 18.", "answer": "x = 5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5"}]}], "accepts": ["x = 5", "5", "x=5"], "rejects": ["7", "15", "3"], "mistakes": []}}, {"id": "ch05-s2-sayBack", "kind": "sayBack", "text": "Do the same to both sides until the letter stands alone, then check the solution."}], "figure": true}, {"id": "ch05-s3", "heading": "5.3 Brackets and fractions", "excerpt": "Each friend paid a third of ₹150, which is ₹50. Take off the ₹8 of popcorn, and a ticket costs ₹42.", "teaches": [], "steps": [{"id": "ch05-s3-question", "kind": "question", "text": "Three friends at the cinema each pay for a ticket and ₹8 of popcorn. Together they pay ₹150. What does one ticket cost?"}, {"id": "ch05-s3-idea", "kind": "idea", "text": "Each friend paid a third of ₹150, which is ₹50. Take off the ₹8 of popcorn, and a ticket costs ₹42."}, {"id": "ch05-s3-picture", "kind": "picture", "text": "Draw three equal bars side by side. Split each bar into a ticket piece and a popcorn piece of 8. The three bars together are 150, so one bar is 50 and its ticket piece is 42."}, {"id": "ch05-s3-reason", "kind": "reason", "text": "With t for the ticket price, the bill is 3(t + 8) = 150. Dividing both sides by 3 gives t + 8 = 50, so t = 42. Expanding first works too: 3t + 24 = 150, so 3t = 126 and t = 42."}, {"id": "ch05-s3-name", "kind": "name", "text": "Brackets and fractions do not change the method. Expand the brackets, or divide both sides by the number outside them. To clear a fraction, multiply both sides by its bottom number. Then gather the letters on one side and the numbers on the other."}, {"id": "ch05-s3-example", "kind": "example", "text": "Solve 4(2x − 1) = 3(x + 7). Expand both sides: 8x − 4 = 3x + 21. Take 3x from both sides: 5x − 4 = 21. Add 4 to both sides: 5x = 25, so x = 5. Check: 4 × 9 = 36, and 3 × 12 = 36."}, {"id": "ch05-s3-mistake", "kind": "mistake", "text": "The usual slip with a fraction is to multiply only one term. In x/2 + 3 = 7, multiplying both sides by 2 gives x + 6 = 14, not x + 3 = 14. The 3 is doubled too. So x = 8, and 8 ÷ 2 + 3 = 7."}, {"id": "ch05-s3-turn", "kind": "turn", "text": "Solve (x − 4)/5 = 3.", "answer": "x = 19", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "19"}]}], "accepts": ["x = 19", "19", "x=19"], "rejects": ["11", "15", "4.6"], "mistakes": []}}, {"id": "ch05-s3-sayBack", "kind": "sayBack", "text": "Clear the brackets and fractions first, then do the same to both sides as before."}]}, {"id": "ch05-s4", "heading": "5.4 A rule with a name", "excerpt": "A 9 km ride costs 50 + 12 × 9 = ₹158. Every ride costs ₹50 plus 12 times the distance. With C for the cost in rupees and d for the distance in km, C = 50 + 12d.", "teaches": ["formula"], "steps": [{"id": "ch05-s4-question", "kind": "question", "text": "A taxi charges ₹50 to start and ₹12 for each kilometre. What does a 9 km ride cost? Can one line give the cost of every ride?"}, {"id": "ch05-s4-idea", "kind": "idea", "text": "A 9 km ride costs 50 + 12 × 9 = ₹158. Every ride costs ₹50 plus 12 times the distance. With C for the cost in rupees and d for the distance in km, C = 50 + 12d."}, {"id": "ch05-s4-picture", "kind": "picture", "text": "Make a table of distances and costs. 1 km costs ₹62, 2 km costs ₹74 and 3 km costs ₹86. Each extra kilometre adds ₹12, and one rule turns any distance into its cost."}, {"id": "ch05-s4-reason", "kind": "reason", "text": "Why write C = in front, and not only 50 + 12d? The letter C names the amount the rule gives. The rule now links two amounts that change together, and a reader can tell which is which."}, {"id": "ch05-s4-name", "kind": "name", "text": "A rule like C = 50 + 12d, which links two or more quantities with an = sign, is called a formula. Each letter stands for a named quantity with a unit. To use a formula, substitute the numbers you know."}, {"id": "ch05-s4-example", "kind": "example", "text": "The perimeter P of a rectangle L cm long and w cm wide is P = 2(L + w). A rectangle 7 cm by 4 cm has P = 2 × 11 = 22 cm. The formula P = 2L + 2w gives the same answer, because it is the bracket expanded."}, {"id": "ch05-s4-mistake", "kind": "mistake", "text": "One slip is to add 50 + 12 first in C = 50 + 12d, which gives 62d. Multiplying comes before adding, so a 9 km ride costs ₹158, not ₹558. Another slip is to drop the units, so nobody can tell whether d is in km or m."}, {"id": "ch05-s4-turn", "kind": "turn", "text": "A concert ticket costs ₹150, and each order pays a ₹40 booking fee. Write a formula for the cost C, in rupees, of an order of n tickets.", "answer": "C = 150n + 40", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "C=150n+40"}, {"kind": "form", "value": "C=40+150n"}]}], "accepts": ["C = 150n + 40", "C = 40 + 150n", "c=150n+40"], "rejects": ["C = 190n", "C = 150 + 40n", "C = 40n + 150"], "mistakes": []}}, {"id": "ch05-s4-sayBack", "kind": "sayBack", "text": "A formula links named quantities, and you use it by substituting the ones you know."}]}, {"id": "ch05-s5", "heading": "5.5 Turning a formula round", "excerpt": "Work backwards from the cost. Take away the ₹50 start charge: 170 − 50 = 120. Divide by the ₹12 for each kilometre: 120 ÷ 12 = 10. Meera went 10 km.", "teaches": ["subject-of-a-formula"], "steps": [{"id": "ch05-s5-question", "kind": "question", "text": "The taxi's rule is C = 50 + 12d. Meera's ride cost ₹170. How far did she go? Is there a rule that turns any cost straight into a distance?"}, {"id": "ch05-s5-idea", "kind": "idea", "text": "Work backwards from the cost. Take away the ₹50 start charge: 170 − 50 = 120. Divide by the ₹12 for each kilometre: 120 ÷ 12 = 10. Meera went 10 km."}, {"id": "ch05-s5-picture", "kind": "picture", "text": "Draw the rule as a chain: d, then × 12, then + 50, then C. Turn every arrow round: C, then − 50, then ÷ 12, then d."}, {"id": "ch05-s5-reason", "kind": "reason", "text": "Why do the same steps work for any cost? They are inverse operations in reverse order. Nothing in them depends on the 170. Write C in place of 170, and the chain gives d = (C − 50) ÷ 12."}, {"id": "ch05-s5-name", "kind": "name", "text": "The letter standing alone on one side is the subject of the formula. In C = 50 + 12d the subject is C. Rewriting it as d = (C − 50)/12 is called changing the subject. Do the same to both sides, as when you solve an equation."}, {"id": "ch05-s5-example", "kind": "example", "text": "Make t the subject of v = u + at. Take u from both sides: v − u = at. Divide both sides by a: t = (v − u)/a. Check with u = 2, a = 3 and t = 4. Then v = 14, and (14 − 2)/3 = 4."}, {"id": "ch05-s5-mistake", "kind": "mistake", "text": "The tempting slip is to write d = C − 50/12. That divides only the 50. The whole of C − 50 is divided by 12, so it needs a bracket. Test with C = 170: (170 − 50)/12 = 10, but 170 − 50/12 is about 166."}, {"id": "ch05-s5-turn", "kind": "turn", "text": "Make x the subject of y = 4x − 3.", "answer": "x = (y + 3)/4", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "x=(y+3)/4"}, {"kind": "form", "value": "x=(3+y)/4"}, {"kind": "form", "value": "x=y/4+3/4"}, {"kind": "form", "value": "x=(y+3)÷4"}]}], "accepts": ["x = (y + 3)/4", "x = (3 + y)/4", "x = (y + 3) ÷ 4"], "rejects": ["x = (y − 3)/4", "x = y + 3/4", "x = 4y + 3"], "mistakes": []}}, {"id": "ch05-s5-sayBack", "kind": "sayBack", "text": "To change the subject, undo what was done to the letter, in reverse order, on both sides."}]}, {"id": "ch05-s6", "heading": "5.6 More than, less than", "excerpt": "Aarav can ride, because 120 cm counts. Kym cannot. Any height of 120 cm or more is allowed. With h for a height in cm, the rule is h ≥ 120.", "teaches": ["inequality"], "steps": [{"id": "ch05-s6-question", "kind": "question", "text": "A ride at the fair says riders must be at least 120 cm tall. Kym is 118 cm and Aarav is 120 cm. Who can ride, and how do you write the rule?"}, {"id": "ch05-s6-idea", "kind": "idea", "text": "Aarav can ride, because 120 cm counts. Kym cannot. Any height of 120 cm or more is allowed. With h for a height in cm, the rule is h ≥ 120."}, {"id": "ch05-s6-picture", "kind": "picture", "text": "On a number line, put a filled dot at 120 and shade everything to its right. The filled dot means 120 itself is allowed. For the rule h > 120, the dot would be an open circle, because 120 would not be allowed."}, {"id": "ch05-s6-reason", "kind": "reason", "text": "Why can you solve 3x + 4 < 19 like an equation? Adding, taking away, and multiplying or dividing by a positive number keep two numbers in the same order. So 3x < 15 and x < 5. Test x = 4: 16 < 19 is true. Test x = 6: 22 < 19 is false."}, {"id": "ch05-s6-name", "kind": "name", "text": "A statement that uses <, >, ≤ or ≥ is called an inequality. Its answer is a whole stretch of numbers. On a number line, an open circle leaves the end out and a filled dot puts it in. Multiplying or dividing both sides by a negative number turns the sign round."}, {"id": "ch05-s6-example", "kind": "example", "text": "Solve 5 − 2x > 11. Take 5 from both sides: −2x > 6. Divide both sides by −2 and turn the sign round: x < −3. Test x = −4: 5 + 8 = 13, and 13 > 11 is true."}, {"id": "ch05-s6-mistake", "kind": "mistake", "text": "The famous slip is to divide by −2 and keep the sign, which gives x > −3. Test x = 0, which that answer allows: 5 − 0 = 5, and 5 > 11 is false. Multiplying by −1 swaps the two sides of 0 on the number line, so the order turns round."}, {"id": "ch05-s6-turn", "kind": "turn", "text": "Solve 7 − 3x ≤ 19.", "answer": "x ≥ −4", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "x>=-4"}, {"kind": "form", "value": "-4<=x"}]}], "accepts": ["x ≥ −4", "x >= -4", "-4 ≤ x"], "rejects": ["x ≤ −4", "x ≥ 4", "x ≤ 4"], "mistakes": []}}, {"id": "ch05-s6-sayBack", "kind": "sayBack", "text": "Solve an inequality like an equation, but turn the sign round when you multiply or divide by a negative."}]}], "callouts": [{"id": "ch05-c-predict", "kind": "predict", "title": "Predict first", "body": "Predict first: 6 bags and 2 loose marbles balance 20 marbles. How many marbles are in a bag? Then set the bags to 6 and the loose marbles to 2, and move the last slider until the right pan shows 20."}, {"id": "ch05-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why, to find the number someone thought of, you undo their last step first."}, {"id": "ch05-c-trap", "kind": "careful", "title": "Both sides, every time", "body": "Whatever you do to one side of an equation, do to the other side too. Then put your answer back into the first equation and check that both sides match."}], "keyTerms": ["Equation", "Inverse operation", "Solving an equation", "Formula", "Subject of a formula", "Inequality"], "widgets": ["w_balance_beam_equations", "w_formula_subject_transposer", "w_inequality_mirror_line"], "debate": {"id": "debate-ch05-equations", "chapterNumber": 5, "oupUnitNumber": 7, "title": "Dividing by a negative", "contextPrompt": "Neha and Kabir each solve −2x < 8.", "speakerAName": "Neha", "speakerAClaim": "Divide both sides by −2. x < −4.", "speakerBName": "Kabir", "speakerBClaim": "Dividing by −2 turns the sign round. x > −4.", "choices": [{"id": "ch05-a", "speakerLabel": "Neha is right (x < −4)", "reasoningStatement": "Whatever you do to one side you do to the other, and the sign stays as it is.", "isCorrect": false, "socraticRebuttal": "Try x = 0. Then −2x is 0, and 0 < 8 is true, so 0 is in the answer. Does x < −4 allow 0?"}, {"id": "ch05-b", "speakerLabel": "Kabir is right (x > −4)", "reasoningStatement": "Dividing by a negative number turns the order of two numbers round.", "isCorrect": true, "socraticRebuttal": "Yes. Test x = −5, which Kabir's answer leaves out: −2 × −5 = 10, and 10 < 8 is false."}, {"id": "ch05-c", "speakerLabel": "Neither. It is x < 4.", "reasoningStatement": "The two minus signs cancel.", "isCorrect": false, "socraticRebuttal": "Try x = −10, which x < 4 allows. Then −2x is 20, and 20 < 8 is false."}], "invariantTakeaway": "Multiplying or dividing an inequality by a negative number turns its sign round: if a < b, then −a > −b."}}, {"id": "ch06", "number": 6, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "Sequences and the nth term", "subtitle": "School book chapter 11 · Term-to-term rules, the nth term, quadratic sequences and adding a staircase", "hookSummary": "A row of 10 squares made of matchsticks needs 31 matches, not 40. How many does a row of 100 squares need, without counting?", "beyondSchoolBook": false, "skillCard": {"skill": "Finding and using the nth term of a sequence", "sheCan": {"prompt": "With no calculator: find the nth term of 6, 11, 16, 21. Is 100 a term of it? Work out 1 + 2 + 3 + … + 50.", "answer": "5n + 1. No, because 5n + 1 = 100 gives n = 19.8. 1275."}, "whyItMatters": "A rule for the nth term jumps straight to the 100th term without writing out the 99 before it. The same habit, finding the rule behind a list, is how a line drawn on a grid is read in the next chapter.", "standsOn": ["Chapter 4: expressions and substitution", "Chapter 5: solving an equation", "Square numbers and the times tables"], "unlocks": ["Chapter 7: lines drawn on a grid, whose points go up in equal steps", "Adding up equal steps, as in saving the same amount each month", "Later chapters on sequences that grow by multiplying"]}, "intuitionToFormula": {"concreteAction": "Set the terms to 5, the first term to 1 and the common difference to 1. The red columns make a staircase 1, 2, 3, 4, 5 high.", "ahaInvariant": "A blue copy of the staircase, turned upside down, fills the gaps above it. Every column is then 6 high, so the rectangle holds 5 × 6 = 30 squares and one staircase holds 15.", "formulaDisplay": "Tₙ = a + (n − 1)d   and   1 + 2 + … + n = n(n + 1) ÷ 2", "termMappings": [{"symbol": "a, a + d, a + 2d, …", "visualPart": "The red columns", "colorRole": "red", "meaning": "The terms of the sequence"}, {"symbol": "the same terms in reverse", "visualPart": "The blue columns", "colorRole": "blue", "meaning": "A copy turned upside down"}, {"symbol": "Tₙ = a + (n − 1)d", "visualPart": "The green line", "colorRole": "green", "meaning": "The nth term of the red staircase"}, {"symbol": "n(first + last) ÷ 2", "visualPart": "The amber line", "colorRole": "amber", "meaning": "Half the rectangle is the sum of the terms"}], "atlasFigureRef": "maths/ch06-sequences-gauss/index.html"}, "sections": [{"id": "ch06-s1", "heading": "6.1 What comes next?", "excerpt": "Each new square adds 3 matches, so 4 squares use 13. Keep adding 3: 16, 19, 22, 25, 28 and 31. A row of 10 squares uses 31 matches.", "teaches": ["sequence", "term-to-term-rule"], "steps": [{"id": "ch06-s1-question", "kind": "question", "text": "Kym makes a row of squares from matchsticks. 1 square uses 4 matches, 2 squares use 7 and 3 squares use 10. How many matches do 4 squares use? And 10 squares?"}, {"id": "ch06-s1-idea", "kind": "idea", "text": "Each new square adds 3 matches, so 4 squares use 13. Keep adding 3: 16, 19, 22, 25, 28 and 31. A row of 10 squares uses 31 matches."}, {"id": "ch06-s1-picture", "kind": "picture", "text": "Draw the rows of 1, 2, 3 and 4 squares, one under another. Write the count of matches beside each row: 4, 7, 10, 13. Between each pair of counts, write + 3."}, {"id": "ch06-s1-reason", "kind": "reason", "text": "Why 3 and not 4? The first square needs 4 matches. Each square after it borrows its left side from the square before, so it needs only 3 new matches."}, {"id": "ch06-s1-name", "kind": "name", "text": "A list of numbers made by a rule is called a sequence. Each number in it is a term. A rule that makes each term from the one before, like \"add 3\", is a term-to-term rule. The first term and the term-to-term rule fix every term after them."}, {"id": "ch06-s1-example", "kind": "example", "text": "Start at 2 and double each time: 2, 4, 8, 16, 32. The term-to-term rule is \"multiply by 2\". Start at 50 and take away 6 each time: 50, 44, 38, 32. The rule there is \"subtract 6\"."}, {"id": "ch06-s1-mistake", "kind": "mistake", "text": "The tempting slip is to say 10 squares need 10 × 4 = 40 matches. That counts each shared side twice. A row of 10 squares has 9 shared sides, and 40 − 9 = 31."}, {"id": "ch06-s1-turn", "kind": "turn", "text": "A sequence starts 3, 10, 17, 24. What is the next term?", "answer": "31", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "31"}]}], "accepts": ["31", "= 31", "the next term is 31"], "rejects": ["28", "30", "38"], "mistakes": []}}, {"id": "ch06-s1-sayBack", "kind": "sayBack", "text": "A sequence follows a rule, and a term-to-term rule makes each term from the one before."}]}, {"id": "ch06-s2", "heading": "6.2 Equal steps", "excerpt": "Take each term away from the next one. For the first list the gaps are 4, 4, 4 and 4. For the second they are 2, 4, 8 and 16. Only the first list grows in equal steps.", "teaches": ["common-difference", "arithmetic-sequence", "geometric-sequence"], "steps": [{"id": "ch06-s2-question", "kind": "question", "text": "Look at 5, 9, 13, 17, 21 and at 2, 4, 8, 16, 32. Both lists grow. Which one grows by the same amount every time?"}, {"id": "ch06-s2-idea", "kind": "idea", "text": "Take each term away from the next one. For the first list the gaps are 4, 4, 4 and 4. For the second they are 2, 4, 8 and 16. Only the first list grows in equal steps."}, {"id": "ch06-s2-picture", "kind": "picture", "text": "Draw each list as a row of columns, as tall as its terms. The first row climbs like a staircase with every step 4 high. The second row's steps keep doubling."}, {"id": "ch06-s2-reason", "kind": "reason", "text": "Why look at the gaps? Equal gaps mean the term-to-term rule is \"add the same number\". Then you can jump ahead without listing every term, as the next section shows."}, {"id": "ch06-s2-name", "kind": "name", "text": "When the gap between neighbouring terms is always the same, that gap is the common difference. A sequence with a common difference is an arithmetic sequence. A sequence that multiplies by the same number each time, like 2, 4, 8, 16, is a geometric sequence."}, {"id": "ch06-s2-example", "kind": "example", "text": "In 7, 4, 1, −2, −5 each term is 3 less than the one before. So it is an arithmetic sequence with common difference −3, and its next term is −8."}, {"id": "ch06-s2-mistake", "kind": "mistake", "text": "One slip is to give the common difference of 40, 35, 30 as 5. The terms go down, and 35 − 40 = −5. Another slip is to call 1, 4, 9, 16 arithmetic. Its gaps are 3, 5 and 7, which are not equal."}, {"id": "ch06-s2-turn", "kind": "turn", "text": "What is the common difference of 11, 8, 5, 2?", "answer": "−3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "-3"}]}], "accepts": ["−3", "-3", "d = −3"], "rejects": ["3", "2", "−2"], "mistakes": []}}, {"id": "ch06-s2-sayBack", "kind": "sayBack", "text": "An arithmetic sequence goes up or down by its common difference every time."}]}, {"id": "ch06-s3", "heading": "6.3 Jumping to any term", "excerpt": "The counts go up by 3, like the 3 times table: 3, 6, 9, 12. Each count is 1 more than that: 4, 7, 10, 13. So 100 squares use 3 × 100 + 1 = 301 matches.", "teaches": ["nth-term"], "steps": [{"id": "ch06-s3-question", "kind": "question", "text": "The matchstick rows used 4, 7, 10 and 13 matches. How many matches does a row of 100 squares use, without listing 100 terms?"}, {"id": "ch06-s3-idea", "kind": "idea", "text": "The counts go up by 3, like the 3 times table: 3, 6, 9, 12. Each count is 1 more than that: 4, 7, 10, 13. So 100 squares use 3 × 100 + 1 = 301 matches."}, {"id": "ch06-s3-picture", "kind": "picture", "text": "Make a table with three rows. The top row is the position: 1, 2, 3, 4. The middle row is 3 times the position: 3, 6, 9, 12. The bottom row is the matches: 4, 7, 10, 13."}, {"id": "ch06-s3-reason", "kind": "reason", "text": "Why 3 times the position? Every square adds 3 matches, so n squares add up to 3n of them. The + 1 is the single match on the far left that starts the row."}, {"id": "ch06-s3-name", "kind": "name", "text": "A rule that gives a term from its position n is called the nth term, or the position-to-term rule. For the matchsticks it is 3n + 1. In an arithmetic sequence, the number in front of n is the common difference."}, {"id": "ch06-s3-example", "kind": "example", "text": "Find the nth term of 5, 8, 11, 14. The common difference is 3, so start from 3n: 3, 6, 9, 12. Each term is 2 more, so the nth term is 3n + 2. The 20th term is 3 × 20 + 2 = 62."}, {"id": "ch06-s3-mistake", "kind": "mistake", "text": "The tempting slip is to write n + 3, because the terms go up by 3. That gives 4, 5, 6, 7. Another slip is to add the first term, as in 3n + 5, which starts at 8. Test n = 1 and n = 2 before you trust a rule."}, {"id": "ch06-s3-turn", "kind": "turn", "text": "Find the nth term of 9, 14, 19, 24.", "answer": "5n + 4", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "5n+4"}, {"kind": "form", "value": "4+5n"}]}], "accepts": ["5n + 4", "4 + 5n", "Tₙ = 5n + 4"], "rejects": ["n + 5", "5n + 9", "5n"], "mistakes": []}}, {"id": "ch06-s3-sayBack", "kind": "sayBack", "text": "Start the nth term from the common difference times n, then fix it so the first term is right."}]}, {"id": "ch06-s4", "heading": "6.4 Is it in the list?", "excerpt": "The rows have 12, 15, 18, … seats. They go up by 3, so start from 3n: 3, 6, 9. Each row has 9 more than that, so row n has 3n + 9. For 57 seats, 3n + 9 = 57, so 3n = 48 and n = 16. For 50 seats, 3n = 41 and n = 13⅔.", "teaches": [], "steps": [{"id": "ch06-s4-question", "kind": "question", "text": "In a hall, row 1 has 12 seats and each row has 3 more seats than the row in front. Which row has 57 seats? Does any row have exactly 50?"}, {"id": "ch06-s4-idea", "kind": "idea", "text": "The rows have 12, 15, 18, … seats. They go up by 3, so start from 3n: 3, 6, 9. Each row has 9 more than that, so row n has 3n + 9. For 57 seats, 3n + 9 = 57, so 3n = 48 and n = 16. For 50 seats, 3n = 41 and n = 13⅔."}, {"id": "ch06-s4-picture", "kind": "picture", "text": "Draw a number line and mark the seat counts 12, 15, 18 and on up to 57. The number 50 falls between 48 and 51, which are rows 13 and 14."}, {"id": "ch06-s4-reason", "kind": "reason", "text": "Why does 13⅔ mean no? Positions count rows: the 1st, the 2nd, the 3rd. There is no row 13⅔, so no row has exactly 50 seats."}, {"id": "ch06-s4-name", "kind": "name", "text": "To test whether a number is a term, set the nth term equal to it and solve the equation. A whole number answer is its position. Any other answer means it is not a term."}, {"id": "ch06-s4-example", "kind": "example", "text": "Is 99 a term of 7n − 6? Solve 7n − 6 = 99. Then 7n = 105, so n = 15. Yes, 99 is the 15th term. Check: 7 × 15 − 6 = 99."}, {"id": "ch06-s4-mistake", "kind": "mistake", "text": "The tempting slip is to put 50 in place of n: 3 × 50 + 9 = 159. That finds how many seats row 50 has. It does not find which row has 50 seats."}, {"id": "ch06-s4-turn", "kind": "turn", "text": "Which term of 5n − 2 is 83?", "answer": "the 17th", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "17"}]}], "accepts": ["17", "the 17th", "n = 17"], "rejects": ["413", "16.2", "81"], "mistakes": []}}, {"id": "ch06-s4-sayBack", "kind": "sayBack", "text": "Set the nth term equal to the number and solve. A whole number answer is its position."}]}, {"id": "ch06-s5", "heading": "6.5 When the steps grow", "excerpt": "The gaps 3, 5 and 7 are the first differences. Find the gaps between them: 5 − 3 = 2 and 7 − 5 = 2. Those are equal. The tile counts are 1 × 1, 2 × 2, 3 × 3 and 4 × 4, so the nth one is n².", "teaches": ["quadratic-sequence"], "steps": [{"id": "ch06-s5-question", "kind": "question", "text": "Kym builds squares of tiles: 1 tile, then 4, then 9, then 16. The gaps are 3, 5 and 7, so they are not equal. Is there still a rule?"}, {"id": "ch06-s5-idea", "kind": "idea", "text": "The gaps 3, 5 and 7 are the first differences. Find the gaps between them: 5 − 3 = 2 and 7 − 5 = 2. Those are equal. The tile counts are 1 × 1, 2 × 2, 3 × 3 and 4 × 4, so the nth one is n²."}, {"id": "ch06-s5-picture", "kind": "picture", "text": "Draw the squares of 1, 4 and 9 tiles inside one another. Each new square adds an L-shaped border of 3, then 5, then 7 tiles."}, {"id": "ch06-s5-reason", "kind": "reason", "text": "Why does each border grow by 2? A 3 by 3 square becomes 4 by 4 when you add a row of 3, a column of 3 and 1 corner. From n by n, the border is n + n + 1 = 2n + 1 tiles, which goes up by 2 each time."}, {"id": "ch06-s5-name", "kind": "name", "text": "The gaps between the first differences are the second differences. When the second differences are equal, and not 0, the list is a quadratic sequence. Its nth term has an n², and the number in front of n² is half the second difference."}, {"id": "ch06-s5-example", "kind": "example", "text": "Take 2, 6, 12, 20, 30. The first differences are 4, 6, 8, 10, and the second differences are all 2, so start from n². Take away 1, 4, 9, 16, 25 to leave 1, 2, 3, 4, 5, which is n. So the nth term is n² + n."}, {"id": "ch06-s5-mistake", "kind": "mistake", "text": "The usual slip is to put the second difference itself in front of n². With a second difference of 2, the rule 2n² gives 2, 8, 18, not 1, 4, 9. Halve the second difference first."}, {"id": "ch06-s5-turn", "kind": "turn", "text": "Find the nth term of 4, 7, 12, 19, 28.", "answer": "n² + 3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "form", "value": "n^2+3"}, {"kind": "form", "value": "3+n^2"}]}], "accepts": ["n² + 3", "n^2 + 3", "3 + n²"], "rejects": ["2n² + 3", "n² + 2", "3n + 1"], "mistakes": []}}, {"id": "ch06-s5-sayBack", "kind": "sayBack", "text": "Equal second differences mean a quadratic sequence, with half the second difference in front of n²."}]}, {"id": "ch06-s6", "heading": "6.6 Adding up a staircase", "excerpt": "Try 1 to 10 first. Pair the first number with the last: 1 + 10 = 11, then 2 + 9 = 11, and so on. There are 5 pairs of 11, which make 55. From 1 to 100 there are 50 pairs of 101, which make 5050.", "teaches": ["triangular-number"], "steps": [{"id": "ch06-s6-question", "kind": "question", "text": "A teacher once asked a class to add every whole number from 1 to 100. A boy called Gauss gave the answer in about a minute. How could he be so quick?"}, {"id": "ch06-s6-idea", "kind": "idea", "text": "Try 1 to 10 first. Pair the first number with the last: 1 + 10 = 11, then 2 + 9 = 11, and so on. There are 5 pairs of 11, which make 55. From 1 to 100 there are 50 pairs of 101, which make 5050."}, {"id": "ch06-s6-picture", "kind": "picture", "text": "In the figure, set the terms to 5, the first term to 1 and the common difference to 1. The red staircase 1, 2, 3, 4, 5 and the blue copy above it make a rectangle 5 wide and 6 high."}, {"id": "ch06-s6-reason", "kind": "reason", "text": "Why is every column the same height? Moving right, the red step rises by 1 and the blue step falls by 1. So each column stays 6 high, the rectangle holds 30 squares, and one staircase holds 15."}, {"id": "ch06-s6-name", "kind": "name", "text": "The totals 1, 3, 6, 10, 15 of 1 + 2 + … + n are the triangular numbers, and the nth one is n(n + 1) ÷ 2. The same pairing adds any arithmetic sequence. Multiply the number of terms by the first term plus the last, then halve."}, {"id": "ch06-s6-example", "kind": "example", "text": "Add 2 + 5 + 8 + … + 29. The nth term is 3n − 1, and 3n − 1 = 29 gives n = 10, so there are 10 terms. The sum is 10 × (2 + 29) ÷ 2 = 155."}, {"id": "ch06-s6-mistake", "kind": "mistake", "text": "The tempting slip is to forget the halving and say 1 + 2 + … + 100 = 100 × 101 = 10,100. The rectangle holds two staircases, so that counts every number twice."}, {"id": "ch06-s6-turn", "kind": "turn", "text": "Work out 1 + 2 + 3 + … + 40.", "answer": "820", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "820"}]}], "accepts": ["820", "= 820", "40 × 41 ÷ 2 = 820"], "rejects": ["1640", "800", "780"], "mistakes": []}}, {"id": "ch06-s6-sayBack", "kind": "sayBack", "text": "To add equal steps, multiply the number of terms by the first term plus the last, and halve."}], "figure": true}], "callouts": [{"id": "ch06-c-predict", "kind": "predict", "title": "Predict first", "body": "Predict 1 + 2 + 3 + … + 8 in your head. Then set the terms to 8, the first term to 1 and the common difference to 1, and read the amber line."}, {"id": "ch06-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why a row of 10 matchstick squares needs 31 matches and not 40."}, {"id": "ch06-c-trap", "kind": "careful", "title": "Test your rule", "body": "Before you use a rule to go further, try it on the terms you already have. Every one of them should fit."}], "keyTerms": ["Sequence", "Term-to-term rule", "Common difference", "Arithmetic sequence", "Geometric sequence", "nth term", "Quadratic sequence", "Triangular number"], "widgets": ["w_gauss_staircase_sum", "w_sequence_difference_engine"], "debate": {"id": "debate-ch06-sequences", "chapterNumber": 6, "oupUnitNumber": 11, "title": "Twice as many squares", "contextPrompt": "A row of 10 matchstick squares uses 31 matches, and the nth term is 3n + 1. Ishaan and Tara work out the matches for a row of 20 squares.", "speakerAName": "Ishaan", "speakerAClaim": "20 squares is twice 10 squares, so it needs twice 31. That is 62 matches.", "speakerBName": "Tara", "speakerBClaim": "Put n = 20 in the nth term. 3 × 20 + 1 = 61 matches.", "choices": [{"id": "ch06-a", "speakerLabel": "Ishaan is right (62)", "reasoningStatement": "Twice the squares always needs twice the matches.", "isCorrect": false, "socraticRebuttal": "Put two rows of 10 squares end to end. Where they meet, two matches stand side by side. Do you need both of them?"}, {"id": "ch06-b", "speakerLabel": "Tara is right (61)", "reasoningStatement": "The nth term gives any term from its position.", "isCorrect": true, "socraticRebuttal": "Yes. Doubling 3n + 1 gives 6n + 2, which counts the starting match twice. The real rule adds that match only once."}, {"id": "ch06-c", "speakerLabel": "Neither. It is 80.", "reasoningStatement": "Each square has 4 sides, and 20 × 4 = 80.", "isCorrect": false, "socraticRebuttal": "Count the matches in a row of 2 squares. Is it 8, or does one side belong to both?"}], "invariantTakeaway": "An nth term like 3n + 1 does not double when n doubles. Find any term by putting its position into the rule."}}, {"id": "ch07", "number": 7, "volumeNumber": 2, "volumeTitle": "Volume II · The Singapore Bar-Model & Algebraic Machine", "title": "Straight-line graphs", "subtitle": "School book chapter 14 · Function machines, coordinates, gradient, y = mx + c and real-life graphs", "hookSummary": "A taxi costs ₹50 to start and ₹20 for every kilometre. Mark the fares for 0 to 4 km as dots on squared paper. Why do the dots fall in a straight row?", "beyondSchoolBook": false, "skillCard": {"skill": "Drawing and reading a straight-line graph from its equation", "sheCan": {"prompt": "With no calculator: give the gradient of y = 3x − 2 and where it crosses the y-axis. Find the equation of the line through (1, 5) and (3, 9). Where does y = 2x + 5 cross the x-axis?", "answer": "Gradient 3, crossing the y-axis at (0, −2). y = 2x + 3. At (−2.5, 0)."}, "whyItMatters": "A straight line is the picture of a steady rate: a fare per kilometre, a speed, a price per kilo. Reading its steepness and its starting point answers questions without working out every value.", "standsOn": ["Chapter 6: the nth term of a sequence that goes up in equal steps", "Chapter 5: solving an equation and turning a formula round", "Negative numbers on a number line"], "unlocks": ["Solving two equations at once by finding where their lines cross", "Speed, rates and unit prices read from a graph", "Curved graphs such as y = x² in later chapters"]}, "intuitionToFormula": {"concreteAction": "Set the gradient to 2, where the line crosses the y-axis to 1 and the step across to 1. The blue line passes through (0, 1), and the step under it goes 1 across and 2 up.", "ahaInvariant": "Change the step across to 2 or 3. The rise grows with it, 4 up and then 6 up, so the rise divided by the run stays 2 wherever you draw the step.", "formulaDisplay": "y = mx + c,   gradient m = change in y ÷ change in x", "termMappings": [{"symbol": "the rise", "visualPart": "The red side of the step", "colorRole": "red", "meaning": "How far the line climbs over the dark step across"}, {"symbol": "y = mx + c", "visualPart": "The blue line", "colorRole": "blue", "meaning": "Every point whose y is m times its x, plus c"}, {"symbol": "(0, c)", "visualPart": "The green dot", "colorRole": "green", "meaning": "Where the line crosses the y-axis"}, {"symbol": "y = 0", "visualPart": "The amber line of text", "colorRole": "amber", "meaning": "Where the line crosses the x-axis"}], "atlasFigureRef": "maths/ch07-functions-graphs/index.html"}, "sections": [{"id": "ch07-s1", "heading": "7.1 Machines that follow a rule", "excerpt": "Each extra 1 going in adds 2 coming out, so the machine doubles. 4 doubled is 8, and 11 is 3 more, so it doubles, then adds 3. To get back from 31, take 3 to get 28, then halve to get 14.", "teaches": ["function-machine", "inverse-function"], "steps": [{"id": "ch07-s1-question", "kind": "question", "text": "Kym feeds 4 into a number machine and 11 comes out. Feeding in 5 gives 13, and 10 gives 23. What does the machine do? What went in if 31 came out?"}, {"id": "ch07-s1-idea", "kind": "idea", "text": "Each extra 1 going in adds 2 coming out, so the machine doubles. 4 doubled is 8, and 11 is 3 more, so it doubles, then adds 3. To get back from 31, take 3 to get 28, then halve to get 14."}, {"id": "ch07-s1-picture", "kind": "picture", "text": "Draw two boxes in a row: in, then × 2, then + 3, then out. Under them, draw the same two boxes with the arrows pointing back: − 3, then ÷ 2."}, {"id": "ch07-s1-reason", "kind": "reason", "text": "Why undo the steps in reverse order? The + 3 happened last, so it is the first thing to take off, the way you take off your shoes before your socks."}, {"id": "ch07-s1-name", "kind": "name", "text": "A rule that turns each input into exactly one output is called a function. A row of boxes showing its steps is a function machine, and we write the rule as f(x) = 2x + 3. Run backwards, each step undone in reverse order, it is the inverse function, f⁻¹(x) = (x − 3) ÷ 2. Say f⁻¹ as \"f inverse\". The small −1 is a label here, not a power."}, {"id": "ch07-s1-example", "kind": "example", "text": "Take f(x) = 5x − 4. Then f(3) = 5 × 3 − 4 = 11. The inverse adds 4, then divides by 5, so f⁻¹(x) = (x + 4) ÷ 5, and f⁻¹(11) = 15 ÷ 5 = 3."}, {"id": "ch07-s1-mistake", "kind": "mistake", "text": "The tempting slip is to undo the steps in the same order: halve first, then take 3. For 31 that gives 15.5 − 3 = 12.5, and 2 × 12.5 + 3 = 28, not 31."}, {"id": "ch07-s1-turn", "kind": "turn", "text": "f(x) = 3x − 7. What is f⁻¹(8)?", "answer": "5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5"}]}], "accepts": ["5", "= 5", "f⁻¹(8) = 5"], "rejects": ["17", "15", "1"], "mistakes": []}}, {"id": "ch07-s1-sayBack", "kind": "sayBack", "text": "A function machine follows its steps in order, and its inverse undoes them in reverse order."}]}, {"id": "ch07-s2", "heading": "7.2 Points on a grid", "excerpt": "The fares are 50, 70, 90, 110 and 130. For each pair, go across by the kilometres and up by the fare, and put a dot. Each dot is 1 across and 20 up from the one before, so the dots sit in a straight row.", "teaches": ["coordinates"], "steps": [{"id": "ch07-s2-question", "kind": "question", "text": "The taxi costs ₹50 to start and ₹20 for each kilometre. Make a table of the fares for 0, 1, 2, 3 and 4 km. Then mark each pair of numbers as a dot on squared paper. What shape do the dots make?"}, {"id": "ch07-s2-idea", "kind": "idea", "text": "The fares are 50, 70, 90, 110 and 130. For each pair, go across by the kilometres and up by the fare, and put a dot. Each dot is 1 across and 20 up from the one before, so the dots sit in a straight row."}, {"id": "ch07-s2-picture", "kind": "picture", "text": "Draw a line across the page for the kilometres, 0 to 4, and a line up the side for the fare, 0 to 140 in steps of 20. Put dots at 0 and 50, 1 and 70, 2 and 90, 3 and 110, and 4 and 130, then lay a ruler along them."}, {"id": "ch07-s2-reason", "kind": "reason", "text": "Why a straight row? Each extra kilometre adds the same ₹20. Equal steps across give equal steps up, like the arithmetic sequences of chapter 6."}, {"id": "ch07-s2-name", "kind": "name", "text": "The line across is the x-axis and the line up is the y-axis. They meet at the origin, (0, 0). A point is named by its coordinates (x, y): how far across, then how far up. The taxi's dots are (0, 50), (1, 70), (2, 90), (3, 110) and (4, 130)."}, {"id": "ch07-s2-example", "kind": "example", "text": "The point (3, −2) is 3 to the right of the origin and 2 down. The point (−4, 1) is 4 to the left and 1 up. The x-coordinate always comes first."}, {"id": "ch07-s2-mistake", "kind": "mistake", "text": "The tempting slip is to swap the numbers and put (2, 5) at 2 up and 5 across. Across comes first, in the same way that x comes before y in the alphabet."}, {"id": "ch07-s2-turn", "kind": "turn", "text": "Another taxi charges ₹30 to start and ₹15 for each kilometre. What is the y-coordinate of its point for 4 km?", "answer": "90", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "90"}]}], "accepts": ["90", "y = 90", "(4, 90)"], "rejects": ["60", "120", "4"], "mistakes": []}}, {"id": "ch07-s2-sayBack", "kind": "sayBack", "text": "Coordinates (x, y) say how far across, then how far up."}]}, {"id": "ch07-s3", "heading": "7.3 How steep?", "excerpt": "The first row goes up 20 for each 1 across. The second goes up 30 for each 1 across. So the second is steeper: it climbs ₹30 for every kilometre instead of ₹20.", "teaches": ["gradient"], "steps": [{"id": "ch07-s3-question", "kind": "question", "text": "For 0, 1 and 2 km, one taxi's fares are 50, 70 and 90, and another's are 50, 80 and 110. Draw both rows of dots. Which row is steeper, and by how much?"}, {"id": "ch07-s3-idea", "kind": "idea", "text": "The first row goes up 20 for each 1 across. The second goes up 30 for each 1 across. So the second is steeper: it climbs ₹30 for every kilometre instead of ₹20."}, {"id": "ch07-s3-picture", "kind": "picture", "text": "On the first row, draw a step from (1, 70) to (3, 110): 2 across, then 40 up. The step and the line make a right-angled triangle."}, {"id": "ch07-s3-reason", "kind": "reason", "text": "Why divide the rise by the run? A wider step has a bigger rise as well. 40 up for 2 across is as steep as 20 up for 1 across, and dividing gives 20 both times."}, {"id": "ch07-s3-name", "kind": "name", "text": "Divide the rise by the run to get the gradient of the line. Gradient = change in y ÷ change in x. A line that goes down from left to right has a negative gradient."}, {"id": "ch07-s3-example", "kind": "example", "text": "Between (−2, 1) and (4, 13), the change in y is 13 − 1 = 12 and the change in x is 4 − (−2) = 6. The gradient is 12 ÷ 6 = 2."}, {"id": "ch07-s3-mistake", "kind": "mistake", "text": "The tempting slip is to divide the run by the rise: 6 ÷ 12 = 0.5. Another is to subtract the y values one way round and the x values the other way, which flips the sign. Start from the same point both times."}, {"id": "ch07-s3-turn", "kind": "turn", "text": "What is the gradient of the line through (1, 9) and (4, 3)?", "answer": "−2", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "-2"}]}], "accepts": ["−2", "-2", "m = −2"], "rejects": ["2", "−0.5", "-0.5"], "mistakes": []}}, {"id": "ch07-s3-sayBack", "kind": "sayBack", "text": "The gradient is the rise divided by the run, and it is negative when the line goes down."}]}, {"id": "ch07-s4", "heading": "7.4 Reading a line's equation", "excerpt": "The fare is y = 20x + 50. At x = 0 it is 50, so the line crosses the y-axis at (0, 50). It climbs 20 for each kilometre, so its gradient is 20. Both numbers sit in the rule.", "teaches": ["intercept", "linear-graph"], "steps": [{"id": "ch07-s4-question", "kind": "question", "text": "The taxi costs ₹50 to start and ₹20 a kilometre. Write the fare y for x kilometres. Where does its line cross the y-axis, and what is its gradient?"}, {"id": "ch07-s4-idea", "kind": "idea", "text": "The fare is y = 20x + 50. At x = 0 it is 50, so the line crosses the y-axis at (0, 50). It climbs 20 for each kilometre, so its gradient is 20. Both numbers sit in the rule."}, {"id": "ch07-s4-picture", "kind": "picture", "text": "In the figure, set the gradient to 2, where the line crosses the y-axis to 1 and the step across to 1. The green dot is at (0, 1), and the step goes 1 across and 2 up."}, {"id": "ch07-s4-reason", "kind": "reason", "text": "Why is the number in front of x the gradient? Each time x goes up by 1, y goes up by that number. The number on its own is the value of y when x is 0, which is where the line meets the y-axis."}, {"id": "ch07-s4-name", "kind": "name", "text": "Any rule y = mx + c draws a straight line, called a straight-line graph or a linear graph. m is its gradient. The point (0, c), where it crosses the y-axis, is the y-intercept. The point where it crosses the x-axis, where y = 0, is the x-intercept."}, {"id": "ch07-s4-example", "kind": "example", "text": "y = 2x + 5 has gradient 2 and y-intercept (0, 5). For the x-intercept, set y = 0. Then 2x + 5 = 0, so 2x = −5 and x = −2.5. The line crosses the x-axis at (−2.5, 0)."}, {"id": "ch07-s4-mistake", "kind": "mistake", "text": "The tempting slip is to read the gradient of y = 7 − 3x as 7, because it comes first. Write it as y = −3x + 7. The gradient is −3 and the y-intercept is (0, 7)."}, {"id": "ch07-s4-turn", "kind": "turn", "text": "Where does y = 4x − 12 cross the x-axis? Give the value of x.", "answer": "3", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "3"}]}], "accepts": ["3", "x = 3", "(3, 0)"], "rejects": ["−12", "-12", "12", "−3"], "mistakes": []}}, {"id": "ch07-s4-sayBack", "kind": "sayBack", "text": "In y = mx + c, m is the gradient and c is where the line crosses the y-axis."}], "figure": true}, {"id": "ch07-s5", "heading": "7.5 Lines that never meet", "excerpt": "At every distance the second fare is ₹30 more: 80 against 50, 100 against 70, 120 against 90. The gap never closes, so the lines never meet.", "teaches": ["parallel-lines"], "steps": [{"id": "ch07-s5-question", "kind": "question", "text": "Two taxi firms both charge ₹20 a kilometre. One charges ₹50 to start and the other ₹80. Draw both lines. Will they ever meet?"}, {"id": "ch07-s5-idea", "kind": "idea", "text": "At every distance the second fare is ₹30 more: 80 against 50, 100 against 70, 120 against 90. The gap never closes, so the lines never meet."}, {"id": "ch07-s5-picture", "kind": "picture", "text": "Draw y = 20x + 50 and y = 20x + 80 on the same axes. The second line is the first one slid 30 straight up."}, {"id": "ch07-s5-reason", "kind": "reason", "text": "Why do they never meet? Both climb 20 for each 1 across, so the gap between them stays 30 however far you go."}, {"id": "ch07-s5-name", "kind": "name", "text": "Lines
