 is the mirror line. Reflecting in the y-axis changes the sign of the x-coordinate."}, {"id": "ch11-s3-example", "kind": "example", "text": "Reflect the point (4, 1) in the x-axis. It is 1 square above the mirror, so its image is 1 square below, at (4, −1)."}, {"id": "ch11-s3-mistake", "kind": "mistake", "text": "The tempting slip is to measure to the mirror along a slant. Always count straight across to the mirror, at a right angle to it."}, {"id": "ch11-s3-turn", "kind": "turn", "text": "Reflect the point (5, 3) in the y-axis. Where is its image?", "answer": "(−5, 3)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["-5", "3"]}]}], "accepts": ["(−5, 3)", "(-5, 3)", "−5, 3"], "rejects": ["(5, −3)", "(−5, −3)", "(3, 5)"], "mistakes": []}}, {"id": "ch11-s3-sayBack", "kind": "sayBack", "text": "A reflection sends each point to the far side of the mirror line, the same distance away, measured straight across."}]}, {"id": "ch11-s4", "heading": "11.4 Turning about a point", "excerpt": "At 3. The tip stays the same distance from the pin, and sweeps through 90°.", "teaches": ["rotation"], "steps": [{"id": "ch11-s4-question", "kind": "question", "text": "A clock hand turns about the pin in the middle. It points at 12. Where does its tip point after a quarter turn clockwise?"}, {"id": "ch11-s4-idea", "kind": "idea", "text": "At 3. The tip stays the same distance from the pin, and sweeps through 90°."}, {"id": "ch11-s4-picture", "kind": "picture", "text": "Plot (3, 1) and the point (0, 0). Lay tracing paper over them, pin it at (0, 0) with a pencil, and give it a half turn. The dot lands on (−3, −1)."}, {"id": "ch11-s4-reason", "kind": "reason", "text": "Why do both signs change in a half turn? A half turn sends every point straight through the pin. It ends up the same distance away on the other side."}, {"id": "ch11-s4-name", "kind": "name", "text": "Turning a shape about a fixed point is a rotation, and the fixed point is the centre of rotation. To describe one, give the centre, the angle, and clockwise or anticlockwise."}, {"id": "ch11-s4-example", "kind": "example", "text": "Rotate (4, 1) by 90° anticlockwise about (0, 0). The step 4 across and 1 up turns into 1 to the left and 4 up, so the image is (−1, 4)."}, {"id": "ch11-s4-mistake", "kind": "mistake", "text": "The tempting slip is to turn about a corner of the shape and forget the centre. Ask which point stays still, and turn about that one."}, {"id": "ch11-s4-turn", "kind": "turn", "text": "Rotate the point (2, 5) by 180° about (0, 0). Where does it land?", "answer": "(−2, −5)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["-2", "-5"]}]}], "accepts": ["(−2, −5)", "(-2, -5)", "−2, −5"], "rejects": ["(−2, 5)", "(2, −5)", "(5, 2)"], "mistakes": []}}, {"id": "ch11-s4-sayBack", "kind": "sayBack", "text": "A rotation turns every point about one centre through the same angle. Describe it by its centre, its angle and its direction."}]}, {"id": "ch11-s5", "heading": "11.5 Shapes that fit themselves", "excerpt": "Four: two folds across the middle and two folds from corner to corner. Each fold is a mirror that leaves the square looking as it did.", "teaches": ["symmetry"], "steps": [{"id": "ch11-s5-question", "kind": "question", "text": "Fold a paper square so that the two halves match exactly. How many different folds work?"}, {"id": "ch11-s5-idea", "kind": "idea", "text": "Four: two folds across the middle and two folds from corner to corner. Each fold is a mirror that leaves the square looking as it did."}, {"id": "ch11-s5-picture", "kind": "picture", "text": "Draw a square and its four folds. Put a dot in one corner, give the square a quarter turn, and watch it fit its outline again."}, {"id": "ch11-s5-reason", "kind": "reason", "text": "Why does a quarter turn fit? The four sides are equal and the four corners are equal. So after a quarter turn, each side lands where its neighbour was."}, {"id": "ch11-s5-name", "kind": "name", "text": "A mirror line that flips a shape onto itself is a line of symmetry. A shape that fits onto itself in less than a full turn has rotational symmetry. Its order is how many times it fits in one full turn."}, {"id": "ch11-s5-example", "kind": "example", "text": "A rectangle that is not a square has 2 lines of symmetry. A half turn fits it onto itself, so its order of rotational symmetry is 2."}, {"id": "ch11-s5-mistake", "kind": "mistake", "text": "The tempting slip is to count a rectangle's corner-to-corner folds as lines of symmetry. Fold one that way and its corners do not meet."}, {"id": "ch11-s5-turn", "kind": "turn", "text": "A regular hexagon has 6 equal sides and 6 equal corners. What is its order of rotational symmetry?", "answer": "6", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "6"}]}], "accepts": ["6", "order 6", "6 times"], "rejects": ["3", "2", "12"], "mistakes": []}}, {"id": "ch11-s5-sayBack", "kind": "sayBack", "text": "A line of symmetry flips a shape onto itself. The order of rotational symmetry counts how often it fits in one full turn."}]}, {"id": "ch11-s6", "heading": "11.6 Growing from a point", "excerpt": "At the torch bulb. Each ray starts there, passes a corner of the cut-out, and goes on to twice that distance to reach the shadow.", "teaches": ["enlargement", "scale-factor"], "steps": [{"id": "ch11-s6-question", "kind": "question", "text": "A torch shines on a cut-out triangle, and its shadow on the wall is twice as tall. Where do the edges of the light all meet?"}, {"id": "ch11-s6-idea", "kind": "idea", "text": "At the torch bulb. Each ray starts there, passes a corner of the cut-out, and goes on to twice that distance to reach the shadow."}, {"id": "ch11-s6-picture", "kind": "picture", "text": "In the figure, set the top slider to 2 and the centre to (0, 0). Each dashed line runs from C through a corner of PQR to a corner of P′Q′R′."}, {"id": "ch11-s6-reason", "kind": "reason", "text": "Why is P′ twice as far from C as P? Each corner moves along its own line from C, to twice the distance. So every side doubles as well."}, {"id": "ch11-s6-name", "kind": "name", "text": "Growing or shrinking a shape from a fixed point like this is an enlargement, and the point is the centre of enlargement. The number every length is multiplied by is the scale factor."}, {"id": "ch11-s6-example", "kind": "example", "text": "Enlarge P(3, 3) by scale factor 2 about C(0, 0). P is 3 across and 3 up from C, so P′ is 6 across and 6 up, at (6, 6). With scale factor ½, P′ would be at (1.5, 1.5), and the shape would shrink."}, {"id": "ch11-s6-mistake", "kind": "mistake", "text": "The tempting slip is to double the sides and draw the image anywhere. The centre fixes where it goes, so measure every distance from C."}, {"id": "ch11-s6-turn", "kind": "turn", "text": "Enlarge the point (2, 1) by scale factor 3 about (0, 0). Where does it land?", "answer": "(6, 3)", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "sequence", "values": ["6", "3"]}]}], "accepts": ["(6, 3)", "6, 3", "(6,3)"], "rejects": ["(5, 4)", "(6, 1)", "(2, 3)"], "mistakes": []}}, {"id": "ch11-s6-sayBack", "kind": "sayBack", "text": "An enlargement multiplies every distance from its centre by the scale factor. The image keeps its shape and the way it faces."}], "figure": true}, {"id": "ch11-s7", "heading": "11.7 Same shape, different size", "excerpt": "30 cm. The width has doubled, so the height must double too. Every length is multiplied by the same number.", "teaches": ["similar-shapes"], "steps": [{"id": "ch11-s7-question", "kind": "question", "text": "A photo is printed 10 cm wide and 15 cm tall. A bigger print is 20 cm wide. How tall must it be so that nobody in it looks stretched?"}, {"id": "ch11-s7-idea", "kind": "idea", "text": "30 cm. The width has doubled, so the height must double too. Every length is multiplied by the same number."}, {"id": "ch11-s7-picture", "kind": "picture", "text": "Draw a triangle with sides of 3 cm, 4 cm and 5 cm. Draw a second one with every side doubled: 6 cm, 8 cm and 10 cm. Measure the angles of both."}, {"id": "ch11-s7-reason", "kind": "reason", "text": "Why do the angles match? The second triangle is an enlargement of the first, and an enlargement keeps every angle. Only the lengths change, all by one scale factor."}, {"id": "ch11-s7-name", "kind": "name", "text": "Shapes like these are similar shapes: one is an enlargement of the other. Their angles are equal, and every pair of matching sides is in the same ratio. Congruent shapes are the case with scale factor 1."}, {"id": "ch11-s7-example", "kind": "example", "text": "A triangle with sides of 4, 6 and 8 cm matches one with sides of 6, 9 and 12 cm. Each side is multiplied by 1.5, so the two are similar shapes."}, {"id": "ch11-s7-mistake", "kind": "mistake", "text": "The tempting slip is to add the same amount to each side. Adding 2 cm to each side of the 3, 4, 5 triangle gives 5, 6, 7, which is a different shape."}, {"id": "ch11-s7-turn", "kind": "turn", "text": "Two triangles are similar shapes. The small one has sides of 3 cm, 4 cm and 5 cm. The large one's shortest side is 6 cm. How long is its longest side?", "answer": "10 cm", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "10"}]}], "accepts": ["10", "10 cm", "10cm"], "rejects": ["8", "7", "5"], "mistakes": []}}, {"id": "ch11-s7-sayBack", "kind": "sayBack", "text": "Similar shapes have equal angles, and every length in one is the matching length in the other times one scale factor."}]}, {"id": "ch11-s8", "heading": "11.8 What happens to the area", "excerpt": "No. The new tile is 3 cm by 3 cm, and 9 of the small tiles fit inside it.", "teaches": ["area-scale-factor"], "steps": [{"id": "ch11-s8-question", "kind": "question", "text": "A square floor tile with 1 cm sides is enlarged by scale factor 3. Is the new tile 3 times as big?"}, {"id": "ch11-s8-idea", "kind": "idea", "text": "No. The new tile is 3 cm by 3 cm, and 9 of the small tiles fit inside it."}, {"id": "ch11-s8-picture", "kind": "picture", "text": "Draw a 1 cm square, a 2 cm square and a 3 cm square on squared paper. Count the 1 cm squares inside each one: 1, then 4, then 9."}, {"id": "ch11-s8-reason", "kind": "reason", "text": "Why k × k? An area spreads across and up at once. Both directions are multiplied by the scale factor k, so the area is multiplied by k twice."}, {"id": "ch11-s8-name", "kind": "name", "text": "The number an area is multiplied by is the area scale factor. For an enlargement with scale factor k it is k². Volumes are multiplied by k³."}, {"id": "ch11-s8-example", "kind": "example", "text": "A triangle of area 6 cm² is enlarged by scale factor 3. Its new area is 3² × 6 = 9 × 6 = 54 cm²."}, {"id": "ch11-s8-mistake", "kind": "mistake", "text": "The tempting slip is to multiply the area by the scale factor itself. Doubling every side of a 5 cm² shape gives 20 cm², not 10 cm²."}, {"id": "ch11-s8-turn", "kind": "turn", "text": "A shape with an area of 5 cm² is enlarged by scale factor 4. What is its new area?", "answer": "80 cm²", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "80"}]}], "accepts": ["80", "80 cm²", "80 cm2"], "rejects": ["20", "25", "9"], "mistakes": []}}, {"id": "ch11-s8-sayBack", "kind": "sayBack", "text": "When lengths are multiplied by k, areas are multiplied by k², and volumes by k³."}]}], "callouts": [{"id": "ch11-c-predict", "kind": "predict", "title": "Predict first", "body": "Set the top slider to 3. Predict how many copies of the small blue triangle will fit inside the red one, then look."}, {"id": "ch11-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why sliding, flipping or turning a shape never changes its area, but growing it from a point does."}, {"id": "ch11-c-trap", "kind": "careful", "title": "Measure from the centre", "body": "When a shape turns or grows, every distance is measured from the centre. Pick the wrong centre and the image lands in the wrong place."}], "keyTerms": ["Transformation", "Translation", "Column vector", "Reflection", "Rotation", "Line and rotational symmetry", "Enlargement", "Scale factor", "Similar shapes", "Area scale factor"], "widgets": ["w_transformation_isometry_stage", "w_enlargement_ray_scaler"], "debate": {"id": "debate-ch11-transformations", "chapterNumber": 11, "oupUnitNumber": 13, "title": "Can an enlargement make a shape smaller?", "contextPrompt": "A triangle is enlarged by scale factor ½ about a point C. Asha and Rohan argue about the result.", "speakerAName": "Asha", "speakerAClaim": "Enlarging means making bigger. A scale factor of ½ is not allowed.", "speakerBName": "Rohan", "speakerBClaim": "A scale factor of ½ halves every distance from C. It is still an enlargement, and the image is smaller.", "choices": [{"id": "ch11-a", "speakerLabel": "Asha is right (it must grow)", "reasoningStatement": "In everyday words, to enlarge is to make bigger.", "isCorrect": false, "socraticRebuttal": "Follow the rule: multiply the distance from C by ½. Does anything in the rule stop you using ½?"}, {"id": "ch11-b", "speakerLabel": "Rohan is right (it can shrink)", "reasoningStatement": "The rule works for any scale factor, and ½ halves every length.", "isCorrect": true, "socraticRebuttal": "Yes. The image has the same shape and the same angles, with every side half as long. In maths the word covers shrinking too."}, {"id": "ch11-c", "speakerLabel": "Neither. It depends where C is.", "reasoningStatement": "If C is inside the triangle, the image might grow.", "isCorrect": false, "socraticRebuttal": "Put C anywhere and halve the distance from C to each corner. How long is each side of the image now?"}], "invariantTakeaway": "In maths an enlargement can shrink a shape: a scale factor between 0 and 1 makes every length smaller."}}, {"id": "ch12", "number": 12, "volumeNumber": 3, "volumeTitle": "Volume III · Euclid's Compass, Circles & Trigonometry", "title": "Pythagoras and trigonometry", "subtitle": "Beyond the school book · The longest side of a right-angled triangle, and the ratios that tie its sides to its angles", "hookSummary": "A ladder 5 m long leans on a wall, with its foot 3 m out. How high up the wall does it reach, without climbing it?", "beyondSchoolBook": true, "skillCard": {"skill": "Finding a missing side of a right-angled triangle, and linking its sides to its angles with sine, cosine and tangent", "sheCan": {"prompt": "With no calculator: a right-angled triangle has shorter sides of 5 cm and 12 cm. What is the length of its longest side? A ramp 10 m long makes 30° with the ground, and sin 30° = 0.5. How high does it rise?", "answer": "5² + 12² = 25 + 144 = 169, and 13² = 169, so the longest side is 13 cm. The ramp rises 10 × 0.5 = 5 m."}, "whyItMatters": "Builders, pilots and phone maps all find distances they cannot measure with a tape. They use a right-angled triangle and one of these rules.", "standsOn": ["Chapter 1: square numbers and square roots", "Chapter 8: angles and the right angle", "Chapter 10: the radius of a circle", "Chapter 11: similar shapes, which keep their ratios"], "unlocks": ["Chapter 17: slopes of curves, measured like the steepness of a ramp", "Chapter 19: vectors, whose lengths come from Pythagoras' theorem", "Chapter 20: matrices that turn a shape, built from sine and cosine"]}, "intuitionToFormula": {"concreteAction": "Set the angle θ to 30° and the radius to 2. Then move the radius slider up to 4, one step at a time.", "ahaInvariant": "The triangle grows, but its height ÷ radius stays 0.5 at 30°. The ratio belongs to the angle, not to the size of the triangle.", "formulaDisplay": "sin θ = height ÷ radius,   cos θ = across ÷ radius,   sin²θ + cos²θ = 1", "termMappings": [{"symbol": "sin θ", "visualPart": "The red side, straight up from the ground to P", "colorRole": "red", "meaning": "The height for every 1 unit of slope"}, {"symbol": "cos θ", "visualPart": "The blue side along the ground", "colorRole": "blue", "meaning": "The distance across for every 1 unit of slope"}, {"symbol": "radius", "visualPart": "The green slope from O to P", "colorRole": "green", "meaning": "The longest side, which the other two are divided by"}], "atlasFigureRef": "maths/unit-circle/index.html#1"}, "sections": [{"id": "ch12-s1", "heading": "12.1 The longest side", "excerpt": "The edge across from the square corner. The square corner is the biggest angle in the triangle, and the biggest angle faces the longest side.", "teaches": ["right-angled-triangle", "hypotenuse"], "steps": [{"id": "ch12-s1-question", "kind": "question", "text": "Pick up a set square. One of its corners is square, like the corner of a page. Which of its three edges is the longest?"}, {"id": "ch12-s1-idea", "kind": "idea", "text": "The edge across from the square corner. The square corner is the biggest angle in the triangle, and the biggest angle faces the longest side."}, {"id": "ch12-s1-picture", "kind": "picture", "text": "Draw a triangle with a square corner, with sides of 3 cm and 4 cm along it. Join their ends and measure the third side. It is 5 cm."}, {"id": "ch12-s1-reason", "kind": "reason", "text": "Why must it be the longest? The other two angles add up to 90°, so each is smaller than the square corner. A smaller angle faces a shorter side."}, {"id": "ch12-s1-name", "kind": "name", "text": "A triangle with one 90° corner is a right-angled triangle. The side across from the right angle is the hypotenuse, and it is always the longest side."}, {"id": "ch12-s1-example", "kind": "example", "text": "A triangle has sides of 6 cm, 8 cm and 10 cm, with the right angle between the 6 cm and 8 cm sides. The 10 cm side faces it, so 10 cm is the hypotenuse."}, {"id": "ch12-s1-mistake", "kind": "mistake", "text": "The tempting slip is to call the side at the bottom of the drawing the hypotenuse. Find the right angle first. The hypotenuse is the side that does not touch it."}, {"id": "ch12-s1-turn", "kind": "turn", "text": "A right-angled triangle has angles of 90° and 35°. What is its third angle, in degrees?", "answer": "55°", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "55"}]}], "accepts": ["55", "55°", "55 degrees"], "rejects": ["125", "145", "35"], "mistakes": []}}, {"id": "ch12-s1-sayBack", "kind": "sayBack", "text": "In a right-angled triangle, the side across from the right angle is the hypotenuse, the longest side."}]}, {"id": "ch12-s2", "heading": "12.2 Squares on the sides", "excerpt": "4 m. Draw a square on each side of the triangle. The two small squares together cover exactly as much as the big one.", "teaches": ["pythagoras-theorem"], "steps": [{"id": "ch12-s2-question", "kind": "question", "text": "A ladder 5 m long leans on a wall, with its foot 3 m out from the wall. How high up the wall does it reach?"}, {"id": "ch12-s2-idea", "kind": "idea", "text": "4 m. Draw a square on each side of the triangle. The two small squares together cover exactly as much as the big one."}, {"id": "ch12-s2-picture", "kind": "picture", "text": "On squared paper, draw the 3, 4, 5 triangle and a square on each side. Count the small squares: 9 and 16 on the short sides, 25 on the longest."}, {"id": "ch12-s2-reason", "kind": "reason", "text": "Why does it always work? Four copies of the triangle fit round a tilted square inside a big square. Move them and the space left over becomes the two smaller squares."}, {"id": "ch12-s2-name", "kind": "name", "text": "This is Pythagoras' theorem. In a right-angled triangle with shorter sides a and b and hypotenuse c, a² + b² = c²."}, {"id": "ch12-s2-example", "kind": "example", "text": "The shorter sides are 5 cm and 12 cm. Then c² = 25 + 144 = 169, and the square root of 169 is 13. So the hypotenuse is 13 cm."}, {"id": "ch12-s2-mistake", "kind": "mistake", "text": "The tempting slip is to add the sides themselves. 3 + 4 = 7, but the hypotenuse of the 3, 4, 5 triangle is 5. Square the sides first."}, {"id": "ch12-s2-turn", "kind": "turn", "text": "A right-angled triangle has shorter sides of 6 cm and 8 cm. How long is its hypotenuse?", "answer": "10 cm", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "10"}]}], "accepts": ["10", "10 cm", "10cm"], "rejects": ["14", "100", "48"], "mistakes": []}}, {"id": "ch12-s2-sayBack", "kind": "sayBack", "text": "The two shorter sides squared and added make the hypotenuse squared: a² + b² = c²."}]}, {"id": "ch12-s3", "heading": "12.3 How steep is a ramp", "excerpt": "Neither. Both rise a quarter of a metre for every metre along, so they make the same angle with the ground.", "teaches": ["theta", "tangent"], "steps": [{"id": "ch12-s3-question", "kind": "question", "text": "One ramp rises 1 m for every 4 m along the ground. Another rises 2 m for every 8 m. Which is steeper?"}, {"id": "ch12-s3-idea", "kind": "idea", "text": "Neither. Both rise a quarter of a metre for every metre along, so they make the same angle with the ground."}, {"id": "ch12-s3-picture", "kind": "picture", "text": "Draw a ramp 4 cm along and 1 cm up, and another 8 cm along and 2 cm up. Measure the angle at the bottom of each with a protractor."}, {"id": "ch12-s3-reason", "kind": "reason", "text": "Why the same angle? The big ramp is an enlargement of the small one with scale factor 2. Its rise and its run double together, so rise ÷ run stays the same."}, {"id": "ch12-s3-name", "kind": "name", "text": "The angle we are working with is often called θ, said theta. The rise ÷ the run is the tangent of θ, written tan θ. Each angle has its own tangent."}, {"id": "ch12-s3-example", "kind": "example", "text": "A ramp rises 2 m over 5 m along the ground. tan θ = 2 ÷ 5 = 0.4. Any ramp that rises 0.4 m per metre along makes the same angle θ."}, {"id": "ch12-s3-mistake", "kind": "mistake", "text": "The tempting slip is to divide the run by the rise. The rise goes on top, so a gentle ramp has a small tangent."}, {"id": "ch12-s3-turn", "kind": "turn", "text": "A ramp rises 3 m over 4 m along the ground. What is tan θ?", "answer": "0.75", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "0.75"}]}], "accepts": ["0.75", "3/4", "tan θ = 0.75"], "rejects": ["1.33", "7", "12"], "mistakes": []}}, {"id": "ch12-s3-sayBack", "kind": "sayBack", "text": "tan θ is the rise ÷ the run. It depends on the angle θ, not on how big the ramp is."}]}, {"id": "ch12-s4", "heading": "12.4 Height for every metre of slope", "excerpt": "Half a metre. At 30°, a ladder reaches up half of its own length, however long the ladder is.", "teaches": ["sine", "cosine"], "steps": [{"id": "ch12-s4-question", "kind": "question", "text": "A ladder leans at 30° to the ground. How high does it reach for every metre of its length?"}, {"id": "ch12-s4-idea", "kind": "idea", "text": "Half a metre. At 30°, a ladder reaches up half of its own length, however long the ladder is."}, {"id": "ch12-s4-picture", "kind": "picture", "text": "In the figure, set θ to 30° and the radius to 2. The red height is 1. Move the radius up to 4: the height grows to 2, and height ÷ radius stays 0.5."}, {"id": "ch12-s4-reason", "kind": "reason", "text": "Why does the ratio stay? Each bigger triangle is an enlargement of the first. Every side is multiplied by the same scale factor, so their ratios do not change."}, {"id": "ch12-s4-name", "kind": "name", "text": "The height ÷ the slope is the sine of θ, written sin θ. The distance across ÷ the slope is the cosine of θ, written cos θ. So sin 30° = 0.5."}, {"id": "ch12-s4-example", "kind": "example", "text": "A ladder 6 m long makes 30° with the ground. Its top is 6 × sin 30° = 6 × 0.5 = 3 m up the wall."}, {"id": "ch12-s4-mistake", "kind": "mistake", "text": "The tempting slip is to divide by the side along the ground. Sine and cosine divide by the slope, the hypotenuse. Only tangent divides by the run."}, {"id": "ch12-s4-turn", "kind": "turn", "text": "A ramp 8 m long makes 30° with the ground, and sin 30° = 0.5. How high does it rise?", "answer": "4 m", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "4"}]}], "accepts": ["4", "4 m", "4m"], "rejects": ["16", "8", "0.5"], "mistakes": []}}, {"id": "ch12-s4-sayBack", "kind": "sayBack", "text": "sin θ is height ÷ hypotenuse and cos θ is across ÷ hypotenuse. Both belong to the angle, whatever the size."}], "figure": true}, {"id": "ch12-s5", "heading": "12.5 One circle for every angle", "excerpt": "Your spoke is the hypotenuse, 1 unit long. So your height is sin θ and your distance across is cos θ.", "teaches": ["unit-circle", "pythagorean-identity"], "steps": [{"id": "ch12-s5-question", "kind": "question", "text": "You sit on a Ferris wheel whose spokes are 1 unit long. As it turns, how high above the hub and how far to the side are you?"}, {"id": "ch12-s5-idea", "kind": "idea", "text": "Your spoke is the hypotenuse, 1 unit long. So your height is sin θ and your distance across is cos θ."}, {"id": "ch12-s5-picture", "kind": "picture", "text": "Draw a circle of radius 10 cm centred on (0, 0). Mark the point at 30° round from the right. Measure its height, 5 cm, and its distance across, about 8.7 cm."}, {"id": "ch12-s5-reason", "kind": "reason", "text": "Why do the squares add up to 1? The height, the distance across and the spoke make a right-angled triangle. Pythagoras' theorem says height² + across² = 1²."}, {"id": "ch12-s5-name", "kind": "name", "text": "A circle of radius 1 centred on (0, 0) is the unit circle. The point at angle θ is (cos θ, sin θ). The rule sin²θ + cos²θ = 1 is the Pythagorean identity."}, {"id": "ch12-s5-example", "kind": "example", "text": "At 30°, sin θ = 0.5, so sin²θ = 0.25. Then cos²θ = 1 − 0.25 = 0.75, and cos 30° is about 0.866."}, {"id": "ch12-s5-mistake", "kind": "mistake", "text": "The tempting slip is to think sin θ + cos θ = 1. At 30° that would make cos 30° = 0.5. It is the squares that add to 1."}, {"id": "ch12-s5-turn", "kind": "turn", "text": "For an angle less than 90°, sin θ = 0.6. Use sin²θ + cos²θ = 1 to find cos θ.", "answer": "0.8", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "0.8"}]}], "accepts": ["0.8", "cos θ = 0.8", "4/5"], "rejects": ["0.4", "0.64", "0.36"], "mistakes": []}}, {"id": "ch12-s5-sayBack", "kind": "sayBack", "text": "On the unit circle the point at angle θ is (cos θ, sin θ), and sin²θ + cos²θ = 1 at every angle."}]}, {"id": "ch12-s6", "heading": "12.6 Measuring a turn by its arc", "excerpt": "A little less than 60°, about 57°. The angle depends only on how many radii fit along the arc, not on the size of the circle.", "teaches": ["radian"], "steps": [{"id": "ch12-s6-question", "kind": "question", "text": "Cut a piece of string as long as a circle's radius, and lay it round the edge of the circle. What angle does it make at the centre?"}, {"id": "ch12-s6-idea", "kind": "idea", "text": "A little less than 60°, about 57°. The angle depends only on how many radii fit along the arc, not on the size of the circle."}, {"id": "ch12-s6-picture", "kind": "picture", "text": "Draw a circle of radius 5 cm and bend a 5 cm strip of paper along its edge. Join both ends of the strip to the centre and measure the angle."}, {"id": "ch12-s6-reason", "kind": "reason", "text": "Why about 57°? The whole circumference is 2π radii long, about 6.28 of them. So one radius of arc is 360° ÷ 6.28, about 57.3°."}, {"id": "ch12-s6-name", "kind": "name", "text": "An angle whose arc is one radius long is 1 radian. A full turn is 2π radians and a half turn is π radians."}, {"id": "ch12-s6-example", "kind": "example", "text": "A half turn is 180°, which is π radians, about 3.14. So 90°, half of that, is π ÷ 2 radians, about 1.57."}, {"id": "ch12-s6-mistake", "kind": "mistake", "text": "The tempting slip is to read 1 radian as 1°. A radian is far bigger: about 57 degrees fit inside it."}, {"id": "ch12-s6-turn", "kind": "turn", "text": "A full turn is 2π radians, about 6.28. How many radians is a quarter turn, to 2 decimal places?", "answer": "1.57", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "1.57"}]}], "accepts": ["1.57", "1.57 radians", "about 1.57"], "rejects": ["90", "3.14", "6.28"], "mistakes": []}}, {"id": "ch12-s6-sayBack", "kind": "sayBack", "text": "One radian is the angle whose arc is one radius long. A full turn is 2π radians."}]}, {"id": "ch12-s7", "heading": "12.7 Triangles with no right angle", "excerpt": "Yes. Drop a line from one corner straight down to the opposite side. That splits the field into two right-angled triangles that share their height.", "teaches": ["sine-rule"], "steps": [{"id": "ch12-s7-question", "kind": "question", "text": "A field is a triangle with no square corner. Can you still find a side you cannot reach from a side and two angles you can measure?"}, {"id": "ch12-s7-idea", "kind": "idea", "text": "Yes. Drop a line from one corner straight down to the opposite side. That splits the field into two right-angled triangles that share their height."}, {"id": "ch12-s7-picture", "kind": "picture", "text": "Draw any triangle ABC and drop a line from C straight down to AB. Label the side across from A as a, and the side across from B as b."}, {"id": "ch12-s7-reason", "kind": "reason", "text": "Why do the two sides match up? The shared height is b × sin A in one triangle and a × sin B in the other. So b × sin A = a × sin B."}, {"id": "ch12-s7-name", "kind": "name", "text": "Divide both sides and you get the sine rule: a ÷ sin A = b ÷ sin B = c ÷ sin C. Each side ÷ the sine of the angle across from it gives the same number."}, {"id": "ch12-s7-example", "kind": "example", "text": "In a triangle, a = 6 cm, sin A = 0.5 and sin B = 0.8. Then b = 6 × 0.8 ÷ 0.5 = 9.6 cm."}, {"id": "ch12-s7-mistake", "kind": "mistake", "text": "The tempting slip is to pair a side with an angle at one of its own ends. Each side goes with the angle across from it."}, {"id": "ch12-s7-turn", "kind": "turn", "text": "In a triangle, a = 8 cm, sin A = 0.4 and sin B = 0.6. Use the sine rule to find b.", "answer": "12 cm", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "12"}]}], "accepts": ["12", "12 cm", "b = 12"], "rejects": ["5.33", "4.8", "3.2"], "mistakes": []}}, {"id": "ch12-s7-sayBack", "kind": "sayBack", "text": "In any triangle, each side ÷ the sine of the angle across from it gives the same number."}]}, {"id": "ch12-s8", "heading": "12.8 Pythagoras with a correction", "excerpt": "7 cm. With a right angle it would be about 9.4 cm, from Pythagoras' theorem. A smaller angle pulls the ends closer, so you take something away.", "teaches": ["cosine-rule"], "steps": [{"id": "ch12-s8-question", "kind": "question", "text": "Two sides of a triangle are 5 cm and 8 cm, with 60° between them. How long is the third side?"}, {"id": "ch12-s8-idea", "kind": "idea", "text": "7 cm. With a right angle it would be about 9.4 cm, from Pythagoras' theorem. A smaller angle pulls the ends closer, so you take something away."}, {"id": "ch12-s8-picture", "kind": "picture", "text": "Hinge two sticks of 5 cm and 8 cm together. Open them to 90°, then close them to 60°. Watch the gap between their free ends shrink."}, {"id": "ch12-s8-reason", "kind": "reason", "text": "Why take away 2ab cos C? Cosine measures how much one side leans along the other. At 90° the lean is zero and the rule turns back into Pythagoras' theorem."}, {"id": "ch12-s8-name", "kind": "name", "text": "The cosine rule says c² = a² + b² − 2ab cos C, where C is the angle between sides a and b."}, {"id": "ch12-s8-example", "kind": "example", "text": "Sides of 3 cm and 5 cm meet at 60°, and cos 60° = 0.5. Then c² = 9 + 25 − 2 × 3 × 5 × 0.5 = 19, so c is about 4.36 cm."}, {"id": "ch12-s8-mistake", "kind": "mistake", "text": "The tempting slip is to use an angle that is not between the two known sides. The angle C must sit where sides a and b meet."}, {"id": "ch12-s8-turn", "kind": "turn", "text": "Sides of 5 cm and 8 cm meet at 60°, and cos 60° = 0.5. Use the cosine rule to find the third side.", "answer": "7 cm", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "7"}]}], "accepts": ["7", "7 cm", "c = 7"], "rejects": ["49", "9.43", "13"], "mistakes": []}}, {"id": "ch12-s8-sayBack", "kind": "sayBack", "text": "The cosine rule c² = a² + b² − 2ab cos C is Pythagoras' theorem with a correction for the angle."}]}], "callouts": [{"id": "ch12-c-predict", "kind": "predict", "title": "Predict first", "body": "Set θ to 45°. Predict whether the red height or the blue side along the ground will be longer, then look."}, {"id": "ch12-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why sin 30° is 0.5 in every right-angled triangle with a 30° angle, from a set square to a mountain."}, {"id": "ch12-c-trap", "kind": "careful", "title": "Name the angle first", "body": "The side across from an angle and the side beside it swap when you move to the other angle. Name the angle you are working with, then name its sides."}], "keyTerms": ["Right-angled triangle", "Hypotenuse", "Pythagoras' theorem", "Theta", "Tangent", "Sine", "Cosine", "Unit circle", "Pythagorean identity", "Radian", "Sine rule", "Cosine rule"], "widgets": ["w_atlas_unit_circle", "w_pythagoras_garfield_proof", "w_cosine_rule_generaliser"], "debate": {"id": "debate-ch12-pythagoras-trig", "chapterNumber": 12, "oupUnitNumber": 8, "title": "Double the angle, double the sine?", "contextPrompt": "sin 30° = 0.5. Asha and Rohan argue about sin 60°.", "speakerAName": "Asha", "speakerAClaim": "60° is twice 30°, so sin 60° is twice 0.5. That makes it 1.", "speakerBName": "Rohan", "speakerBClaim": "sin 60° can't be 1. That would make the height as long as the slope, and only 90° does that.", "choices": [{"id": "ch12-a", "speakerLabel": "Asha is right (sin 60° = 1)", "reasoningStatement": "The angle doubles, so the height for every metre of slope doubles too.", "isCorrect": false, "socraticRebuttal": "If sin 60° were 1, the height would equal the slope. What would sin 90° be, and could any height be longer than the slope?"}, {"id": "ch12-b", "speakerLabel": "Rohan is right (sin 60° is less than 1)", "reasoningStatement": "The height can never be longer than the slope, and only a 90° angle makes them equal.", "isCorrect": true, "socraticRebuttal": "Yes. sin 60° is about 0.866. Doubling an angle does not double its sine: the height grows more and more slowly near 90°."}, {"id": "ch12-c", "speakerLabel": "Neither. It depends how big the triangle is.", "reasoningStatement": "A bigger triangle has a bigger height.", "isCorrect": false, "socraticRebuttal": "A bigger triangle has a longer slope too. What happens to height ÷ slope when both grow by the same scale factor?"}], "invariantTakeaway": "A sine belongs to its angle, but it does not grow in step with it: sin 60° is about 0.866, not twice sin 30°."}}, {"id": "ch13", "number": 13, "volumeNumber": 4, "volumeTitle": "Volume IV · Data Forensics, Uncertainty & Bayes' Theorem", "title": "Samples you can trust", "subtitle": "School book chapter 4 · Picking a fair group, spotting a lopsided survey, Abraham Wald's returning planes, and why bigger samples steady the average", "hookSummary": "A soup pot holds 10 litres. You do not drink all 10 litres to check the salt. You stir the pot well and taste one spoonful.", "beyondSchoolBook": false, "skillCard": {"skill": "Designing a fair sample by random, systematic or stratified choice, and spotting when a survey leaves an important group out", "sheCan": {"prompt": "With no calculator: a school has 240 Year 7 students, 180 Year 8 students and 180 Year 9 students, 600 in all. How many from each year belong in a fair sample of 50? And if you pick 20 names at even steps from a list of 600, what step size do you use?", "answer": "Year 7 is 240 ÷ 600 × 50 = 20, Year 8 is 180 ÷ 600 × 50 = 15, and Year 9 is 15. For 20 names from 600, step through every 600 ÷ 20 = 30th name."}, "whyItMatters": "Doctors testing a medicine, pollsters before an election and engineers checking factory parts can never test everyone. A fair sample tells the truth about the whole group; a lopsided one fools you even when it is huge.", "standsOn": ["Chapter 2: fractions and simplifying a part of a whole", "Chapter 3: sharing a total in a given ratio", "Chapter 1: square roots, for how fast sample error shrinks"], "unlocks": ["Chapter 14: drawing and measuring the spread of data you collect", "Chapter 15: counting equally likely outcomes when picking at random", "Chapter 16: updating a belief when a test screens a whole population"]}, "intuitionToFormula": {"concreteAction": "In the figure, keep the spread at 12 and slide the group size from 4 up to 16, then to 64.", "ahaInvariant": "When the group size is multiplied by 4, the width of the red error bar is cut in half. And on the returning plane, the missing bullet holes on the engines show where a hit brings the plane down.", "formulaDisplay": "Group share = (group ÷ total) × sample,   Standard error = σ ÷ √n", "termMappings": [{"symbol": "group ÷ total", "visualPart": "Each year group's share of the whole school", "colorRole": "blue", "meaning": "The fraction of the sample that group should get"}, {"symbol": "σ ÷ √n", "visualPart": "The red bracket under the curve", "colorRole": "red", "meaning": "How far a typical sample average sits from the true average"}, {"symbol": "Missing hits", "visualPart": "The amber engine box on the plane", "colorRole": "amber", "meaning": "Planes hit there did not come back to be counted"}], "atlasFigureRef": "statistics/error/index.html"}, "sections": [{"id": "ch13-s1", "heading": "13.1 Tasting the soup without drinking the pot", "excerpt": "She stirs the pot well and tastes one spoonful. When the pot is well mixed, a small spoonful tells the truth about the whole pot.", "teaches": ["population", "sample", "random-sample"], "steps": [{"id": "ch13-s1-question", "kind": "question", "text": "A cook makes a 10-litre pot of dal. How does she know if it needs more salt without eating the whole pot?"}, {"id": "ch13-s1-idea", "kind": "idea", "text": "She stirs the pot well and tastes one spoonful. When the pot is well mixed, a small spoonful tells the truth about the whole pot."}, {"id": "ch13-s1-picture", "kind": "picture", "text": "Picture 600 folded slips of paper in a drum, one for each student in a school. Shake the drum and pull out 30 slips with your eyes shut."}, {"id": "ch13-s1-reason", "kind": "reason", "text": "Why shut your eyes and shake the drum? If you only ask your own table at lunch, you get your friends' habits, not the school's. Giving every person the same chance keeps favourites out."}, {"id": "ch13-s1-name", "kind": "name", "text": "The whole group you want to know about is the population. A smaller group chosen from it is a sample. When every member of the population has the same chance of being chosen, it is a random sample."}, {"id": "ch13-s1-example", "kind": "example", "text": "A school has 600 students. Number them 1 to 600 and let a computer pick 30 numbers with equal chance. The 600 students are the population, and the 30 chosen are a random sample."}, {"id": "ch13-s1-mistake", "kind": "mistake", "text": "The tempting slip is to think 'random' means picking whoever walks past first. That leaves out everyone in a classroom or on another floor. Use numbered slips or a random number list."}, {"id": "ch13-s1-turn", "kind": "turn", "text": "A factory bakes 2,000 biscuits and picks 40 of them by lot to test their weight. How many biscuits are in the population?", "answer": "2000", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2000"}]}], "accepts": ["2000", "2,000", "2000 biscuits"], "rejects": ["40", "1960", "50"], "mistakes": []}}, {"id": "ch13-s1-sayBack", "kind": "sayBack", "text": "The population is the whole group, a sample is the part you test, and a random sample gives everyone the same chance."}]}, {"id": "ch13-s2", "heading": "13.2 Stepping through a list and matching group shares", "excerpt": "No. Year 7 is twice as big as Year 8, so it should get twice as many places in the sample: 20 from Year 7 and 10 from Year 8.", "teaches": ["systematic-sample", "stratified-sample"], "steps": [{"id": "ch13-s2-question", "kind": "question", "text": "A school has 400 students in Year 7 and 200 in Year 8. If you want 30 students in your sample, should you pick 15 from each year?"}, {"id": "ch13-s2-idea", "kind": "idea", "text": "No. Year 7 is twice as big as Year 8, so it should get twice as many places in the sample: 20 from Year 7 and 10 from Year 8."}, {"id": "ch13-s2-picture", "kind": "picture", "text": "Draw a bar of 6 equal blocks for the 600 students: 4 blocks for Year 7 and 2 blocks for Year 8. Share the 30 sample places across the 6 blocks: 5 in each block."}, {"id": "ch13-s2-reason", "kind": "reason", "text": "Why not 15 and 15? Taking 15 from each gives Year 8 half the voice in the sample when they are only a third of the school. Matching each group's fraction keeps the sample in the same ratio as the school."}, {"id": "ch13-s2-name", "kind": "name", "text": "When you split the population into groups and pick from each group in proportion to its size, you take a stratified sample. When you line everyone up on a numbered list and pick every kth person from a random start, you take a systematic sample."}, {"id": "ch13-s2-example", "kind": "example", "text": "To pick a systematic sample of 20 from a list of 600 names, divide 600 ÷ 20 = 30. Pick a random start between 1 and 30, say 7, then take the 7th, 37th, 67th, and every 30th name."}, {"id": "ch13-s2-mistake", "kind": "mistake", "text": "The tempting slip in a stratified sample is to divide the sample equally among the groups. Always multiply the sample size by group size ÷ total population."}, {"id": "ch13-s2-turn", "kind": "turn", "text": "A club has 120 juniors and 80 seniors, 200 members in all. In a stratified sample of 40 members, how many juniors should be chosen?", "answer": "24", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "24"}]}], "accepts": ["24", "24 juniors"], "rejects": ["20", "16", "60"], "mistakes": []}}, {"id": "ch13-s2-sayBack", "kind": "sayBack", "text": "A systematic sample takes every kth item on a list; a stratified sample gives each group its true fraction of the sample."}]}, {"id": "ch13-s3", "heading": "13.3 The planes that did not come back", "excerpt": "Because people who never go to a gym had zero chance of being asked. Your method favoured early-morning gym-goers before a single question was answered.", "teaches": ["bias", "survivorship-bias"], "steps": [{"id": "ch13-s3-question", "kind": "question", "text": "Wanting to know how many hours people in Mumbai exercise, you ask 100 people leaving a gym at 6 am. Why will your answer be too high?"}, {"id": "ch13-s3-idea", "kind": "idea", "text": "Because people who never go to a gym had zero chance of being asked. Your method favoured early-morning gym-goers before a single question was answered."}, {"id": "ch13-s3-picture", "kind": "picture", "text": "Picture the outline of a Second World War plane. Returning planes are covered in bullet holes along the wings and tail, while the engine boxes are clean."}, {"id": "ch13-s3-reason", "kind": "reason", "text": "Why did the mathematician Abraham Wald put armour on the clean engines instead of the riddled wings? Enemy bullets hit every part equally. Planes hit in the wings flew home to be counted; planes hit in the engine crashed and were missing from the shed."}, {"id": "ch13-s3-name", "kind": "name", "text": "When a sampling method favours some parts of the population over others, the sample has bias. When you only see the ones that survived a test or a journey and forget the ones that dropped out, that is survivorship bias."}, {"id": "ch13-s3-example", "kind": "example", "text": "Reading only five-star reviews from customers who kept a phone for two years misses everyone who returned it in the first week. That is survivorship bias."}, {"id": "ch13-s3-mistake", "kind": "mistake", "text": "The tempting slip is to think a bigger sample cures bias. Asking 10,000 people outside the gym still misses everyone asleep at home. Fix how you pick, not how many."}, {"id": "ch13-s3-turn", "kind": "turn", "text": "Out of 50 planes sent out, 8 are hit in the engine and all 8 crash. The other 42 return with wing hits. How many engine-hit planes are in the shed to be counted?", "answer": "0", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "0"}]}], "accepts": ["0", "0 planes"], "rejects": ["8", "42", "50"], "mistakes": []}}, {"id": "ch13-s3-sayBack", "kind": "sayBack", "text": "Bias happens when some members are more likely to be picked than others; survivorship bias happens when dropouts are invisible."}]}, {"id": "ch13-s4", "heading": "13.4 Why four times the sample halves the wobble", "excerpt": "Rohan's. This step goes beyond the school book. Because 64 is 4 times 16, and the square root of 4 is 2, Rohan's typical error is half as wide as Asha's.", "teaches": ["mean", "standard-error"], "steps": [{"id": "ch13-s4-question", "kind": "question", "text": "Two students each estimate the average height in their school using a fair random sample. Asha measures 16 students; Rohan measures 64. Whose estimate is likely to sit closer to the true school figure?"}, {"id": "ch13-s4-idea", "kind": "idea", "text": "Rohan's. This step goes beyond the school book. Because 64 is 4 times 16, and the square root of 4 is 2, Rohan's typical error is half as wide as Asha's."}, {"id": "ch13-s4-picture", "kind": "picture", "text": "In the figure, keep the population spread at 12 and move the sample size from 16 to 64. Watch the red bracket shrink from 3 down to 1.5."}, {"id": "ch13-s4-reason", "kind": "reason", "text": "Why does the error divide by √n instead of n? In a random group, high values and low values partly cancel each other out. The leftover wobble shrinks with the square root of the group size."}, {"id": "ch13-s4-name", "kind": "name", "text": "Adding the values and dividing by how many there are gives the mean. The typical gap between a sample mean and the population mean is the standard error, σ ÷ √n."}, {"id": "ch13-s4-example", "kind": "example", "text": "If the population spread σ is 12 cm and you take a sample of n = 16 students, the standard error is 12 ÷ √16 = 12 ÷ 4 = 3 cm. With n = 64 students, it drops to 12 ÷ √64 = 12 ÷ 8 = 1.5 cm."}, {"id": "ch13-s4-mistake", "kind": "mistake", "text": "The tempting slip is to think doubling the sample size halves the standard error. Because of the square root, you must multiply the sample size by 4 to halve the standard error."}, {"id": "ch13-s4-turn", "kind": "turn", "text": "A population has spread σ = 20, and you take a random sample of n = 25 items. Using σ ÷ √n, what is the standard error?", "answer": "4", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "4"}]}], "accepts": ["4", "SE = 4"], "rejects": ["0.8", "5", "100"], "mistakes": []}}, {"id": "ch13-s4-sayBack", "kind": "sayBack", "text": "The standard error is σ ÷ √n, so multiplying a random sample's size by 4 cuts the typical error of the mean in half."}], "figure": true}], "callouts": [{"id": "ch13-c-predict", "kind": "predict", "title": "Predict first", "body": "Keep the spread at 12 and multiply the sample size from 4 to 16. Predict whether the standard error is divided by 4 or by 2."}, {"id": "ch13-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why Abraham Wald told the engineers to armour the parts of the returning planes that had no bullet holes."}, {"id": "ch13-c-trap", "kind": "careful", "title": "Fairness before size", "body": "A sample of 50 chosen fairly across every year group beats a survey of 500 volunteers from one corridor."}], "keyTerms": ["Population", "Sample", "Random sample", "Systematic sample", "Stratified sample", "Bias", "Survivorship bias", "Mean", "Standard error"], "widgets": ["w_atlas_sampling_error", "w_wald_survivorship_bomber"], "debate": {"id": "debate-ch13-sampling", "chapterNumber": 13, "oupUnitNumber": 4, "title": "Equal numbers or equal shares?", "contextPrompt": "A school has 300 students in Year 7 and 100 in Year 8. Asha and Rohan want a stratified sample of 40 students.", "speakerAName": "Asha", "speakerAClaim": "There are two year groups, so a fair sample takes the same number from each: 20 from Year 7 and 20 from Year 8.", "speakerBName": "Rohan", "speakerBClaim": "Year 7 is three quarters of the school, so it gets three quarters of the sample: 30 from Year 7 and 10 from Year 8.", "choices": [{"id": "ch13-a", "speakerLabel": "Asha is right (20 and 20)", "reasoningStatement": "Every group should have the same number of people in the sample.", "isCorrect": false, "socraticRebuttal": "If Year 8 gets 20 out of 40 places, it has half the sample even though it is only a quarter of the school."}, {"id": "ch13-b", "speakerLabel": "Rohan is right (30 and 10)", "reasoningStatement": "Each group gets the same fraction of the sample as its fraction of the whole school.", "isCorrect": true, "socraticRebuttal": "Yes. 300 ÷ 400 × 40 = 30 from Year 7 and 100 ÷ 400 × 40 = 10 from Year 8, so every student has the same 1 in 10 chance."}, {"id": "ch13-c", "speakerLabel": "Neither. Take all 40 from Year 7 because it is the largest group.", "reasoningStatement": "Only the biggest group matters for the school average.", "isCorrect": false, "socraticRebuttal": "Leaving Year 8 out completely gives a biased sample with zero voice for a quarter of the school."}], "invariantTakeaway": "In a stratified sample, each group's share of the sample matches its share of the whole population."}}, {"id": "ch14", "number": 14, "volumeNumber": 4, "volumeTitle": "Volume IV · Data Forensics, Uncertainty & Bayes' Theorem", "title": "Spread: histograms and standard deviation", "subtitle": "School book chapter 10 · Smoothing a bumpy line over time, ordering leaves, drawing bars whose area is the count, and measuring spread", "hookSummary": "Two bus routes both take 20 minutes on average. One arrives in 19, 20 or 21 minutes; the other takes 5 minutes or 35. The average alone hides the wait.", "beyondSchoolBook": false, "skillCard": {"skill": "Reading and drawing time-series graphs, stem-and-leaf diagrams and unequal-width histograms, and comparing two sets of data by their middle and their spread", "sheCan": {"prompt": "With no calculator: in a survey of parcel masses, the group 40 ≤ m < 60 kg holds 30 parcels and the group 60 ≤ m < 70 kg holds 25 parcels. What height should each bar have on a histogram? And for the seven numbers 12, 15, 17, 20, 24, 29, 31, what are the middle value and the spread of the middle half?", "answer": "For 40 to 60 kg the width is 20, so the bar height is 30 ÷ 20 = 1.5. For 60 to 70 kg the width is 10, so the bar height is 25 ÷ 10 = 2.5. For the seven numbers, the middle value is 20, and the middle half runs from 15 to 29, a spread of 29 − 15 = 14."}, "whyItMatters": "Averages without spread can mislead a hospital, a weather office or a shopper. Knowing how wide the bars are and how far values sit from the middle lets you read the whole shape of the data.", "standsOn": ["Chapter 3: dividing by a width to find a rate per unit", "Chapter 10: the area of a rectangle, height times width", "Chapter 13: the mean of a group of numbers"], "unlocks": ["Chapter 15: the bell-shaped curve of totals when many random steps add up", "Chapter 16: reading two-way area diagrams where rectangle area is the count", "Chapter 18: adding the areas of thin rectangles under a curve"]}, "intuitionToFormula": {"concreteAction": "In the figure, keep the count in the third group at 30 and widen its span from 10 minutes to 25 minutes.", "ahaInvariant": "As the third bar gets wider, its height drops so that width × height stays equal to 30. In a histogram, the area of the bar is the count.", "formulaDisplay": "Frequency density = count ÷ width,   IQR = Q₃ − Q₁,   σ = √( Σ(x − mean)² ÷ n )", "termMappings": [{"symbol": "count ÷ width", "visualPart": "The height of the red bar on the right", "colorRole": "red", "meaning": "How many items fall in each 1 unit of width"}, {"symbol": "height × width", "visualPart": "The filled area of each bar", "colorRole": "blue", "meaning": "The exact count of items in that group"}, {"symbol": "IQR & σ", "visualPart": "The spread of values around the middle", "colorRole": "amber", "meaning": "How tightly or loosely the data clusters"}], "atlasFigureRef": "maths/ch11-data-histograms/index.html"}, "sections": [{"id": "ch14-s1", "heading": "14.1 Smoothing out the bumps across time", "excerpt": "Plot the days in order along the bottom, then take the mean of each run of 7 days. Every 7-day window holds one Saturday and one Monday, so the weekly bumps flatten out.", "teaches": ["time-series", "moving-average"], "steps": [{"id": "ch14-s1-question", "kind": "question", "text": "An ice-cream stall writes down its sales every day for a month. Weekends spike high and Mondays dip low. How can the owner see whether the month as a whole is climbing?"}, {"id": "ch14-s1-idea", "kind": "idea", "text": "Plot the days in order along the bottom, then take the mean of each run of 7 days. Every 7-day window holds one Saturday and one Monday, so the weekly bumps flatten out."}, {"id": "ch14-s1-picture", "kind": "picture", "text": "Picture a jagged mountain path of daily dots, and a smooth ribbon running through the middle of every three consecutive dots."}, {"id": "ch14-s1-reason", "kind": "reason", "text": "Why slide the window one step at a time? Each step drops the oldest day and adds the newest day. One hot Saturday cannot pull the whole ribbon up on its own."}, {"id": "ch14-s1-name", "kind": "name", "text": "A graph with time along the horizontal axis and readings plotted in order is a time series. The mean of a sliding window of fixed length, such as 3 days or 4 quarters, is a moving average."}, {"id": "ch14-s1-example", "kind": "example", "text": "Daily sales over four days are 10, 14, 18 and 22. The first 3-day moving average is (10 + 14 + 18) ÷ 3 = 14, and the next is (14 + 18 + 22) ÷ 3 = 18."}, {"id": "ch14-s1-mistake", "kind": "mistake", "text": "The tempting slip is to plot a moving average above the last day of its window. Plot it above the middle of its window so the trend line is not shifted sideways."}, {"id": "ch14-s1-turn", "kind": "turn", "text": "Rainfall over three months is 12 mm, 18 mm and 24 mm. What is their 3-month moving average, in mm?", "answer": "18", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "18"}]}], "accepts": ["18", "18 mm", "18mm"], "rejects": ["54", "15", "21"], "mistakes": []}}, {"id": "ch14-s1-sayBack", "kind": "sayBack", "text": "A time series plots readings in time order, and a moving average smooths regular ups and downs to show the underlying trend."}]}, {"id": "ch14-s2", "heading": "14.2 Keeping every digit while showing the shape", "excerpt": "The middle number when they are lined up in order, 20. And to measure the spread without being fooled by the 95-minute puncture, take the gap across the middle half of the riders: 29 − 15 = 14.", "teaches": ["stem-and-leaf-diagram", "median", "quartile", "interquartile-range"], "steps": [{"id": "ch14-s2-question", "kind": "question", "text": "Seven cyclists finish a hill climb in 12, 15, 17, 20, 24, 29 and 31 minutes. If one cyclist had a puncture and took 95 minutes instead of 31, the mean jumps up. What measure of the middle stays at 20?"}, {"id": "ch14-s2-idea", "kind": "idea", "text": "The middle number when they are lined up in order, 20. And to measure the spread without being fooled by the 95-minute puncture, take the gap across the middle half of the riders: 29 − 15 = 14."}, {"id": "ch14-s2-picture", "kind": "picture", "text": "Write the tens digit on the left of a line and the ordered units digits on the right: 1 | 2 5 7, 2 | 0 4 9, 3 | 1. Add the key: 1 | 2 means 12 minutes."}, {"id": "ch14-s2-reason", "kind": "reason", "text": "Why cut off the bottom quarter and the top quarter? Extreme outliers live at the two ends. The middle half shows how spread out typical riders are."}, {"id": "ch14-s2-name", "kind": "name", "text": "Splitting each number into a tens stem and an ordered units leaf makes a stem-and-leaf diagram. In an ordered list, the middle value is the median. The middles of the two halves are the quartiles Q₁ and Q₃, and Q₃ − Q₁ is the interquartile range."}, {"id": "ch14-s2-example", "kind": "example", "text": "For 12, 15, 17, 20, 24, 29, 31, the 4th value is the median, 20. The lower three values 12, 15, 17 have middle Q₁ = 15; the upper three 24, 29, 31 have middle Q₃ = 29; so the interquartile range is 29 − 15 = 14."}, {"id": "ch14-s2-mistake", "kind": "mistake", "text": "The tempting slip in a stem-and-leaf diagram is to leave the leaves unsorted or forget the key. Without ascending leaves you cannot count to the median, and without a key 2 | 4 could mean 24 or 2.4."}, {"id": "ch14-s2-turn", "kind": "turn", "text": "Find the interquartile range of the seven ordered numbers 10, 13, 16, 19, 22, 25, 28.", "answer": "12", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "12"}]}], "accepts": ["12", "IQR = 12"], "rejects": ["18", "19", "9"], "mistakes": []}}, {"id": "ch14-s2-sayBack", "kind": "sayBack", "text": "A stem-and-leaf diagram keeps every exact value in order; the median marks the middle and the interquartile range Q₃ − Q₁ measures the middle half."}]}, {"id": "ch14-s3", "heading": "14.3 Why area, not height, is the count", "excerpt": "Because the group from 20 to 45 minutes is 25 minutes wide, two and a half times as wide as the 10-minute groups. Making it 30 units tall as well makes its rectangle look huge, even though only 1.2 patients arrived per minute.", "teaches": ["class-width", "frequency-density", "histogram"], "steps": [{"id": "ch14-s3-question", "kind": "question", "text": "Waiting times at a clinic are grouped into 0 to 10 minutes (18 patients), 10 to 20 minutes (24 patients), and one wide group from 20 to 45 minutes (30 patients). If you draw a bar of height 30 for the wide group, why does the chart lie?"}, {"id": "ch14-s3-idea", "kind": "idea", "text": "Because the group from 20 to 45 minutes is 25 minutes wide, two and a half times as wide as the 10-minute groups. Making it 30 units tall as well makes its rectangle look huge, even though only 1.2 patients arrived per minute."}, {"id": "ch14-s3-picture", "kind": "picture", "text": "In the figure, look at the three bars when the third group's width is 25 minutes and its count is 30. Its height is 30 ÷ 25 = 1.2, so the area of the red rectangle is 25 × 1.2 = 30."}, {"id": "ch14-s3-reason", "kind": "reason", "text": "Why divide the count by the width? The eye judges a bar by the ink it covers, which is its area. Setting height = count ÷ width guarantees that area = width × height = count."}, {"id": "ch14-s3-name", "kind": "name", "text": "The span of a group from its lower edge to its upper edge is the class width. The count divided by the class width is the frequency density. A chart of continuous groups with no gaps where bar height is frequency density and bar area is the count is a histogram."}, {"id": "ch14-s3-example", "kind": "example", "text": "For 40 ≤ m < 60 kg with 30 parcels, the class width is 60 − 40 = 20 kg and the frequency density is 30 ÷ 20 = 1.5. For 60 ≤ m < 70 kg with 25 parcels, the class width is 10 kg and the frequency density is 25 ÷ 10 = 2.5."}, {"id": "ch14-s3-mistake", "kind": "mistake", "text": "The tempting slip is to plot the raw count on the vertical axis when the groups have unequal widths. Always divide count by class width first, and multiply frequency density by class width to read a count back."}, {"id": "ch14-s3-turn", "kind": "turn", "text": "A group 10 ≤ t < 25 seconds has class width 15 seconds and frequency density 3.2. How many items are in this group?", "answer": "48", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "48"}]}], "accepts": ["48", "48 items", "48 observations"], "rejects": ["18.2", "4.8", "15"], "mistakes": []}}, {"id": "ch14-s3-sayBack", "kind": "sayBack", "text": "In a histogram, frequency density is count ÷ class width, so the area of every bar equals the count in that group."}], "figure": true}, {"id": "ch14-s4", "heading": "14.4 Distance from the balance point", "excerpt": "Square each gap before adding, take the mean of those squares, then take the square root to return to the starting units. This calculation goes beyond the school book, which only asks you to compare spreads.", "teaches": ["sigma", "variance", "standard-deviation"], "steps": [{"id": "ch14-s4-question", "kind": "question", "text": "Five friends score 4, 6, 8, 10 and 12 on a quiz. Their mean is 8. If you find each score's gap from 8 (−4, −2, 0, +2, +4) and add those gaps up, you get 0. How do we stop the negative gaps cancelling the positive ones?"}, {"id": "ch14-s4-idea", "kind": "idea", "text": "Square each gap before adding, take the mean of those squares, then take the square root to return to the starting units. This calculation goes beyond the school book, which only asks you to compare spreads."}, {"id": "ch14-s4-picture", "kind": "picture", "text": "Picture a plank balanced on a pivot at 8, with blocks at 4, 6, 8, 10 and 12. Each block's distance from the pivot is squared: 16, 4, 0, 4 and 16."}, {"id": "ch14-s4-reason", "kind": "reason", "text": "Why take the square root at the end? Squaring turns marks into squared marks, or metres into square metres. Taking the square root brings the spread back into marks or metres so you can compare it with the mean."}, {"id": "ch14-s4-name", "kind": "name", "text": "The Greek capital letter Σ, called sigma, means 'add up all the terms of this kind'. The mean of the squared gaps from the mean, Σ(x − mean)² ÷ n, is the variance. Its square root is the standard deviation, written σ."}, {"id": "ch14-s4-example", "kind": "example", "text": "For 4, 6, 8, 10, 12, the mean is 8 and the squared gaps are 16, 4, 0, 4, 16. Their sum Σ(x − 8)² is 40, the variance is 40 ÷ 5 = 8, and the standard deviation is σ = √8 ≈ 2.83."}, {"id": "ch14-s4-mistake", "kind": "mistake", "text": "The tempting slip is to stop at the variance, 8, and forget the square root. A spread of 8 marks would be wider than the gap from 8 to the highest score, 12. Take the square root to get √8 ≈ 2.83."}, {"id": "ch14-s4-turn", "kind": "turn", "text": "Four numbers 2, 4, 6 and 8 have a mean of 5. Their gaps from 5 are −3, −1, 1 and 3, so the squared gaps are 9, 1, 1 and 9. What is their variance, Σ(x − 5)² ÷ 4?", "answer": "5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "5"}]}], "accepts": ["5", "variance = 5"], "rejects": ["20", "0", "2.24"], "mistakes": []}}, {"id": "ch14-s4-sayBack", "kind": "sayBack", "text": "Variance averages the squared distances from the mean using Σ, and standard deviation σ takes the square root to measure typical spread."}]}], "callouts": [{"id": "ch14-c-predict", "kind": "predict", "title": "Predict first", "body": "In the figure, keep the third group's count at 30 and double its width from 15 to 30. Predict what happens to its bar height before you move the slider."}, {"id": "ch14-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why a taller bar on a histogram does not always hold more items than a shorter, wider bar."}, {"id": "ch14-c-trap", "kind": "careful", "title": "Always pair middle with spread", "body": "When comparing two groups of data, give one measure of the middle (mean or median) and one measure of spread (interquartile range or standard deviation)."}], "keyTerms": ["Time series", "Moving average", "Stem-and-leaf diagram", "Median", "Quartile", "Interquartile range", "Class width", "Frequency density", "Histogram", "Sigma", "Variance", "Standard deviation"], "widgets": ["w_histogram_frequency_density", "w_mean_fulcrum_std_dev"], "debate": {"id": "debate-ch14-histograms", "chapterNumber": 14, "oupUnitNumber": 10, "title": "Does the tallest bar hold the most people?", "contextPrompt": "On a journey-time histogram, group A (width 10 minutes) has frequency density 4, and group B (width 30 minutes) has frequency density 2.", "speakerAName": "Asha", "speakerAClaim": "Group A's bar is twice as tall as group B's (4 against 2), so twice as many people are in group A.", "speakerBName": "Rohan", "speakerBClaim": "In a histogram, the area is the count. Group A holds 10 × 4 = 40 people, while group B holds 30 × 2 = 60 people.", "choices": [{"id": "ch14-a", "speakerLabel": "Asha is right (group A has more)", "reasoningStatement": "The tallest bar always shows the biggest count.", "isCorrect": false, "socraticRebuttal": "Height matches the count only when every bar has the same width. Here group B is three times as wide as group A."}, {"id": "ch14-b", "speakerLabel": "Rohan is right (group B has 60, group A has 40)", "reasoningStatement": "Count equals frequency density × class width, which is the area of the bar.", "isCorrect": true, "socraticRebuttal": "Yes. Group A is more crowded per minute, but group B spans 30 minutes and holds 30 × 2 = 60 people in total."}, {"id": "ch14-c", "speakerLabel": "Neither. They hold the same number of people.", "reasoningStatement": "A wider bar and a taller bar cancel each other out.", "isCorrect": false, "socraticRebuttal": "Multiply width by height for each bar: 10 × 4 = 40, while 30 × 2 = 60."}], "invariantTakeaway": "In a histogram, the area of a bar (class width × frequency density) equals the count in that group."}}, {"id": "ch15", "number": 15, "volumeNumber": 4, "volumeTitle": "Volume IV · Data Forensics, Uncertainty & Bayes' Theorem", "title": "Counting outcomes", "subtitle": "School book chapter 15 · Fair grids for two dice, multiplying along branches, counting orders with n!, and why pegs build a bell curve", "hookSummary": "Roll two fair dice and add the spots. Why does a total of 7 show up six times as often as a total of 12?", "beyondSchoolBook": false, "skillCard": {"skill": "Listing equally likely outcomes in a grid or tree, working out probabilities with and without replacement, and counting arrangements and choices", "sheCan": {"prompt": "With no calculator: two fair six-sided dice are rolled. What is the chance their sum is 9, in simplest form? A bag holds 5 red and 3 blue marbles, and two are drawn without putting the first back. What is the chance both are red? And how many 3-person teams can be chosen from 8 students?", "answer": "On the 6 × 6 grid, four pairs add to 9: (3,6), (4,5), (5,4), (6,3), so the chance is 4/36 = 1/9. For two red marbles without replacement: 5/8 × 4/7 = 20/56 = 5/14. For 3 students chosen from 8: (8 × 7 × 6) ÷ (3 × 2 × 1) = 56 teams."}, "whyItMatters": "Games, weather forecasts, genetics and quality checks all rest on counting how many ways something can happen out of all equally likely ways.", "standsOn": ["Chapter 0: sets, intersections and complements", "Chapter 2: multiplying and simplifying fractions", "Chapter 13: fair random choices from a group"], "unlocks": ["Chapter 16: updating a probability when new evidence narrows the outcomes", "Genetics: Punnett grids for inherited traits", "Statistics: binomial probabilities and the normal curve"]}, "intuitionToFormula": {"concreteAction": "In the figure, set the rows of pegs to 6, the slot to 3, and the bounce chance to 50%.", "ahaInvariant": "To land in slot 3 after 6 rows, a ball must bounce right 3 times and left 3 times. There are 20 different paths to that middle slot, and only 1 path to each end.", "formulaDisplay": "P(A) = ways ÷ total,   ⁿPᵣ = n! ÷ (n − r)!,   ⁿCᵣ = n! ÷ (r!(n − r)!)", "termMappings": [{"symbol": "n! ÷ (n − r)!", "visualPart": "Choices for 1st place × 2nd place × …", "colorRole": "red", "meaning": "Ordered arrangements when the order of picking matters"}, {"symbol": "÷ r!", "visualPart": "Collapsing rearrangements of the same r items", "colorRole": "blue", "meaning": "Dividing out the r! orders to count unordered teams"}, {"symbol": "ⁿCₖ paths", "visualPart": "The height of bar k on the pegboard", "colorRole": "amber", "meaning": "How many left-right paths land in slot k"}], "atlasFigureRef": "statistics/galton/index.html"}, "sections": [{"id": "ch15-s1", "heading": "15.1 Why 7 beats 12 six to one", "excerpt": "No. A total of 12 happens in only one way, 6 on red and 6 on blue. A total of 7 happens in six ways: (1,6), (2,5), (3,4), (4,3), (5,2) and (6,1).", "teaches": ["outcome", "sample-space", "probability", "mutually-exclusive"], "steps": [{"id": "ch15-s1-question", "kind": "question", "text": "You roll a red die and a blue die and add them. There are 11 possible totals, from 2 to 12. Does each total have a 1 in 11 chance?"}, {"id": "ch15-s1-idea", "kind": "idea", "text": "No. A total of 12 happens in only one way, 6 on red and 6 on blue. A total of 7 happens in six ways: (1,6), (2,5), (3,4), (4,3), (5,2) and (6,1)."}, {"id": "ch15-s1-picture", "kind": "picture", "text": "Draw a 6 × 6 grid with red 1 to 6 along the side and blue 1 to 6 along the top. Count the 36 squares, and shade the diagonal of four squares that add to 9: (3,6), (4,5), (5,4), (6,3)."}, {"id": "ch15-s1-reason", "kind": "reason", "text": "Why count the 36 pairs instead of the 11 totals? Each of the 36 pairs is equally likely, 1 in 36. The 11 totals are not equally likely because different numbers of pairs make them."}, {"id": "ch15-s1-name", "kind": "name", "text": "One possible result of a trial is an outcome, and the complete list or grid of all possible results is the sample space. When outcomes are equally likely, the probability of a result is wanted outcomes ÷ total outcomes, on a scale from 0 to 1. Results that cannot happen at the same time are mutually exclusive; their probabilities add up, and P(not A) = 1 − P(A)."}, {"id": "ch15-s1-example", "kind": "example", "text": "On the 36-square grid for two fair dice, four squares add to 9. So the probability of a sum of 9 is 4 ÷ 36 = 1/9, and the probability of not getting 9 is 1 − 1/9 = 8/9."}, {"id": "ch15-s1-mistake", "kind": "mistake", "text": "The tempting slip is to treat (3, 6) and (6, 3) as one outcome. Red 3 with blue 6 and red 6 with blue 3 are two separate squares on the 36-square grid."}, {"id": "ch15-s1-turn", "kind": "turn", "text": "Two fair six-sided dice are rolled. What is the probability that their sum is 11, as a fraction in simplest form?", "answer": "1/18", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "1/18", "simplest": true}]}], "accepts": ["1/18"], "rejects": ["2/36", "1/36", "1/11"], "mistakes": []}}, {"id": "ch15-s1-sayBack", "kind": "sayBack", "text": "List the sample space of equally likely outcomes first; probability is wanted outcomes ÷ total outcomes, and P(not A) = 1 − P(A)."}]}, {"id": "ch15-s2", "heading": "15.2 Testing a coin and multiplying along a tree", "excerpt": "Because only 7 marbles are left in the bag. If the first marble was red, only 4 of the remaining 7 are red, so the chance of two reds is 5/8 × 4/7 = 20/56 = 5/14.", "teaches": ["experimental-probability", "independent-events", "tree-diagram"], "steps": [{"id": "ch15-s2-question", "kind": "question", "text": "A bag holds 5 red and 3 blue marbles, 8 in all. You pick one marble, keep it out, and pick a second. Why does the fraction for the second marble change?"}, {"id": "ch15-s2-idea", "kind": "idea", "text": "Because only 7 marbles are left in the bag. If the first marble was red, only 4 of the remaining 7 are red, so the chance of two reds is 5/8 × 4/7 = 20/56 = 5/14."}, {"id": "ch15-s2-picture", "kind": "picture", "text": "Draw two branches from the start labeled Red (5/8) and Blue (3/8). From the Red tip, split into Red (4/7) and Blue (3/7), and multiply along the top path: 5/8 × 4/7."}, {"id": "ch15-s2-reason", "kind": "reason", "text": "Why multiply along the branches? Five eighths of the time you take the top branch, and four sevenths of those times you take the next top branch. Four sevenths of five eighths is 5/8 × 4/7."}, {"id": "ch15-s2-name", "kind": "name", "text": "A probability estimated from real trials, count of successes ÷ number of trials, is an experimental probability. Two stages where the first result does not change the chances of the second are independent events, so P(A and B) = P(A) × P(B). A branching picture that writes each step's fractions on its branches is a tree diagram."}, {"id": "ch15-s2-example", "kind": "example", "text": "If you put the first marble back before picking the second, the two picks are independent events: P(both red) = 5/8 × 5/8 = 25/64. Without replacement they are not: P(both red) = 5/8 × 4/7 = 5/14."}, {"id": "ch15-s2-mistake", "kind": "mistake", "text": "The tempting slip is to add along a path, writing 5/8 + 4/7. Multiply along the branches to follow one path; add at the end only when combining two separate paths."}, {"id": "ch15-s2-turn", "kind": "turn", "text": "A bag holds 4 green and 2 yellow counters, 6 in all. Two counters are drawn without replacement. What is the probability that both are green, in simplest form?", "answer": "2/5", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "2/5", "simplest": true}]}], "accepts": ["2/5", "0.4"], "rejects": ["12/30", "4/9", "16/36"], "mistakes": []}}, {"id": "ch15-s2-sayBack", "kind": "sayBack", "text": "On a tree diagram, multiply along branches for one path and add separate paths. Only independent events keep the same fractions on the second step."}]}, {"id": "ch15-s3", "heading": "15.3 When order matters and when it does not", "excerpt": "For medals, there are 8 choices for Gold, 7 for Silver and 6 for Bronze: 8 × 7 × 6 = 336 ways. For a team, the same 3 students can be arranged in 3 × 2 × 1 = 6 medal orders, so divide 336 by 6 to get 56 teams.", "teaches": ["factorial", "permutation", "combination"], "steps": [{"id": "ch15-s3-question", "kind": "question", "text": "From 8 students, how many ways can you award Gold, Silver and Bronze medals? How does that count change for an equal 3-person team?"}, {"id": "ch15-s3-idea", "kind": "idea", "text": "For medals, there are 8 choices for Gold, 7 for Silver and 6 for Bronze: 8 × 7 × 6 = 336 ways. For a team, the same 3 students can be arranged in 3 × 2 × 1 = 6 medal orders, so divide 336 by 6 to get 56 teams."}, {"id": "ch15-s3-picture", "kind": "picture", "text": "Draw three medal boxes [8][7][6]. Underneath, group the 6 rearrangements of Asha, Rohan and Meera into one single team box."}, {"id": "ch15-s3-reason", "kind": "reason", "text": "Why divide by 6? In a team there is no Gold, Silver or Bronze. Every group of 3 people was counted 3 × 2 × 1 = 6 times in the ordered list, so dividing by 6 counts each team once."}, {"id": "ch15-s3-name", "kind": "name", "text": "This section goes beyond the school book. The product of all whole numbers from n down to 1 is n factorial, written n!. An ordered arrangement of r items from n is a permutation, ⁿPᵣ = n! ÷ (n − r)!. An unordered selection of r items from n is a combination, ⁿCᵣ = n! ÷ (r!(n − r)!)."}, {"id": "ch15-s3-example", "kind": "example", "text": "4! = 4 × 3 × 2 × 1 = 24. To choose 2 captains of equal rank from 6 players, calculate ⁶C₂ = (6 × 5) ÷ (2 × 1) = 15 pairs."}, {"id": "ch15-s3-mistake", "kind": "mistake", "text": "The tempting slip is to use ⁿPᵣ when order does not matter. Ask whether swapping two picked people changes the result: if not, divide by r! to get a combination."}, {"id": "ch15-s3-turn", "kind": "turn", "text": "How many different 2-topping pizzas can you choose from 7 toppings, where the order of the two toppings does not matter?", "answer": "21", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "21"}]}], "accepts": ["21", "21 pizzas"], "rejects": ["42", "14", "9"], "mistakes": []}}, {"id": "ch15-s3-sayBack", "kind": "sayBack", "text": "n! multiplies from n down to 1; a permutation counts ordered picks, and a combination divides by r! when order does not matter."}]}, {"id": "ch15-s4", "heading": "15.4 Dropping balls through a pegboard", "excerpt": "Because there is only 1 path that goes right all 6 times, but there are ⁶C₃ = 20 different paths that go right 3 times and left 3 times.", "teaches": ["bell-curve"], "steps": [{"id": "ch15-s4-question", "kind": "question", "text": "A ball drops through 6 rows of pegs, bouncing left or right with a 50% chance at each peg. Why do most balls pile up in the middle slots instead of spreading evenly across the bottom?"}, {"id": "ch15-s4-idea", "kind": "idea", "text": "Because there is only 1 path that goes right all 6 times, but there are ⁶C₃ = 20 different paths that go right 3 times and left 3 times."}, {"id": "ch15-s4-picture", "kind": "picture", "text": "In the figure, set the pegboard rows to 6, the slot to 3, and the bounce chance to 50%. Read the path counts above the bars: 1, 6, 15, 20, 15, 6, 1, adding up to 64 paths in all."}, {"id": "ch15-s4-reason", "kind": "reason", "text": "Why is the count in slot k equal to ⁿCₖ? Choosing a path to slot k means choosing which k of the n rows bounce right. That is a combination of k rows out of n."}, {"id": "ch15-s4-name", "kind": "name", "text": "As the number of rows grows, the tall middle bars and low outer tails smooth into the symmetric shape called a bell curve."}, {"id": "ch15-s4-example", "kind": "example", "text": "With 6 rows at 50%, there are 2⁶ = 64 equally likely paths. Slot 3 has ⁶C₃ = 20 paths, so the probability of landing in slot 3 is 20 ÷ 64 = 5/16 = 31.25%."}, {"id": "ch15-s4-mistake", "kind": "mistake", "text": "The tempting slip is to think a ball 'aims' for the middle. Every single path has the same 1 in 64 chance; the middle wins only because 20 paths lead there."}, {"id": "ch15-s4-turn", "kind": "turn", "text": "A ball drops through 4 rows of pegs (n = 4). How many paths ⁴C₂ land in the middle slot (k = 2)?", "answer": "6", "answerKey": {"parts": [{"label": "answer", "anyOf": [{"kind": "number", "value": "6"}]}], "accepts": ["6", "6 paths"], "rejects": ["4", "8", "16"], "mistakes": []}}, {"id": "ch15-s4-sayBack", "kind": "sayBack", "text": "Slot k after n rows of pegs collects ⁿCₖ paths, piling most balls in the middle to form a bell curve."}], "figure": true}], "callouts": [{"id": "ch15-c-predict", "kind": "predict", "title": "Predict first", "body": "In the figure with 6 rows of pegs, predict how many paths land in slot 0 and how many land in slot 1."}, {"id": "ch15-c-aha", "kind": "check", "title": "Explain it", "body": "Explain to a friend why a sum of 7 on two dice is six times as likely as a sum of 2."}, {"id": "ch15-c-trap", "kind": "careful", "title": "With or without replacement?", "body": "Before multiplying along a tree diagram, check whether the first item was put back. If not, decrease both the total and the matching count by 1."}], "keyTerms": ["Outcome", "Sample space", "Probability", "Mutually exclusive", "Experimental probability", "Independent events", "Tree diagram", "Factorial", "Permutation", "Combination", "Bell curve"], "widgets": ["w_atlas_galton_board", "w_combinatorics_tree_builder"], "debate": {"id": "debate-ch15-counting", "chapterNumber": 15, "oupUnitNumber": 15, "title": "One head and one tail: two outcomes or three?", "contextPrompt": "Two fair coins, a ₹1 coin and a ₹2 coin, are tossed together. Asha and Rohan argue about the probability of getting one Head
